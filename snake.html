            if (activeMutators.indexOf('shrink_zone') !== -1) {
                var ticksPerShrink = Math.floor(30000 / getEffectiveSpeed());
                if (gameTick > 0 && gameTick % ticksPerShrink === 0) {
                    if (shrinkCols < PLAY_WIDTH / TILE_SIZE / 2 - 1) {
                        shrinkCols++;
                    } else if (shrinkRows < PLAY_HEIGHT / TILE_SIZE / 2 - 1) {
                        shrinkRows++;
                    }
                    var headNow = snake[0];
                    var minSX = shrinkCols * TILE_SIZE;
                    var maxSX = PLAY_WIDTH - shrinkCols * TILE_SIZE;
                    var minSY = shrinkRows * TILE_SIZE;
                    var maxSY = PLAY_HEIGHT - shrinkRows * TILE_SIZE;
                    if (headNow.x < minSX || headNow.x >= maxSX || headNow.y < minSY || headNow.y >= maxSY) {
                        lastDeathCause = 'Caught by the shrinking zone!';
                        gameOver();
                        return;
                    }
                }
            }

            if (activeMutators.indexOf('chaos_seed') !== -1 && gameTick % 20 === 0) {
                chaosCurrentWeights = shuffleFoodWeights();
                chaosShuffleTick = gameTick;
            }

            // v6: Resonance effects
            activeResonance = detectResonance(activeMutators);
            if (activeResonance) {
                if (activeResonance.effect === 'invertControls' && gameTick % (10 + Math.floor(Math.random() * 6)) === 0) {
                    flashOverlay = { color: '#FFFFFF', alpha: 0.2, priority: 'normal' };
                    queueGameEffect('flash', { color: '#FFFFFF', alpha: 0.2, priority: 'normal' });
                }
                if (activeResonance.effect === 'feastFamine' && hungerStarted) {
                    if (hungerTickCounter % 30 === 0 && snake.length > 1) {
                        // existing hunger logic will fire — this just ensures shorter interval
                    }
                }
            }

            prevSnake = snake.map(s => ({ x: s.x, y: s.y }));
            snakeGrew = false;
            prevRivalSnake = rivalCombinedSnake().map(s => ({ x: s.x, y: s.y }));

            gameTick++;

            // Rebuild ghost positions
            if (ghostArenaMode && activeSeed !== null) {
                arenaGhostPositions = [];
                for (var agi = 0; agi < arenaGhostReplays.length; agi++) {
                    arenaGhostPositions.push(rebuildGhost(arenaGhostReplays[agi], gameTick));
                }
                ghostPositions = [];
            } else if (ghostEnabled && activeSeed !== null) {
                var bestReplay = getBestReplay(gameMode);
                ghostPositions = rebuildGhost(bestReplay, gameTick);
            } else {
                ghostPositions = [];
                arenaGhostPositions = [];
            }
            stats.totalDistance++;
            if (gameTick % 10 === 0) awardXP(1);

            // Time Attack timer
            if (gameMode === 'timeAttack' && timeAttackEnd > 0) {
                const remaining = timeAttackEnd - Date.now();
                if (remaining <= 0) { gameOver(); return; }
            }

            if (nextDirection) {
                if (nextDirection.dx !== -dx || nextDirection.dy !== -dy) {
                    dx = nextDirection.dx;
                    dy = nextDirection.dy;
                    if (activeSeed !== null) {
                        recordReplayDirection(gameTick, dx, dy);
                    }
                }
                nextDirection = null;
            }

            const tail = snake.pop();
            // Painter mode: paint the tail position
            if (gameMode === 'painter' && paintGrid) {
                var pcol = Math.floor(tail.x / TILE_SIZE);
                var prow = Math.floor(tail.y / TILE_SIZE);
                var cols = PLAY_WIDTH / TILE_SIZE;
                var rows = PLAY_HEIGHT / TILE_SIZE;
                if (pcol >= 0 && pcol < cols && prow >= 0 && prow < rows) {
                    if (!paintGrid[pcol][prow]) {
                        paintGrid[pcol][prow] = { color: currentPaintColor, layer: paintLayers, timestamp: Date.now() };
                        paintCoveredCount++;
                    } else {
                        paintGrid[pcol][prow] = { color: currentPaintColor, layer: paintGrid[pcol][prow].layer + 1, timestamp: Date.now() };
                    }
                }
            }

            const headRef = snake.length > 0 ? snake[0] : tail;
            const newHead = {
                x: headRef.x + dx,
                y: headRef.y + dy
            };
            const wrappedHead = wrapPosition(newHead);

            // --- v6: extracted death check ---
            function checkPlayerDeath(wrappedHead, skipSelfCollision) {
                if (checkCollision(wrappedHead) && !skipSelfCollision) {
                    if (shieldActive) {
                        shieldActive = false; powerUpTimer = 0; powerUpType = null;
                        stats.shieldBlocks++;
                        spawnParticles(wrappedHead.x, wrappedHead.y, 15, '#4488FF');
                        playSound('bonus');
                        return false;
                    }
                    // v6: Vampire Brew — survive first fatal hit at length 3
                    if (activeBrews.indexOf('vampire') !== -1 && !brewUsageFlags.vampireUsed) {
                        brewUsageFlags.vampireUsed = true;
                        while (snake.length > 3) snake.pop();
                        lastDeathCause = 'Vampire Brew saved you!';
                        spawnParticles(wrappedHead.x, wrappedHead.y, 20, '#FF0044');
                        return false;
                    }
                    // v7: Serpentine evolution — one-time obstacle pass. Order per
                    // design: Shield -> Vampire/Phoenix brew -> Serpentine -> death,
                    // so a chosen brew save is never wasted on an automatic save.
                    if (evolutionTier >= 1 && !obstaclePassUsed && isObstacleCollision(wrappedHead)) {
                        obstaclePassUsed = true;
                        lastDeathCause = 'Serpentine phased through an obstacle!';
                        spawnParticles(wrappedHead.x, wrappedHead.y, 18, EVOLUTION_TIERS[1].color);
                        playSound('bonus');
                        queueToast('\uD83D\uDEE1\uFE0F Serpentine: obstacle pass used!', 2000);
                        return false;
                    }
                    lastDeathCause = isObstacleCollision(wrappedHead) ? 'Hit an obstacle!' : 'You ran into yourself!';
                    return true;
                }
                if (MODE_CONFIG[gameMode].wallDeath) {
                    if (wrappedHead.x < 0 || wrappedHead.x >= PLAY_WIDTH || wrappedHead.y < 0 || wrappedHead.y >= PLAY_HEIGHT) {
                        lastDeathCause = 'Hit the wall!';
                        // v6: Phoenix Brew — resurrect once
                        if (activeBrews.indexOf('phoenix') !== -1 && !brewUsageFlags.phoenixUsed) {
                            brewUsageFlags.phoenixUsed = true;
                            var freePos = findFreeTile(wrappedHead.x, wrappedHead.y);
                            if (freePos) {
                                snake[0] = { x: freePos.x, y: freePos.y };
                                while (snake.length > 5) snake.pop();
                                score = 0;
                                lastDeathCause = 'Phoenix Brew resurrected!';
                                spawnParticles(freePos.x, freePos.y, 25, '#FF8800');
                                return false;
                            }
                        }
                        return true;
                    }
                }
                for (var rci = 0; rci < rivals.length; rci++) {
                    if (rivals[rci].active) {
                        // v6: Leech Brew head-to-head with rival
                        if (activeBrews.indexOf('leech') !== -1 && rivals[rci].snake.length > 0) {
                            var rHead = rivals[rci].snake[0];
                            var ldx = Math.abs(wrappedHead.x - rHead.x);
                            var ldy = Math.abs(wrappedHead.y - rHead.y);
                            if (ldx <= TILE_SIZE && ldy <= TILE_SIZE && ldx + ldy <= TILE_SIZE * 2) {
                                for (var lsi = 0; lsi < 3 && rivals[rci].snake.length > 1; lsi++) {
                                    snake.push({ x: snake[snake.length - 1].x, y: snake[snake.length - 1].y });
                                    rivals[rci].snake.pop();
                                }
                                if (rivals[rci].snake.length <= 1) rivals[rci].active = false;
                                spawnParticles(wrappedHead.x, wrappedHead.y, 10, '#44FF88');
                                // v7: evolution trigger — Leech steal is a 3rd growth site
                                triggerEvolutionIfReady();
                            }
                        }
                        for (var rcj = 0; rcj < rivals[rci].snake.length; rcj++) {
                            if (rivals[rci].snake[rcj].x === wrappedHead.x && rivals[rci].snake[rcj].y === wrappedHead.y) {
                                if (shieldActive) {
                                    shieldActive = false; powerUpTimer = 0; powerUpType = null;
                                    stats.shieldBlocks++;
                                    spawnParticles(wrappedHead.x, wrappedHead.y, 15, '#4488FF');
                                    playSound('bonus');
                                    return false;
                                }
                                lastDeathCause = 'You were caught by the rival!';
                                // v6: Phoenix Brew in rival collision
                                if (activeBrews.indexOf('phoenix') !== -1 && !brewUsageFlags.phoenixUsed) {
                                    brewUsageFlags.phoenixUsed = true;
                                    var freePos2 = findFreeTile(wrappedHead.x, wrappedHead.y);
                                    if (freePos2) {
                                        snake[0] = { x: freePos2.x, y: freePos2.y };
                                        while (snake.length > 5) snake.pop();
                                        score = 0;
                                        lastDeathCause = 'Phoenix Brew resurrected!';
                                        spawnParticles(freePos2.x, freePos2.y, 25, '#FF8800');
                                        return false;
                                    }
                                }
                                return true;
                            }
                        }
                    }
                }
                return false;
            }
            // --- end v6 extraction ---

            if (checkPlayerDeath(wrappedHead, skipSelfCollision)) {
                snake.push(tail);
                gameOver();
                return;
            }

            snake.unshift(wrappedHead);
            // Painter mode: paint the head position too
            if (gameMode === 'painter' && paintGrid) {
                var hcol = Math.floor(wrappedHead.x / TILE_SIZE);
                var hrow = Math.floor(wrappedHead.y / TILE_SIZE);
                var cols = PLAY_WIDTH / TILE_SIZE;
                var rows = PLAY_HEIGHT / TILE_SIZE;
                if (hcol >= 0 && hcol < cols && hrow >= 0 && hrow < rows) {
                    if (!paintGrid[hcol][hrow]) {
                        paintGrid[hcol][hrow] = { color: currentPaintColor, layer: paintLayers, timestamp: Date.now() };
                        paintCoveredCount++;
                    } else {
                        paintGrid[hcol][hrow] = { color: currentPaintColor, layer: paintGrid[hcol][hrow].layer + 1, timestamp: Date.now() };
                    }
                }
            }
            // v8 E: hunter food flees the head every HUNTER_MOVE_INTERVAL ticks (after
            // the snake has moved, so it flees the NEW head position). Game-logic only.
            if (food && food.type === 'hunter' && gameTick % HUNTER_MOVE_INTERVAL === 0) {
                moveHunter();
            }

            // v6: Phantom Brew — cross ghost trail for +1.0x combo (5s cooldown)
            if (activeBrews.indexOf('phantom') !== -1) {
                var phantomNow = Date.now();
                var phantomCooldown = brewUsageFlags.phantomCooldown || 0;
                if (phantomNow > phantomCooldown) {
                    var ghostMatch = false;
                    if (ghostPositions.length > 0) {
                        for (var pgi = 0; pgi < ghostPositions.length; pgi++) {
                            if (ghostPositions[pgi].x === wrappedHead.x && ghostPositions[pgi].y === wrappedHead.y) {
                                ghostMatch = true; break;
                            }
                        }
                    }
                    if (!ghostMatch && arenaGhostPositions.length > 0) {
                        for (var agi2 = 0; agi2 < arenaGhostPositions.length; agi2++) {
                            var agBody = arenaGhostPositions[agi2] || [];
                            for (var agj = 0; agj < agBody.length; agj++) {
                                if (agBody[agj].x === wrappedHead.x && agBody[agj].y === wrappedHead.y) {
                                    ghostMatch = true; break;
                                }
                            }
                            if (ghostMatch) break;
                        }
                    }
                    if (ghostMatch) {
                        brewUsageFlags.phantomCooldown = phantomNow + 5000;
                        comboCount = Math.min(50, comboCount + 1);
                        lastEatTime = Date.now();
                        spawnParticles(wrappedHead.x, wrappedHead.y, 15, '#88FFFF');
                        playSound('bonus');
                        queueToast('Phantom Brew: +1.0x Combo!', 2000);
                    }
                }
            }

            if (food && wrappedHead.x === food.x && wrappedHead.y === food.y) {
                snake.push(tail);
                snakeGrew = true;
                triggerEvolutionIfReady();
                if (activeSeed !== null) recordReplayGrow(gameTick);
                const eatenType = food.type;

                // Stats tracking
                sessionFoodTypes.add(eatenType);
                sessionFoodEaten++;
                stats.totalFoodEaten++;
                if (magnetActive) stats.magnetEats++;
                if (eatenType === 'bonus') { stats.bonusFoodEaten++; sessionBonusFood++; }
                else if (eatenType === 'speed') { stats.speedFoodEaten++; sessionSpeedFood++; }
                else if (eatenType === 'epic') { stats.epicFoodEaten++; }
                // common, uncommon, rare all count as normalFoodEaten
                else { stats.normalFoodEaten++; }

                srSpeak('Ate ' + eatenType + '. Score ' + score);

                // Combo logic
                const now = Date.now();
                if (now - lastEatTime < 3000 && lastEatTime > 0) {
                    comboCount = Math.min(50, comboCount + 1);
                } else {
                    comboCount = (evolutionTier >= 3) ? EVOLUTION_TIERS[3].minCombo : 0;
                    lastComboMilestone = 0;
                }
                lastEatTime = now;
                clearTimeout(comboFadeTimer);
                comboFadeTimer = setTimeout(function() {
                    comboDisplayEl.textContent = '';
                }, 3500);
                if (comboCount > stats.maxCombo) stats.maxCombo = comboCount;
                if (comboCount > sessionMaxCombo) sessionMaxCombo = comboCount;

                // --- v6: extracted combo milestone handler ---
            handleComboMilestone();
            // --- end v6 extraction ---

                // XP award for eating
                const tier = FOOD_TIERS[eatenType] || FOOD_TIERS.common;
                let foodXP = tier.xp;
                if (gameMode === 'zen') {
                    foodXP = 10; // Flat XP in Zen mode
                } else {
                    const comboMul = 1 + comboCount * 0.5;
                    foodXP = Math.round(foodXP * comboMul);
                }
                awardXP(foodXP);

                // Track longest length
                if (snake.length > stats.longestLength) stats.longestLength = snake.length;

                const tierColor = tier.color;
                if (!flashOverlay || (flashOverlay.priority !== 'high' && flashOverlay.priority !== 'critical')) {
                    flashOverlay = { color: tierColor, alpha: 0.4, priority: 'normal' };
                    queueGameEffect('flash', { color: tierColor, alpha: 0.4, priority: 'normal' });
                }
                eatAnimTimer = 150;
                spawnParticles(wrappedHead.x, wrappedHead.y, tier.pCount, tierColor);
                // v6: Score pop-up floater
                if (eatenType === 'speed') {
                    spawnFloater(wrappedHead.x, wrappedHead.y, '+5 SPEED!', '#FFDD00', 20);
                } else if (eatenType === 'bonus') {
                    spawnFloater(wrappedHead.x, wrappedHead.y, '+30 BONUS!', '#FFD700', 18);
                } else {
                    spawnFloater(wrappedHead.x, wrappedHead.y, '+' + tier.pts, tierColor);
                }
                // --- end v6 ---
                if (synesthesiaMode) {
                    spawnSynesthesiaRing(wrappedHead.x, wrappedHead.y, tierColor);
                }
                if (gameMode !== 'zen' && gameMode !== 'painter') addScore(tier.pts);
                // v6: Combustion Brew bonus — each combo milestone adds +1 mult to next 3 foods
                if (activeBrews.indexOf('combustion') !== -1 && brewUsageFlags.combRemaining > 0 && gameMode !== 'zen' && gameMode !== 'painter') {
                    addScore(tier.pts * brewUsageFlags.combustionAccum);
                    brewUsageFlags.combRemaining--;
                }
                // Combo score bonus
                if (comboCount > 0 && gameMode !== 'zen' && gameMode !== 'painter') {
                    let comboBonus;
                    if (comboCount >= 20) {
                        comboBonus = Math.floor(comboCount * 5);
                    } else if (comboCount >= 10) {
                        comboBonus = Math.floor(comboCount * 3);
                    } else {
                        comboBonus = Math.floor(comboCount * 2);
                    }
                    addScore(comboBonus);
                }
                if (gameMode === 'snap') {
                    shrinkTimer = snapDuration;
                    if (eatenType === 'rare' || eatenType === 'epic') {
                        shrinkTimer = Math.min(5000, shrinkTimer + 1000);
                    } else if (eatenType === 'bonus') {
                        shrinkTimer = Math.min(5000, shrinkTimer + 2000);
                    }
                    shrinkTimer += MODE_CONFIG.snap.speed;
                }
                // Track last eaten type BEFORE playSound (synesthesia and painter depend on it)
                lastEatenType = eatenType;
                vibrate(15);
                playSound(tier.sound);
                // speed food still has the special speed boost behavior
                if (eatenType === 'speed') {
                    if (activeSeed === null) {
                        tickInterval = Math.max(MIN_SPEED, getEffectiveSpeed() - 30);
                        speedBoostCounter = 16; // ~2 seconds at 120ms ticks
                    }
                }
                // Painter mode: 100% coverage check
                if (gameMode === 'painter' && paintTotalTiles > 0 && paintCoveredCount >= paintTotalTiles && !flashOverlay) {
                    paintLayers++;
                    paintCoveredCount = 0;
                    flashOverlay = { color: '#FFFFFF', alpha: 0.6, priority: 'high' };
                    queueGameEffect('flash', { color: '#FFFFFF', alpha: 0.6, priority: 'high' });
                    queueToast('100% Coverage! Layer ' + paintLayers + '!', 3000);
                    playSound('achievement');
                    vibrate(50);
                }
                // Painter mode: update paint color
                if (gameMode === 'painter') {
                    painterFoodEaten++;
                    if (comboCount >= 30) {
                        currentPaintColor = 'hsl(' + ((renderTime * 0.1) % 360) + ',100%,50%)';
                    } else if (comboCount >= 10) {
                        var tierKeys = Object.keys(FOOD_TIERS);
                        currentPaintColor = FOOD_TIERS[tierKeys[painterFoodEaten % tierKeys.length]].color;
                    } else {
                        var paintTier = FOOD_TIERS[eatenType] || FOOD_TIERS.common;
                        currentPaintColor = paintTier.color;
                    }
                    if (painterFoodEaten % 50 === 0) {
                        var painterSpeed = Math.max(MIN_SPEED, getEffectiveSpeed() - 5);
                        tickInterval = painterSpeed;
                        restartGameTimeout();
                    }
                }
                checkAchievements(score);
                checkQuestProgress();
                // v9 D: if the eaten food was a portal epic, remove its twin from extraFoods[]
                if (eatenType === 'epic') {
                    extraFoods = extraFoods.filter(function(ef) { return !ef.portalLink; });
                }
                const playerCombined = snake.concat(rivalCombinedSnake()).concat(extraFoods);
                food = generateFood(playerCombined);
                if (!food) { lastDeathCause = 'The board filled up!'; gameOver(); return; }
                // v6: Rampage Brew — food spawns closer to head (min 3 tiles)
                if (activeBrews.indexOf('rampage') !== -1) {
                    minFoodSpawnDist = 3;
                }
                // v6: Echo Brew — every 8th food spawns adjacent copy (half pts)
                if (activeBrews.indexOf('echo') !== -1) {
                    brewUsageFlags.echoCount = (brewUsageFlags.echoCount || 0) + 1;
                    if (brewUsageFlags.echoCount % 8 === 0 && food) {
                        var adj = [{x: food.x + TILE_SIZE, y: food.y}, {x: food.x - TILE_SIZE, y: food.y}, {x: food.x, y: food.y + TILE_SIZE}, {x: food.x, y: food.y - TILE_SIZE}];
                        for (var ai = 0; ai < adj.length; ai++) {
                            if (adj[ai].x >= 0 && adj[ai].x < PLAY_WIDTH && adj[ai].y >= 0 && adj[ai].y < PLAY_HEIGHT) {
                                // v8 E: food2 copies the eaten food's type — coerce hunter to
                                // common so a static hunter food2 (never moves) can't spawn.
                                var f2Type = (food.type === 'hunter' || food.type === 'portal') ? 'common' : food.type;
                                food2 = { x: adj[ai].x, y: adj[ai].y, type: f2Type, pts: Math.floor((FOOD_TIERS[f2Type] ? FOOD_TIERS[f2Type].pts : 10) / 2), spawnTime: performance.now() };
                                break;
                            }
                        }
                    }
                }
            }

            // v6: Echo Brew food2 eating
            if (food2 && wrappedHead.x === food2.x && wrappedHead.y === food2.y) {
                snake.push(tail);
                snakeGrew = true;
                triggerEvolutionIfReady();
                if (activeSeed !== null) recordReplayGrow(gameTick);
                sessionFoodEaten++;
                stats.totalFoodEaten++;
                stats.normalFoodEaten++;
                addScore(food2.pts || Math.floor(FOOD_TIERS[food2.type].pts / 2));
                spawnParticles(food2.x, food2.y, 8, '#44FF88');
                playSound('eat');
                food2 = null;
            }
            // v9 D: extraFoods[] eat check (portal + hoard foods)
            for (var efi = extraFoods.length - 1; efi >= 0; efi--) {
                var ef = extraFoods[efi];
                if (wrappedHead.x === ef.x && wrappedHead.y === ef.y) {
                    if (ef.portalLink) {
                        // Portal food: teleport the entire snake (Phoenix-style re-anchor)
                        // Eating the portal grants the epic's bonus (score + XP) and removes both foods.
                        var exitTile = snapToFreeTile(ef.portalLink.x, ef.portalLink.y);
                        spawnParticles(ef.x, ef.y, 18, '#AA44FF');
                        spawnParticles(exitTile.x, exitTile.y, 18, '#AA44FF');
                        playSound('bonus');
                        // Grant the epic's bonus
                        sessionFoodEaten++;
                        stats.totalFoodEaten++;
                        stats.epicFoodEaten++;
                        sessionFoodTypes.add('epic');
                        if (gameMode !== 'zen' && gameMode !== 'painter') addScore(FOOD_TIERS.epic.pts);
                        awardXP(FOOD_TIERS.epic.xp);
                        spawnFloater(exitTile.x, exitTile.y, '+' + FOOD_TIERS.epic.pts + ' EPIC!', '#AA44FF', 18);
                        // Remove the portal food from extraFoods[]
                        extraFoods.splice(efi, 1);
                        // Remove the primary epic food (it's the `food` variable, not in extraFoods[])
                        // The epic's portalLink points to the portal food we just removed.
                        // Check if food is the epic twin: its portalLink matches the eaten portal's position.
                        if (food && food.portalLink && food.portalLink.x === ef.x && food.portalLink.y === ef.y) {
                            food = null;
                            // Generate a new primary food (without portal, since we don't want another portal immediately)
                            var combinedAfterPortal = snake.concat(rivalCombinedSnake()).concat(extraFoods);
                            food = generateFood(combinedAfterPortal);
                            if (!food) { lastDeathCause = 'The board filled up!'; gameOver(); return; }
                        }
                        // Re-anchor: snake becomes a short segment at the exit
                        snake = [{ x: exitTile.x, y: exitTile.y }];
                        while (snake.length < 3) {
                            var tailSeg = wrapPosition({ x: snake[snake.length - 1].x - dx, y: snake[snake.length - 1].y - dy });
                            if (snake.some(function(s) { return s.x === tailSeg.x && s.y === tailSeg.y; })) break;
                            snake.push(tailSeg);
                        }
                        triggerEvolutionIfReady();
                        queueToast('🌀 Teleported!', 1500);
                    } else {
                        // Hoard bonus food: normal eat logic
                        snake.push(tail);
                        snakeGrew = true;
                        triggerEvolutionIfReady();
                        if (activeSeed !== null) recordReplayGrow(gameTick);
                        sessionFoodEaten++;
                        stats.totalFoodEaten++;
                        stats.bonusFoodEaten++;
                        sessionBonusFood++;
                        sessionFoodTypes.add('bonus');
                        if (gameMode !== 'zen' && gameMode !== 'painter') addScore(FOOD_TIERS.bonus.pts);
                        spawnParticles(ef.x, ef.y, FOOD_TIERS.bonus.pCount, FOOD_TIERS.bonus.color);
                        spawnFloater(ef.x, ef.y, '+30 BONUS!', '#FFD700', 18);
                        playSound('bonus');
                        extraFoods.splice(efi, 1);
                    }
                    break; // only eat one food per tick
                }
            }

            // Check power-up collection
            if (powerUpPickup && wrappedHead.x === powerUpPickup.x && wrappedHead.y === powerUpPickup.y) {
                activatePowerUp(powerUpPickup.type);
                powerUpPickup = null;
                spawnParticles(wrappedHead.x, wrappedHead.y, 12, '#FFFFFF');
                playSound('bonus');
            }

            // Snap mode shrink logic
            if (gameMode === 'snap') {
                shrinkTimer -= MODE_CONFIG.snap.speed;
                if (shrinkTimer <= 0) {
                    if (snake.length <= 1) {
                        lastDeathCause = 'You shrunk to nothing!';
                        gameOver();
                        return;
                    }
                    const tailSeg = snake.pop();
                    shrinkTimer = snapDuration;
                    spawnParticles(tailSeg.x, tailSeg.y, 6, '#FF4444');
                    playSound('eat');
                }
                
                // Duration decreases every ~12 seconds of play
                snapTimeSinceDecrease += MODE_CONFIG.snap.speed;
                if (snapTimeSinceDecrease >= 12000) {
                    snapDuration = Math.floor(snapDuration * 0.88);
                    snapTimeSinceDecrease -= 12000;
                    snapLevel++;
                    snapLevelUpFlash = 1500; // show "LEVEL N!" for 1.5s
                    if (snapDuration < 800) snapDuration = 800;
                }
            }

            // Power-up timer update
            if (powerUpType) {
                const tickDuration = getEffectiveSpeed();
                powerUpTimer -= tickDuration;
                if (powerUpTimer <= 0) {
                    deactivatePowerUp();
                }
            }

            // Magnet effect: pull food toward snake
            // v8 E: magnet pull skips hunter food (a fleeing hunter pulled 1 tile/tick
            // toward the head would be a free lunch, defeating the challenge).
            if (magnetActive && food && food.type !== 'hunter') {
                const head = snake[0];
                let dx_food = head.x - food.x;
                let dy_food = head.y - food.y;

                // Account for wrapping — use the shortest path on each axis
                if (Math.abs(dx_food) > PLAY_WIDTH / 2) {
                    dx_food = dx_food > 0 ? dx_food - PLAY_WIDTH : dx_food + PLAY_WIDTH;
                }
                if (Math.abs(dy_food) > PLAY_HEIGHT / 2) {
                    dy_food = dy_food > 0 ? dy_food - PLAY_HEIGHT : dy_food + PLAY_HEIGHT;
                }

                const dist = Math.abs(dx_food) + Math.abs(dy_food);
                if (dist > 0 && dist <= 4 * TILE_SIZE) {
                    let newFX = food.x;
                    let newFY = food.y;
                    if (Math.abs(dx_food) >= Math.abs(dy_food)) {
                        newFX += dx_food > 0 ? TILE_SIZE : -TILE_SIZE;
                    } else {
                        newFY += dy_food > 0 ? TILE_SIZE : -TILE_SIZE;
                    }
                    const wrappedPos = wrapPosition({ x: newFX, y: newFY });
                    const wrappedFX = wrappedPos.x;
                    const wrappedFY = wrappedPos.y;
                    if (!snake.some(s => s.x === wrappedFX && s.y === wrappedFY) &&
                        !obstacles.some(o => o.x === wrappedFX && o.y === wrappedFY)) {
                        food.x = wrappedFX;
                        food.y = wrappedFY;
                    }
                }
            }
            // v9 D: magnet also pulls extraFoods[] (hoard bonus foods, not portal foods)
            if (magnetActive) {
                for (var efi2 = 0; efi2 < extraFoods.length; efi2++) {
                    var ef2 = extraFoods[efi2];
                    if (ef2.type === 'portal') continue;
                    var head2 = snake[0];
                    var dfx = head2.x - ef2.x, dfy = head2.y - ef2.y;
                    if (Math.abs(dfx) > PLAY_WIDTH / 2) dfx = dfx > 0 ? dfx - PLAY_WIDTH : dfx + PLAY_WIDTH;
                    if (Math.abs(dfy) > PLAY_HEIGHT / 2) dfy = dfy > 0 ? dfy - PLAY_HEIGHT : dfy + PLAY_HEIGHT;
                    var d2 = Math.abs(dfx) + Math.abs(dfy);
                    if (d2 > 0 && d2 <= 4 * TILE_SIZE) {
                        var nfx = ef2.x, nfy = ef2.y;
                        if (Math.abs(dfx) >= Math.abs(dfy)) nfx += dfx > 0 ? TILE_SIZE : -TILE_SIZE;
                        else nfy += dfy > 0 ? TILE_SIZE : -TILE_SIZE;
                        var wp = wrapPosition({ x: nfx, y: nfy });
                        if (!snake.some(function(s) { return s.x === wp.x && s.y === wp.y; }) &&
                            !obstacles.some(function(o) { return o.x === wp.x && o.y === wp.y; })) {
                            ef2.x = wp.x; ef2.y = wp.y;
                        }
                    }
                }
            }

            // Power-up spawn timer
            if (gameMode !== 'zen' && gameMode !== 'walled' && !powerUpPickup && !powerUpType) {
                powerUpSpawnCounter++;
                if (powerUpSpawnCounter >= 500) {
                    powerUpSpawnCounter = 0;
                    spawnPowerUpPickup();
                }
            }

            // Power-up despawn timer
            if (powerUpPickup && !powerUpType) {
                powerUpDespawnCounter--;
                if (powerUpDespawnCounter <= 0) {
                    powerUpPickup = null;
                }
            }

            // Rival respawn timer
            var anyRivalAlive = anyRivalActive();
            if (!anyRivalAlive && rivals.length > 0 && rivals[0].respawnTimer > 0 && !hoardActive) {
                rivals[0].respawnTimer -= getEffectiveSpeed();
                if (rivals[0].respawnTimer <= 0) {
                    spawnRival(0);
                }
            }

            // Update rival
            if (anyRivalActive() && !hoardActive) {
                for (var rii = 0; rii < rivals.length; rii++) {
                    if (rivals[rii].active) updateRival(rii);
                }
            }

            // Sparkle trail spawn
            if (cosmetics.trace === 'trace_sparkle' && gameTick % 5 === 0 && snake.length > 1) {
                const tail = snake[snake.length - 1];
                spawnParticles(tail.x, tail.y, 2, '#FFD700');
            }
            if (cosmetics.trace === 'trace_rainbow' && gameTick % 4 === 0 && snake.length > 1) {
                const tail = snake[snake.length - 1];
                const color = ['#FF0000','#FF8800','#FFFF00','#00FF00','#0088FF','#8800FF'][Math.floor(renderTime / 200) % 6];
                spawnParticles(tail.x, tail.y, 3, color);
            }
            if (cosmetics.trace === 'trace_galaxy' && gameTick % 4 === 0 && snake.length > 1) {
                const tail = snake[snake.length - 1];
                const galaxyColors = ['#FF88FF', '#88FFFF', '#FFFF88', '#8888FF', '#FF8888'];
                spawnParticles(tail.x, tail.y, 2, galaxyColors[gameTick % galaxyColors.length]);
            }
            if (cosmetics.trace === 'trace_fire' && gameTick % 6 === 0 && snake.length > 1) {
                const tail = snake[snake.length - 1];
                spawnParticles(tail.x, tail.y, 2, '#FF6600');
            }

            // Passive food regeneration
            var foodRegenInterval = 10;
            if (activeMutators.indexOf('golden_food') !== -1) foodRegenInterval = 20;
            if (gameMode === 'gauntlet') {
                for (var gfpi = 0; gfpi < gauntletPicks.length; gfpi++) {
                    if (gauntletPicks[gfpi].id === 'food_rush') { foodRegenInterval = Math.floor(foodRegenInterval / 2); break; }
                }
            }
            if (!food && gameTick % foodRegenInterval === 0 && gameState === 'playing') {
                const combinedSnake = snake.concat(rivalCombinedSnake());
                const newFood = generateFood(combinedSnake);
                if (newFood) food = newFood;
            }

            // Synesthesia: rhythmic pulse, drone, pad, arpeggiator
            if (synesthesiaMode && !muted) {
                if (gameTick % 4 === 0) playSynesthesiaPulse();
                if (gameTick % 10 === 0) updateDrone();
                updatePad();
                if (comboCount > 0 && gameTick % Math.max(1, 4 - Math.min(3, Math.floor(comboCount / 5))) === 0) {
                    playSynesthesiaArp();
                }
            }

            lastTickTime = performance.now();
            visualDirty = true;

            // Speed boost counter — decrements every tick
            if (speedBoostCounter > 0) {
                speedBoostCounter--;
                if (speedBoostCounter <= 0) {
                    tickInterval = getEffectiveSpeed();
                }
            }

            // Progressive obstacle spawning
            if (gameMode !== 'zen' && gameMode !== 'walled' && gameMode !== 'daily' && gameMode !== 'painter' && obstacles.length < Math.floor((PLAY_WIDTH / TILE_SIZE) * (PLAY_HEIGHT / TILE_SIZE) * MAX_OBSTACLE_PERCENT)) {
                if (obstacleSpawnTimer <= 0) {
                    obstacleSpawnTimer = OBSTACLE_SPAWN_INTERVAL;
                    const head = snake.length > 0 ? snake[0] : { x: 10 * TILE_SIZE, y: 10 * TILE_SIZE };
                    const count = 1 + Math.floor(seededRandom() * 2);
                    let spawned = 0;
                    for (let i = 0; i < count; i++) {
                        const tile = findFreeTile(head.x, head.y);
                        if (tile) {
                            obstacles.push(tile);
                            newObstacleFlash.push({ x: tile.x, y: tile.y, timer: 1000 });
                            spawned++;
                        }
                    }
                    if (spawned > 0) {
                        newObstacleToastTimer = 2000;
                    }
                } else {
                    obstacleSpawnTimer--;
                }
            }

        }

        function getLevelFromXP(xp) {
            let n = 1;
            while (true) {
                const required = 100 * n * (n + 1) / 2;
                if (xp < required) return n;
                n++;
            }
        }

        function updateXpCache() {
            if (cachedLevel === level) return;
            cachedLevel = level;
            cachedXpForThisLevel = 100 * level * (level + 1) / 2;
            cachedXpForPrevLevel = level > 1 ? 100 * (level - 1) * level / 2 : 0;
        }

        function awardXP(amount) {
            const mc = MODE_CONFIG[gameMode];
            if (!mc.earnXP) return;
            if (level >= 20) {
                xpOvercharge += amount;
                sessionXP += amount;
                saveManager.set('snake_xp_overcharge', xpOvercharge);
                return;
            }
            xp += amount;
            sessionXP += amount;
            const newLevel = getLevelFromXP(xp);
            while (newLevel > level) {
                level++;
                levelUpFlash = 1500; // show "LEVEL N!" for 1.5 seconds
                showLevelUpToast(level);
                checkLevelUnlocks(level);
                srSpeak('Level ' + level + '!');
            }
            cachedLevel = -1; // invalidate XP cache on level change
            saveManager.set('snake_xp', xp);
        }

        function loadStats() {
            return Object.assign(getDefaultStats(), saveManager.getJSON('snake_stats', {}));
        }

        function getDefaultStats() {
            return {
                gamesPlayed: 0, totalScore: 0, maxScore: 0,
                totalFoodEaten: 0, normalFoodEaten: 0, bonusFoodEaten: 0, speedFoodEaten: 0,
                longestLength: 0, longestTimeAlive: 0, totalTimePlayed: 0,
                totalDistance: 0, maxCombo: 0, totalDeaths: 0,
                rivalsDefeated: 0,

                magnetEats: 0,

            };
        }

        function syncDailyState() {
            const today = new Date();
            const dateStr = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
            let lastDate = saveManager.get('snake_daily_date', '');
            
            if (lastDate !== dateStr) {
                // New day — reset attempts
                dailyAttempts = 3;
                dailyDone = false;
                saveManager.set('snake_daily_done', 'false');
                saveManager.set('snake_daily_attempts_remaining', 3);
            } else {
                // Same day — load saved state
                dailyAttempts = saveManager.getInt('snake_daily_attempts_remaining', 3);
                dailyDone = saveManager.get('snake_daily_done', 'false') === 'true';
            }
        }

        function showFoodLegend() {
            const el = toastEl;
            if (!el) return;
            el.textContent = '\uD83C\uDF4E Common=10pts Epic=50pts Bonus=30pts Rare=20pts Uncommon=15pts Speed=5pts(speed!) 🐾 Hunter=50pts(fleeing!)';
            el.style.display = 'block';
            setTimeout(function() { el.style.display = 'none'; }, 5000);
        }

        function queueToast(message, duration) {
            duration = duration || 3000;
            toastQueue.push({ message: message, duration: duration });
            if (!toastActive) processToastQueue();
        }

        function processToastQueue() {
            if (toastQueue.length === 0) {
                toastActive = false;
                return;
            }
            toastActive = true;
            const toast = toastQueue.shift();
            const el = toastEl;
            if (el) {
                el.textContent = toast.message;
                el.style.display = 'block';
            }
            setTimeout(function() {
                const el2 = toastEl;
                if (el2) el2.style.display = 'none';
                processToastQueue();
            }, toast.duration);
        }

        function showLevelUpToast(level) {
            playSound('levelup');
            vibrate(40);
            queueToast('\u26A1 LEVEL UP! Level ' + level + ' \u26A1', 3000);
        }

        function checkLevelUnlocks(newLevel) {
            const unlocks = LEVEL_UNLOCKS[newLevel] || [];
            for (let i = 0; i < unlocks.length; i++) {
                const id = unlocks[i];
                if (unlockedCosmetics.indexOf(id) === -1) {
                    unlockedCosmetics.push(id);
                    saveManager.setJSON('snake_unlocks', unlockedCosmetics);
                    const allCosmetics = Object.assign({}, SNAKE_SKINS, GRID_THEMES, TRACE_EFFECTS, DEATH_EFFECTS, BORDER_EFFECTS);
                    const c = allCosmetics[id];
                    if (c) {
                        queueToast('🎨 Unlocked: ' + c.name + '!', 3000);
                    }
                }
            }
        }

        function checkPrestigeUnlocks() {
            const reward = PRESTIGE_REWARDS[prestigeLevel];
            if (reward && unlockedCosmetics.indexOf(reward.id) === -1) {
                unlockedCosmetics.push(reward.id);
                saveManager.setJSON('snake_unlocks', unlockedCosmetics);
                queueToast('\u2B50 Prestige ' + prestigeLevel + '! Unlocked: ' + reward.name + '!', 4000);
            }
        }

        function checkAchievements(sessionScore) {
            const mc = MODE_CONFIG[gameMode];
            if (!mc.achievementsEnabled) return;
            let unlockedAny = false;
            const ctx = {
                sessionFoodEaten: sessionFoodEaten,
                sessionTimeAlive: sessionTimeAlive,
                snakeLength: snake.length,
                hatTrickEligible: sessionFoodTypes.size >= 4,
                eatAllTypes: sessionFoodTypes.size >= 6,
                maxCombo: sessionMaxCombo,
                sessionScore: sessionScore || score,
                snapLevel: snapLevel,
                prestigeLevel: prestigeLevel,
            };
            for (const id in ACHIEVEMENTS) {
                if (achievements[id]) continue;
                const ach = ACHIEVEMENTS[id];
                if (ach.check(stats, ctx)) {
                    achievements[id] = Date.now();
                    saveManager.setJSON('snake_achievements', achievements);
                    awardXP(ach.xp);
                    showAchievementToast(ach);
                    unlockedAny = true;
                    mutatorTokens++;
                    saveManager.set('snake_mutator_tokens', mutatorTokens);
                    checkMutatorUnlocks();
                }
            }
        }

        function showAchievementToast(ach) {
            playSound('achievement');
            vibrate(50);
            queueToast('\u{1F3C6} ' + ach.icon + ' ' + ach.name + ': ' + ach.desc + ' (+' + ach.xp + ' XP)', 4000);
        }

        function checkStatMilestones() {
            for (const statKey in STAT_MILESTONES) {
                const statValue = stats[statKey];
                if (statValue === undefined) continue;
                const thresholds = STAT_MILESTONES[statKey];
                for (const threshold in thresholds) {
                    if (statValue >= parseInt(threshold)) {
                        const milestone = thresholds[threshold];
                        if (unlockedCosmetics.indexOf(milestone.id) === -1) {
                            unlockedCosmetics.push(milestone.id);
                            saveManager.setJSON('snake_unlocks', unlockedCosmetics);
                            queueToast(milestone.icon + ' ' + milestone.name + ': ' + milestone.msg, 4000);
                        }
                    }
                }
            }
        }

        function checkDailyCompletion(sessionScore, checkCtx) {
            if (gameMode !== 'daily') return;
            if (dailyDone) return;
            const seed = getDailySeed();
            const challenge = DAILY_CHALLENGES[seed % DAILY_CHALLENGES.length];
            if (challenge.check(sessionScore, checkCtx)) {
                dailyDone = true;
                stats.dailyCompleted++;
                awardXP(challenge.reward);
                saveManager.set('snake_daily_done', 'true');
                queueToast('⭐ Daily Complete! ' + challenge.desc + ' (+' + challenge.reward + ' XP)', 4000);
            }
        }

            function cycle(currentId, categoryMap, direction) {
                const keys = Object.keys(categoryMap);
                const idx = keys.indexOf(currentId);
                if (idx === -1) return currentId;
                let newIdx = idx;
                const maxAttempts = keys.length;
                for (let attempt = 0; attempt < maxAttempts; attempt++) {
                    newIdx = (newIdx + direction + keys.length) % keys.length;
                    if (unlockedCosmetics.indexOf(keys[newIdx]) !== -1) return keys[newIdx];
                }
                return currentId;
            }

              const scaleY = CANVAS_HEIGHT / rect.height;
              const tapY = (e.changedTouches[0].clientY - rect.top) * scaleY;
              if (tapY >= CANVAS_HEIGHT - 40) {
                deferredInstallPrompt.prompt();
                deferredInstallPrompt = null;
                drawGame(1);
                return;
              }
            }
            if (gameState === 'idle' || gameState === 'gameover') {
              document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter' }));
            } else if (gameState === 'playing') {
              document.dispatchEvent(new KeyboardEvent('keydown', { key: ' ' }));
            }
            return;
          }

          // Idle-state swipe detection for mode selection
          if (gameState === 'idle') {
            if (Math.abs(dy_touch) > Math.abs(dx_touch) && Math.abs(dy_touch) > 30) {
              if (dy_touch < 0) {
                modeSelectIndex = (modeSelectIndex + 1) % MODE_ORDER.length;
              } else {
                modeSelectIndex = (modeSelectIndex - 1 + MODE_ORDER.length) % MODE_ORDER.length;
              }
              gameMode = MODE_ORDER[modeSelectIndex];
              visualDirty = true;
              return;
            }
            return;
          }

          // Swipe detection (minimum 30px movement)
          if (Math.abs(dx_touch) < 30 && Math.abs(dy_touch) < 30) return;

          let newDx = 0, newDy = 0;
          if (Math.abs(dx_touch) > Math.abs(dy_touch)) {
            newDx = dx_touch > 0 ? TILE_SIZE : -TILE_SIZE;
          } else {
            newDy = dy_touch > 0 ? TILE_SIZE : -TILE_SIZE;
          }

          if (gameState === 'playing') {
            touchIndicatorTimer = 200; // 200ms flash
            setNextDirection(newDx, newDy);
          }
        }, { passive: false });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden && gameState === 'playing') {
                saveSnapshot(); // v9 B: save before pausing so mobile backgrounding doesn't lose the run
                autoPaused = true;
                sessionPauseStart = Date.now();
                gameState = 'paused';
                pauseMenuSelection = 0;
                pauseConfirmPending = false;
                pauseConfirmAction = null;
                stopGameLoop();
                playSound('pause');
                drawGame(1);
                visualDirty = true;
            } else if (!document.hidden && gameState === 'paused' && autoPaused) {
                autoPaused = false;
                resumeGame();
            }
        });

        panelBackdropEl.addEventListener('click', function() {
            closeAllPanels();
        });

        // v7 E: Auto-save on tab close / navigation (pagehide for mobile iOS)
        function autoSaveOnClose() {
            if (gameState === 'playing' || gameState === 'paused') {
                saveSnapshot();
            }
        }
        window.addEventListener('beforeunload', autoSaveOnClose);
        window.addEventListener('pagehide', autoSaveOnClose);

        syncDailyState();
        syncQuestState();

        window.addEventListener('load', function() {
            var hash = window.location.hash.slice(1);
            if (hash) {
                if (hash.startsWith('snapshot=')) {
                    restoreFromSnapshotHash(hash.slice(9));
                } else {
                    challengeFromUrl = parseChallengeUrl(hash);
                }
            }
        });

        window.addEventListener('hashchange', function() {
            if (gameState === 'idle') {
                var hash = window.location.hash.slice(1);
                if (hash && hash.startsWith('snapshot=')) {
                    restoreFromSnapshotHash(hash.slice(9));
                } else {
                    challengeFromUrl = hash ? parseChallengeUrl(hash) : null;
                }
                visualDirty = true;
            }
        });

        resetGame();

        // === SEED INPUT HANDLERS ===
        document.getElementById('seedField').addEventListener('input', function() {
            var rawVal = this.value;
            rawVal = rawVal.replace(/~/g, '');
            if (rawVal !== this.value) this.value = rawVal;
            const val = rawVal.trim();
            if (val) {
                activeSeed = val;
                const hash = val.split('').reduce(function(h, c) { return ((h << 5) - h) + c.charCodeAt(0) | 0; }, 0);
                seedPrng = mulberry32(hash);
            } else {
                activeSeed = null;
                seedPrng = null;
            }
        });
        document.getElementById('seedRandomBtn').addEventListener('click', function() {
            const seed = Math.random().toString(36).substring(2, 10).toUpperCase();
            document.getElementById('seedField').value = seed;
            activeSeed = seed;
            const hash = seed.split('').reduce(function(h, c) { return ((h << 5) - h) + c.charCodeAt(0) | 0; }, 0);
            seedPrng = mulberry32(hash);
        });
        document.getElementById('seedClearBtn').addEventListener('click', function() {
            document.getElementById('seedField').value = '';
            activeSeed = null;
            seedPrng = null;
        });

        requestAnimationFrame(animateVisuals);
    </script>
</body>
</html>
