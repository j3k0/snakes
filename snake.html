        function drawFood() {
            if (!food) return;
            const tier = FOOD_TIERS[food.type] || FOOD_TIERS.common;
            const cx = food.x + TILE_SIZE / 2;
            const cy = food.y + TILE_SIZE / 2;

            ctx.save();

            if (tier.glow) {
                ctx.shadowBlur = tier.glow;
                ctx.shadowColor = tier.color;
            }

            ctx.fillStyle = tier.color;

            switch (food.type) {
                case 'common': {
                    // Filled circle
                    ctx.beginPath();
                    ctx.arc(cx, cy, TILE_SIZE * 0.4, 0, 2 * Math.PI);
                    ctx.fill();
                    break;
                }
                case 'uncommon': {
                    // Diamond shape
                    const s = TILE_SIZE * 0.45;
                    ctx.beginPath();
                    ctx.moveTo(cx, cy - s);
                    ctx.lineTo(cx + s, cy);
                    ctx.lineTo(cx, cy + s);
                    ctx.lineTo(cx - s, cy);
                    ctx.closePath();
                    ctx.fill();
                    break;
                }
                case 'rare': {
                    // Upward-pointing triangle
                    const s = TILE_SIZE * 0.45;
                    ctx.beginPath();
                    ctx.moveTo(cx, cy - s);
                    ctx.lineTo(cx + s, cy + s * 0.7);
                    ctx.lineTo(cx - s, cy + s * 0.7);
                    ctx.closePath();
                    ctx.fill();
                    break;
                }
                case 'epic': {
                    // Hexagon
                    const r = TILE_SIZE * 0.42;
                    ctx.beginPath();
                    for (let i = 0; i < 6; i++) {
                        const angle = (Math.PI / 3) * i - Math.PI / 2;
                        const px = cx + r * Math.cos(angle);
                        const py = cy + r * Math.sin(angle);
                        if (i === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    }
                    ctx.closePath();
                    ctx.fill();
                    break;
                }
                case 'bonus': {
                    // Pulsing circle (keep existing pulse mechanic)
                    const pulse = 1 + 0.5 * Math.sin(renderTime / 200);
                    const r = Math.min(TILE_SIZE * 0.4 * pulse, TILE_SIZE * 0.6);
                    ctx.beginPath();
                    ctx.arc(cx, cy, r, 0, 2 * Math.PI);
                    ctx.fill();
                    break;
                }
                case 'speed': {
                    // Double chevron >>
                    const s = TILE_SIZE * 0.35;
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = tier.color;
                    ctx.beginPath();
                    ctx.moveTo(cx - s, cy - s);
                    ctx.lineTo(cx, cy);
                    ctx.lineTo(cx - s, cy + s);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(cx, cy - s);
                    ctx.lineTo(cx + s, cy);
                    ctx.lineTo(cx, cy + s);
                    ctx.stroke();
                    break;
                }
                default: {
                    ctx.fillRect(food.x, food.y, TILE_SIZE, TILE_SIZE);
                    break;
                }
            }

            ctx.restore();

            // Letter labels for non-common types with text outline for contrast
            const labels = { uncommon: 'U', rare: 'R', epic: 'E', bonus: 'B' };
            if (labels[food.type]) {
                ctx.save();
                ctx.font = 'bold 10px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.strokeText(labels[food.type], cx, cy);
                ctx.fillStyle = '#FFFFFF';
                ctx.fillText(labels[food.type], cx, cy);
                ctx.restore();
            }
        }

        function drawPowerUpPickup() {
            if (!powerUpPickup) return;
            if (powerUpPickup && powerUpDespawnCounter < 20 && Math.floor(renderTime / 100) % 2 === 0) return;
            const config = POWERUP_TYPES[powerUpPickup.type];
            const cx = powerUpPickup.x + TILE_SIZE / 2;
            const cy = powerUpPickup.y + TILE_SIZE / 2;

            ctx.save();
            ctx.shadowBlur = 10;
            ctx.shadowColor = config.color;
            ctx.fillStyle = config.color;
            
            const r = TILE_SIZE * 0.35;
            if (powerUpPickup.type === 'shield') {
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, 2 * Math.PI);
                ctx.fill();
                ctx.fillStyle = '#FFF';
                ctx.font = 'bold 14px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('S', cx, cy);
            } else if (powerUpPickup.type === 'magnet') {
                ctx.beginPath();
                for (let i = 0; i < 4; i++) {
                    const angle = (i * Math.PI / 2) - Math.PI / 2;
                    const outerR = r;
                    const innerR = r * 0.4;
                    ctx.lineTo(cx + Math.cos(angle) * outerR, cy + Math.sin(angle) * outerR);
                    ctx.lineTo(cx + Math.cos(angle + Math.PI / 4) * innerR, cy + Math.sin(angle + Math.PI / 4) * innerR);
                }
                ctx.closePath();
                ctx.fill();
            } else if (powerUpPickup.type === 'slowmo') {
                ctx.beginPath();
                ctx.moveTo(cx, cy - r);
                ctx.lineTo(cx + r, cy);
                ctx.lineTo(cx, cy + r);
                ctx.lineTo(cx - r, cy);
                ctx.closePath();
                ctx.fill();
            }
            
            ctx.restore();
        }

        function drawEyes(drawX, drawY, dx, dy, scleraColor, pupilColor) {
            let ex1, ey1, ex2, ey2;
            if (dx > 0) {
                ex1 = drawX + 12; ey1 = drawY + 4;
                ex2 = drawX + 12; ey2 = drawY + 12;
            } else if (dx < 0) {
                ex1 = drawX + 4; ey1 = drawY + 4;
                ex2 = drawX + 4; ey2 = drawY + 12;
            } else if (dy < 0) {
                ex1 = drawX + 4; ey1 = drawY + 4;
                ex2 = drawX + 12; ey2 = drawY + 4;
            } else {
                ex1 = drawX + 4; ey1 = drawY + 12;
                ex2 = drawX + 12; ey2 = drawY + 12;
            }
            ctx.fillStyle = scleraColor;
            ctx.beginPath(); ctx.arc(ex1, ey1, 4, 0, 2 * Math.PI); ctx.fill();
            ctx.beginPath(); ctx.arc(ex2, ey2, 4, 0, 2 * Math.PI); ctx.fill();
            ctx.fillStyle = pupilColor;
            ctx.beginPath(); ctx.arc(ex1, ey1, 2, 0, 2 * Math.PI); ctx.fill();
            ctx.beginPath(); ctx.arc(ex2, ey2, 2, 0, 2 * Math.PI); ctx.fill();
        }

        function drawSnake(t) {
            const skin = SNAKE_SKINS[cosmetics.snake] || SNAKE_SKINS.snake_green;
            let headDrawX = 0, headDrawY = 0;
            snake.forEach(function(segment, index) {
                let drawX, drawY;
                
                if (t >= 1 || prevSnake.length === 0) {
                    drawX = segment.x;
                    drawY = segment.y;
                } else if (index === 0) {
                    const prev = prevSnake[0];
                    if (prev) {
                        const pdx = segment.x - prev.x;
                        const pdy = segment.y - prev.y;
                        drawX = Math.abs(pdx) > CANVAS_WIDTH / 2 ? segment.x : prev.x + pdx * t;
                        drawY = Math.abs(pdy) > CANVAS_HEIGHT / 2 ? segment.y : prev.y + pdy * t;
                    } else {
                        drawX = segment.x;
                        drawY = segment.y;
                    }
                } else if (snakeGrew && prevSnake[index - 1]) {
                    const prev = prevSnake[index - 1];
                    const pdx = segment.x - prev.x;
                    const pdy = segment.y - prev.y;
                    drawX = Math.abs(pdx) > CANVAS_WIDTH / 2 ? segment.x : prev.x + pdx * t;
                    drawY = Math.abs(pdy) > CANVAS_HEIGHT / 2 ? segment.y : prev.y + pdy * t;
                } else if (prevSnake[index]) {
                    const pdx = segment.x - prevSnake[index].x;
                    const pdy = segment.y - prevSnake[index].y;
                    drawX = Math.abs(pdx) > CANVAS_WIDTH / 2 ? segment.x : prevSnake[index].x + pdx * t;
                    drawY = Math.abs(pdy) > CANVAS_HEIGHT / 2 ? segment.y : prevSnake[index].y + pdy * t;
                } else {
                    drawX = segment.x;
                    drawY = segment.y;
                }
                
                if (index === 0) {
                    headDrawX = drawX;
                    headDrawY = drawY;
                }
                
                if (skin.head === 'ghost') {
                    ctx.globalAlpha = 0.5;
                    ctx.fillStyle = index === 0 ? 'rgba(200, 200, 255, 0.7)' : 'rgba(150, 150, 255, 0.4)';
                } else if (skin.head === 'rainbow') {
                    const hue = (index * 20 + renderTime * 0.05) % 360;
                    ctx.fillStyle = 'hsl(' + hue + ', 100%, 50%)';
                } else {
                    ctx.fillStyle = index === 0 ? skin.head : skin.body;
                }
                if (index === 0 && eatAnimTimer > 0) {
                    const scale = 1 + 0.2 * (eatAnimTimer / 150);
                    const size = Math.round((TILE_SIZE - 1) * scale);
                    const offset = Math.round(((TILE_SIZE - 1) - size) / 2);
                    ctx.fillRect(drawX + offset, drawY + offset, size, size);
                } else {
                    ctx.fillRect(drawX, drawY, TILE_SIZE - 1, TILE_SIZE - 1);
                }
                if (skin.head === 'ghost') {
                    ctx.globalAlpha = 1;
                }

                if (index === 0) {
                    drawEyes(drawX, drawY, dx, dy, 'white', 'black');
                }
            });

            // Snap mode timer ring around head
            if (gameMode === 'snap' && gameState === 'playing' && snake.length > 0) {
                const cx = headDrawX + TILE_SIZE / 2;
                const cy = headDrawY + TILE_SIZE / 2;
                const radius = TILE_SIZE * 0.8;
                const fraction = Math.min(shrinkTimer, snapDuration) / snapDuration;

                let ringColor;
                if (fraction > 0.5) ringColor = '#44FF44';
                else if (fraction > 0.25) ringColor = '#FFAA00';
                else ringColor = '#FF4444';

                ctx.strokeStyle = ringColor;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(cx, cy, radius, -Math.PI / 2, -Math.PI / 2 + fraction * 2 * Math.PI);
                ctx.stroke();

                // Text label for accessibility
                ctx.fillStyle = ringColor;
                ctx.font = 'bold 9px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillText('SNAP ' + Math.round(fraction * 100) + '%', cx, cy + radius + 3);
            }

            // Shield aura around head
            if (shieldActive && snake.length > 0) {
                ctx.save();
                ctx.strokeStyle = '#4488FF';
                ctx.lineWidth = 2;
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#4488FF';
                ctx.globalAlpha = 0.6;
                ctx.beginPath();
                ctx.arc(headDrawX + TILE_SIZE / 2, headDrawY + TILE_SIZE / 2, TILE_SIZE * 0.7, 0, 2 * Math.PI);
                ctx.stroke();
                ctx.restore();
            }
        }

        function drawRival(t) {
            if (!rivalActive || rivalSnake.length === 0) return;
            
            rivalSnake.forEach(function(segment, index) {
                let drawX, drawY;
                
                if (t >= 1 || prevRivalSnake.length === 0 || !rivalActive) {
                    drawX = segment.x;
                    drawY = segment.y;
                } else if (index === 0 && prevRivalSnake[0]) {
                    const prev = prevRivalSnake[0];
                    const rdx = segment.x - prev.x;
                    const rdy = segment.y - prev.y;
                    drawX = Math.abs(rdx) > CANVAS_WIDTH / 2 ? segment.x : prev.x + rdx * t;
                    drawY = Math.abs(rdy) > CANVAS_HEIGHT / 2 ? segment.y : prev.y + rdy * t;
                } else if (prevRivalSnake[index]) {
                    const prev = prevRivalSnake[index];
                    const rdx = segment.x - prev.x;
                    const rdy = segment.y - prev.y;
                    drawX = Math.abs(rdx) > CANVAS_WIDTH / 2 ? segment.x : prev.x + rdx * t;
                    drawY = Math.abs(rdy) > CANVAS_HEIGHT / 2 ? segment.y : prev.y + rdy * t;
                } else {
                    drawX = segment.x;
                    drawY = segment.y;
                }
                
                ctx.fillStyle = index === 0 ? '#FF6600' : '#CC3300';
                ctx.fillRect(drawX, drawY, TILE_SIZE - 1, TILE_SIZE - 1);
                
                if (index === 0) {
                    drawEyes(drawX, drawY, rivalDx, rivalDy, '#FFD700', '#000');
                }
            });
        }

        function drawTrails() {
            const config = TRAIL_RENDER_CONFIG[cosmetics.trace];
            if (!config || snake.length < 4) return;
            const skin = SNAKE_SKINS[cosmetics.snake] || SNAKE_SKINS.snake_green;
            for (let t = 0; t < 3; t++) {
                const idx = snake.length - 1 - t;
                if (idx < 0) break;
                const seg = snake[idx];
                ctx.globalAlpha = config.alphaStart - t * config.alphaDecay;
                ctx.fillStyle = config.color(idx, skin);
                ctx.fillRect(seg.x, seg.y, TILE_SIZE - 1, TILE_SIZE - 1);
            }
            ctx.globalAlpha = 1;
        }

        function drawMuteIndicator() {
            if (muted) {
                ctx.fillStyle = '#888';
                ctx.font = hudFont(16);
                ctx.textAlign = 'right';
                ctx.textBaseline = 'top';
                ctx.fillText('🔇', CANVAS_WIDTH - 8, 8);
            }
        }

        function drawXPBar() {
            if (level < 20) {
                updateXpCache();
                const xpInLevel = xp - cachedXpForPrevLevel;
                const xpNeeded = cachedXpForThisLevel - cachedXpForPrevLevel;
                const progress = xpInLevel / xpNeeded;
                
                const barX = 5;
                const barY = CANVAS_HEIGHT - 22;
                const barWidth = 120;
                const barHeight = 12;
                
                if (prestigeLevel > 0) {
                    ctx.fillStyle = '#FFD700';
                    ctx.font = 'bold 8px Arial';
                    ctx.textAlign = 'right';
                    ctx.textBaseline = 'bottom';
                    ctx.fillText('P' + prestigeLevel, barX + barWidth - 2, barY - 2);
                }
                
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(barX - 2, barY - 2, barWidth + 4, barHeight + 4);
                
                ctx.fillStyle = 'rgba(255,215,0,0.3)';
                ctx.fillRect(barX, barY, barWidth * Math.min(progress, 1), barHeight);
                
                ctx.strokeStyle = 'rgba(255,215,0,0.5)';
                ctx.lineWidth = 1;
                ctx.strokeRect(barX, barY, barWidth, barHeight);
                
                ctx.fillStyle = '#FFD700';
                ctx.font = hudFont(9);
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('Lv.' + level + ' ' + xpInLevel + '/' + xpNeeded, barX + barWidth/2, barY + barHeight/2);
            }
        }

        function drawPrestigeBorder() {
            if (cosmetics.border && cosmetics.border !== 'border_none') {
                const borderConfig = BORDER_EFFECTS[cosmetics.border];
                if (borderConfig) {
                    if (cosmetics.border === 'border_gold') {
                        ctx.save();
                        ctx.strokeStyle = '#FFD700';
                        ctx.lineWidth = 3;
                        ctx.shadowBlur = 8;
                        ctx.shadowColor = '#FFD700';
                        ctx.strokeRect(1.5, 1.5, CANVAS_WIDTH - 3, CANVAS_HEIGHT - 3);
                        ctx.restore();
                    }
                }
            }
        }

        function drawSlowMoTint() {
            if (slowMoActive) {
                ctx.fillStyle = 'rgba(170, 68, 255, 0.05)';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            }
        }

        function drawTimeAttackHUD() {
            if (gameMode === 'timeAttack' && gameState === 'playing' && timeAttackEnd > 0) {
                const remaining = Math.max(0, Math.ceil((timeAttackEnd - Date.now()) / 1000));
                ctx.fillStyle = remaining <= 10 ? '#FF4444' : '#FFD700';
                ctx.font = hudFont(18);
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillText('TIME: ' + remaining + 's', CANVAS_WIDTH / 2, 5);
            }
        }

        function drawSnapHUD() {
            if (gameMode === 'snap' && gameState === 'playing') {
                const fraction = Math.min(shrinkTimer, snapDuration) / snapDuration;
                ctx.fillStyle = fraction > 0.5 ? '#44FF44' : fraction > 0.25 ? '#FFAA00' : '#FF4444';
                ctx.font = hudFont(14);
                ctx.textAlign = 'right';
                ctx.textBaseline = 'top';
                ctx.fillText('SNAP LV.' + snapLevel, CANVAS_WIDTH - 5, 5);

                const barWidth = 80;
                const barHeight = 6;
                const barX = CANVAS_WIDTH - 10 - barWidth;
                const barY = 22;
                ctx.fillStyle = 'rgba(255,255,255,0.15)';
                ctx.fillRect(barX, barY, barWidth, barHeight);
                ctx.fillStyle = fraction > 0.5 ? '#44FF44' : fraction > 0.25 ? '#FFAA00' : '#FF4444';
                ctx.fillRect(barX, barY, barWidth * fraction, barHeight);
            }
        }

        function drawDailyHUD() {
            if (gameMode === 'daily' && gameState === 'playing') {
                const seed = getDailySeed();
                const challenge = DAILY_CHALLENGES[seed % DAILY_CHALLENGES.length];
                const progress = getDailyProgress(challenge);
                ctx.fillStyle = '#FFD700';
                ctx.font = hudFont(11);
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillText('\uD83C\uDFAF ' + challenge.desc, CANVAS_WIDTH / 2, 2);
                if (challenge.progressTarget) {
                    const fraction = Math.min(progress / challenge.progressTarget, 1);
                    ctx.fillStyle = fraction >= 1 ? '#4CAF50' : '#AAA';
                    ctx.font = hudFont(10);
                    ctx.fillText('Progress: ' + Math.min(progress, challenge.progressTarget) + '/' + challenge.progressTarget, CANVAS_WIDTH / 2, 18);
                }
            }
        }

        function drawPowerUpHUD() {
            if (powerUpType) {
                const config = POWERUP_TYPES[powerUpType];
                const timerDuration = POWERUP_TYPES[powerUpType].duration;
                const fraction = Math.max(0, powerUpTimer / timerDuration);
                // Flicker when about to expire
                if (powerUpTimer > 0 && powerUpTimer < 2000 && Math.floor(renderTime / 80) % 2 === 0) return;
                const barX = 5;
                const barY = 5;
                const barWidth = 100;
                const barHeight = 14;
                
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(barX - 2, barY - 2, barWidth + 4, barHeight + 4);
                
                ctx.fillStyle = config.color;
                ctx.globalAlpha = 0.3;
                ctx.fillRect(barX, barY, barWidth * fraction, barHeight);
                ctx.globalAlpha = 1;
                
                ctx.fillStyle = '#FFF';
                ctx.font = hudFont(11);
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                ctx.fillText(config.name, barX + 4, barY + barHeight / 2);
            }
        }

        function drawRivalHUD() {
            if (rivalActive) {
                ctx.fillStyle = '#FF6600';
                ctx.font = hudFont(12);
                ctx.textAlign = 'right';
                ctx.textBaseline = 'bottom';
                ctx.fillText('Rival: ' + rivalSnake.length, CANVAS_WIDTH - 5, CANVAS_HEIGHT - 60);
                ctx.fillStyle = '#00FF00';
                ctx.fillText('You: ' + snake.length, CANVAS_WIDTH - 5, CANVAS_HEIGHT - 45);
            }
        }

        function drawGame(t) {
            drawGrid();
            drawMuteIndicator();
            drawXPBar();
            drawPrestigeBorder();
            drawObstacles();
            drawFood();
            drawPowerUpPickup();
            drawSnake(t);
            drawRival(t);
            drawTrails();
            drawSlowMoTint();
            drawTimeAttackHUD();
            drawSnapHUD();
            drawDailyHUD();
            drawPowerUpHUD();
            drawRivalHUD();

            if (gameState === 'idle') {
                drawOverlay('SNAKE', 'Press ENTER to Start');
            } else if (gameState === 'paused') {
                drawOverlay('PAUSED', 'Press P or SPACE to Resume');
            } else if (gameState === 'gameover') {
                const deathMsg = lastDeathCause ? lastDeathCause + ' | ' : '';
                drawOverlay('GAME OVER', 'Score: ' + score + ' | ' + deathMsg + 'Press ENTER to Restart');
            }
        }

        function updateGame() {
            if (gameState !== 'playing') return;

            // Zen mode: score = snake length
            if (gameMode === 'zen') {
                score = snake.length;
            }

            prevSnake = snake.map(s => ({ x: s.x, y: s.y }));
            snakeGrew = false;
            prevRivalSnake = rivalSnake.map(s => ({ x: s.x, y: s.y }));

            gameTick++;
            stats.totalDistance++;
            if (gameTick % 10 === 0) awardXP(1);

            // Time Attack timer
            if (gameMode === 'timeAttack' && timeAttackEnd > 0) {
                const remaining = timeAttackEnd - Date.now();
                if (remaining <= 0) { gameOver(); return; }
            }

            if (nextDirection) {
                if (nextDirection.dx !== -dx || nextDirection.dy !== -dy) {
                    dx = nextDirection.dx;
                    dy = nextDirection.dy;
                }
                nextDirection = null;
            }

            const tail = snake.pop();

            const headRef = snake.length > 0 ? snake[0] : tail;
            const newHead = {
                x: headRef.x + dx,
                y: headRef.y + dy
            };
            const wrappedHead = wrapPosition(newHead);

            if (checkCollision(wrappedHead)) {
                if (shieldActive) {
                    shieldActive = false;
                    powerUpTimer = 0;
                    powerUpType = null;
                    stats.shieldBlocks++;
                    spawnParticles(wrappedHead.x, wrappedHead.y, 15, '#4488FF');
                    playSound('bonus');
                } else {
                    lastDeathCause = 'You ran into yourself!';
                    snake.push(tail);
                    gameOver();
                    return;
                }
            }

            // Check player head vs rival body
            if (rivalActive) {
                const rivalBodyHit = rivalSnake.some(function(s) { return s.x === wrappedHead.x && s.y === wrappedHead.y; });
                if (rivalBodyHit) {
                    if (shieldActive) {
                        shieldActive = false;
                        powerUpTimer = 0;
                        powerUpType = null;
                        stats.shieldBlocks++;
                        spawnParticles(wrappedHead.x, wrappedHead.y, 15, '#4488FF');
                        playSound('bonus');
                    } else {
                        lastDeathCause = 'You were caught by the rival!';
                        snake.push(tail);
                        gameOver();
                        return;
                    }
                }
            }

            snake.unshift(wrappedHead);

            if (wrappedHead.x === food.x && wrappedHead.y === food.y) {
                snake.push(tail);
                snakeGrew = true;
                const eatenType = food.type;

                // Stats tracking
                sessionFoodTypes.add(eatenType);
                sessionFoodEaten++;
                stats.totalFoodEaten++;
                if (magnetActive) stats.magnetEats++;
                if (eatenType === 'bonus') { stats.bonusFoodEaten++; sessionBonusFood++; }
                else if (eatenType === 'speed') { stats.speedFoodEaten++; sessionSpeedFood++; }
                else if (eatenType === 'epic') { stats.epicFoodEaten++; }
                // common, uncommon, rare all count as normalFoodEaten
                else { stats.normalFoodEaten++; }

                // Combo logic
                const now = Date.now();
                if (now - lastEatTime < 3000 && lastEatTime > 0) {
                    comboCount = Math.min(5, comboCount + 1);
                } else {
                    comboCount = 0;
                }
                lastEatTime = now;
                clearTimeout(comboFadeTimer);
                comboFadeTimer = setTimeout(function() {
                    comboDisplayEl.textContent = '';
                }, 3500);
                if (comboCount > stats.maxCombo) stats.maxCombo = comboCount;
                if (comboCount > sessionMaxCombo) sessionMaxCombo = comboCount;

                // Combo milestone flash
                if (comboCount >= 3 && comboCount > lastComboMilestone) {
                    lastComboMilestone = comboCount;
                    flashOverlay = { color: comboCount >= 5 ? '#FF8800' : '#44BB44', alpha: 0.3 };
                    vibrate(30);
                    playSound('combo_milestone');
                }

                // XP award for eating
                const tier = FOOD_TIERS[eatenType] || FOOD_TIERS.common;
                let foodXP = tier.xp;
                if (gameMode === 'zen') {
                    foodXP = 10; // Flat XP in Zen mode
                } else {
                    const comboMul = 1 + comboCount * 0.5;
                    foodXP = Math.round(foodXP * comboMul);
                }
                awardXP(foodXP);

                // Track longest length
                if (snake.length > stats.longestLength) stats.longestLength = snake.length;

                const tierColor = tier.color;
                flashOverlay = { color: tierColor, alpha: 0.4 };
                eatAnimTimer = 150;
                spawnParticles(wrappedHead.x, wrappedHead.y, tier.pCount, tierColor);
                if (gameMode !== 'zen') score += tier.pts;
                // Combo score bonus
                if (comboCount > 0 && gameMode !== 'zen') {
                    score += Math.floor(comboCount * 2);
                }
                if (gameMode === 'snap') {
                    shrinkTimer = snapDuration;
                    if (eatenType === 'rare' || eatenType === 'epic') {
                        shrinkTimer = Math.min(5000, shrinkTimer + 1000);
                    } else if (eatenType === 'bonus') {
                        shrinkTimer = Math.min(5000, shrinkTimer + 2000);
                    }
                    shrinkTimer += MODE_CONFIG.snap.speed;
                }
                vibrate(15);
                playSound(tier.sound);
                // speed food still has the special speed boost behavior
                if (eatenType === 'speed') {
                    tickInterval = Math.max(MIN_SPEED, getEffectiveSpeed() - 30);
                    restartGameInterval(tickInterval);
                    speedBoostCounter = 16; // ~2 seconds at 120ms ticks
                }
                updateScoreDisplay();
                checkAchievements(score);
                food = generateFood(snake);
                if (!food) { lastDeathCause = 'The board filled up!'; gameOver(); return; }
            }

            // Check power-up collection
            if (powerUpPickup && wrappedHead.x === powerUpPickup.x && wrappedHead.y === powerUpPickup.y) {
                activatePowerUp(powerUpPickup.type);
                powerUpPickup = null;
                spawnParticles(wrappedHead.x, wrappedHead.y, 12, '#FFFFFF');
                playSound('bonus');
            }

            // Snap mode shrink logic
            if (gameMode === 'snap') {
                shrinkTimer -= MODE_CONFIG.snap.speed;
                if (shrinkTimer <= 0) {
                    if (snake.length <= 1) {
                        lastDeathCause = 'You shrunk to nothing!';
                        gameOver();
                        return;
                    }
                    const tailSeg = snake.pop();
                    shrinkTimer = snapDuration;
                    spawnParticles(tailSeg.x, tailSeg.y, 6, '#FF4444');
                    playSound('eat');
                }
                
                // Duration decreases every ~12 seconds of play
                snapTimeSinceDecrease += MODE_CONFIG.snap.speed;
                if (snapTimeSinceDecrease >= 12000) {
                    snapDuration = Math.floor(snapDuration * 0.88);
                    snapTimeSinceDecrease -= 12000;
                    snapLevel++;
                    snapLevelUpFlash = 1500; // show "LEVEL N!" for 1.5s
                    if (snapDuration < 800) snapDuration = 800;
                }
            }

            // Power-up timer update
            if (powerUpType) {
                const tickDuration = getEffectiveSpeed();
                powerUpTimer -= tickDuration;
                if (powerUpTimer <= 0) {
                    deactivatePowerUp();
                }
            }

            // Magnet effect: pull food toward snake
            if (magnetActive && food) {
                const head = snake[0];
                const dx_food = head.x - food.x;
                const dy_food = head.y - food.y;
                const dist = Math.abs(dx_food) + Math.abs(dy_food);
                if (dist > 0 && dist <= 4 * TILE_SIZE) {
                    let newFX = food.x;
                    let newFY = food.y;
                    if (Math.abs(dx_food) >= Math.abs(dy_food)) {
                        newFX += dx_food > 0 ? TILE_SIZE : -TILE_SIZE;
                    } else {
                        newFY += dy_food > 0 ? TILE_SIZE : -TILE_SIZE;
                    }
                    const wrappedPos = wrapPosition({ x: newFX, y: newFY });
                    const wrappedFX = wrappedPos.x;
                    const wrappedFY = wrappedPos.y;
                    if (!snake.some(s => s.x === wrappedFX && s.y === wrappedFY) &&
                        !obstacles.some(o => o.x === wrappedFX && o.y === wrappedFY)) {
                        food.x = wrappedFX;
                        food.y = wrappedFY;
                    }
                }
            }

            // Power-up spawn timer
            if (gameMode !== 'zen' && !powerUpPickup && !powerUpType) {
                powerUpSpawnCounter++;
                if (powerUpSpawnCounter >= 500) {
                    powerUpSpawnCounter = 0;
                    spawnPowerUpPickup();
                }
            }

            // Power-up despawn timer
            if (powerUpPickup && !powerUpType) {
                powerUpDespawnCounter--;
                if (powerUpDespawnCounter <= 0) {
                    powerUpPickup = null;
                }
            }

            // Rival respawn timer
            if (!rivalActive && rivalRespawnTimer > 0) {
                rivalRespawnTimer -= getEffectiveSpeed();
                if (rivalRespawnTimer <= 0) {
                    spawnRival();
                }
            }

            // Update rival
            if (rivalActive) {
                updateRival();
            }

            // Sparkle trail spawn
            if (cosmetics.trace === 'trace_sparkle' && gameTick % 5 === 0 && snake.length > 1) {
                const tail = snake[snake.length - 1];
                spawnParticles(tail.x, tail.y, 2, '#FFD700');
            }
            if (cosmetics.trace === 'trace_rainbow' && gameTick % 4 === 0 && snake.length > 1) {
                const tail = snake[snake.length - 1];
                const color = ['#FF0000','#FF8800','#FFFF00','#00FF00','#0088FF','#8800FF'][Math.floor(renderTime / 200) % 6];
                spawnParticles(tail.x, tail.y, 3, color);
            }
            if (cosmetics.trace === 'trace_galaxy' && gameTick % 4 === 0 && snake.length > 1) {
                const tail = snake[snake.length - 1];
                const galaxyColors = ['#FF88FF', '#88FFFF', '#FFFF88', '#8888FF', '#FF8888'];
                spawnParticles(tail.x, tail.y, 2, galaxyColors[gameTick % galaxyColors.length]);
            }
            if (cosmetics.trace === 'trace_fire' && gameTick % 6 === 0 && snake.length > 1) {
                const tail = snake[snake.length - 1];
                spawnParticles(tail.x, tail.y, 2, '#FF6600');
            }

            // Passive food regeneration (amendment C: only every 10th tick to avoid O(n*m) churn)
            if (!food && gameTick % 10 === 0 && gameState === 'playing') {
                const combinedSnake = snake.concat(rivalActive ? rivalSnake : []);
                const newFood = generateFood(combinedSnake);
                if (newFood) food = newFood;
            }

            lastTickTime = performance.now();
            visualDirty = true;

            // Speed boost counter — decrements every tick
            if (speedBoostCounter > 0) {
                speedBoostCounter--;
                if (speedBoostCounter <= 0) {
                    tickInterval = getEffectiveSpeed();
                    restartGameInterval(tickInterval);
                }
            }
        }

        function getLevelFromXP(xp) {
            let n = 1;
            while (true) {
                const required = 100 * n * (n + 1) / 2;
                if (xp < required) return n;
                n++;
            }
        }

        function updateXpCache() {
            if (cachedLevel === level) return;
            cachedLevel = level;
            cachedXpForThisLevel = 100 * level * (level + 1) / 2;
            cachedXpForPrevLevel = level > 1 ? 100 * (level - 1) * level / 2 : 0;
        }

        function awardXP(amount) {
            const mc = MODE_CONFIG[gameMode];
            if (!mc.earnXP) return;
            xp += amount;
            sessionXP += amount;
            const newLevel = getLevelFromXP(xp);
            while (newLevel > level) {
                level++;
                showLevelUpToast(level);
                checkLevelUnlocks(level);
            }
            levelUpFlash = 1500; // show "LEVEL N!" for 1.5 seconds
            cachedLevel = -1; // invalidate XP cache on level change
            saveManager.set('snake_xp', xp);
        }

            const dateStr = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
            let lastDate = saveManager.get('snake_daily_date', '');

                dailyAttempts = 3;

        function queueToast(message, duration) {
            duration = duration || 3000;
            toastQueue.push({ message: message, duration: duration });
            if (!toastActive) processToastQueue();
        }

        function processToastQueue() {
            if (toastQueue.length === 0) {
                toastActive = false;
                return;
            }
            toastActive = true;
            const toast = toastQueue.shift();
            const el = toastEl;
            if (el) {
                el.textContent = toast.message;
                el.style.display = 'block';
            }
            setTimeout(function() {
                const el2 = toastEl;
                if (el2) el2.style.display = 'none';
                processToastQueue();
            }, toast.duration);
        }

            const ctx = {

                maxCombo: sessionMaxCombo,

        document.addEventListener('keydown', (e) => {
            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', ' '].includes(e.key)) {
                e.preventDefault();
            }

            if (e.key === 'Enter') {
                if (gameState === 'idle') {
                    if (gameMode === 'daily' && dailyAttempts <= 0) {
                        const el = toastEl;
                        if (el) {
                            el.textContent = 'No attempts left today!';
                            el.style.display = 'block';
                            setTimeout(function() { el.style.display = 'none'; }, 2000);
                        }
                        return;
                    }
                    resetGame();
                    startGame();
                    visualDirty = true;
                    return;
                }
                if (gameState === 'gameover') {
                    resetGame();
                    startGame();
                    return;
                }
            }

            // Prestige on idle
            if ((e.key === 'x' || e.key === 'X') && gameState === 'idle' && level >= 20) {
                if (prestigeLevel >= 5) {
                    queueToast('⭐ Max Prestige Reached!', 3000);
                    return;
                }
                prestigeLevel++;
                xp = 0;
                level = 1;
                saveManager.set('snake_prestige', prestigeLevel);
                saveManager.set('snake_xp', '0');
                checkPrestigeUnlocks();
                drawGame(1);
                return;
            }

            // Mode selection on idle
            if (gameState === 'idle') {
                if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    modeSelectIndex = (modeSelectIndex - 1 + MODE_ORDER.length) % MODE_ORDER.length;
                    gameMode = MODE_ORDER[modeSelectIndex];
                    drawGame(1);
                    visualDirty = true;
                    return;
                }
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    modeSelectIndex = (modeSelectIndex + 1) % MODE_ORDER.length;
                    gameMode = MODE_ORDER[modeSelectIndex];
                    drawGame(1);
                    visualDirty = true;
                    return;
                }
            }

            // Zen mode quit
            if (e.key === 'Enter' && gameState === 'playing' && gameMode === 'zen') {
                endZenSession();
                return;
            }

            if (e.key === 'p' || e.key === 'P' || e.key === ' ') {
                if (gameState === 'playing') {
                    autoPaused = false;
                    gameState = 'paused';
                    clearInterval(gameInterval);
                    gameInterval = null;
                    sessionPauseStart = Date.now();
                    playSound('pause');
                    drawGame(1);
                    visualDirty = true;
                } else if (gameState === 'paused') {
                    resumeGame();
                    return;
                }
                return;
            }

            if (e.key === 'm' || e.key === 'M') {
                muted = muted ? 0 : 1;
                saveManager.set('snake_muted', muted);
                queueToast(muted ? '\uD83D\uDD07 Muted' : '\uD83D\uDD0A Sound On', 1500);
                return;
            }

            if (e.key === 'Tab') {
                e.preventDefault();
                showStatsPanel();
                return;
            }
            if (e.key === 'Escape') {
                if (gameState === 'gameover') {
                    gameState = 'idle';
                    drawGame(1);
                    visualDirty = true;
                    return;
                }
                closeAllPanels();
                return;
            }

            if (e.key === 'c' || e.key === 'C') {
                e.preventDefault();
                if (gameState === 'playing') return;
                showCosmeticsPanel();
                return;
            }

            if (e.key === 'f' || e.key === 'F') {
                e.preventDefault();
                showAchievementsPanel();
                return;
            }

            if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                if (helpOverlayVisible) {
                    helpOverlayVisible = false;
                } else {
                    helpOverlayVisible = true;
                    // Force a redraw so overlay appears immediately
                    visualDirty = true;
                }
                return;
            }

            if (e.key === 'l' || e.key === 'L') {
                if (gameState === 'idle') {
                    showFoodLegend();
                }
                return;
            }

            if (gameState !== 'playing') return;

            let newDx = dx;
            let newDy = dy;

            switch (e.key) {
                case 'ArrowLeft':
                case 'a':
                    newDx = -TILE_SIZE;
                    newDy = 0;
                    break;
                case 'ArrowUp':
                case 'w':
                    newDx = 0;
                    newDy = -TILE_SIZE;
                    break;
                case 'ArrowRight':
                case 'd':
                    newDx = TILE_SIZE;
                    newDy = 0;
                    break;
                case 'ArrowDown':
                case 's':
                    newDx = 0;
                    newDy = TILE_SIZE;
                    break;
                default:
                    return;
            }

            setNextDirection(newDx, newDy);
        });

        // Virtual D-pad — single dispatch with touch suppression
        let _touchDispatched = false;
        document.querySelectorAll('.dpad-btn').forEach(function(btn) {
          btn.addEventListener('touchstart', function(e) {
            e.preventDefault();
            _touchDispatched = true;
            const key = btn.getAttribute('data-key');
            document.dispatchEvent(new KeyboardEvent('keydown', { key: key }));
          }, { passive: false });
          btn.addEventListener('click', function(e) {
            e.preventDefault();
            if (_touchDispatched) {
              _touchDispatched = false;
              return;
            }
            const key = btn.getAttribute('data-key');
            document.dispatchEvent(new KeyboardEvent('keydown', { key: key }));
          });
        });

        // Touch swipe controls
        let touchStartX = 0;
        let touchStartY = 0;
        canvas.addEventListener('touchstart', function(e) {
          e.preventDefault();
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
        }, { passive: false });

        canvas.addEventListener('touchend', function(e) {
          e.preventDefault();
          const dx_touch = e.changedTouches[0].clientX - touchStartX;
          const dy_touch = e.changedTouches[0].clientY - touchStartY;

          // Tap detection (small movement)
          if (Math.abs(dx_touch) < 10 && Math.abs(dy_touch) < 10) {
            if (gameState === 'idle' || gameState === 'gameover') {
              document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter' }));
            } else if (gameState === 'playing') {
              document.dispatchEvent(new KeyboardEvent('keydown', { key: ' ' }));
            }
            return;
          }

          // Idle-state swipe detection for mode selection
          if (gameState === 'idle') {
            if (Math.abs(dy_touch) > Math.abs(dx_touch) && Math.abs(dy_touch) > 30) {
              if (dy_touch < 0) {
                modeSelectIndex = (modeSelectIndex + 1) % MODE_ORDER.length;
              } else {
                modeSelectIndex = (modeSelectIndex - 1 + MODE_ORDER.length) % MODE_ORDER.length;
              }
              gameMode = MODE_ORDER[modeSelectIndex];
              visualDirty = true;
              return;
            }
            return;
          }

          // Swipe detection (minimum 30px movement)
          if (Math.abs(dx_touch) < 30 && Math.abs(dy_touch) < 30) return;

          let newDx = 0, newDy = 0;
          if (Math.abs(dx_touch) > Math.abs(dy_touch)) {
            newDx = dx_touch > 0 ? TILE_SIZE : -TILE_SIZE;
          } else {
            newDy = dy_touch > 0 ? TILE_SIZE : -TILE_SIZE;
          }

          if (gameState === 'playing') {
            touchIndicatorTimer = 200; // 200ms flash
            setNextDirection(newDx, newDy);
          }
        }, { passive: false });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden && gameState === 'playing') {
                autoPaused = true;
                sessionPauseStart = Date.now();
                gameState = 'paused';
                clearInterval(gameInterval);
                gameInterval = null;
                playSound('pause');
                drawGame(1);
                visualDirty = true;
            } else if (!document.hidden && gameState === 'paused' && autoPaused) {
                autoPaused = false;
                resumeGame();
            }
        });

        panelBackdropEl.addEventListener('click', function() {
            closeAllPanels();
        });

        syncDailyState();
        resetGame();
        requestAnimationFrame(animateVisuals);
    </script>
</body>
</html>
