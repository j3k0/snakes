<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Snake Game</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #222;
            font-family: Arial, sans-serif;
            color: white;
        }
        h1 {
            margin-bottom: 10px;
        }
        #gameCanvas {
            border: 2px solid #333;
            background-color: #111;
            display: block;
            max-width: calc(100vw - 20px);
            max-height: 70vh;
            touch-action: none;
        }
        #score {
            font-size: 1.5em;
        }
        #highScore {
            font-size: 1em;
            color: #aaa;
            margin-bottom: 10px;
        }
        @media (max-width: 480px) {
          body { padding: 5px; box-sizing: border-box; }
          #gameCanvas { width: 100%; height: auto; }
          .dpad-btn { width: 56px; height: 56px; font-size: 24px; }
        }
        @media (pointer: coarse) {
          #dpad { display: flex !important; justify-content: center; }
        }
    </style>
</head>
<body>
    <h1>Snake Game</h1>
    <canvas id="gameCanvas" width="400" height="400"></canvas>
    <div id="dpad" style="display:none;margin-top:10px;touch-action:manipulation;user-select:none;-webkit-user-select:none;">
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
        <button class="dpad-btn" data-key="ArrowUp" style="width:56px;height:56px;font-size:24px;background:#333;color:white;border:2px solid #555;border-radius:8px;cursor:pointer;touch-action:manipulation;">▲</button>
        <div style="display:flex;gap:48px;">
          <button class="dpad-btn" data-key="ArrowLeft" style="width:56px;height:56px;font-size:24px;background:#333;color:white;border:2px solid #555;border-radius:8px;cursor:pointer;touch-action:manipulation;">◀</button>
          <button class="dpad-btn" data-key="ArrowDown" style="width:56px;height:56px;font-size:24px;background:#333;color:white;border:2px solid #555;border-radius:8px;cursor:pointer;touch-action:manipulation;">▼</button>
          <button class="dpad-btn" data-key="ArrowRight" style="width:56px;height:56px;font-size:24px;background:#333;color:white;border:2px solid #555;border-radius:8px;cursor:pointer;touch-action:manipulation;">▶</button>
        </div>
        <button class="dpad-btn" data-key=" " style="width:56px;height:56px;font-size:18px;background:#333;color:white;border:2px solid #555;border-radius:8px;cursor:pointer;touch-action:manipulation;margin-top:4px;">⏸</button>
      </div>
    </div>
    <p>Score: <span id="score">0</span></p>
    <p id="highScore">Best: 0</p>
        <div id="xpDisplay" style="color:#aaa;font-size:0.9em;"></div>
        <div id="comboDisplay" style="color:#FFD700;font-size:1.2em;min-height:1.5em;"></div>
        <div id="toast" style="display:none;position:fixed;top:20px;left:50%;transform:translateX(-50%);color:#FFD700;font-size:24px;font-weight:bold;text-shadow:2px 2px 4px rgba(0,0,0,0.8);z-index:1000;pointer-events:none;text-align:center;"></div>
        <div id="statsPanel" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.95);border:2px solid #555;border-radius:10px;padding:20px;color:white;font-family:monospace;z-index:100;min-width:300px;max-width:400px;"></div>

        const TILE_SIZE = 20;
        const CANVAS_WIDTH = 400;

        function ensureGridCache() {
            const theme = GRID_THEMES[cosmetics.grid] || GRID_THEMES.grid_classic;
            if (gridCacheCanvas && gridCacheTheme === cosmetics.grid) return;
            if (!gridCacheCanvas) {
                gridCacheCanvas = document.createElement('canvas');
                gridCacheCanvas.width = CANVAS_WIDTH;
                gridCacheCanvas.height = CANVAS_HEIGHT;
            }
            gridCacheTheme = cosmetics.grid;
            const gctx = gridCacheCanvas.getContext('2d');
            gctx.fillStyle = theme.bg;
            gctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            gctx.strokeStyle = theme.stroke;
            gctx.lineWidth = 1;
            gctx.beginPath();
            for (let x = 0; x <= CANVAS_WIDTH; x += TILE_SIZE) {
                gctx.moveTo(x, 0);
                gctx.lineTo(x, CANVAS_HEIGHT);
            }
            for (let y = 0; y <= CANVAS_HEIGHT; y += TILE_SIZE) {
                gctx.moveTo(0, y);
                gctx.lineTo(CANVAS_WIDTH, y);
            }
            gctx.stroke();
        }

        const saveManager = {
            get(key, defaultVal) {
                try { const v = localStorage.getItem(key); return v !== null ? v : defaultVal; }
                catch(e) { return defaultVal; }
            },
            set(key, value) {
                try { localStorage.setItem(key, String(value)); }
                catch(e) { /* localStorage unavailable */ }
            },
            getInt(key, defaultVal) {
                try { const v = localStorage.getItem(key); return v !== null ? parseInt(v, 10) || defaultVal : defaultVal; }
                catch(e) { return defaultVal; }
            },
            getJSON(key, defaultVal, validator) {
                try {
                    const v = localStorage.getItem(key);
                    if (v === null) return defaultVal;
                    const parsed = JSON.parse(v);
                    return validator ? (validator(parsed) ? parsed : defaultVal) : parsed;
                }
                catch(e) { return defaultVal; }
            },
            setJSON(key, value) {
                try { localStorage.setItem(key, JSON.stringify(value)); }
                catch(e) { /* localStorage unavailable */ }
            },
            remove(key) {
                try { localStorage.removeItem(key); }
                catch(e) { /* localStorage unavailable */ }

          { desc:'Reach 5x combo', check:function(s,st){return st.sessionMaxCombo>=5;}, reward:300, progressKey:'combo', progressTarget:5 },
          { desc:'Survive 2 minutes', check:function(s,st){return st.sessionTimeAlive>=120000;}, reward:200, progressKey:'time', progressTarget:120000 },
          { desc:'Eat 20 foods total', check:function(s,st){return st.sessionFoodEaten>=20;}, reward:250, progressKey:'food', progressTarget:20 },
          { desc:'Reach snake length 15', check:function(s,st){return st.snakeLength>=15;}, reward:200, progressKey:'length', progressTarget:15 },
          { desc:'Eat 4+ different food types', check:function(s,st){return st.sessionFoodTypes.size>=4;}, reward:250, progressKey:'types', progressTarget:4 },
        ];

        function getDailySeed() {
            const today = new Date();
            const dateStr = today.getFullYear() + '-' + (today.getMonth()+1) + '-' + today.getDate();
            let hash = 0;
            for (let i = 0; i < dateStr.length; i++) {
                hash = ((hash << 5) - hash) + dateStr.charCodeAt(i);
                hash |= 0;
            }
            return Math.abs(hash);
        }

        function getDailyProgress(challenge) {
            switch (challenge.progressKey) {
                case 'score': return score;
                case 'speed': return sessionSpeedFood;
                case 'bonus': return sessionBonusFood;
                case 'combo': return sessionMaxCombo;
                case 'time': return Math.min(sessionTimeAlive, challenge.progressTarget);
                case 'food': return sessionFoodEaten;
                case 'length': return snake.length;
                case 'types': return sessionFoodTypes.size;
                default: return 0;
            }
        }

        let gameMode = 'classic';
        let modeSelectIndex = 0;
        let timeAttackEnd = 0;
        let zenActive = false;
        let modeHighScores = loadModeHighScores();

        function loadModeHighScores() {
            return saveManager.getJSON('snake_mode_highs', {});
        }

        function getModeDesc(mode) {
            const descs = {
                classic: 'Standard Snake. Wall wrapping, speed increases with score.',
                timeAttack: 'Score max points in 60 seconds. Fixed speed, bonus food worth +50.',
                zen: 'No death from collisions. Relax and grow. Score = snake length.',
                daily: 'Complete today\'s unique challenge! 3 attempts per day.',
                snap: 'Snake shrinks every 3s — keep eating to survive!'
            };
            return descs[mode] || '';
        }

        highScoreEl.textContent = 'Best: ' + highScore;

        function getSpeed() {
            const mc = MODE_CONFIG[gameMode];
            if (typeof mc.speed === 'number') return mc.speed;
            return Math.max(MIN_SPEED, BASE_SPEED - Math.floor(score / 50) * 5);
        }

        function getEffectiveSpeed() {
            return slowMoActive ? getSpeed() * 2 : getSpeed();
        }

        function vibrate(duration) {
            if (navigator.vibrate) {
                const now = Date.now();
                if (now - lastVibrateTime >= 300) {
                    lastVibrateTime = now;
                    navigator.vibrate(duration);
                }
            }
        }

        function pickRandomFoodType() {
            const rand = Math.random();
            const tiers = FOOD_TIERS;
            let cumulative = 0;
            for (const typeKey in tiers) {
                cumulative += tiers[typeKey].weight;
                if (rand < cumulative) return typeKey;
            }
            return 'common';
        }

        function generateFood(currentSnake) {
            const totalTiles = (CANVAS_WIDTH / TILE_SIZE) * (CANVAS_HEIGHT / TILE_SIZE);
            const rivalLength = rivalActive ? rivalSnake.length : 0;
            if (currentSnake.length + obstacles.length + rivalLength >= totalTiles) return null;

            let newFood;
            let iterations = 0;
            const MAX_ITERATIONS = 200;
            do {
                if (iterations++ > MAX_ITERATIONS) {
                    // Board is nearly full — scan all tiles for a free spot
                    const freeTiles = [];
                    const cols = CANVAS_WIDTH / TILE_SIZE;
                    const rows = CANVAS_HEIGHT / TILE_SIZE;
                    for (let x = 0; x < cols; x++) {
                        for (let y = 0; y < rows; y++) {
                            const tx = x * TILE_SIZE;
                            const ty = y * TILE_SIZE;
                            if (currentSnake.some(s => s.x === tx && s.y === ty)) continue;
                            if (obstacles.some(o => o.x === tx && o.y === ty)) continue;
                            if (rivalActive && rivalSnake.some(s => s.x === tx && s.y === ty)) continue;
                            freeTiles.push({ x: tx, y: ty });
                        }
                    }
                    if (freeTiles.length === 0) return null;
                    const tile = freeTiles[Math.floor(Math.random() * freeTiles.length)];
                    const fallbackFood = { x: tile.x, y: tile.y, type: pickRandomFoodType() };
                    if (fallbackFood.type === 'rare' || fallbackFood.type === 'epic') playSound('rare_spawn');
                    return fallbackFood;
                }

                const type = pickRandomFoodType();
                newFood = {
                    x: Math.floor(Math.random() * (CANVAS_WIDTH / TILE_SIZE)) * TILE_SIZE,
                    y: Math.floor(Math.random() * (CANVAS_HEIGHT / TILE_SIZE)) * TILE_SIZE,
                    type: type
                };
            } while (currentSnake.some(segment => segment.x === newFood.x && segment.y === newFood.y) ||
                     obstacles.some(o => o.x === newFood.x && o.y === newFood.y) ||
                     (rivalActive && rivalSnake.some(s => s.x === newFood.x && s.y === newFood.y)));
            if (newFood.type === 'rare' || newFood.type === 'epic') playSound('rare_spawn');
            return newFood;
        }

        function spawnPowerUpPickup() {
            if (powerUpPickup) return;
            const types = Object.keys(POWERUP_TYPES);
            const type = types[Math.floor(Math.random() * types.length)];
            const maxAttempts = 50;
            for (let attempt = 0; attempt < maxAttempts; attempt++) {
                const x = Math.floor(Math.random() * (CANVAS_WIDTH / TILE_SIZE)) * TILE_SIZE;
                const y = Math.floor(Math.random() * (CANVAS_HEIGHT / TILE_SIZE)) * TILE_SIZE;
                if (snake.some(s => s.x === x && s.y === y)) continue;
                if (obstacles.some(o => o.x === x && o.y === y)) continue;
                if (food && food.x === x && food.y === y) continue;
                if (rivalActive && rivalSnake.some(s => s.x === x && s.y === y)) continue;
                powerUpPickup = { x, y, type };
                powerUpDespawnCounter = 125; // ~15 seconds at 120ms per tick
                return;
            }
        }

        function activatePowerUp(type) {
            vibrate(20);
            playSound('powerup');
            deactivatePowerUp(true);
            
            powerUpType = type;
            const config = POWERUP_TYPES[type];
            
            switch (type) {
                case 'shield':
                    shieldActive = true;
                    powerUpTimer = POWERUP_TYPES.shield.duration;
                    break;
                case 'magnet':
                    magnetActive = true;
                    powerUpTimer = config.duration;
                    break;
                case 'slowmo':
                    slowMoActive = true;
                    powerUpTimer = config.duration;
                    tickInterval = getEffectiveSpeed();
                    restartGameInterval(tickInterval);
                    break;
            }
            
            const el = toastEl;
            if (el) {
                el.textContent = '⚡ ' + config.name + ' Activated!';
                el.style.display = 'block';
                setTimeout(function() { el.style.display = 'none'; }, 2000);
            }
        }

        function deactivatePowerUp(silent) {
            if (!silent) { playSound('powerdown'); vibrate(15); }
            if (slowMoActive) {
                slowMoActive = false;
                tickInterval = getEffectiveSpeed();
                restartGameInterval(tickInterval);
            }
            shieldActive = false;
            magnetActive = false;
            powerUpTimer = 0;
            powerUpType = null;
            powerUpSpawnCounter = 0;
        }

        function resetGame() {
            helpOverlayVisible = false;
            lastDeathCause = '';
            lastComboMilestone = 0;
            comboCount = 0;
            sessionFoodEaten = 0;
            sessionFoodTypes = new Set();
            sessionSpeedFood = 0;
            sessionBonusFood = 0;
            gameTick = 0;
            lastEatTime = 0;
            sessionXP = 0;
            sessionPauseStart = 0;
            sessionPausedTime = 0;
            sessionTimeAlive = 0;
            sessionMaxCombo = 0;
            shrinkTimer = 3000;
            snapDuration = 3000;
            snapTimeSinceDecrease = 0;
            snapLevel = 1;
            snapLevelUpFlash = 0;
            levelUpFlash = 0;
            touchIndicatorTimer = 0;
            shakeTimer = 0;
            flashOverlay = null;
            eatAnimTimer = 0;
            if (comboFadeTimer) clearTimeout(comboFadeTimer);
            comboFadeTimer = null;
            powerUpPickup = null;
            shieldActive = false;

            rivalSnake = [];
            rivalDx = 0;

            snake = [{ x: 10 * TILE_SIZE, y: 10 * TILE_SIZE }];

            generateObstacles();

        function updateScoreDisplay() {
            if (score > (modeHighScores[gameMode] || 0)) {
                modeHighScores[gameMode] = score;
                saveManager.setJSON('snake_mode_highs', modeHighScores);
            }
            if (score > highScore) {
                highScore = score;
                saveManager.set('snake_high_score', highScore);
            }
            if (modeHighScores[gameMode]) {
                highScoreEl.textContent = 'Best (' + MODE_CONFIG[gameMode].name + '): ' + modeHighScores[gameMode];
            } else {
                highScoreEl.textContent = 'Best: ' + highScore;
            }
        }

        function startGame() {
            sessionSummary = null;
            sessionSummaryTimer = 0;
            if (gameMode === 'daily') {
                if (dailyAttempts <= 0) {
                    const el = toastEl;
                    if (el) {
                        el.textContent = 'No attempts remaining! Come back tomorrow.';
                        el.style.display = 'block';
                        setTimeout(function() { el.style.display = 'none'; }, 3000);
                    }
                    return;
                }
                dailyAttempts--;
                saveManager.set('snake_daily_attempts_remaining', dailyAttempts);
                    // Update streak — only when a daily game actually starts
                    const today = new Date();
                    const storedDate = saveManager.get('snake_daily_date', '');
                    let streak = saveManager.getInt('snake_streak_count', 0);
                    const todayStr = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');

                    if (storedDate && storedDate !== todayStr) {
                        // Different day than last play — check if consecutive
                        const parts = storedDate.split('-');
                        const storedDateObj = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
                        const yesterday = new Date(today);
                        yesterday.setDate(yesterday.getDate() - 1);
                        const yesterdayStr = yesterday.getFullYear() + '-' + String(yesterday.getMonth()+1).padStart(2, '0') + '-' + String(yesterday.getDate()).padStart(2, '0');
                        if (storedDate === yesterdayStr) {
                            streak++;
                        } else {
                            streak = 1; // Broken streak, restart
                        }
                        saveManager.set('snake_streak_count', streak);
                    } else if (!storedDate) {
                        // First ever play
                        streak = 1;
                        saveManager.set('snake_streak_count', streak);
                    }
                    // Always save the date so next day's comparison works
                    saveManager.set('snake_daily_date', todayStr);
            }
            // Check streak cosmetic unlocks
            const streak = saveManager.getInt('snake_streak_count', 0);
            for (const days in STREAK_UNLOCKS) {
                if (streak >= parseInt(days)) {
                    const id = STREAK_UNLOCKS[days];
                    if (unlockedCosmetics.indexOf(id) === -1) {
                        unlockedCosmetics.push(id);
                        saveManager.setJSON('snake_unlocks', unlockedCosmetics);
                    const allCosmetics = Object.assign({}, SNAKE_SKINS, GRID_THEMES, TRACE_EFFECTS, DEATH_EFFECTS, BORDER_EFFECTS);
                    const c = allCosmetics[id];
                    if (c) {
                        queueToast('🔑 Unlocked: ' + c.name + '!', 4000);
                    }
                    }
                }
            }
            const mc = MODE_CONFIG[gameMode];
            if (mc.timer) timeAttackEnd = Date.now() + mc.timer;
            if (gameMode === 'zen') zenActive = true;
            sessionStartTime = Date.now();
            gameState = 'playing';
            tickInterval = getEffectiveSpeed();
            gameInterval = setInterval(updateGame, tickInterval);
            if (gameMode === 'classic' || gameMode === 'timeAttack') {
                spawnRival();
            }
            drawGame(1);
            visualDirty = true;
        }

        function checkCollision(pos) {
            const mc = MODE_CONFIG[gameMode];
            // Check obstacle collision
            for (let i = 0; i < obstacles.length; i++) {
                if (pos.x === obstacles[i].x && pos.y === obstacles[i].y) return true;
            }
            // Check self collision (existing)
            if (!mc.selfCollision) return false;
            for (let i = 0; i < snake.length; i++) {
                if (pos.x === snake[i].x && pos.y === snake[i].y) return true;
            }
            return false;
        }

        function wrapPosition(pos) {
            return {
                x: ((pos.x % CANVAS_WIDTH) + CANVAS_WIDTH) % CANVAS_WIDTH,
                y: ((pos.y % CANVAS_HEIGHT) + CANVAS_HEIGHT) % CANVAS_HEIGHT
            };
        }

        function restartGameInterval(speed) {
            clearInterval(gameInterval);
            gameInterval = null;
            gameInterval = setInterval(updateGame, speed || tickInterval);
        }

        function generateObstacles() {
            obstacles = [];
            if (gameMode === 'zen') return;
            const totalTiles = (CANVAS_WIDTH / TILE_SIZE) * (CANVAS_HEIGHT / TILE_SIZE);
            const count = 3 + Math.floor(Math.random() * 6); // 3-8 obstacles
            const maxAttempts = 50;
            const headX = 10 * TILE_SIZE;
            const headY = 10 * TILE_SIZE;
            for (let i = 0; i < count; i++) {
                let placed = false;
                for (let attempt = 0; attempt < maxAttempts; attempt++) {
                    const obsX = Math.floor(Math.random() * (CANVAS_WIDTH / TILE_SIZE)) * TILE_SIZE;
                    const obsY = Math.floor(Math.random() * (CANVAS_HEIGHT / TILE_SIZE)) * TILE_SIZE;
                    // Check minimum distance from snake head (3 tiles)
                    const dist = Math.abs(obsX - headX) + Math.abs(obsY - headY);
                    if (dist < 3 * TILE_SIZE) continue;
                    // Check overlap with snake
                    if (snake.some(s => s.x === obsX && s.y === obsY)) continue;
                    // Check overlap with food
                    if (food && food.x === obsX && food.y === obsY) continue;
                    // Check overlap with existing obstacles
                    if (obstacles.some(o => o.x === obsX && o.y === obsY)) continue;
                    obstacles.push({ x: obsX, y: obsY });
                    placed = true;
                    break;
                }
                if (!placed) break; // Can't place more, continue with what we have
            }
            // Safety: if obstacles would leave < 50% of board open, reduce
            const minOpen = totalTiles / 2;
            if (totalTiles - obstacles.length - snake.length < minOpen) {
                obstacles = obstacles.slice(0, Math.max(0, Math.floor(totalTiles / 4)));
            }
        }

        function spawnRival() {
            if (rivalActive) return;
            if (gameMode === 'zen' || gameMode === 'snap' || gameMode === 'daily') return;
            
            const startX = 10 * TILE_SIZE;
            const startY = 10 * TILE_SIZE;
            const candidatePositions = [];
            
            const corners = [
                { x: 2 * TILE_SIZE, y: 2 * TILE_SIZE },
                { x: 17 * TILE_SIZE, y: 2 * TILE_SIZE },
                { x: 2 * TILE_SIZE, y: 17 * TILE_SIZE },
                { x: 17 * TILE_SIZE, y: 17 * TILE_SIZE },
            ];
            
            for (const corner of corners) {
                const dist = Math.abs(corner.x - startX) + Math.abs(corner.y - startY);
                if (dist >= 8 * TILE_SIZE) {
                    if (!obstacles.some(o => o.x === corner.x && o.y === corner.y)) {
                        candidatePositions.push(corner);
                    }
                }
            }
            
            if (candidatePositions.length === 0) {
                for (let attempt = 0; attempt < 20; attempt++) {
                    const x = Math.floor(Math.random() * (CANVAS_WIDTH / TILE_SIZE)) * TILE_SIZE;
                    const y = Math.floor(Math.random() * (CANVAS_HEIGHT / TILE_SIZE)) * TILE_SIZE;
                    const dist = Math.abs(x - startX) + Math.abs(y - startY);
                    if (dist >= 8 * TILE_SIZE && !obstacles.some(o => o.x === x && o.y === y)) {
                        if (!snake.some(s => s.x === x && s.y === y)) {
                            candidatePositions.push({ x: x, y: y });
                            break;
                        }
                    }
                }
            }
            
            if (candidatePositions.length === 0) return;
            
            const pos = candidatePositions[Math.floor(Math.random() * candidatePositions.length)];
            
            rivalSnake = [
                { x: pos.x, y: pos.y },
                { x: pos.x, y: pos.y + TILE_SIZE },
                { x: pos.x, y: pos.y + 2 * TILE_SIZE },
            ];
            rivalDx = 0;
            rivalDy = -TILE_SIZE;
            rivalActive = true;
        }

        function updateRival() {
            if (!rivalActive || rivalSnake.length === 0) return;
            
            const head = rivalSnake[0];
            
            let nearestFood = null;
            let nearestDist = Infinity;
            if (food) {
                const dist = Math.abs(food.x - head.x) + Math.abs(food.y - head.y);
                if (dist < nearestDist) {
                    nearestDist = dist;
                    nearestFood = food;
                }
            }
            
            const possibleDirs = [
                { dx: TILE_SIZE, dy: 0 },
                { dx: -TILE_SIZE, dy: 0 },
                { dx: 0, dy: TILE_SIZE },
                { dx: 0, dy: -TILE_SIZE },
            ].filter(function(d) { return !(d.dx === -rivalDx && d.dy === -rivalDy); });
            
            let chosenDir = { dx: rivalDx, dy: rivalDy };
            const rand = Math.random();
            
            if (rand < 0.70 && nearestFood) {
                const dx_food = nearestFood.x - head.x;
                const dy_food = nearestFood.y - head.y;
                
                if (Math.abs(dx_food) >= Math.abs(dy_food)) {
                    chosenDir = { dx: dx_food > 0 ? TILE_SIZE : -TILE_SIZE, dy: 0 };
                } else {
                    chosenDir = { dx: 0, dy: dy_food > 0 ? TILE_SIZE : -TILE_SIZE };
                }
                
                if (chosenDir.dx === -rivalDx && chosenDir.dy === -rivalDy) {
                    chosenDir = { dx: rivalDx, dy: rivalDy };
                }
            } else if (rand < 0.90) {
                chosenDir = { dx: rivalDx, dy: rivalDy };
            } else {
                const shuffled = possibleDirs.slice().sort(function() { return Math.random() - 0.5; });
                if (shuffled.length > 0) chosenDir = shuffled[0];
            }
            
            const testPos = { x: head.x + chosenDir.dx, y: head.y + chosenDir.dy };
            const wrappedTest = wrapPosition(testPos);
            
            const selfCollision = rivalSnake.some(function(s) { return s.x === wrappedTest.x && s.y === wrappedTest.y; });
            const obsCollision = obstacles.some(function(o) { return o.x === wrappedTest.x && o.y === wrappedTest.y; });
            
            if (selfCollision || obsCollision) {
                let found = false;
                for (let i = 0; i < possibleDirs.length; i++) {
                    const dir = possibleDirs[i];
                    const tp = wrapPosition({ x: head.x + dir.dx, y: head.y + dir.dy });
                    const sc = rivalSnake.some(function(s) { return s.x === tp.x && s.y === tp.y; });
                    const oc = obstacles.some(function(o) { return o.x === tp.x && o.y === tp.y; });
                    if (!sc && !oc) {
                        chosenDir = dir;
                        found = true;
                        break;
                    }
                }
                if (!found) {
                    removeRival();
                    return;
                }
            }
            
            rivalDx = chosenDir.dx;
            rivalDy = chosenDir.dy;
            
            const rTail = rivalSnake.pop();
            const rNewHead = wrapPosition({ x: head.x + rivalDx, y: head.y + rivalDy });
            
            const playerBodyHit = snake.some(function(s) { return s.x === rNewHead.x && s.y === rNewHead.y; });
            if (playerBodyHit) {
                spawnParticles(rNewHead.x, rNewHead.y, 20, '#FF4444');
                awardXP(100);
                if (gameMode !== 'zen') score += 50;
                updateScoreDisplay();
                stats.rivalsDefeated++;
                const el = toastEl;
                if (el) {
                    el.textContent = '\u{1F480} Rival Defeated! +50 pts +100 XP';
                    el.style.display = 'block';
                    setTimeout(function() { el.style.display = 'none'; }, 3000);
                }
                removeRival();
                return;
            }
            
            rivalSnake.unshift(rNewHead);
            
            if (food && rNewHead.x === food.x && rNewHead.y === food.y) {
                const combinedSnake = snake.concat(rivalSnake);
                const newFood = generateFood(combinedSnake);
                if (newFood) {
                    if (rivalSnake.length < RIVAL_MAX_LENGTH) {
                        rivalSnake.push(rTail);
                    }
                    food = newFood;
                    playSound('eat');
                } else {
                    food = null; // Board full — set food to null so it's not stuck at rival position
                }
            }
            
            const rHeadNow = rivalSnake[0];
            const selfHit = rivalSnake.slice(1).some(function(s) { return s.x === rHeadNow.x && s.y === rHeadNow.y; });
            if (selfHit) {
                removeRival();
                return;
            }
        }

        function removeRival() {
            if (rivalActive && rivalSnake.length > 0) {
                spawnParticles(rivalSnake[0].x, rivalSnake[0].y, 20, '#FF4444');
            }
            rivalSnake = [];
            rivalActive = false;
            rivalRespawnTimer = 10000;
        }

        function resumeGame() {
            gameState = 'playing';
            if (sessionPauseStart) {
                const pauseDuration = Date.now() - sessionPauseStart;
                sessionPausedTime += pauseDuration;
                if (gameMode === 'timeAttack') {
                    timeAttackEnd += pauseDuration;
                }
                sessionPauseStart = 0;
            }
    tickInterval = getEffectiveSpeed();
    restartGameInterval(tickInterval);
    playSound('resume');
            drawGame(1);
            visualDirty = true;
        }

        function finalizeSession(isVoluntary) {
            sessionTimeAlive = Date.now() - sessionStartTime - sessionPausedTime;
            stats.gamesPlayed++;
            stats.totalScore += score;
            if (!isVoluntary) stats.totalDeaths++;
            stats.totalTimePlayed += sessionTimeAlive;
            if (score > stats.maxScore) stats.maxScore = score;
            if (sessionTimeAlive > stats.longestTimeAlive) stats.longestTimeAlive = sessionTimeAlive;
            if (snake.length > stats.longestLength) stats.longestLength = snake.length;
            saveAllState();
            if (score > (modeHighScores[gameMode] || 0)) {
                modeHighScores[gameMode] = score;
                saveManager.setJSON('snake_mode_highs', modeHighScores);
            }
            drawGame(1);
            visualDirty = true;
        }

        function gameOver() {
            helpOverlayVisible = false;
            clearInterval(gameInterval);
            gameInterval = null;
            gameState = 'gameover';
            rivalSnake = [];
            rivalActive = false;
            rivalRespawnTimer = 0;
            finalizeSession(false);
            awardXP(snake.length * 10);
            checkAchievements(score);
            checkDailyCompletion(score, {
                sessionSpeedFood: sessionSpeedFood,
                sessionBonusFood: sessionBonusFood,
                sessionMaxCombo: sessionMaxCombo,
                sessionTimeAlive: sessionTimeAlive,
                sessionFoodEaten: sessionFoodEaten,
                sessionFoodTypes: sessionFoodTypes,
                snakeLength: snake.length
            });

            // Session summary
            sessionSummary = {
                score: score,
                time: Math.floor(sessionTimeAlive / 1000),
                food: sessionFoodEaten,
                combo: sessionMaxCombo,
                xp: sessionXP,
            };
            sessionSummaryTimer = 4000; // show for 4 seconds

            vibrate(30);
            const de = DEATH_EFFECTS[cosmetics.death] || DEATH_EFFECTS.death_classic;
            if (de.color === 'rainbow') {
                const perColor = Math.floor(de.count / 3);
                const extra = de.count - perColor * 3;
                spawnParticles(snake[0].x, snake[0].y, perColor + (extra > 0 ? 1 : 0), '#FF0000');
                spawnParticles(snake[0].x, snake[0].y, perColor + (extra > 1 ? 1 : 0), '#00FF00');
                spawnParticles(snake[0].x, snake[0].y, perColor, '#0000FF');
            } else {
                spawnParticles(snake[0].x, snake[0].y, de.count, de.color);
            }
            playSound('gameover');
            shakeTimer = 200;
            drawGame(1);
            visualDirty = true;
        }

        function playSound(name) {
            if (muted) return;
            if (!audioCtx) {
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) {
                    return;
                }
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            gain.gain.value = 0.2;
            const now = audioCtx.currentTime;

            switch (name) {
                case 'eat':
                    osc.frequency.value = 523;
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                    break;
                case 'bonus':
                    osc.frequency.value = 523;
                    osc.frequency.linearRampToValueAtTime(1047, now + 0.15);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                    break;
                case 'speed':
                    osc.frequency.value = 440;
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
                    osc.start(now);
                    osc.stop(now + 0.06);
                    break;
                case 'achievement':
                    // Ascending arpeggio C5→E5→G5, 0.4s
                    osc.frequency.setValueAtTime(523, now);
                    osc.frequency.setValueAtTime(659, now + 0.13);
                    osc.frequency.setValueAtTime(784, now + 0.26);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                    break;
                case 'levelup':
                    // Two-tone ascending C5→C6, 0.3s
                    osc.frequency.setValueAtTime(523, now);
                    osc.frequency.setValueAtTime(1047, now + 0.15);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                    break;
                case 'powerup':
                    // Quick ascending sweep 440→880, 0.15s
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.linearRampToValueAtTime(880, now + 0.15);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                    break;
                case 'powerdown':
                    // Short descending 660→330, 0.1s
                    osc.frequency.setValueAtTime(660, now);
                    osc.frequency.linearRampToValueAtTime(330, now + 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                    break;
                case 'rare_spawn':
                    // Two quick ascending notes, 0.2s total
                    osc.frequency.setValueAtTime(880, now);
                    osc.frequency.setValueAtTime(1100, now + 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                    break;
                case 'combo_milestone':
                    // Quick ascending C5→E5, 0.2s
                    osc.frequency.setValueAtTime(523, now);
                    osc.frequency.setValueAtTime(659, now + 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                    break;
                case 'gameover':
                    osc.frequency.value = 440;
                    osc.frequency.linearRampToValueAtTime(220, now + 0.5);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                    break;
                case 'pause':
                    osc.frequency.value = 330;
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                    break;
                case 'resume':
                    osc.frequency.value = 440;
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                    break;
            }
        }

        function spawnParticles(x, y, count, color) {

                    life: 1.0,
                    maxLife: count > 20 ? 1.0 : 0.5,
                    color: color,
                    size: Math.random() * 3 + 2
                });
            }
        }

        function animateVisuals(timestamp) {
            if (!lastFrameTime) lastFrameTime = timestamp;
            const delta = Math.min(timestamp - lastFrameTime, 100);
            lastFrameTime = timestamp;
            renderTime = timestamp || performance.now();

            // Update and draw particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.05; // gravity
                p.life -= delta / (p.maxLife * 1000) * (slowMoActive ? 0.5 : 1);
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }

            if (shakeTimer > 0) shakeTimer = Math.max(0, shakeTimer - delta);
            if (eatAnimTimer > 0) eatAnimTimer = Math.max(0, eatAnimTimer - delta);
            if (snapLevelUpFlash > 0) snapLevelUpFlash = Math.max(0, snapLevelUpFlash - delta);
            if (sessionSummaryTimer > 0) sessionSummaryTimer = Math.max(0, sessionSummaryTimer - delta);
            if (touchIndicatorTimer > 0) touchIndicatorTimer = Math.max(0, touchIndicatorTimer - delta);

            if (flashOverlay) {
                flashOverlay.alpha -= delta * 0.004;
                if (flashOverlay.alpha <= 0) flashOverlay = null;
            }

            // Level-up flash overlay
            if (levelUpFlash > 0) {
                levelUpFlash = Math.max(0, levelUpFlash - delta);
                if (!flashOverlay || flashOverlay.color === '#FFD700') {
                    flashOverlay = { color: '#FFD700', alpha: Math.min(0.3, levelUpFlash / 5000) };
                }
            }

            const elapsed = timestamp - lastTickTime;
            const t = lastTickTime > 0 ? Math.min(elapsed / tickInterval, 1) : 1;

            const needsRedraw = visualDirty || particles.length > 0 || flashOverlay || shakeTimer > 0 || eatAnimTimer > 0 || snapLevelUpFlash > 0 || (gameMode === 'snap' && gameState === 'playing');
            if (needsRedraw) {
                visualDirty = false;
                let didShake = false;
                if (shakeTimer > 0 && gameState !== 'paused') {
                    const intensity = (shakeTimer / 200) * 5;
                    ctx.save();
                    ctx.translate((Math.random() - 0.5) * 2 * intensity, (Math.random() - 0.5) * 2 * intensity);
                    didShake = true;
                }
                drawGame(t);
                if (didShake) ctx.restore();
            }

            // Render particles on top of game state
            for (const p of particles) {
                const alpha = Math.max(0, p.life);
                ctx.globalAlpha = alpha;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
            }
            ctx.globalAlpha = 1;

            // Touch swipe indicator
            if (touchIndicatorTimer > 0) {
                const alpha = Math.min(1, touchIndicatorTimer / 150);
                ctx.save();
                ctx.globalAlpha = alpha * 0.3;
                ctx.fillStyle = '#4488FF';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                ctx.restore();
            }

            // Help overlay — renders on top of everything
            if (helpOverlayVisible) {
                drawHelpOverlay();
            }

            // Session summary overlay
            if (sessionSummary && sessionSummaryTimer > 0) {
                const alpha = Math.min(1, sessionSummaryTimer / 1000);
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                ctx.fillRect(10, CANVAS_HEIGHT - 110, CANVAS_WIDTH - 20, 100);
                ctx.fillStyle = '#FFD700';
                ctx.font = 'bold 12px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillText('📊 Session Summary', CANVAS_WIDTH / 2, CANVAS_HEIGHT - 105);
                ctx.fillStyle = '#CCC';
                ctx.font = '11px Arial';
                ctx.fillText('Score: ' + sessionSummary.score + '  |  Time: ' + sessionSummary.time + 's  |  Food: ' + sessionSummary.food, CANVAS_WIDTH / 2, CANVAS_HEIGHT - 88);
                ctx.fillText('Best Combo: ' + sessionSummary.combo + 'x  |  XP Earned: +' + sessionSummary.xp, CANVAS_WIDTH / 2, CANVAS_HEIGHT - 73);
                ctx.restore();
            }

            // Snap level-up flash
            if (snapLevelUpFlash > 0 && gameMode === 'snap') {
                const alpha = Math.min(1, snapLevelUpFlash / 500);
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = '#FFD700';
                ctx.font = 'bold 24px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.fillText('⚡ LEVEL ' + snapLevel + ' ⚡', CANVAS_WIDTH / 2, CANVAS_HEIGHT - 15);
                ctx.restore();
            }

            // XP level-up flash
            if (levelUpFlash > 0 && level >= 1) {
                const alpha = Math.min(1, levelUpFlash / 500);
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = '#FFD700';
                ctx.font = 'bold 24px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillText('🌟 LEVEL ' + level + '! 🌟', CANVAS_WIDTH / 2, 20);
                ctx.restore();
            }

            // Flash overlay — renders last on top of everything (AGENTS.md)
            if (flashOverlay) {
                ctx.fillStyle = flashOverlay.color;
                ctx.globalAlpha = Math.max(0, flashOverlay.alpha);
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                ctx.globalAlpha = 1;
            }

            // Animate score
            const scoreDelta = score - displayedScore;
            if (scoreDelta > 1) {
                displayedScore += Math.ceil(scoreDelta * 0.3);
            } else if (scoreDelta > 0) {
                displayedScore = score;
            }
            if (displayedScore !== parseInt(scoreEl.textContent, 10)) {
                scoreEl.textContent = displayedScore;
            }

            const comboEl = comboDisplayEl;
            if (comboEl) {
                const mul = 1 + comboCount * 0.5;
                const comboText = comboCount > 0 ? 'x' + mul.toFixed(1) + ' COMBO!' : '';
                if (comboEl.textContent !== comboText) {
                    comboEl.textContent = comboText;
                }
            }
            const xpEl = xpDisplayEl;
            if (xpEl) {
                if (xpEl.style.display !== 'none') {
                    xpEl.style.display = 'none';
                }
            }

            requestAnimationFrame(animateVisuals);
        }
