        function drawGrid() {
            ensureGridCache();
            ctx.drawImage(gridCacheCanvas, 0, 0);
        }

        function drawObstacles() {
            for (let i = 0; i < obstacles.length; i++) {
                const obs = obstacles[i];
                const flash = newObstacleFlash.find(f => f.x === obs.x && f.y === obs.y);
                if (flash) {
                    const alpha = flash.timer / 1000;
                    ctx.fillStyle = 'rgba(255, 100, 50, ' + (0.5 + alpha * 0.5) + ')';
                    ctx.strokeStyle = 'rgba(255, 150, 100, ' + (0.7 + alpha * 0.3) + ')';
                } else {
                    ctx.fillStyle = '#555';
                    ctx.strokeStyle = '#777';
                }
                ctx.fillRect(obs.x + 1, obs.y + 1, TILE_SIZE - 2, TILE_SIZE - 2);
                ctx.strokeRect(obs.x + 0.5, obs.y + 0.5, TILE_SIZE - 1, TILE_SIZE - 1);
                // High-contrast cross-hatch
                if (highContrast) {
                    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(obs.x + 1, obs.y + 1);
                    ctx.lineTo(obs.x + TILE_SIZE - 2, obs.y + TILE_SIZE - 2);
                    ctx.moveTo(obs.x + TILE_SIZE - 2, obs.y + 1);
                    ctx.lineTo(obs.x + 1, obs.y + TILE_SIZE - 2);
                    ctx.stroke();
                }
            }
        }

        function drawFood() {
            if (!food) return;
            const tier = FOOD_TIERS[food.type] || FOOD_TIERS.common;
            const cx = food.x + TILE_SIZE / 2;
            const cy = food.y + TILE_SIZE / 2;

            ctx.save();

            if (tier.glow) {
                ctx.shadowBlur = tier.glow;
                ctx.shadowColor = tier.color;
            }

            ctx.fillStyle = tier.color;

            switch (food.type) {
                case 'common': {
                    // Filled circle
                    ctx.beginPath();
                    ctx.arc(cx, cy, TILE_SIZE * 0.4, 0, 2 * Math.PI);
                    ctx.fill();
                    break;
                }
                case 'uncommon': {
                    // Diamond shape
                    const s = TILE_SIZE * 0.45;
                    ctx.beginPath();
                    ctx.moveTo(cx, cy - s);
                    ctx.lineTo(cx + s, cy);
                    ctx.lineTo(cx, cy + s);
                    ctx.lineTo(cx - s, cy);
                    ctx.closePath();
                    ctx.fill();
                    break;
                }
                case 'rare': {
                    // Upward-pointing triangle
                    const s = TILE_SIZE * 0.45;
                    ctx.beginPath();
                    ctx.moveTo(cx, cy - s);
                    ctx.lineTo(cx + s, cy + s * 0.7);
                    ctx.lineTo(cx - s, cy + s * 0.7);
                    ctx.closePath();
                    ctx.fill();
                    break;
                }
                case 'epic': {
                    // Hexagon
                    const r = TILE_SIZE * 0.42;
                    ctx.beginPath();
                    for (let i = 0; i < 6; i++) {
                        const angle = (Math.PI / 3) * i - Math.PI / 2;
                        const px = cx + r * Math.cos(angle);
                        const py = cy + r * Math.sin(angle);
                        if (i === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    }
                    ctx.closePath();
                    ctx.fill();
                    break;
                }
                case 'bonus': {
                    // Pulsing circle (keep existing pulse mechanic)
                    const pulse = 1 + 0.5 * Math.sin(renderTime / 200);
                    const r = Math.min(TILE_SIZE * 0.4 * pulse, TILE_SIZE * 0.6);
                    ctx.beginPath();
                    ctx.arc(cx, cy, r, 0, 2 * Math.PI);
                    ctx.fill();
                    break;
                }
                case 'speed': {
                    // Double chevron >>
                    const s = TILE_SIZE * 0.35;
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = tier.color;
                    ctx.beginPath();
                    ctx.moveTo(cx - s, cy - s);
                    ctx.lineTo(cx, cy);
                    ctx.lineTo(cx - s, cy + s);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(cx, cy - s);
                    ctx.lineTo(cx + s, cy);
                    ctx.lineTo(cx, cy + s);
                    ctx.stroke();
                    break;
                }
                default: {
                    ctx.fillRect(food.x, food.y, TILE_SIZE, TILE_SIZE);
                    break;
                }
            }

            ctx.restore();

            // Letter labels for non-common types with text outline for contrast
            if (!highContrast) {
                const labels = { uncommon: 'U', rare: 'R', epic: 'E', bonus: 'B', speed: 'S' };
                if (labels[food.type]) {
                    ctx.save();
                    ctx.font = 'bold 10px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 2;
                    ctx.strokeText(labels[food.type], cx, cy);
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillText(labels[food.type], cx, cy);
                    ctx.restore();
                }
            } else {
                // High-contrast: universal labels for ALL food types
                const hcLabels = { common: 'C', uncommon: 'U', rare: 'R', epic: 'E', bonus: 'B', speed: 'S' };
                ctx.save();
                ctx.font = 'bold 13px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 3;
                ctx.strokeText(hcLabels[food.type] || '?', cx, cy);
                ctx.fillStyle = '#FFFFFF';
                ctx.fillText(hcLabels[food.type] || '?', cx, cy);
                ctx.restore();
            }
            // v6: Echo Brew food2 rendering
            if (food2) {
                ctx.save();
                ctx.globalAlpha = 0.7;
                var f2Tier = FOOD_TIERS[food2.type] || FOOD_TIERS.common;
                var f2cx = food2.x + TILE_SIZE / 2;
                var f2cy = food2.y + TILE_SIZE / 2;
                ctx.fillStyle = f2Tier.color;
                ctx.beginPath();
                ctx.arc(f2cx, f2cy, TILE_SIZE * 0.35, 0, 2 * Math.PI);
                ctx.fill();
                ctx.fillStyle = '#FFF';
                ctx.font = 'bold 8px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('E', f2cx, f2cy);
                ctx.restore();
            }
        }

        function drawPowerUpPickup() {
            if (!powerUpPickup) return;
            if (powerUpPickup && powerUpDespawnCounter < 20 && Math.floor(renderTime / 100) % 2 === 0) return;
            const config = POWERUP_TYPES[powerUpPickup.type];
            const cx = powerUpPickup.x + TILE_SIZE / 2;
            const cy = powerUpPickup.y + TILE_SIZE / 2;

            ctx.save();
            ctx.shadowBlur = 10;
            ctx.shadowColor = config.color;
            ctx.fillStyle = config.color;
            
            const r = TILE_SIZE * 0.35;
            if (powerUpPickup.type === 'shield') {
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, 2 * Math.PI);
                ctx.fill();
                ctx.fillStyle = '#FFF';
                ctx.font = 'bold 14px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('S', cx, cy);
            } else if (powerUpPickup.type === 'magnet') {
                ctx.beginPath();
                for (let i = 0; i < 4; i++) {
                    const angle = (i * Math.PI / 2) - Math.PI / 2;
                    const outerR = r;
                    const innerR = r * 0.4;
                    ctx.lineTo(cx + Math.cos(angle) * outerR, cy + Math.sin(angle) * outerR);
                    ctx.lineTo(cx + Math.cos(angle + Math.PI / 4) * innerR, cy + Math.sin(angle + Math.PI / 4) * innerR);
                }
                ctx.closePath();
                ctx.fill();
            } else if (powerUpPickup.type === 'slowmo') {
                ctx.beginPath();
                ctx.moveTo(cx, cy - r);
                ctx.lineTo(cx + r, cy);
                ctx.lineTo(cx, cy + r);
                ctx.lineTo(cx - r, cy);
                ctx.closePath();
                ctx.fill();
            }
            
            ctx.restore();
        }

        function drawEyes(drawX, drawY, dx, dy, scleraColor, pupilColor) {
            let ex1, ey1, ex2, ey2;
            if (dx > 0) {
                ex1 = drawX + 12; ey1 = drawY + 4;
                ex2 = drawX + 12; ey2 = drawY + 12;
            } else if (dx < 0) {
                ex1 = drawX + 4; ey1 = drawY + 4;
                ex2 = drawX + 4; ey2 = drawY + 12;
            } else if (dy < 0) {
                ex1 = drawX + 4; ey1 = drawY + 4;
                ex2 = drawX + 12; ey2 = drawY + 4;
            } else {
                ex1 = drawX + 4; ey1 = drawY + 12;
                ex2 = drawX + 12; ey2 = drawY + 12;
            }
            ctx.fillStyle = scleraColor;
            ctx.beginPath(); ctx.arc(ex1, ey1, 4, 0, 2 * Math.PI); ctx.fill();
            ctx.beginPath(); ctx.arc(ex2, ey2, 4, 0, 2 * Math.PI); ctx.fill();
            ctx.fillStyle = pupilColor;
            ctx.beginPath(); ctx.arc(ex1, ey1, 2, 0, 2 * Math.PI); ctx.fill();
            ctx.beginPath(); ctx.arc(ex2, ey2, 2, 0, 2 * Math.PI); ctx.fill();
        }

        function drawSnake(t) {
            const skin = SNAKE_SKINS[cosmetics.snake] || SNAKE_SKINS.snake_green;
            let headDrawX = 0, headDrawY = 0;
            snake.forEach(function(segment, index) {
                let drawX, drawY;
                
                if (t >= 1 || prevSnake.length === 0) {
                    drawX = segment.x;
                    drawY = segment.y;
                } else if (index === 0) {
                    // When the snake just ate (snakeGrew=true), snap the head to its
                    // actual position immediately so the visual matches where eating
                    // effects (particles, floater) and collision occurred. Without
                    // this, the head is interpolated from prevSnake[0] (1 block
                    // behind) while food is already replaced — making eating appear
                    // to trigger "early" and the head "1 block behind."
                    if (snakeGrew) {
                        drawX = segment.x;
                        drawY = segment.y;
                    } else {
                        const prev = prevSnake[0];
                        if (prev) {
                            const pdx = segment.x - prev.x;
                            const pdy = segment.y - prev.y;
                            drawX = Math.abs(pdx) > PLAY_WIDTH / 2 ? segment.x : prev.x + pdx * t;
                            drawY = Math.abs(pdy) > PLAY_HEIGHT / 2 ? segment.y : prev.y + pdy * t;
                        } else {
                            drawX = segment.x;
                            drawY = segment.y;
                        }
                    }
                } else if (snakeGrew && prevSnake[index - 1]) {
                    const prev = prevSnake[index - 1];
                    const pdx = segment.x - prev.x;
                    const pdy = segment.y - prev.y;
                    drawX = Math.abs(pdx) > PLAY_WIDTH / 2 ? segment.x : prev.x + pdx * t;
                    drawY = Math.abs(pdy) > PLAY_HEIGHT / 2 ? segment.y : prev.y + pdy * t;
                } else if (index > 0 && prevSnake[index - 1]) {
                    const pdx = segment.x - prevSnake[index - 1].x;
                    const pdy = segment.y - prevSnake[index - 1].y;
                    drawX = Math.abs(pdx) > PLAY_WIDTH / 2 ? segment.x : prevSnake[index - 1].x + pdx * t;
                    drawY = Math.abs(pdy) > PLAY_HEIGHT / 2 ? segment.y : prevSnake[index - 1].y + pdy * t;
                } else {
                    drawX = segment.x;
                    drawY = segment.y;
                }
                
                if (index === 0) {
                    headDrawX = drawX;
                    headDrawY = drawY;
                }
                
                if (skin.head === 'ghost') {
                    ctx.globalAlpha = 0.5;
                    ctx.fillStyle = index === 0 ? 'rgba(200, 200, 255, 0.7)' : 'rgba(150, 150, 255, 0.4)';
                } else if (skin.head === 'rainbow') {
                    const hue = (index * 20 + renderTime * 0.05) % 360;
                    ctx.fillStyle = 'hsl(' + hue + ', 100%, 50%)';
                } else {
                    ctx.fillStyle = index === 0 ? skin.head : skin.body;
                }
                if (index === 0 && eatAnimTimer > 0) {
                    const scale = 1 + 0.2 * (eatAnimTimer / 150);
                    const size = Math.round((TILE_SIZE - 1) * scale);
                    const offset = Math.round(((TILE_SIZE - 1) - size) / 2);
                    ctx.fillRect(drawX + offset, drawY + offset, size, size);
                } else {
                    ctx.fillRect(drawX, drawY, TILE_SIZE - 1, TILE_SIZE - 1);
                }
                if (skin.head === 'ghost') {
                    ctx.globalAlpha = 1;
                }

                // High-contrast snake outline
                if (highContrast && !(skin.head === 'ghost')) {
                    ctx.strokeStyle = '#FFFFFF';
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(drawX, drawY, TILE_SIZE - 1, TILE_SIZE - 1);
                }

                if (index === 0) {
                    drawEyes(drawX, drawY, dx, dy, 'white', 'black');
                }
            });

            // Snap mode timer ring around head
            if (gameMode === 'snap' && gameState === 'playing' && snake.length > 0) {
                const cx = headDrawX + TILE_SIZE / 2;
                const cy = headDrawY + TILE_SIZE / 2;
                const radius = TILE_SIZE * 0.8;
                const fraction = Math.min(shrinkTimer, snapDuration) / snapDuration;

                let ringColor;
                if (fraction > 0.5) ringColor = '#44FF44';
                else if (fraction > 0.25) ringColor = '#FFAA00';
                else ringColor = '#FF4444';

                ctx.strokeStyle = ringColor;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(cx, cy, radius, -Math.PI / 2, -Math.PI / 2 + fraction * 2 * Math.PI);
                ctx.stroke();

                // Text label for accessibility
                ctx.fillStyle = ringColor;
                ctx.font = 'bold 9px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillText('SNAP ' + Math.round(fraction * 100) + '%', cx, cy + radius + 3);
            }

            // Shield aura around head
            if (shieldActive && snake.length > 0) {
                ctx.save();
                ctx.strokeStyle = '#4488FF';
                ctx.lineWidth = 2;
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#4488FF';
                ctx.globalAlpha = 0.6;
                ctx.beginPath();
                ctx.arc(headDrawX + TILE_SIZE / 2, headDrawY + TILE_SIZE / 2, TILE_SIZE * 0.7, 0, 2 * Math.PI);
                ctx.stroke();
                ctx.restore();
            }
        }

        function drawRival(t) {
            for (var ri = 0; ri < rivals.length; ri++) {
                var r = rivals[ri];
                if (!r.active || r.snake.length === 0) continue;
                ctx.save();
                for (var rj = 0; rj < r.snake.length; rj++) {
                    ctx.fillStyle = rj === 0 ? '#FF6666' : r.color;
                    ctx.fillRect(r.snake[rj].x + 1, r.snake[rj].y + 1, TILE_SIZE - 2, TILE_SIZE - 2);
                }
                ctx.restore();
            }
        }

        function drawTrails() {
            const config = TRAIL_RENDER_CONFIG[cosmetics.trace];
            if (!config || snake.length < 4) return;
            const skin = SNAKE_SKINS[cosmetics.snake] || SNAKE_SKINS.snake_green;
            for (let t = 0; t < 3; t++) {
                const idx = snake.length - 1 - t;
                if (idx < 0) break;
                const seg = snake[idx];
                ctx.globalAlpha = config.alphaStart - t * config.alphaDecay;
                ctx.fillStyle = config.color(idx, skin);
                ctx.fillRect(seg.x, seg.y, TILE_SIZE - 1, TILE_SIZE - 1);
            }
            ctx.globalAlpha = 1;
        }

            if (muted) {
                ctx.fillStyle = '#888';

                ctx.textAlign = 'right';
                ctx.textBaseline = 'top';
                ctx.fillText('🔇', CANVAS_WIDTH - 8, 8);

            if (highContrast) {
                ctx.fillStyle = 'rgba(255,255,255,0.5)';

        function drawXPBar() {
            if (level < 20) {
                updateXpCache();
                const xpInLevel = xp - cachedXpForPrevLevel;
                const xpNeeded = cachedXpForThisLevel - cachedXpForPrevLevel;
                const progress = xpInLevel / xpNeeded;
                
                const barX = 5;
                const barY = CANVAS_HEIGHT - 22;
                const barWidth = 120;
                const barHeight = 12;
                
                if (prestigeLevel > 0) {
                    ctx.fillStyle = '#FFD700';
                    ctx.font = 'bold 8px Arial';
                    ctx.textAlign = 'right';
                    ctx.textBaseline = 'bottom';
                    ctx.fillText('P' + prestigeLevel, barX + barWidth - 2, barY - 2);
                }
                
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(barX - 2, barY - 2, barWidth + 4, barHeight + 4);
                
                ctx.fillStyle = 'rgba(255,215,0,0.3)';
                ctx.fillRect(barX, barY, barWidth * Math.min(progress, 1), barHeight);
                
                ctx.strokeStyle = 'rgba(255,215,0,0.5)';
                ctx.lineWidth = 1;
                ctx.strokeRect(barX, barY, barWidth, barHeight);
                
                ctx.fillStyle = '#FFD700';
                ctx.font = hudFont(9);
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('Lv.' + level + ' ' + xpInLevel + '/' + xpNeeded, barX + barWidth/2, barY + barHeight/2);
            }
        }

        function drawPrestigeBorder() {
            if (cosmetics.border && cosmetics.border !== 'border_none') {
                const borderConfig = BORDER_EFFECTS[cosmetics.border];
                if (borderConfig) {

        function drawSlowMoTint() {

        function drawSnapHUD() {

            ctx.fillStyle = '#FF8888';
            ctx.font = hudFont(10);
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';

        function drawPaintGrid() {
            if (gameMode !== 'painter' || !paintGrid) return;
            var cols = PLAY_WIDTH / TILE_SIZE;
            var rows = PLAY_HEIGHT / TILE_SIZE;
            var now = Date.now();
            ctx.save();
            for (var c = 0; c < cols; c++) {
                for (var r = 0; r < rows; r++) {
                    var tile = paintGrid[c][r];
                    if (!tile) continue;
                    var age = now - tile.timestamp;
                    var flashAlpha = age < 500 ? 0.15 : 0;
                    ctx.globalAlpha = 0.85 + flashAlpha;
                    ctx.shadowBlur = 6;
                    ctx.shadowColor = tile.color;
                    ctx.fillStyle = tile.color;
                    ctx.fillRect(c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                }
            }
            ctx.shadowBlur = 0;
            ctx.shadowColor = 'transparent';
            ctx.globalAlpha = 1;
            ctx.restore();

        function generateObstaclesForWave(wave) {
            if (wave.obstacles === 0) return;
            var headX = 10 * TILE_SIZE;
            var headY = 10 * TILE_SIZE;
            for (var i = 0; i < wave.obstacles; i++) {
                var tile = findFreeTile(headX, headY);
                if (tile) obstacles.push(tile);
            }
        }

        function applyGauntletPicks() {
            for (var i = 0; i < gauntletPicks.length; i++) {
                var pick = gauntletPicks[i];
                switch (pick.id) {
                    case 'extra_length':
                        for (var j = 0; j < 5; j++) {
                            snake.push({ x: snake[0].x, y: snake[0].y });
                        }
                        break;
                    case 'wave_shield':
                        shieldActive = true;
                        powerUpTimer = 6000;
                        powerUpType = 'shield';
                        break;
                    case 'slow_pace':
                        tickInterval = Math.floor(tickInterval * 1.2);
                        break;
                }
            }
        }

        function resetWaveState() {
            var wave = GAUNTLET_WAVES[gauntletWave];
            snake = [{ x: 10 * TILE_SIZE, y: 10 * TILE_SIZE }];
            dx = TILE_SIZE;
            dy = 0;
            nextDirection = null;
            food = null;
            score = 0;
            gauntletWaveScore = 0;
            displayedScore = 0;
            sessionFoodEaten = 0;
            sessionFoodTypes = new Set();
            sessionSpeedFood = 0;
            sessionBonusFood = 0;
            comboCount = 0;
            lastEatTime = 0;
            lastComboMilestone = 0;
            var hasComboSave = false;
            for (var cp = 0; cp < gauntletPicks.length; cp++) {

            particles = [];
            flashOverlay = null;

        function completeGauntletWave() {
            gauntletWaveScore = score;
            gauntletScore += score;
            gauntletMasteryPoints++;
            saveManager.set('snake_gauntlet_mastery', gauntletMasteryPoints);
            if (gauntletWave >= GAUNTLET_WAVES.length - 1) {
                score = gauntletScore;
                queueToast('Gauntlet Complete! Total: ' + gauntletScore, 4000);
                gameOver();
                return;
            }
            gauntletIntermission = true;
            gauntletPickOptions = pickRandomGauntletPicks(3);
            gauntletSelection = 0;
            playSound('achievement');
            queueToast('Wave ' + (gauntletWave + 1) + ' Complete! +' + gauntletWaveScore + ' pts', 2000);
        }

        function pickRandomGauntletPicks(count) {
            var pool = GAUNTLET_PICKS.slice();
            var options = [];
            var safety = 0;
            while (options.length < count && safety < 100) {
                var idx = Math.floor(Math.random() * pool.length);
                var pick = pool[idx];
                var dup = false;
                for (var pi = 0; pi < options.length; pi++) {
                    if (options[pi].id === pick.id) { dup = true; break; }
                }
                if (!dup) options.push(pick);
                safety++;
            }
            return options;
        }

        function startNextWave() {
            gauntletWave++;
            gauntletIntermission = false;
            resetWaveState();
             var wave = GAUNTLET_WAVES[gauntletWave];
             if (wave.rival && gameMode === 'gauntlet') {
                 spawnRival(0);
             }
             tickInterval = wave.speedBase;
             restartGameTimeout();
         }

        function getMasteryTier() {
            var tier = GAUNTLET_MASTERY_TIERS[0];
            for (var ti = GAUNTLET_MASTERY_TIERS.length - 1; ti >= 0; ti--) {
                if (gauntletMasteryPoints >= GAUNTLET_MASTERY_TIERS[ti].points) {
                    tier = GAUNTLET_MASTERY_TIERS[ti];
                    break;
                }
            }
            return tier;
        }

        function drawGauntletHUD() {
            if (gameMode !== 'gauntlet' || gameState !== 'playing') return;
            ctx.save();
            var wave = GAUNTLET_WAVES[gauntletWave];
            ctx.fillStyle = '#FFD700';
            ctx.font = hudFont(11);
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText('Wave ' + (gauntletWave + 1) + '/5: ' + wave.desc, 5, 50);
            var barW = 120;
            var barH = 8;
            var barX = 5;
            var barY = 72;
            var progress = 0;
            if (wave.objective === 'survive') {
                progress = Math.min(1, gameTick / wave.duration);
            } else if (wave.objective === 'eat') {
                progress = Math.min(1, sessionFoodEaten / wave.target);
            } else if (wave.objective === 'combo') {
                progress = Math.min(1, comboCount / wave.target);
            } else if (wave.objective === 'score') {
                progress = Math.min(1, score / wave.target);
            }
            ctx.fillStyle = '#333';
            ctx.fillRect(barX, barY, barW, barH);
            ctx.fillStyle = '#FFD700';
            ctx.fillRect(barX, barY, barW * progress, barH);
            ctx.strokeStyle = '#555';
            ctx.strokeRect(barX, barY, barW, barH);
            if (gauntletPicks.length > 0) {
                var picksText = '';
                for (var pi = 0; pi < gauntletPicks.length; pi++) {
                    picksText += gauntletPicks[pi].icon;

                ctx.fillStyle = '#AAA';
                ctx.font = hudFont(9);
                ctx.fillText('Picks: ' + picksText, 5, 88);

        function checkMutatorUnlocks() {
            for (var key in MUTATOR_DEFS) {
                var def = MUTATOR_DEFS[key];
                if (unlockedMutators.indexOf(key) === -1 && mutatorTokens >= def.tokenCost) {
                    unlockedMutators.push(key);
                    saveManager.setJSON('snake_mutator_unlocks', unlockedMutators);
                    queueToast('\uD83D\uDD13 New mutator unlocked: ' + def.name + '!', 3000);
                }
            }
            // v6: Cascade unlock
            if (!cascadeUnlocked && mutatorTokens >= 5) {
                saveManager.set('snake_cascade_unlocked', 'true');
                cascadeUnlocked = true;
                queueToast('\uD83C\uDF00 Cascade Mode Unlocked! Pick up to 3 mutators per run!', 4000);
            }
        }

        function pickDraftOptions(count) {
            var pool = unlockedMutators.slice();
            if (pool.length <= count) return pool;
            var options = [];
            var safety = 0;
            while (options.length < count && safety < 100) {
                var idx = Math.floor(Math.random() * pool.length);
                var key = pool[idx];
                if (options.indexOf(key) === -1) options.push(key);
                safety++;
            }
            return options;
        }

        function shuffleFoodWeights() {
            var keys = Object.keys(FOOD_TIERS);
            var weights = keys.map(function() { return Math.random(); });
            var total = weights.reduce(function(a,b) { return a+b; }, 0);
            var result = {};
            for (var i = 0; i < keys.length; i++) {
                result[keys[i]] = weights[i] / total;
            }
            return result;
        }

        // v6: Floater rendering
        function drawFloaters(ctx) {
            for (var fi = floaters.length - 1; fi >= 0; fi--) {
                var f = floaters[fi];
                ctx.save();
                ctx.globalAlpha = Math.max(0, f.life / f.maxLife);

                function drawGame(t) {
            ctx.imageSmoothingEnabled = false;

            // Clear entire canvas (including margin areas) before drawing
            ctx.fillStyle = '#111';
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            // Play area margin — translate all game elements into the margin-bounded box
            ctx.save();
            ctx.translate(PLAY_MARGIN_LEFT, PLAY_MARGIN_TOP);
            ctx.beginPath();
            ctx.rect(0, 0, PLAY_WIDTH, PLAY_HEIGHT);
            ctx.clip();

            drawGrid();
            drawPaintGrid();
            drawObstacles();
            drawFood();
            drawPowerUpPickup();
            drawSnake(t);
            drawRival(t);

            // Ghost snake overlay
            if (ghostEnabled && activeSeed !== null && ghostPositions.length > 0) {
                ctx.save();
                ctx.globalAlpha = 0.3;
                for (var gi = 0; gi < ghostPositions.length; gi++) {
                    var gp = ghostPositions[gi];
                    ctx.fillStyle = gi === 0 ? '#88DDFF' : '#66CCFF';
                    ctx.fillRect(gp.x, gp.y, TILE_SIZE - 1, TILE_SIZE - 1);
                }
                ctx.restore();
            }
            // Ghost Arena
            if (ghostArenaMode && activeSeed !== null && arenaGhostReplays.length > 0) {
                for (var gai = 0; gai < arenaGhostReplays.length && gai < GHOST_ARENA_MAX; gai++) {
                    var ghostBody = arenaGhostPositions[gai] || [];
                    if (ghostBody.length === 0) continue;
                    ctx.save();
                    ctx.globalAlpha = GHOST_ARENA_COLORS[gai].alpha;
                    for (var gaj = 0; gaj < ghostBody.length; gaj++) {
                        ctx.fillStyle = gaj === 0 ? GHOST_ARENA_COLORS[gai].head : GHOST_ARENA_COLORS[gai].body;
                        ctx.fillRect(ghostBody[gaj].x, ghostBody[gaj].y, TILE_SIZE - 1, TILE_SIZE - 1);
                    }
                    if (ghostBody.length > 0) {
                        ctx.fillStyle = GHOST_ARENA_COLORS[gai].body;
                        ctx.font = hudFont(9);
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'bottom';
                        ctx.fillText(GHOST_ARENA_COLORS[gai].label, ghostBody[0].x + TILE_SIZE / 2, ghostBody[0].y - 2);
                    }
                    ctx.restore();
                }
            }
            drawTrails();
            drawSlowMoTint();

            // Subtle play area border
            ctx.save();
            ctx.strokeStyle = 'rgba(255,255,255,0.12)';
            ctx.lineWidth = 2;
            ctx.strokeRect(0, 0, PLAY_WIDTH, PLAY_HEIGHT);
            ctx.restore();

            ctx.restore(); // end play-area translate/clip

            // —— Everything below is in full-canvas (margin) coordinates ——

            drawMuteIndicator();
            // Synesthesia indicator
            if (synesthesiaMode) {
                ctx.save();
                var synAlpha = 0.5 + 0.5 * Math.sin(renderTime * 0.005);
                ctx.globalAlpha = synAlpha;
                ctx.fillStyle = '#FFD700';
                ctx.font = hudFont(10);
                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';
                ctx.fillText('♫ SYN', 5, 15);
                ctx.restore();
            }
            drawXPBar();
            drawPrestigeBorder();
            drawTimeAttackHUD();
            drawSnapHUD();
            drawDailyHUD();
            drawPowerUpHUD();
            drawRivalHUD();
            drawGauntletHUD();
            if (draftScreenVisible) {
                drawDraftScreen();
                return;
            }

            // v6: Multi-mutator display
            if (activeMutators.length > 0) {
                for (var mi = 0; mi < activeMutators.length; mi++) {
                    var mutId = activeMutators[mi];
                    var mutDef = MUTATOR_DEFS[mutId];
                    if (mutDef) {
                        ctx.save();
                        ctx.globalAlpha = 0.7;
                        ctx.font = '10px Arial';
                        ctx.fillStyle = '#888';
                        ctx.textAlign = 'right';
                        ctx.fillText(mutDef.icon + ' ' + mutDef.name, CANVAS_WIDTH - 5, 20 + mi * 14);
                        ctx.restore();
                    }
                }
            }

            // v6: Resonance indicator
            if (activeResonance && activeMutators.length > 1) {
                ctx.save();
                ctx.globalAlpha = 0.8;
                ctx.font = 'bold 10px monospace';
                ctx.fillStyle = '#AA88FF';
                ctx.textAlign = 'right';
                ctx.fillText('✦ ' + activeResonance.name, CANVAS_WIDTH - 5, 20 + activeMutators.length * 14);
                ctx.restore();
            }

            // Seed display
            if (activeSeed !== null && (gameState === 'playing' || gameState === 'paused' || gameState === 'gameover')) {
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.font = '10px monospace';
                ctx.textAlign = 'right';
                ctx.textBaseline = 'bottom';
                ctx.fillText('Seed: ' + activeSeed, CANVAS_WIDTH - 5, CANVAS_HEIGHT - 5);

            if (challengeFromUrl && challengeFromUrl.targetScore !== null && (gameState === 'playing' || gameState === 'paused')) {
                ctx.save();
                var targetReached = score >= challengeFromUrl.targetScore;
                ctx.fillStyle = targetReached ? '#FFFFFF' : '#FFD700';
                ctx.font = hudFont(11);
                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';
                ctx.fillText('Target: ' + challengeFromUrl.targetScore, 5, synesthesiaMode ? 28 : 15);
                ctx.restore();
            }

            // Gauntlet intermission overlay
            if (gauntletIntermission) {
                drawGauntletIntermission();
            }

            // Gauntlet complete screen
            if (gameState === 'gameover' && gameMode === 'gauntlet' && gauntletWave >= GAUNTLET_WAVES.length - 1) {
                drawGauntletCompleteScreen();
            }

            if (gameState === 'idle') {
                if (challengeFromUrl) {
                    drawChallengeOverlay();
                } else {
                    drawOverlay('SNAKE', 'Press ENTER to Start');
                }
            } else if (gameState === 'paused') {
                drawOverlay();
            } else if (gameState === 'gameover') {
                if (gameMode === 'gauntlet' && !(gauntletWave >= GAUNTLET_WAVES.length - 1)) {
                    var runOverMsg = lastDeathCause ? lastDeathCause + ' | ' : '';
                    drawOverlay('Run Over — Wave ' + (gauntletWave + 1) + '/5', 'Score: ' + (gauntletScore + score) + ' | ' + runOverMsg + 'Press ENTER to Restart');
                } else {
                    const deathMsg = lastDeathCause ? lastDeathCause + ' | ' : '';
                    drawOverlay('GAME OVER', 'Score: ' + score + ' | ' + deathMsg + 'Press ENTER to Restart');
                }
            }
        }

        function updateGame() {
            if (gameState !== 'playing') return;

            // v6: extracted functions (declared here for closure over updateGame's locals)
            function handleComboMilestone() {
                if (COMBO_MILESTONES.includes(comboCount) && comboCount > lastComboMilestone) {
                    lastComboMilestone = comboCount;
                    var color = COMBO_FLASH_COLORS[comboCount] || '#44BB44';
                    var alpha = comboCount >= 20 ? 0.5 : comboCount >= 10 ? 0.4 : 0.3;
                    if (!flashOverlay || flashOverlay.priority !== 'critical') {
                        flashOverlay = { color: color, alpha: alpha, priority: comboCount >= 10 ? 'high' : 'normal' };
                    }
                    if (comboCount >= 10) {
                        shakeTimer = Math.min(300, 100 + comboCount * 5);
                    }
                    vibrate(30);
                    playSound('combo_milestone');
                    srSpeak('Combo ' + comboCount + '!');
                    // v6: Combustion Brew — each combo milestone adds +1 mult
                    if (activeBrews.indexOf('combustion') !== -1) {
                        brewUsageFlags.combustionAccum++;
                        brewUsageFlags.combRemaining += 3;
                    }
                    // v6: combo floater
                    if (comboCount >= 50) spawnFloater(PLAY_MARGIN_LEFT + PLAY_WIDTH / 2, PLAY_MARGIN_TOP + PLAY_HEIGHT / 2, 'COMBO x50!', '#FF0000', 42, 2.0);
                    else if (comboCount >= 20) spawnFloater(PLAY_MARGIN_LEFT + PLAY_WIDTH / 2, PLAY_MARGIN_TOP + PLAY_HEIGHT / 2, 'COMBO x20!', '#FFAA00', 38, 2.0);
                    else if (comboCount >= 10) spawnFloater(PLAY_MARGIN_LEFT + PLAY_WIDTH / 2, PLAY_MARGIN_TOP + PLAY_HEIGHT / 2, 'COMBO x10!', '#FF44FF', 34, 1.8);
                    else if (comboCount >= 5) spawnFloater(PLAY_MARGIN_LEFT + PLAY_WIDTH / 2, PLAY_MARGIN_TOP + PLAY_HEIGHT / 2, 'COMBO x5!', '#44FF44', 30, 1.5);
                    else spawnFloater(PLAY_MARGIN_LEFT + PLAY_WIDTH / 2, PLAY_MARGIN_TOP + PLAY_HEIGHT / 2, 'COMBO x3!', '#44CCFF', 28, 1.5);
                    // --- end v6 ---
                }
            }
            // --- end v6 extraction ---

            // Zen mode: score = snake length
            if (gameMode === 'zen') {
                score = snake.length;
            }
            // Painter mode: score = coverage %
            if (gameMode === 'painter' && paintTotalTiles > 0) {
                var coveragePct = Math.floor((paintCoveredCount / paintTotalTiles) * 100);
                score = coveragePct;
                if (paintLayers > 1) {
                    score = coveragePct + ((paintLayers - 1) * 100);
                }
            }

            // Gauntlet mode: wave objective checking
            if (gameMode === 'gauntlet') {
                if (gauntletIntermission) return;
                var wave = GAUNTLET_WAVES[gauntletWave];
                if (wave.objective === 'survive' && gameTick >= wave.duration) {
                    completeGauntletWave();
                    return;
                } else if (wave.objective === 'eat' && sessionFoodEaten >= wave.target) {
                    completeGauntletWave();
                    return;
                } else if (wave.objective === 'combo' && comboCount >= wave.target) {
                    completeGauntletWave();
                    return;
                } else if (wave.objective === 'score' && score >= wave.target) {
                    completeGauntletWave();
                    return;
                }
            }

            // === MUTATOR LOGIC ===
            if (activeMutators.indexOf('gravity') !== -1 && dy !== -TILE_SIZE && dy !== TILE_SIZE) {
                dx = 0;
                dy = TILE_SIZE;
            }

            var skipSelfCollision = false;
            if (activeMutators.indexOf('phase_shift') !== -1 && gameTick % 5 === 0) {
                skipSelfCollision = true;
            }

            if (activeMutators.indexOf('hunger_clock') !== -1) {
                if (!hungerStarted && sessionFoodEaten > 0) {
                    hungerStarted = true;
                    hungerTickCounter = 0;
                }
                if (hungerStarted) {
                    hungerTickCounter++;
                    if (hungerTickCounter > 0 && hungerTickCounter % 50 === 0) {
                        if (snake.length > 1) {
                            snake.pop();
                        } else {
                            lastDeathCause = 'Starvation!';
                            gameOver();
                            return;
                        }
                    }
                }
            }

            if (activeMutators.indexOf('shrink_zone') !== -1) {
                var ticksPerShrink = Math.floor(30000 / getEffectiveSpeed());
                if (gameTick > 0 && gameTick % ticksPerShrink === 0) {
                    if (shrinkCols < PLAY_WIDTH / TILE_SIZE / 2 - 1) {
                        shrinkCols++;
                    } else if (shrinkRows < PLAY_HEIGHT / TILE_SIZE / 2 - 1) {
                        shrinkRows++;
                    }
                    var headNow = snake[0];
                    var minSX = shrinkCols * TILE_SIZE;
                    var maxSX = PLAY_WIDTH - shrinkCols * TILE_SIZE;
                    var minSY = shrinkRows * TILE_SIZE;
                    var maxSY = PLAY_HEIGHT - shrinkRows * TILE_SIZE;
                    if (headNow.x < minSX || headNow.x >= maxSX || headNow.y < minSY || headNow.y >= maxSY) {
                        lastDeathCause = 'Caught by the shrinking zone!';
                        gameOver();
                        return;
                    }
                }
            }

            if (activeMutators.indexOf('chaos_seed') !== -1 && gameTick % 20 === 0) {
                chaosCurrentWeights = shuffleFoodWeights();
                chaosShuffleTick = gameTick;
            }

            // v6: Resonance effects
            activeResonance = detectResonance(activeMutators);
            if (activeResonance) {
                if (activeResonance.effect === 'invertControls' && gameTick % (10 + Math.floor(Math.random() * 6)) === 0) {
                    flashOverlay = { color: '#FFFFFF', alpha: 0.2, priority: 'normal' };
                }
                if (activeResonance.effect === 'feastFamine' && hungerStarted) {
                    if (hungerTickCounter % 30 === 0 && snake.length > 1) {
                        // existing hunger logic will fire — this just ensures shorter interval
                    }
                }
            }

            prevSnake = snake.map(s => ({ x: s.x, y: s.y }));
            snakeGrew = false;
            prevRivalSnake = rivalCombinedSnake().map(s => ({ x: s.x, y: s.y }));

            gameTick++;

            // Rebuild ghost positions
            if (ghostArenaMode && activeSeed !== null) {
                arenaGhostPositions = [];
                for (var agi = 0; agi < arenaGhostReplays.length; agi++) {

                }
                ghostPositions = [];
            } else if (ghostEnabled && activeSeed !== null) {
                var bestReplay = getBestReplay(gameMode);
                ghostPositions = rebuildGhost(bestReplay, gameTick);
            } else {
                ghostPositions = [];
                arenaGhostPositions = [];
            }
            stats.totalDistance++;
            if (gameTick % 10 === 0) awardXP(1);

            // Time Attack timer
            if (gameMode === 'timeAttack' && timeAttackEnd > 0) {
                const remaining = timeAttackEnd - Date.now();
                if (remaining <= 0) { gameOver(); return; }
            }

            if (nextDirection) {
                if (nextDirection.dx !== -dx || nextDirection.dy !== -dy) {
                    dx = nextDirection.dx;
                    dy = nextDirection.dy;
                    if (activeSeed !== null) {
                        recordReplayDirection(gameTick, dx, dy);
                    }
                }
                nextDirection = null;
            }

            const tail = snake.pop();
            // Painter mode: paint the tail position
            if (gameMode === 'painter' && paintGrid) {
                var pcol = Math.floor(tail.x / TILE_SIZE);
                var prow = Math.floor(tail.y / TILE_SIZE);
                var cols = PLAY_WIDTH / TILE_SIZE;
                var rows = PLAY_HEIGHT / TILE_SIZE;
                if (pcol >= 0 && pcol < cols && prow >= 0 && prow < rows) {
                    if (!paintGrid[pcol][prow]) {
                        paintGrid[pcol][prow] = { color: currentPaintColor, layer: paintLayers, timestamp: Date.now() };
                        paintCoveredCount++;
                    } else {
                        paintGrid[pcol][prow] = { color: currentPaintColor, layer: paintGrid[pcol][prow].layer + 1, timestamp: Date.now() };
                    }
                }
            }

            const headRef = snake.length > 0 ? snake[0] : tail;
            const newHead = {
                x: headRef.x + dx,
                y: headRef.y + dy
            };
            const wrappedHead = wrapPosition(newHead);

            // --- v6: extracted death check ---
            function checkPlayerDeath(wrappedHead, skipSelfCollision) {
                if (checkCollision(wrappedHead) && !skipSelfCollision) {
                    if (shieldActive) {
                        shieldActive = false; powerUpTimer = 0; powerUpType = null;
                        stats.shieldBlocks++;
                        spawnParticles(wrappedHead.x, wrappedHead.y, 15, '#4488FF');
                        playSound('bonus');
                        return false;
                    }
                    // v6: Vampire Brew — survive first fatal hit at length 3
                    if (activeBrews.indexOf('vampire') !== -1 && !brewUsageFlags.vampireUsed) {
                        brewUsageFlags.vampireUsed = true;
                        while (snake.length > 3) snake.pop();
                        lastDeathCause = 'Vampire Brew saved you!';
                        spawnParticles(wrappedHead.x, wrappedHead.y, 20, '#FF0044');

                    }
                    lastDeathCause = 'You ran into yourself!';
                    return true;
                }
                if (MODE_CONFIG[gameMode].wallDeath) {
                    if (wrappedHead.x < 0 || wrappedHead.x >= PLAY_WIDTH || wrappedHead.y < 0 || wrappedHead.y >= PLAY_HEIGHT) {
                        lastDeathCause = 'Hit the wall!';
                        // v6: Phoenix Brew — resurrect once
                        if (activeBrews.indexOf('phoenix') !== -1 && !brewUsageFlags.phoenixUsed) {
                            brewUsageFlags.phoenixUsed = true;
                            var freePos = findFreeTile(wrappedHead.x, wrappedHead.y);
                            if (freePos) {
                                snake[0] = { x: freePos.x, y: freePos.y };
                                while (snake.length > 5) snake.pop();
                                score = 0;
                                lastDeathCause = 'Phoenix Brew resurrected!';
                                spawnParticles(freePos.x, freePos.y, 25, '#FF8800');
                                return false;
                            }
                        }
                        return true;
                    }
                }
                for (var rci = 0; rci < rivals.length; rci++) {
                    if (rivals[rci].active) {
                        // v6: Leech Brew head-to-head with rival
                        if (activeBrews.indexOf('leech') !== -1 && rivals[rci].snake.length > 0) {
                            var rHead = rivals[rci].snake[0];
                            var ldx = Math.abs(wrappedHead.x - rHead.x);
                            var ldy = Math.abs(wrappedHead.y - rHead.y);
                            if (ldx <= TILE_SIZE && ldy <= TILE_SIZE && ldx + ldy <= TILE_SIZE * 2) {
                                for (var lsi = 0; lsi < 3 && rivals[rci].snake.length > 1; lsi++) {
                                    snake.push({ x: snake[snake.length - 1].x, y: snake[snake.length - 1].y });
                                    rivals[rci].snake.pop();
                                }
                                if (rivals[rci].snake.length <= 1) rivals[rci].active = false;
                                spawnParticles(wrappedHead.x, wrappedHead.y, 10, '#44FF88');
                            }
                        }
                        for (var rcj = 0; rcj < rivals[rci].snake.length; rcj++) {
                            if (rivals[rci].snake[rcj].x === wrappedHead.x && rivals[rci].snake[rcj].y === wrappedHead.y) {
                                if (shieldActive) {
                                    shieldActive = false; powerUpTimer = 0; powerUpType = null;
                                    stats.shieldBlocks++;
                                    spawnParticles(wrappedHead.x, wrappedHead.y, 15, '#4488FF');
                                    playSound('bonus');
                                    return false;
                                }
                                lastDeathCause = 'You were caught by the rival!';
                                // v6: Phoenix Brew in rival collision
                                if (activeBrews.indexOf('phoenix') !== -1 && !brewUsageFlags.phoenixUsed) {
                                    brewUsageFlags.phoenixUsed = true;
                                    var freePos2 = findFreeTile(wrappedHead.x, wrappedHead.y);
                                    if (freePos2) {
                                        snake[0] = { x: freePos2.x, y: freePos2.y };
                                        while (snake.length > 5) snake.pop();
                                        score = 0;
                                        lastDeathCause = 'Phoenix Brew resurrected!';
                                        spawnParticles(freePos2.x, freePos2.y, 25, '#FF8800');
                                        return false;
                                    }
                                }
                                return true;
                            }
                        }
                    }
                }
                return false;
            }
            // --- end v6 extraction ---

            if (checkPlayerDeath(wrappedHead, skipSelfCollision)) {
                snake.push(tail);
                gameOver();
                return;
            }

            snake.unshift(wrappedHead);
            // Painter mode: paint the head position too
            if (gameMode === 'painter' && paintGrid) {
                var hcol = Math.floor(wrappedHead.x / TILE_SIZE);
                var hrow = Math.floor(wrappedHead.y / TILE_SIZE);
                var cols = PLAY_WIDTH / TILE_SIZE;
                var rows = PLAY_HEIGHT / TILE_SIZE;
                if (hcol >= 0 && hcol < cols && hrow >= 0 && hrow < rows) {
                    if (!paintGrid[hcol][hrow]) {
                        paintGrid[hcol][hrow] = { color: currentPaintColor, layer: paintLayers, timestamp: Date.now() };
                        paintCoveredCount++;
                    } else {
                        paintGrid[hcol][hrow] = { color: currentPaintColor, layer: paintGrid[hcol][hrow].layer + 1, timestamp: Date.now() };
                    }
                }
            }

            // v6: Phantom Brew — cross ghost trail for +1.0x combo (5s cooldown)
            if (activeBrews.indexOf('phantom') !== -1) {
                var phantomNow = Date.now();
                var phantomCooldown = brewUsageFlags.phantomCooldown || 0;
                if (phantomNow > phantomCooldown) {
                    var ghostMatch = false;
                    if (ghostPositions.length > 0) {
                        for (var pgi = 0; pgi < ghostPositions.length; pgi++) {
                            if (ghostPositions[pgi].x === wrappedHead.x && ghostPositions[pgi].y === wrappedHead.y) {
                                ghostMatch = true; break;
                            }
                        }
                    }
                    if (!ghostMatch && arenaGhostPositions.length > 0) {
                        for (var agi2 = 0; agi2 < arenaGhostPositions.length; agi2++) {
                            var agBody = arenaGhostPositions[agi2] || [];
                            for (var agj = 0; agj < agBody.length; agj++) {
                                if (agBody[agj].x === wrappedHead.x && agBody[agj].y === wrappedHead.y) {
                                    ghostMatch = true; break;
                                }
                            }
                            if (ghostMatch) break;
                        }
                    }
                    if (ghostMatch) {
                        brewUsageFlags.phantomCooldown = phantomNow + 5000;
                        comboCount = Math.min(50, comboCount + 1);
                        lastEatTime = Date.now();
                        spawnParticles(wrappedHead.x, wrappedHead.y, 15, '#88FFFF');
                        playSound('bonus');
                        queueToast('Phantom Brew: +1.0x Combo!', 2000);
                    }
                }
            }

            if (food && wrappedHead.x === food.x && wrappedHead.y === food.y) {
                snake.push(tail);
                snakeGrew = true;
                if (activeSeed !== null) recordReplayGrow(gameTick);
                const eatenType = food.type;

                // Stats tracking
                sessionFoodTypes.add(eatenType);
                sessionFoodEaten++;
                stats.totalFoodEaten++;
                if (magnetActive) stats.magnetEats++;
                if (eatenType === 'bonus') { stats.bonusFoodEaten++; sessionBonusFood++; }
                else if (eatenType === 'speed') { stats.speedFoodEaten++; sessionSpeedFood++; }
                else if (eatenType === 'epic') { stats.epicFoodEaten++; }
                // common, uncommon, rare all count as normalFoodEaten
                else { stats.normalFoodEaten++; }

                srSpeak('Ate ' + eatenType + '. Score ' + score);

                // Combo logic
                const now = Date.now();
                if (now - lastEatTime < 3000 && lastEatTime > 0) {
                    comboCount = Math.min(50, comboCount + 1);
                } else {
                    comboCount = 0;
                    lastComboMilestone = 0;
                }
                lastEatTime = now;
                clearTimeout(comboFadeTimer);
                comboFadeTimer = setTimeout(function() {
                    comboDisplayEl.textContent = '';
                }, 3500);
                if (comboCount > stats.maxCombo) stats.maxCombo = comboCount;
                if (comboCount > sessionMaxCombo) sessionMaxCombo = comboCount;

                // --- v6: extracted combo milestone handler ---
            handleComboMilestone();
            // --- end v6 extraction ---

                // XP award for eating
                const tier = FOOD_TIERS[eatenType] || FOOD_TIERS.common;
                let foodXP = tier.xp;
                if (gameMode === 'zen') {
                    foodXP = 10; // Flat XP in Zen mode
                } else {
                    const comboMul = 1 + comboCount * 0.5;
                    foodXP = Math.round(foodXP * comboMul);
                }
                awardXP(foodXP);

                // Track longest length
                if (snake.length > stats.longestLength) stats.longestLength = snake.length;

                const tierColor = tier.color;
                if (!flashOverlay || (flashOverlay.priority !== 'high' && flashOverlay.priority !== 'critical')) {
                    flashOverlay = { color: tierColor, alpha: 0.4, priority: 'normal' };
                }
                eatAnimTimer = 150;
                spawnParticles(wrappedHead.x, wrappedHead.y, tier.pCount, tierColor);
                // v6: Score pop-up floater
                if (eatenType === 'speed') {
                    spawnFloater(wrappedHead.x, wrappedHead.y, '+5 SPEED!', '#FFDD00', 20);
                } else if (eatenType === 'bonus') {
                    spawnFloater(wrappedHead.x, wrappedHead.y, '+30 BONUS!', '#FFD700', 18);
                } else {
                    spawnFloater(wrappedHead.x, wrappedHead.y, '+' + tier.pts, tierColor);
                }
                // --- end v6 ---
                if (synesthesiaMode) {
                    spawnSynesthesiaRing(wrappedHead.x, wrappedHead.y, tierColor);
                }
                if (gameMode !== 'zen' && gameMode !== 'painter') addScore(tier.pts);
                // v6: Combustion Brew bonus — each combo milestone adds +1 mult to next 3 foods
                if (activeBrews.indexOf('combustion') !== -1 && brewUsageFlags.combRemaining > 0 && gameMode !== 'zen' && gameMode !== 'painter') {
                    addScore(tier.pts * brewUsageFlags.combustionAccum);
                    brewUsageFlags.combRemaining--;
                }
                // Combo score bonus
                if (comboCount > 0 && gameMode !== 'zen' && gameMode !== 'painter') {
                    let comboBonus;
                    if (comboCount >= 20) {
                        comboBonus = Math.floor(comboCount * 5);
                    } else if (comboCount >= 10) {
                        comboBonus = Math.floor(comboCount * 3);
                    } else {
                        comboBonus = Math.floor(comboCount * 2);
                    }
                    addScore(comboBonus);
                }
                if (gameMode === 'snap') {
                    shrinkTimer = snapDuration;
                    if (eatenType === 'rare' || eatenType === 'epic') {
                        shrinkTimer = Math.min(5000, shrinkTimer + 1000);
                    } else if (eatenType === 'bonus') {
                        shrinkTimer = Math.min(5000, shrinkTimer + 2000);
                    }
                    shrinkTimer += MODE_CONFIG.snap.speed;
                }
                // Track last eaten type BEFORE playSound (synesthesia and painter depend on it)
                lastEatenType = eatenType;
                vibrate(15);
                playSound(tier.sound);
                // speed food still has the special speed boost behavior
                if (eatenType === 'speed') {
                    if (activeSeed === null) {
                        tickInterval = Math.max(MIN_SPEED, getEffectiveSpeed() - 30);
                        speedBoostCounter = 16; // ~2 seconds at 120ms ticks
                    }
                }
                // Painter mode: 100% coverage check
                if (gameMode === 'painter' && paintTotalTiles > 0 && paintCoveredCount >= paintTotalTiles && !flashOverlay) {
                    paintLayers++;
                    paintCoveredCount = 0;
                    flashOverlay = { color: '#FFFFFF', alpha: 0.6, priority: 'high' };
                    queueToast('100% Coverage! Layer ' + paintLayers + '!', 3000);
                    playSound('achievement');
                    vibrate(50);
                }
                // Painter mode: update paint color
                if (gameMode === 'painter') {
                    painterFoodEaten++;
                    if (comboCount >= 30) {
                        currentPaintColor = 'hsl(' + ((renderTime * 0.1) % 360) + ',100%,50%)';
                    } else if (comboCount >= 10) {
                        var tierKeys = Object.keys(FOOD_TIERS);
                        currentPaintColor = FOOD_TIERS[tierKeys[painterFoodEaten % tierKeys.length]].color;
                    } else {
                        var paintTier = FOOD_TIERS[eatenType] || FOOD_TIERS.common;
                        currentPaintColor = paintTier.color;
                    }
                    if (painterFoodEaten % 50 === 0) {
                        var painterSpeed = Math.max(MIN_SPEED, getEffectiveSpeed() - 5);
                        tickInterval = painterSpeed;
                        restartGameTimeout();
                    }
                }
                checkAchievements(score);
                const playerCombined = snake.concat(rivalCombinedSnake());
                food = generateFood(playerCombined);
                if (!food) { lastDeathCause = 'The board filled up!'; gameOver(); return; }
                // v6: Rampage Brew — food spawns closer to head (min 3 tiles)
                if (activeBrews.indexOf('rampage') !== -1) {
                    minFoodSpawnDist = 3;
                }
                // v6: Echo Brew — every 8th food spawns adjacent copy (half pts)
                if (activeBrews.indexOf('echo') !== -1) {
                    brewUsageFlags.echoCount = (brewUsageFlags.echoCount || 0) + 1;
                    if (brewUsageFlags.echoCount % 8 === 0 && food) {
                        var adj = [{x: food.x + TILE_SIZE, y: food.y}, {x: food.x - TILE_SIZE, y: food.y}, {x: food.x, y: food.y + TILE_SIZE}, {x: food.x, y: food.y - TILE_SIZE}];
                        for (var ai = 0; ai < adj.length; ai++) {
                            if (adj[ai].x >= 0 && adj[ai].x < PLAY_WIDTH && adj[ai].y >= 0 && adj[ai].y < PLAY_HEIGHT) {
                                food2 = { x: adj[ai].x, y: adj[ai].y, type: food.type, pts: Math.floor((FOOD_TIERS[food.type] ? FOOD_TIERS[food.type].pts : 10) / 2) };
                                break;
                            }
                        }
                    }
                }
            }

            // v6: Echo Brew food2 eating
            if (food2 && wrappedHead.x === food2.x && wrappedHead.y === food2.y) {
                snake.push(tail);
                snakeGrew = true;
                if (activeSeed !== null) recordReplayGrow(gameTick);
                sessionFoodEaten++;
                stats.totalFoodEaten++;
                stats.normalFoodEaten++;
                addScore(food2.pts || Math.floor(FOOD_TIERS[food2.type].pts / 2));
                spawnParticles(food2.x, food2.y, 8, '#44FF88');
                playSound('eat');
                food2 = null;
            }

            // Check power-up collection
            if (powerUpPickup && wrappedHead.x === powerUpPickup.x && wrappedHead.y === powerUpPickup.y) {
                activatePowerUp(powerUpPickup.type);
                powerUpPickup = null;
                spawnParticles(wrappedHead.x, wrappedHead.y, 12, '#FFFFFF');
                playSound('bonus');
            }

            // Snap mode shrink logic
            if (gameMode === 'snap') {
                shrinkTimer -= MODE_CONFIG.snap.speed;
                if (shrinkTimer <= 0) {
                    if (snake.length <= 1) {
                        lastDeathCause = 'You shrunk to nothing!';
                        gameOver();
                        return;
                    }
                    const tailSeg = snake.pop();
                    shrinkTimer = snapDuration;
                    spawnParticles(tailSeg.x, tailSeg.y, 6, '#FF4444');
                    playSound('eat');
                }
                
                // Duration decreases every ~12 seconds of play
                snapTimeSinceDecrease += MODE_CONFIG.snap.speed;
                if (snapTimeSinceDecrease >= 12000) {
                    snapDuration = Math.floor(snapDuration * 0.88);
                    snapTimeSinceDecrease -= 12000;
                    snapLevel++;
                    snapLevelUpFlash = 1500; // show "LEVEL N!" for 1.5s
                    if (snapDuration < 800) snapDuration = 800;
                }
            }

            // Power-up timer update
            if (powerUpType) {

                powerUpTimer -= tickDuration;
                if (powerUpTimer <= 0) {
                    deactivatePowerUp();
                }
            }

            // Magnet effect: pull food toward snake
            if (magnetActive && food) {
                const head = snake[0];
                let dx_food = head.x - food.x;
                let dy_food = head.y - food.y;

                // Account for wrapping — use the shortest path on each axis
                if (Math.abs(dx_food) > PLAY_WIDTH / 2) {
                    dx_food = dx_food > 0 ? dx_food - PLAY_WIDTH : dx_food + PLAY_WIDTH;
                }
                if (Math.abs(dy_food) > PLAY_HEIGHT / 2) {
                    dy_food = dy_food > 0 ? dy_food - PLAY_HEIGHT : dy_food + PLAY_HEIGHT;
                }

                const dist = Math.abs(dx_food) + Math.abs(dy_food);
                if (dist > 0 && dist <= 4 * TILE_SIZE) {
                    let newFX = food.x;
                    let newFY = food.y;
                    if (Math.abs(dx_food) >= Math.abs(dy_food)) {
                        newFX += dx_food > 0 ? TILE_SIZE : -TILE_SIZE;
                    } else {
                        newFY += dy_food > 0 ? TILE_SIZE : -TILE_SIZE;
                    }
                    const wrappedPos = wrapPosition({ x: newFX, y: newFY });
                    const wrappedFX = wrappedPos.x;
                    const wrappedFY = wrappedPos.y;
                    if (!snake.some(s => s.x === wrappedFX && s.y === wrappedFY) &&
                        !obstacles.some(o => o.x === wrappedFX && o.y === wrappedFY)) {
                        food.x = wrappedFX;
                        food.y = wrappedFY;
                    }
                }
            }

            // Power-up spawn timer
            if (gameMode !== 'zen' && gameMode !== 'walled' && !powerUpPickup && !powerUpType) {
                powerUpSpawnCounter++;
                if (powerUpSpawnCounter >= 500) {
                    powerUpSpawnCounter = 0;
                    spawnPowerUpPickup();
                }
            }

            // Power-up despawn timer
            if (powerUpPickup && !powerUpType) {
                powerUpDespawnCounter--;
                if (powerUpDespawnCounter <= 0) {
                    powerUpPickup = null;
                }
            }

            // Rival respawn timer
            var anyRivalAlive = anyRivalActive();
            if (!anyRivalAlive && rivals.length > 0 && rivals[0].respawnTimer > 0) {
                rivals[0].respawnTimer -= getEffectiveSpeed();
                if (rivals[0].respawnTimer <= 0) {
                    spawnRival(0);
                }
            }

            // Update rival
            if (anyRivalActive()) {
                for (var rii = 0; rii < rivals.length; rii++) {
                    if (rivals[rii].active) updateRival(rii);
                }
            }

            // Sparkle trail spawn
            if (cosmetics.trace === 'trace_sparkle' && gameTick % 5 === 0 && snake.length > 1) {
                const tail = snake[snake.length - 1];
                spawnParticles(tail.x, tail.y, 2, '#FFD700');
            }
            if (cosmetics.trace === 'trace_rainbow' && gameTick % 4 === 0 && snake.length > 1) {
                const tail = snake[snake.length - 1];
                const color = ['#FF0000','#FF8800','#FFFF00','#00FF00','#0088FF','#8800FF'][Math.floor(renderTime / 200) % 6];
                spawnParticles(tail.x, tail.y, 3, color);
            }
            if (cosmetics.trace === 'trace_galaxy' && gameTick % 4 === 0 && snake.length > 1) {
                const tail = snake[snake.length - 1];
                const galaxyColors = ['#FF88FF', '#88FFFF', '#FFFF88', '#8888FF', '#FF8888'];
                spawnParticles(tail.x, tail.y, 2, galaxyColors[gameTick % galaxyColors.length]);
            }
            if (cosmetics.trace === 'trace_fire' && gameTick % 6 === 0 && snake.length > 1) {
                const tail = snake[snake.length - 1];
                spawnParticles(tail.x, tail.y, 2, '#FF6600');
            }

            // Passive food regeneration
            var foodRegenInterval = 10;
            if (activeMutators.indexOf('golden_food') !== -1) foodRegenInterval = 20;
            if (gameMode === 'gauntlet') {
                for (var gfpi = 0; gfpi < gauntletPicks.length; gfpi++) {
                    if (gauntletPicks[gfpi].id === 'food_rush') { foodRegenInterval = Math.floor(foodRegenInterval / 2); break; }
                }
            }
            if (!food && gameTick % foodRegenInterval === 0 && gameState === 'playing') {
                const combinedSnake = snake.concat(rivalCombinedSnake());
                const newFood = generateFood(combinedSnake);
                if (newFood) food = newFood;
            }

            // Synesthesia: rhythmic pulse, drone, pad, arpeggiator
            if (synesthesiaMode && !muted) {
                if (gameTick % 4 === 0) playSynesthesiaPulse();
                if (gameTick % 10 === 0) updateDrone();
                updatePad();
                if (comboCount > 0 && gameTick % Math.max(1, 4 - Math.min(3, Math.floor(comboCount / 5))) === 0) {
                    playSynesthesiaArp();
                }
            }

            lastTickTime = performance.now();
            visualDirty = true;

            // Speed boost counter — decrements every tick
            if (speedBoostCounter > 0) {
                speedBoostCounter--;
                if (speedBoostCounter <= 0) {
                    tickInterval = getEffectiveSpeed();
                }
            }

            // Progressive obstacle spawning
            if (gameMode !== 'zen' && gameMode !== 'walled' && gameMode !== 'daily' && gameMode !== 'painter' && obstacles.length < Math.floor((PLAY_WIDTH / TILE_SIZE) * (PLAY_HEIGHT / TILE_SIZE) * MAX_OBSTACLE_PERCENT)) {
                if (obstacleSpawnTimer <= 0) {
                    obstacleSpawnTimer = OBSTACLE_SPAWN_INTERVAL;
                    const head = snake.length > 0 ? snake[0] : { x: 10 * TILE_SIZE, y: 10 * TILE_SIZE };
                    const count = 1 + Math.floor(seededRandom() * 2);
                    let spawned = 0;
                    for (let i = 0; i < count; i++) {
                        const tile = findFreeTile(head.x, head.y);
                        if (tile) {
                            obstacles.push(tile);
                            newObstacleFlash.push({ x: tile.x, y: tile.y, timer: 1000 });
                            spawned++;
                        }
                    }
                    if (spawned > 0) {
                        newObstacleToastTimer = 2000;
                    }
                } else {
                    obstacleSpawnTimer--;
                }
            }

        }

        function getLevelFromXP(xp) {
            let n = 1;
            while (true) {
                const required = 100 * n * (n + 1) / 2;
                if (xp < required) return n;
                n++;
            }
        }

        function updateXpCache() {
            if (cachedLevel === level) return;
            cachedLevel = level;
            cachedXpForThisLevel = 100 * level * (level + 1) / 2;
            cachedXpForPrevLevel = level > 1 ? 100 * (level - 1) * level / 2 : 0;
        }

        function awardXP(amount) {
            const mc = MODE_CONFIG[gameMode];
            if (!mc.earnXP) return;
            if (level >= 20) {
                xpOvercharge += amount;
                sessionXP += amount;
                saveManager.set('snake_xp_overcharge', xpOvercharge);
                return;
            }
            xp += amount;
            sessionXP += amount;
            const newLevel = getLevelFromXP(xp);
            while (newLevel > level) {
                level++;
                levelUpFlash = 1500; // show "LEVEL N!" for 1.5 seconds
                showLevelUpToast(level);
                checkLevelUnlocks(level);
                srSpeak('Level ' + level + '!');
            }
            cachedLevel = -1; // invalidate XP cache on level change
            saveManager.set('snake_xp', xp);
        }

        function syncDailyState() {
            const today = new Date();
            const dateStr = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
            let lastDate = saveManager.get('snake_daily_date', '');
            
            if (lastDate !== dateStr) {
                // New day — reset attempts
                dailyAttempts = 3;
                dailyDone = false;
                saveManager.set('snake_daily_done', 'false');
                saveManager.set('snake_daily_attempts_remaining', 3);
            } else {
                // Same day — load saved state

            }

        function queueToast(message, duration) {
            duration = duration || 3000;
            toastQueue.push({ message: message, duration: duration });
            if (!toastActive) processToastQueue();
        }

        function processToastQueue() {
            if (toastQueue.length === 0) {
                toastActive = false;
                return;
            }
            toastActive = true;
            const toast = toastQueue.shift();
            const el = toastEl;
            if (el) {
                el.textContent = toast.message;
                el.style.display = 'block';
            }
            setTimeout(function() {
                const el2 = toastEl;
                if (el2) el2.style.display = 'none';
                processToastQueue();
            }, toast.duration);
        }

                    const c = allCosmetics[id];

            }

            const ctx = {

                eatAllTypes: sessionFoodTypes.size >= 6,

        function checkStatMilestones() {
            for (const statKey in STAT_MILESTONES) {
                const statValue = stats[statKey];
                if (statValue === undefined) continue;
                const thresholds = STAT_MILESTONES[statKey];
                for (const threshold in thresholds) {
                    if (statValue >= parseInt(threshold)) {
                        const milestone = thresholds[threshold];
                        if (unlockedCosmetics.indexOf(milestone.id) === -1) {
                            unlockedCosmetics.push(milestone.id);
                            saveManager.setJSON('snake_unlocks', unlockedCosmetics);
                            queueToast(milestone.icon + ' ' + milestone.name + ': ' + milestone.msg, 4000);
                        }
                    }
                }
            }
        }
