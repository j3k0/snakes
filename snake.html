<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Snake Game</title>
    <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Snakes%22%2C%22short_name%22%3A%22Snakes%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23222%22%2C%22theme_color%22%3A%22%23111%22%2C%22orientation%22%3A%22portrait%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%2520xmlns%253D%2522http%253A%252F%252Fwww.w3.org%252F%252F2000%252Fsvg%2522%2520viewBox%253D%25220%25200%2520192%2520192%2522%253E%253Crect%2520width%253D%2522192%2522%2520height%253D%2522192%2522%2520fill%253D%2522%2523111%2522%2520rx%253D%252224%2522%252F%253E%253Cpath%2520d%253D%2522M96%252040%2520C60%252040%252C%252040%252060%252C%252040%252080%2520C40%2520100%252C%252060%2520100%252C%252096%2520100%2520C132%2520100%252C%2520152%2520100%252C%2520152%2520120%2520C152%2520140%252C%2520132%2520152%252C%252096%2520152%2522%2520stroke%253D%2522%252344FF44%2522%2520stroke-width%253D%252214%2522%2520fill%253D%2522none%2522%2520stroke-linecap%253D%2522round%2522%252F%253E%253Ccircle%2520cx%253D%252240%2522%2520cy%253D%252272%2522%2520r%253D%25225%2522%2520fill%253D%2522%2523FFF%2522%252F%253E%253C%252Fsvg%253E%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D">
    <meta name="theme-color" content="#111">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #222;
            font-family: Arial, sans-serif;
            color: white;
            overflow: hidden;
        }
        h1 {
            margin-bottom: 10px;
        }
        #gameCanvas {
            border: 2px solid #333;
            background-color: #111;
            display: block;
            max-width: 100%;
            height: auto;
            aspect-ratio: 440 / 600;
            touch-action: none;
        }
        #score {
            font-size: 1.5em;
        }
        #highScore {
            font-size: 1em;
            color: #aaa;
            margin-bottom: 10px;
        }
        @media (max-width: 480px) {
          body { padding: 5px; box-sizing: border-box; }
          #gameCanvas { max-width: 100%; }
          .dpad-btn { width: 56px; height: 56px; font-size: 24px; }
        }
        @media (pointer: coarse) {
          #dpad { display: flex !important; justify-content: center; }
        }
        #menuFooter {
            display: none;
            margin-top: 4px;
            text-align: center;
            user-select: none;
            line-height: 1.5;
            font-family: Arial, sans-serif;
            max-width: 440px;
        }
        .prestige-gold { color: #FFD700; font-weight: bold; font-size: 14px; }
        .prestige-purple { color: #AA44FF; font-weight: bold; font-size: 13px; }
        .prestige-gray { color: #888; font-size: 14px; }
        .shortcut-dim { color: #555; font-size: 13px; }
        @media (pointer: coarse) {
            #menuFooter { font-size: 12px; line-height: 1.3; max-width: calc(100vw - 20px); }
        }
        /* v7: Hide title and score in standalone PWA mode */
        @media (display-mode: standalone), (display-mode: fullscreen) {
            h1 { display: none; }
            #score { display: none; }
            #highScore { display: none; }
        }
    </style>
</head>
<body>
    <h1>Snake Game</h1>
    <canvas id="gameCanvas" width="440" height="600" role="img" aria-label="Snake game board"></canvas>
    <div id="menuFooter">
      <div id="prestigeInfo"></div>
      <div id="shortcutInfo"></div>
    </div>
    <div id="dpad" style="display:none;margin-top:10px;touch-action:manipulation;user-select:none;-webkit-user-select:none;">
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
        <button class="dpad-btn" data-key="ArrowUp" aria-label="Up" style="width:56px;height:56px;font-size:24px;background:#333;color:white;border:2px solid #555;border-radius:8px;cursor:pointer;touch-action:manipulation;">▲</button>
        <div style="display:flex;gap:48px;">
          <button class="dpad-btn" data-key="ArrowLeft" aria-label="Left" style="width:56px;height:56px;font-size:24px;background:#333;color:white;border:2px solid #555;border-radius:8px;cursor:pointer;touch-action:manipulation;">◀</button>
          <button class="dpad-btn" data-key="ArrowDown" aria-label="Down" style="width:56px;height:56px;font-size:24px;background:#333;color:white;border:2px solid #555;border-radius:8px;cursor:pointer;touch-action:manipulation;">▼</button>
          <button class="dpad-btn" data-key="ArrowRight" aria-label="Right" style="width:56px;height:56px;font-size:24px;background:#333;color:white;border:2px solid #555;border-radius:8px;cursor:pointer;touch-action:manipulation;">▶</button>
        </div>
        <button class="dpad-btn" data-key=" " aria-label="Pause" style="width:56px;height:56px;font-size:18px;background:#333;color:white;border:2px solid #555;border-radius:8px;cursor:pointer;touch-action:manipulation;margin-top:4px;">⏸</button>
      </div>
    </div>
    <p>Score: <span id="score">0</span></p>
    <p id="highScore">Best: 0</p>
        <div id="xpDisplay" style="color:#aaa;font-size:0.9em;"></div>
        <div id="seedContainer" style="margin-top:6px;display:flex;align-items:center;gap:6px;justify-content:center;font-size:12px;">
            <input type="text" id="seedField" placeholder="Seed..." style="width:120px;padding:3px 6px;background:#222;color:white;border:1px solid #555;border-radius:4px;font-family:monospace;font-size:12px;">
            <button id="seedRandomBtn" style="padding:3px 8px;background:#333;color:white;border:1px solid #555;border-radius:4px;cursor:pointer;font-size:11px;">🎲</button>
            <button id="seedClearBtn" style="padding:3px 8px;background:#333;color:#aaa;border:1px solid #555;border-radius:4px;cursor:pointer;font-size:11px;">✕</button>
        </div>
        <div id="comboDisplay" style="color:#FFD700;font-size:1.2em;min-height:1.5em;"></div>
        <div id="toast" style="display:none;position:fixed;top:max(20px, env(safe-area-inset-top, 0px));left:50%;transform:translateX(-50%);color:#FFD700;font-size:24px;font-weight:bold;text-shadow:2px 2px 4px rgba(0,0,0,0.8);z-index:1000;pointer-events:none;text-align:center;"></div>
        <div id="statsPanel" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.95);border:2px solid #555;border-radius:10px;padding:20px;color:white;font-family:monospace;z-index:100;min-width:300px;max-width:400px;max-height:70vh;overflow-y:auto;"></div>
        <div id="achievementsPanel" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.96);border:2px solid #FFD700;border-radius:12px;padding:20px;color:white;font-family:sans-serif;z-index:100;min-width:350px;max-width:480px;"></div>
        <div id="cosmeticsPanel" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.96);border:2px solid #9B59B6;border-radius:12px;padding:20px;color:white;font-family:sans-serif;z-index:100;min-width:320px;"></div>
        <div id="questsPanel" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.96);border:2px solid #44FF88;border-radius:12px;padding:20px;color:white;font-family:sans-serif;z-index:100;min-width:320px;max-width:440px;max-height:80vh;overflow-y:auto;"></div>
        <div id="settingsPanel" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.96);border:2px solid #88AAFF;border-radius:12px;padding:20px;color:white;font-family:sans-serif;z-index:100;min-width:320px;max-width:440px;max-height:80vh;overflow-y:auto;"></div>
        <div id="panelBackdrop" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:99;touch-action:manipulation;"></div>
        <!-- v6: Screen reader live region -->
        <div id="srAnnounce" aria-live="polite" aria-atomic="true" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;"></div>
        <!-- v6 styles for new panels -->
        <style>
            .brews-grid { display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0; }
            .brew-card { padding:8px;border-radius:8px;cursor:pointer;text-align:center;transition:all .15s; }
            .brew-card.unlocked { background:rgba(68,255,136,0.1);border:1px solid rgba(68,255,136,0.3); }
            .brew-card.locked { background:rgba(68,68,68,0.3);border:1px solid rgba(68,68,68,0.3); }
            .brew-card.equipped { border-color:#4488FF;box-shadow:0 0 8px rgba(68,136,255,0.5); }
            .brew-name { font-weight:bold;font-size:13px; }
            .brew-desc { font-size:11px;color:#AAA;margin:4px 0; }
            .brew-cost { font-size:10px;color:#888; }
            .diary-entry { padding:6px;border-bottom:1px solid #333;cursor:pointer; }
            .diary-entry:hover { background:rgba(255,255,255,0.05); }
            .diary-summary { display:flex;justify-content:space-between;align-items:center; }
            .diary-mode { font-weight:bold;font-size:12px; }
            .diary-score { font-size:14px;color:#FFD700; }
            .diary-time { font-size:11px;color:#AAA; }
            .diary-date { font-size:11px;color:#666; }
            .diary-detail { margin-top:6px;padding:8px;background:rgba(0,0,0,0.3);border-radius:4px; }
            .diary-stats { display:grid;grid-template-columns:repeat(2,1fr);gap:4px;font-size:11px;color:#CCC; }
            .diary-delete { margin-top:8px;padding:4px 10px;background:#C03;color:white;border:none;border-radius:4px;cursor:pointer;font-size:10px; }
            .panel-subtitle { text-align:center;font-size:12px;color:#AAA;margin:4px 0 12px 0; }
            #diaryFilter { text-align:center;margin:8px 0; }
            #diaryFilter select { background:#222;color:white;border:1px solid #555;padding:4px 8px;border-radius:4px;font-size:11px; }
            @media (display-mode: standalone) { #dpad { padding-bottom:max(8px, env(safe-area-inset-bottom)); } }
        </style>

    <script>
        const TILE_SIZE = 20;
        const CANVAS_WIDTH = 440;
        const CANVAS_HEIGHT = 600;
        // v8 A: HiDPI/Retina backing store — scale by devicePixelRatio (capped at 3).
        // All draw code keeps using logical CANVAS_WIDTH/CANVAS_HEIGHT coords; the base
        // transform (set in drawGame) maps logical→backing pixels. CSS size is managed
        // separately by resizeCanvas().
        let DPR = Math.min(window.devicePixelRatio || 1, 3);
        const PLAY_WIDTH = 400;
        const PLAY_HEIGHT = 400;
        const PLAY_MARGIN_LEFT = 20;
        const PLAY_MARGIN_TOP = 50;
        const BASE_SPEED = 120;
        const MIN_SPEED = 50;
        const MAX_OBSTACLE_PERCENT = 0.20;
        const OBSTACLE_SPAWN_INTERVAL = 200;

        function ensureGridCache() {
            const theme = GRID_THEMES[cosmetics.grid] || GRID_THEMES.grid_classic;
            // v8 A: DPR in the cache key so a DPR change rebuilds the cache (resizeCanvas
            // does not call ensureGridCache — the key mismatch triggers the rebuild).
            // v8 C: gridVisible in the key so toggling lines rebuilds bg-only vs full.
            const cacheKey = cosmetics.grid + (highContrast ? '_hc' : '') + (DPR !== 1 ? '_dpr' + DPR : '') + (gridVisible ? '_g' : '_bg');
            if (gridCacheCanvas && gridCacheTheme === cacheKey) return;
            if (!gridCacheCanvas) {
                gridCacheCanvas = document.createElement('canvas');
            }
            gridCacheCanvas.width = PLAY_WIDTH * DPR;
            gridCacheCanvas.height = PLAY_HEIGHT * DPR;
            gridCacheTheme = cacheKey;
            const gctx = gridCacheCanvas.getContext('2d');
            gctx.setTransform(DPR, 0, 0, DPR, 0, 0);
            gctx.fillStyle = theme.bg;
            gctx.fillRect(0, 0, PLAY_WIDTH, PLAY_HEIGHT);
            if (gridVisible) {
                gctx.strokeStyle = highContrast ? 'rgba(255,255,255,0.15)' : theme.stroke;
                gctx.lineWidth = 1;
                gctx.beginPath();
                for (let x = 0; x <= PLAY_WIDTH; x += TILE_SIZE) {
                    gctx.moveTo(x, 0);
                    gctx.lineTo(x, PLAY_HEIGHT);
                }
                for (let y = 0; y <= PLAY_HEIGHT; y += TILE_SIZE) {
                    gctx.moveTo(0, y);
                    gctx.lineTo(PLAY_WIDTH, y);
                }
                gctx.stroke();
            }
        }

        const canvas = document.getElementById('gameCanvas');
        canvas.width = CANVAS_WIDTH * DPR;
        canvas.height = CANVAS_HEIGHT * DPR;
        const ctx = canvas.getContext('2d');
        canvas.addEventListener('contextmenu', e => e.preventDefault());
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');
        const toastEl = document.getElementById('toast');
        const comboDisplayEl = document.getElementById('comboDisplay');
        const xpDisplayEl = document.getElementById('xpDisplay');
        const panelBackdropEl = document.getElementById('panelBackdrop');

        let snake = [];
        let food = {};
        var food2 = null; // v6: Echo Brew duplicate food
        let extraFoods = []; // v9 D: shared array for portal + hoard foods
        let transientRings = []; // v9 F: shared visual rings (hunter dust, bounty burst, power-up shockwave)
        let hoardActive = false; // v9 E: Golden Hoard event state (declared here so F can reference it before E)
        let scoreMultiplier = 1; // v9 E: hoard score multiplier (declared here for same reason)
        let dx = 0;
        let dy = 0;
        let score = 0;

        // === PROGRESSION SYSTEM ===
        const saveManager = {
            get(key, defaultVal) {
                try { const v = localStorage.getItem(key); return v !== null ? v : defaultVal; }
                catch(e) { return defaultVal; }
            },
            set(key, value) {
                try { localStorage.setItem(key, String(value)); }
                catch(e) { /* localStorage unavailable */ }
            },
            getInt(key, defaultVal) {
                try { const v = localStorage.getItem(key); return v !== null ? parseInt(v, 10) || defaultVal : defaultVal; }
                catch(e) { return defaultVal; }
            },
            getJSON(key, defaultVal, validator) {
                try {
                    const v = localStorage.getItem(key);
                    if (v === null) return defaultVal;
                    const parsed = JSON.parse(v);
                    return validator ? (validator(parsed) ? parsed : defaultVal) : parsed;
                }
                catch(e) { return defaultVal; }
            },
            setJSON(key, value) {
                try { localStorage.setItem(key, JSON.stringify(value)); }
                catch(e) { /* localStorage unavailable */ }
            },
            remove(key) {
                try { localStorage.removeItem(key); }
                catch(e) { /* localStorage unavailable */ }
            }
        };
        let highScore = saveManager.getInt('snake_high_score', 0);
        let gameTimeout = null;

        function scheduleNextTick() {
            if (gameState !== 'playing') return;
            gameTimeout = setTimeout(() => {
                updateGame();
                if (gameState === 'playing') {
                    scheduleNextTick();
                }
            }, tickInterval);
        }

        function stopGameLoop() {
            if (gameTimeout) { clearTimeout(gameTimeout); gameTimeout = null; }
        }

        let gameState = 'idle';
        let nextDirection = null;
        let audioCtx = null;
        let muted = saveManager.getInt('snake_muted', 0);
        let highContrast = saveManager.get('snake_high_contrast', '') === '1';
        // v8 C: grid-lines visibility (themed bg always paints; this gates lines only).
        let gridVisible = saveManager.get('snake_grid_visible', '1') === '1';
        // v8 B: Calm Mode — reduced-motion accessibility. 'auto' follows the OS
        // prefers-reduced-motion setting; 'on'/'off' override it. Persists via saveManager.
        let calmMode = saveManager.get('snake_calm_mode', 'auto');
        let displayedScore = 0;
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
        function calmModeEffective() {
            return calmMode === 'on' || (calmMode === 'auto' && prefersReducedMotion.matches);
        }
        prefersReducedMotion.addEventListener('change', function() { visualDirty = true; });
        // v8 C: Settings sliders (declared here so the folded-shake line and
        // spawnParticles gating can reference them; populated by the Settings panel).
        let shakeIntensity = saveManager.getInt('snake_shake_intensity', 100);
        let particleDensity = saveManager.getInt('snake_particle_density', 100);
        let particles = [];
        // v7 D4: snake-decay death fragments — REPLACE the old death particle burst.
        // Spawned tail-to-head in gameOver(); updated/rendered additively in the rAF
        // loop. deathFragmentsActive gates rendering so the array isn't scanned when
        // no death sequence is in flight. Capped at 400 fragments.
        let deathFragments = [];
        let deathFragmentsActive = false;
        let shakeTimer = 0;
        // v8 A: shake offset folded into drawGame's base transform (visual state,
        // written only in animateVisuals, read in drawGame). Replaces the old
        // save()/translate()/restore() shake wrapper around the drawGame call.
        let shakeOffsetX = 0;
        let shakeOffsetY = 0;
        let obstacles = [];
        let lastFrameTime = 0;
        // v7: Visual effect queues — producer-consumer pattern (replaces flashOverlay)
        // gameEffects: written ONLY by game-tick loop (updateGame)
        // rAFEffects: written ONLY by rAF loop (animateVisuals)
        let gameEffects = [];
        let rAFEffects = [];
        const PRIORITY_ORDER = { critical: 3, high: 2, normal: 1, none: 0 };
        // flashOverlay kept for backward compat during migration — will be removed
        let flashOverlay = null;

        function queueGameEffect(type, params) {
            gameEffects.push({
                type: type,
                color: params.color || '#FFF',
                alpha: params.alpha || 0.5,
                priority: PRIORITY_ORDER[params.priority] || 0,
                decay: params.decay || 0
            });
        }
        function queueRAFEffect(type, params) {
            rAFEffects.push({
                type: type,
                color: params.color || '#FFF',
                alpha: params.alpha || 0.5,
                priority: PRIORITY_ORDER[params.priority] || 0,
                decay: params.decay || 0
            });
        }
        function drainVisualQueue() {
            var effects = { flash: null, shake: null };
            var all = gameEffects.concat(rAFEffects);
            for (var i = 0; i < all.length; i++) {
                var e = all[i];
                if (!effects[e.type] || e.priority > effects[e.type].priority) {
                    effects[e.type] = e;
                }
            }
            gameEffects.length = 0;
            rAFEffects.length = 0;
            return effects;
        }
        function hasPendingEffects() {
            return gameEffects.length > 0 || rAFEffects.length > 0;
        }
        let visualDirty = true;
        let prevSnake = [];
        let lastTickTime = 0;
        let tickInterval = 120;
        let snakeGrew = false;
        let prevRivalSnake = [];
        // Touch-device detection (referenced by isMobile and the touch UI guards).
        // Was missing since the v5 refactor, throwing a ReferenceError that halted
        // the entire game script on load — every symbol below landed in the TDZ.
        const hasTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
        let isMobile = hasTouch || window.innerWidth < 600;
        let mutatorTokens = saveManager.getInt('snake_mutator_tokens', 0);
        // v7: PWA standalone detection
        const isStandalone = window.matchMedia('(display-mode: standalone), (display-mode: fullscreen), (display-mode: minimal-ui)').matches || window.navigator.standalone === true;
        let deferredInstallPrompt = null;
        window.addEventListener('beforeinstallprompt', function(e) { e.preventDefault(); deferredInstallPrompt = e; });
        let unlockedMutators = saveManager.getJSON('snake_mutator_unlocks', ['gravity','mirror','phase_shift'], function(v) { return Array.isArray(v) && v.length > 0; });

        // === SEEDED RUNS ===
        let activeSeed = null;
        let seedPrng = null;

        // === GHOST REPLAY SYSTEM ===
        let replayEvents = [];
        let ghostPositions = [];
        let ghostEnabled = false;
        const REPLAY_VERSION = 1;
        const CHALLENGE_URL_VERSION = 1;
        const GHOST_ARENA_MAX = 3;
        const GHOST_ARENA_COLORS = [
            { body: '#66CCFF', head: '#4488AA', label: '1st', alpha: 0.35 },
            { body: '#FF8866', head: '#AA4422', label: '2nd', alpha: 0.25 },
            { body: '#88FF88', head: '#44AA44', label: '3rd', alpha: 0.20 },
        ];

        let challengeFromUrl = null;
        let ghostArenaMode = false;
        let arenaGhostReplays = [];
        let arenaGhostPositions = [];

        function startReplayRecording() {
            replayEvents = [];
        }

        function recordReplayDirection(tick, dx, dy) {
            replayEvents.push({ tick: tick, type: 'dir', dx: dx, dy: dy });
        }

        function recordReplayGrow(tick) {
            replayEvents.push({ tick: tick, type: 'grow' });
        }

        function saveReplay(score, maxLength) {
            if (replayEvents.length === 0 || activeSeed === null) return;
            if (gameMode === 'daily' || gameMode === 'gauntlet') return;
            var replay = {
                version: REPLAY_VERSION,
                seed: activeSeed,
                mode: gameMode,
                mutators: activeMutators,
                score: score,
                maxLength: maxLength,
                timestamp: Date.now(),
                events: replayEvents
            };
            var replays = loadReplays(gameMode);
            replays.push(replay);
            replays.sort(function(a, b) { return b.score - a.score; });
            replays = replays.slice(0, 5);
            saveManager.setJSON('snake_replays_' + gameMode, replays);
        }

        function loadReplays(mode) {
            return saveManager.getJSON('snake_replays_' + mode, []);
        }

        // v6: Snake Diary
        var MAX_DIARY_ENTRIES = 200;

        function saveDiaryEntry() {
            if (gameMode === 'daily') return; // skip for daily mode (seed-based)
            var diary = saveManager.getJSON('snake_diary', []);
            var entry = {
                id: Date.now(),
                date: new Date().toISOString(),
                mode: gameMode,
                score: gameMode === 'painter' ? (paintCoveredCount || 0) : (score || 0),
                duration: Math.floor((Date.now() - (sessionStartTime || Date.now())) / 1000) || 0,
                foodEaten: sessionFoodEaten || 0,
                maxCombo: sessionMaxCombo || 0,
                level: level || 0,
                prestigeLevel: prestigeLevel || 0,
                deathCause: lastDeathCause || 'quit',
                seed: activeSeed || '',
                mutators: typeof activeMutators !== 'undefined' ? activeMutators.slice() : [],
                brews: typeof activeBrews !== 'undefined' ? activeBrews.slice() : [],
            };
            diary.unshift(entry);
            if (diary.length > MAX_DIARY_ENTRIES) diary.length = MAX_DIARY_ENTRIES;
            saveManager.setJSON('snake_diary', diary);
        }

        function formatDuration(secs) {
            if (!secs || secs < 0) return '0:00';
            var m = Math.floor(secs / 60);

        function getDailySeed() {
            const today = new Date();
            const dateStr = today.getFullYear() + '-' + (today.getMonth()+1) + '-' + today.getDate();
            let hash = 0;
            for (let i = 0; i < dateStr.length; i++) {
                hash = ((hash << 5) - hash) + dateStr.charCodeAt(i);
                hash |= 0;
            }
            return Math.abs(hash);
        }

        function getDailyProgress(challenge) {
            switch (challenge.progressKey) {
                case 'score': return score;
                case 'speed': return sessionSpeedFood;
                case 'bonus': return sessionBonusFood;
                case 'combo': return sessionMaxCombo;
                case 'time': return Math.min(sessionTimeAlive, challenge.progressTarget);
                case 'food': return sessionFoodEaten;
                case 'length': return snake.length;
                case 'types': return sessionFoodTypes.size;
                default: return 0;
            }
        }

        // ============================================================
        // v7 Feature C: Quest Board (Daily/Weekly Missions)
        // 3 daily + 3 weekly missions, deterministic per day/ISO-week seed.
        // Rewards are XP only (NOT mutator tokens) per design review —
        // flooding the token economy would destroy its scarcity.
        // checkQuestProgress() is a parallel session-end hook: it MUST be
        // called from BOTH gameOver() AND endZenSession() (see AGENTS.md).
        // ============================================================
        let dailyQuests = [];
        let weeklyQuests = [];

        function getDayString() {
            const d = new Date();
            return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
        }

        // ISO-8601 week string: 'YYYY-Www'. Monday-anchored, week 1 = first week
        // with a Thursday. Deterministic per calendar week across runs.
        function getISOWeekString() {
            const d = new Date();
            const tmp = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            const dayNum = (tmp.getUTCDay() + 6) % 7; // 0 = Monday
            tmp.setUTCDate(tmp.getUTCDate() - dayNum + 3); // nearest Thursday
            const firstThursday = tmp.getTime();
            tmp.setUTCMonth(0, 1);
            if (tmp.getUTCDay() !== 4) {
                tmp.setUTCMonth(0, 1 + ((4 - tmp.getUTCDay()) + 7) % 7);
            }
            const weekNum = 1 + Math.round((firstThursday - tmp.getTime()) / (7*24*3600*1000));
            return tmp.getUTCFullYear() + '-W' + String(weekNum).padStart(2,'0');
        }

        function hashString(s) {
            let h = 0;
            for (let i = 0; i < s.length; i++) {
                h = ((h << 5) - h) + s.charCodeAt(i);
                h |= 0;
            }
            return Math.abs(h);
        }

        const QUEST_TEMPLATES = [

            { id:'score_target',   desc:'Score {n} in one run',        progressKey:'score',       daily:[100,150,200],      weekly:[300,400],      xpDaily:30,  xpWeekly:70 },
            { id:'combo_target',   desc:'Reach a x{n} combo',          progressKey:'maxCombo',    daily:[3,5,7],            weekly:[10,15],        xpDaily:20,  xpWeekly:55 },
            { id:'survive_time',   desc:'Survive {n} in one run',      progressKey:'timeAlive',   daily:[60000,90000,120000], weekly:[180000,240000], xpDaily:25, xpWeekly:60 },
            { id:'eat_food',       desc:'Eat {n} food in one run',     progressKey:'foodEaten',   daily:[10,15,20],         weekly:[30,40],        xpDaily:15,  xpWeekly:50 },
            { id:'eat_speed',      desc:'Eat {n} speed food',          progressKey:'speedFood',   daily:[2,3],              weekly:[5,8],          xpDaily:20,  xpWeekly:50 },
            { id:'eat_bonus',      desc:'Eat {n} bonus food',          progressKey:'bonusFood',   daily:[2,3],              weekly:[5,8],          xpDaily:20,  xpWeekly:50 },
            { id:'mode_classic',   desc:'Play a Classic run',          progressKey:'modePlayed',  param:{mode:'classic'},   daily:[1], weekly:[1], xpDaily:10, xpWeekly:0 },
            { id:'mode_timeattack',desc:'Play a Time Attack run',      progressKey:'modePlayed',  param:{mode:'timeAttack'},daily:[1], weekly:[1], xpDaily:10, xpWeekly:0 },
            { id:'mode_snap',      desc:'Play a Snap run',             progressKey:'modePlayed',  param:{mode:'snap'},      daily:[1], weekly:[1], xpDaily:10, xpWeekly:0 },
            { id:'mode_zen',       desc:'Play a Zen run',              progressKey:'modePlayed',  param:{mode:'zen'},       daily:[1], weekly:[1], xpDaily:10, xpWeekly:0 },
            { id:'mode_walled',    desc:'Play a Walled run',           progressKey:'modePlayed',  param:{mode:'walled'},    daily:[1], weekly:[1], xpDaily:10, xpWeekly:0 },
            { id:'mode_paint',     desc:'Play a Painter run',          progressKey:'modePlayed',  param:{mode:'painter'},   daily:[1], weekly:[1], xpDaily:10, xpWeekly:0 },
            { id:'walled_score',   desc:'Score {n}+ in Walled mode',   progressKey:'walledScore', daily:[],                 weekly:[150,200,250],  xpDaily:0,   xpWeekly:65 },
            { id:'no_death_5min',  desc:'Survive 5 minutes in one run',progressKey:'timeAlive',   daily:[],                 weekly:[300000],       xpDaily:0,   xpWeekly:80 },
            { id:'use_mutator',    desc:'Finish a run with a mutator', progressKey:'mutatorUsed', daily:[],                 weekly:[1],            xpDaily:0,   xpWeekly:45 },
            { id:'brew_run',       desc:'Finish a run with a brew',    progressKey:'brewUsed',    daily:[],                 weekly:[1],            xpDaily:0,   xpWeekly:45 },
            { id:'combo_high',     desc:'Reach a x{n} combo',          progressKey:'maxCombo',    daily:[],                 weekly:[20,30],        xpDaily:0,   xpWeekly:75 },
            { id:'length_high',    desc:'Reach length {n}',            progressKey:'snakeLength', daily:[],                 weekly:[75,100],       xpDaily:0,   xpWeekly:85 },
            { id:'zen_score',      desc:'Score {n}+ in Zen mode',      progressKey:'modeScore',   param:{mode:'zen'},       daily:[], weekly:[50,75], xpDaily:0, xpWeekly:70 },
        ];

        // Maps a quest's progressKey to its current live value. Run-based
        // metrics (score, length, combo, time, food counts) track the BEST
        // single run of the period via Math.max in checkQuestProgress — this
        // mirrors the existing daily-challenge semantics, not cumulative totals.
        // The reader receives the quest so param-driven keys (modeScore,
        // modePlayed) can inspect param.mode.
        const QUEST_PROGRESS_MAP = {
            snakeLength: () => snake.length,
            score: () => score,
            maxCombo: () => sessionMaxCombo,
            timeAlive: (q) => Math.min(sessionTimeAlive, q.target),
            foodEaten: () => sessionFoodEaten,
            speedFood: () => sessionSpeedFood,
            bonusFood: () => sessionBonusFood,
            modePlayed: (q) => (gameMode === (q.param && q.param.mode)) ? 1 : 0,
            modeScore: (q) => (gameMode === (q.param && q.param.mode)) ? score : 0,
            walledScore: () => (gameMode === 'walled') ? score : 0,
            mutatorUsed: () => activeMutators.length > 0 ? 1 : 0,
            brewUsed: () => activeBrews.length > 0 ? 1 : 0,
        };

        function instantiateQuest(template, target, period) {
            const displayN = template.progressKey === 'timeAlive'
                ? (target / 1000) + 's'
                : String(target);
            const xp = period === 'daily' ? template.xpDaily : template.xpWeekly;
            return {
                id: 'q_' + period + '_' + template.id + '_' + target,
                templateId: template.id,
                desc: template.desc.replace('{n}', displayN),
                progressKey: template.progressKey,
                param: template.param || null,
                progress: 0,
                target: target,
                completed: false,
                claimed: false,
                reward: { xp: xp },
                period: period,
            };
        }

        // Deterministic per day/week: same seed string → same 3 quests. Picks
        // 3 distinct templates from the period's pool, then a target from each
        // template's pool, both driven by mulberry32(seedHash).
        function generateQuests(period) {
            const seedStr = (period === 'daily' ? getDayString() : getISOWeekString()) + '_quests_' + period;
            const rng = mulberry32(hashString(seedStr));
            const pool = QUEST_TEMPLATES.filter(t => (period === 'daily' ? t.daily : t.weekly).length > 0);
            const chosen = [];
            const usedIdx = new Set();
            while (chosen.length < 3 && usedIdx.size < pool.length) {
                const idx = Math.floor(rng() * pool.length);
                if (usedIdx.has(idx)) continue;
                usedIdx.add(idx);
                const t = pool[idx];
                const targets = period === 'daily' ? t.daily : t.weekly;
                const target = targets[Math.floor(rng() * targets.length)];
                chosen.push(instantiateQuest(t, target, period));
            }
            return chosen;
        }

        // Update progress for all active quests. Called from the food-eat
        // block (length/food/combo movement) AND from BOTH gameOver() and
        // endZenSession() — the parallel session-end paths (AGENTS.md).
        // Progress is monotonic (Math.max) so it survives across runs in the
        // same period; newly-completed quests toast once.
        function checkQuestProgress() {
            let changed = false;
            let newlyCompleted = null;
            const all = dailyQuests.concat(weeklyQuests);
            for (let i = 0; i < all.length; i++) {
                const q = all[i];
                if (q.completed) continue;
                const reader = QUEST_PROGRESS_MAP[q.progressKey];
                if (!reader) continue;
                const current = reader(q) || 0;
                if (current > q.progress) { q.progress = current; changed = true; }
                if (q.progress >= q.target) { q.completed = true; changed = true; if (!newlyCompleted) newlyCompleted = q; }
            }
            if (changed) persistQuests();
            if (newlyCompleted) queueToast('🎯 Quest complete: ' + newlyCompleted.desc, 2800);
        }

        // Atomic claim: set claimed, award XP, persist — all synchronous, no
        // await between them, so a crash mid-claim cannot leave a half-state.
        function claimQuest(period, index) {
            const list = period === 'daily' ? dailyQuests : weeklyQuests;
            const q = list[index];
            if (!q || !q.completed || q.claimed) return;
            q.claimed = true;
            awardXP(q.reward.xp);
            persistQuests();
            queueToast('🎯 Claimed: +' + q.reward.xp + ' XP', 2500);
            renderQuests();
            updateMenuFooter();
        }

        function persistQuests() {
            saveManager.setJSON('snake_daily_quests', dailyQuests);
            saveManager.setJSON('snake_weekly_quests', weeklyQuests);
            saveManager.set('snake_daily_quest_date', getDayString());
            saveManager.set('snake_weekly_quest_date', getISOWeekString());
        }

        // Staleness check — page load + idle render only (NOT during gameplay).
        // If the stored date doesn't match today / this ISO week, regenerate;
        // otherwise restore persisted quests. Always re-persists so the date
        // keys stay current even on a fresh generate.
        function syncQuestState() {
            const today = getDayString();
            const thisWeek = getISOWeekString();
            if (saveManager.get('snake_daily_quest_date', '') !== today) {
                dailyQuests = generateQuests('daily');
            } else {
                const saved = saveManager.getJSON('snake_daily_quests', null);
                dailyQuests = (Array.isArray(saved) && saved.length === 3) ? saved : generateQuests('daily');
            }
            if (saveManager.get('snake_weekly_quest_date', '') !== thisWeek) {
                weeklyQuests = generateQuests('weekly');
            } else {
                const saved = saveManager.getJSON('snake_weekly_quests', null);
                weeklyQuests = (Array.isArray(saved) && saved.length === 3) ? saved : generateQuests('weekly');
            }
            persistQuests();
        }

        // Human-readable "resets in Xh Ym" for the period boundary.
        function questResetCountdown(period) {
            const now = new Date();
            let next;
            if (period === 'daily') {
                next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 0, 0);
            } else {
                const dayIdx = (now.getDay() + 6) % 7; // 0 = Monday
                const daysToMonday = (7 - dayIdx) % 7 || 7;
                next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + daysToMonday, 0, 0, 0, 0);
            }
            const ms = Math.max(0, next - now);
            const h = Math.floor(ms / 3600000);
            const m = Math.floor((ms % 3600000) / 60000);
            return h + 'h ' + m + 'm';
        }

        function renderQuestRow(q, period, index) {
            const pct = Math.min(100, Math.round((q.progress / q.target) * 100));
            const barColor = q.completed ? '#44FF88' : '#4488FF';
            let action;
            if (q.claimed) {
                action = '<span style="color:#44FF88;font-weight:bold;">✓ Claimed</span>';
            } else if (q.completed) {
                action = '<button onclick="claimQuest(\'' + period + '\',' + index + ')" style="background:#44FF88;color:#000;border:none;border-radius:4px;padding:5px 10px;cursor:pointer;font-weight:bold;font-size:11px;touch-action:manipulation;">Claim +' + q.reward.xp + ' XP</button>';
            } else {
                action = '<span style="color:#666;font-size:11px;">' + q.progress + ' / ' + q.target + '</span>';
            }
            return '<div style="margin:8px 0;padding:8px;background:rgba(255,255,255,0.05);border-radius:6px;">' +
                '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;">' +
                  '<span style="font-size:12px;flex:1;">' + q.desc + '</span>' +
                  '<span style="font-size:11px;color:#FFD700;white-space:nowrap;">+' + q.reward.xp + ' XP</span>' +
                '</div>' +
                '<div style="background:#222;border-radius:4px;height:8px;margin:6px 0;overflow:hidden;">' +
                  '<div style="width:' + pct + '%;height:100%;background:' + barColor + ';border-radius:4px;"></div>' +
                '</div>' +
                '<div style="text-align:right;min-height:20px;">' + action + '</div>' +
            '</div>';
        }

        function renderQuests() {
            const el = document.getElementById('questsPanel');
            if (!el) return;
            const dailyHtml = dailyQuests.map((q, i) => renderQuestRow(q, 'daily', i)).join('');
            const weeklyHtml = weeklyQuests.map((q, i) => renderQuestRow(q, 'weekly', i)).join('');
            el.innerHTML =

                '<h2 style="text-align:center;margin-top:0;color:#44FF88;">🎯 QUESTS</h2>' +

                  '<span style="font-weight:bold;color:#FFD700;font-size:13px;">📅 Daily</span>' +

                '</div>' + dailyHtml +
                '<div style="display:flex;justify-content:space-between;align-items:center;margin:14px 0 4px 0;">' +
                  '<span style="font-weight:bold;color:#9B59B6;font-size:13px;">📆 Weekly</span>' +
                  '<span style="font-size:11px;color:#888;">Resets in ' + questResetCountdown('weekly') + '</span>' +
                '</div>' + weeklyHtml;
        }

        function showQuestsPanel() {
            const el = document.getElementById('questsPanel');
            if (!el) return;
            // Always re-sync on open so a just-crossed midnight rotates quests
            // even if the player never left the idle screen.

        // v8 C: Unified Settings Panel — surfaces hidden toggles (mute, high-contrast,
        // calm mode, grid lines) and sliders (shake intensity, particle density).
        function renderSettings() {
            const el = document.getElementById('settingsPanel');

                '</div>' +

                '<div style="padding:14px 0;border-bottom:1px solid #333;"><div style="font-size:13px;margin-bottom:8px;">Data Backup</div><div style="display:flex;gap:8px;"><button onclick="exportSaveData()" style="flex:1;padding:8px;border-radius:6px;border:1px solid #555;background:#222;color:#aaa;cursor:pointer;font-size:12px;touch-action:manipulation;">⬇ Export</button><label style="flex:1;padding:8px;border-radius:6px;border:1px solid #555;background:#222;color:#aaa;cursor:pointer;font-size:12px;text-align:center;touch-action:manipulation;"><input type="file" accept=".json" style="display:none;" onchange="importSaveData(this.files[0])">⬆ Import</label></div></div>' +

        function showSettingsPanel() {
            const el = document.getElementById('settingsPanel');
            if (!el) return;
            if (el.style.display === 'block') { el.style.display = 'none'; panelBackdropEl.style.display = 'none'; return; }
            panelBackdropEl.style.display = 'block';
            document.getElementById('statsPanel').style.display = 'none';
            document.getElementById('achievementsPanel').style.display = 'none';
            document.getElementById('cosmeticsPanel').style.display = 'none';
            document.getElementById('questsPanel').style.display = 'none';

            if (bp) bp.style.display = 'none';
            var dp = document.getElementById('diaryPanel');
            if (dp) dp.style.display = 'none';

        // v8 C: settings action handlers (bare-name globals — module-scope functions).
        function toggleMute() { muted = muted ? 0 : 1; saveManager.set('snake_muted', muted); renderSettings(); }
        function toggleHighContrast() { highContrast = !highContrast; saveManager.set('snake_high_contrast', highContrast ? '1' : '0'); gridCacheTheme = null; visualDirty = true; renderSettings(); }
        function toggleGridVisible() { gridVisible = !gridVisible; saveManager.set('snake_grid_visible', gridVisible ? '1' : '0'); gridCacheTheme = null; visualDirty = true; renderSettings(); }
        function setCalmMode(v) { calmMode = v; saveManager.set('snake_calm_mode', v); visualDirty = true; renderSettings(); }
        function setShakeIntensity(v) { shakeIntensity = parseInt(v, 10) || 0; saveManager.set('snake_shake_intensity', shakeIntensity); }
        function setParticleDensity(v) { particleDensity = parseInt(v, 10) || 0; saveManager.set('snake_particle_density', particleDensity); }
        // --- end v8 Feature C ---
        // v9 A: Save Data Export/Import — download/restore all snake_* localStorage keys.
        function exportSaveData() {
            var keys = {};
            try {
                Object.keys(localStorage).filter(function(k) { return k.indexOf('snake_') === 0; }).forEach(function(k) { keys[k] = localStorage.getItem(k); });
            } catch (e) { queueToast('Export failed: ' + e.message, 2000); return; }
            var data = { format: 'snakes-backup', version: 1, exportedAt: new Date().toISOString(), keys: keys };
            var blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'snakes-backup-' + new Date().toISOString().slice(0, 10) + '.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            queueToast('Backup exported!', 2000);
        }
        function importSaveData(file) {
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(e) {
                try {
                    var data = JSON.parse(e.target.result);
                    if (!data || data.format !== 'snakes-backup' || data.version !== 1) {
                        queueToast('Invalid backup file', 2000);
                        return;
                    }
                    if (!confirm('Importing will overwrite all current save data. Continue?')) return;
                    Object.keys(data.keys).forEach(function(k) { localStorage.setItem(k, data.keys[k]); });
                    queueToast('Backup imported! Reload to apply.', 3000);
                } catch (err) {
                    queueToast('Import failed: ' + err.message, 2000);
                }
            };
            reader.readAsText(file);
        }

        let gameMode = 'classic';
        let modeSelectIndex = 0;
        let timeAttackEnd = 0;
        let zenActive = false;
        let modeHighScores = loadModeHighScores();

        function loadModeHighScores() {
            return saveManager.getJSON('snake_mode_highs', {});
        }

        function getModeDesc(mode) {
            const descs = {
                classic: 'Standard Snake. Speed increases with score. Board closes in over time.',
                timeAttack: 'Score max points in 60 seconds. Fixed speed, bonus food worth +50.',
                zen: 'No death from collisions. Relax and grow. Score = snake length.',
                daily: 'Complete today\'s unique challenge! 3 attempts per day.',
                snap: 'Snake shrinks every 3s — keep eating to survive!',
                walled: 'Classic Snake with walls. Hitting the edge kills you. No second chances.',
                painter: 'Paint the board! Eat food to grow. Your trail is permanent. No self-collision. Score = coverage %.',
                gauntlet: '5 waves, each with a unique objective. Pick bonuses between waves. Death ends the run!',
            };
            return descs[mode] || '';
        }

        highScoreEl.textContent = 'Best: ' + highScore;

        function getSpeed() {
            const mc = MODE_CONFIG[gameMode];
            if (typeof mc.speed === 'number') return mc.speed;
            return Math.max(MIN_SPEED, BASE_SPEED - Math.floor(score / 50) * 5);
        }

        function getEffectiveSpeed() {
            // Returns the tick interval in ms (smaller = faster snake). slowMo doubles
            // it (slower); the Swift evolution divides it by (1+bonus) for +5% speed.
            let speed = slowMoActive ? getSpeed() * 2 : getSpeed();
            // v7: Swift evolution — +5% speed = ~5% smaller tick interval. Recomputed
            // live every call so it never needs snapshot/restore across slowMo changes.
            if (evolutionTier >= 0) speed /= (1 + EVOLUTION_TIERS[0].speedBonus);
            return speed;
        }

        function getOverchargeMultiplier() {
            if (level < 20) return 1;
            const bonus = Math.min(0.50, Math.floor(xpOvercharge / 1000) * 0.01);
            return 1 + bonus;
        }

        function addScore(amount) {
            if (gameMode === 'zen' || gameMode === 'painter') {
                if (gameMode === 'zen') score = snake.length;
                updateScoreDisplay();
                return;
            }
            const multi = (pinnacleRank > 0 ? (1 + pinnacleRank * 0.02) : 1) * getOverchargeMultiplier();
            if (gameMode === 'gauntlet') {
                for (var gpi = 0; gpi < gauntletPicks.length; gpi++) {
                    if (gauntletPicks[gpi].id === 'score_boost') {
                        amount = Math.floor(amount * 1.5);
                        break;
                    }
                }
            }
            if (activeMutators.indexOf('golden_food') !== -1) {
                amount = Math.round(amount * 3);
            }
            // v9 E: hoard scoreMultiplier (cap with golden_food to prevent ×6 trivialization)
            var effectiveHoardMult = scoreMultiplier;
            if (activeMutators.indexOf('golden_food') !== -1 && scoreMultiplier > 1) {
                effectiveHoardMult = Math.min(scoreMultiplier, 1.5); // Hoard + Golden Age = ×4.5 max
            }
            score += Math.round(amount * multi * effectiveHoardMult);
            updateScoreDisplay();
        }

        function vibrate(duration) {
            if (navigator.vibrate) {
                const now = Date.now();
                if (now - lastVibrateTime >= 300) {
                    lastVibrateTime = now;
                    navigator.vibrate(duration);
                }
            }
        }

        function pickRandomFoodType() {
            const rand = seededRandom();
            if (activeMutators.indexOf('chaos_seed') !== -1 && chaosCurrentWeights) {
                var chaosCum = 0;
                for (var ck in chaosCurrentWeights) {
                    chaosCum += chaosCurrentWeights[ck];
                    if (rand < chaosCum) return ck;
                }
            }
            // v8 E: in Walled (wrap:false) modes, hunter can't spawn (flee bias needs
            // wrapping). The chaos branch above is handled by shuffleFoodWeights' filter.
            const tiers = MODE_CONFIG[gameMode].wrap === false
                ? Object.fromEntries(Object.entries(FOOD_TIERS).filter(([k]) => k !== 'hunter'))
                : FOOD_TIERS;
            let cumulative = 0;
            for (const typeKey in tiers) {
                cumulative += tiers[typeKey].weight;
                if (rand < cumulative) return typeKey;
            }
            return 'common';
        }
        // v8 E: hunter food — fleeing prey. Fixed interval (no per-move random) so no
        // extra food-snapshot field is needed; type:'hunter' round-trips in the snapshot.
        const HUNTER_MOVE_INTERVAL = 3;
        function moveHunter() {
            if (!food || food.type !== 'hunter') return;
            var head = snake[0];
            var candidates = [
                { x: food.x + TILE_SIZE, y: food.y },
                { x: food.x - TILE_SIZE, y: food.y },
                { x: food.x, y: food.y + TILE_SIZE },
                { x: food.x, y: food.y - TILE_SIZE }
            ];
            var best = null, bestScore = -1;
            for (var ci = 0; ci < candidates.length; ci++) {
                var c = wrapPosition(candidates[ci]);
                // Reject occupied tiles: snake body, obstacles, rival, food2, power-up.
                if (snake.some(function(s) { return s.x === c.x && s.y === c.y; })) continue;
                if (obstacles.some(function(o) { return o.x === c.x && o.y === c.y; })) continue;
                if (rivals.some(function(r) { return r.active && r.snake.some(function(s) { return s.x === c.x && s.y === c.y; }); })) continue;
                if (food2 && food2.x === c.x && food2.y === c.y) continue;
                if (powerUpPickup && powerUpPickup.x === c.x && powerUpPickup.y === c.y) continue;
                // v9 D: reject extraFoods[] tiles (portal + hoard foods)
                if (extraFoods.some(function(ef) { return ef.x === c.x && ef.y === c.y; })) continue;
                // Wrap-aware Manhattan distance from head (PLAY dims, not CANVAS).
                var ddx = c.x - head.x, ddy = c.y - head.y;
                if (ddx > PLAY_WIDTH / 2) ddx -= PLAY_WIDTH; else if (ddx < -PLAY_WIDTH / 2) ddx += PLAY_WIDTH;
                if (ddy > PLAY_HEIGHT / 2) ddy -= PLAY_HEIGHT; else if (ddy < -PLAY_HEIGHT / 2) ddy += PLAY_HEIGHT;
                var dist = Math.abs(ddx) + Math.abs(ddy);
                // seededRandom() tiebreak so seeded challenge runs stay deterministic.
                var score = dist + seededRandom() * 0.5;
                if (score > bestScore) { bestScore = score; best = c; }
            }
            if (best) {
                // v9 F1: dust trail at the vacated cell (calm-mode: skip)
                if (!calmModeEffective()) pushTransientRing(food.x + TILE_SIZE / 2, food.y + TILE_SIZE / 2, 6, '#8B7355', 300, 'dust');
                food.x = best.x; food.y = best.y; food.spawnTime = performance.now();
            }
        }

        function generateFood(currentSnake) {
            const totalTiles = (PLAY_WIDTH / TILE_SIZE) * (PLAY_HEIGHT / TILE_SIZE);
            if (currentSnake.length + obstacles.length >= totalTiles) return null;

            let newFood;
            let iterations = 0;
            const MAX_ITERATIONS = 200;
            do {
                if (iterations++ > MAX_ITERATIONS) {
                    // Board is nearly full — scan all tiles for a free spot
                    const freeTiles = [];
                    const cols = PLAY_WIDTH / TILE_SIZE;
                    const rows = PLAY_HEIGHT / TILE_SIZE;
                    for (let x = 0; x < cols; x++) {
                        for (let y = 0; y < rows; y++) {
                            const tx = x * TILE_SIZE;
                            const ty = y * TILE_SIZE;
                            if (currentSnake.some(s => s.x === tx && s.y === ty)) continue;
                            if (obstacles.some(o => o.x === tx && o.y === ty)) continue;
                            freeTiles.push({ x: tx, y: ty });
                        }
                    }
                    if (freeTiles.length === 0) return null;
                    const tile = freeTiles[Math.floor(seededRandom() * freeTiles.length)];
                    const fallbackFood = { x: tile.x, y: tile.y, type: pickRandomFoodType(), spawnTime: performance.now() };
                    if (fallbackFood.type === 'rare' || fallbackFood.type === 'epic') playSound('rare_spawn');
                    return fallbackFood;
                }

                const type = pickRandomFoodType();
                newFood = {
                    x: Math.floor(seededRandom() * (PLAY_WIDTH / TILE_SIZE)) * TILE_SIZE,
                    y: Math.floor(seededRandom() * (PLAY_HEIGHT / TILE_SIZE)) * TILE_SIZE,
                    type: type,
                    spawnTime: performance.now()
                };
            } while (currentSnake.some(segment => segment.x === newFood.x && segment.y === newFood.y) ||
                     obstacles.some(o => o.x === newFood.x && o.y === newFood.y) ||
                     // v6: Rampage Brew — prefer food closer to head.
                     // v7: Titan evolution shrinks the cap by foodProximity tiles
                     // (stacks with Rampage; only meaningful while a cap is active).
                     (minFoodSpawnDist !== null && currentSnake.length > 0 &&
                      Math.abs(newFood.x - currentSnake[0].x) + Math.abs(newFood.y - currentSnake[0].y) > Math.max(1, minFoodSpawnDist - ((evolutionTier >= 2) ? EVOLUTION_TIERS[2].foodProximity : 0)) * TILE_SIZE));
            if (newFood.type === 'rare' || newFood.type === 'epic') playSound('rare_spawn');
            // v9 D: epic food spawns a linked portal twin in extraFoods[] (non-Walled only)
            if (newFood && FOOD_TIERS[newFood.type] && FOOD_TIERS[newFood.type].portal && MODE_CONFIG[gameMode].wrap !== false) {
                var portalFood = findPortalTile(newFood, currentSnake);
                if (portalFood) {
                    portalFood.type = 'portal';
                    portalFood.spawnTime = performance.now();
                    portalFood.portalLink = { x: newFood.x, y: newFood.y };
                    newFood.portalLink = { x: portalFood.x, y: portalFood.y };
                    extraFoods.push(portalFood);
                    if (!hasSeenPortal) {
                        hasSeenPortal = true;
                        saveManager.set('snake_has_seen_portal', '1');
                        queueToast('🌀 Portal food! Eat to teleport to its twin.', 3000);
                    }
                }
            }
            return newFood;
        }

        // v9 D: find a distant free tile for the portal twin (min 10 tiles, wrap-aware distance)
        function findPortalTile(epicFood, currentSnake) {
            var cols = PLAY_WIDTH / TILE_SIZE;
            var rows = PLAY_HEIGHT / TILE_SIZE;
            var minDist = 10 * TILE_SIZE;
            var candidates = [];
            for (var x = 0; x < cols; x++) {
                for (var y = 0; y < rows; y++) {
                    var tx = x * TILE_SIZE, ty = y * TILE_SIZE;
                    if (currentSnake.some(function(s) { return s.x === tx && s.y === ty; })) continue;
                    if (obstacles.some(function(o) { return o.x === tx && o.y === ty; })) continue;
                    if (food && food.x === tx && food.y === ty) continue;
                    if (food2 && food2.x === tx && food2.y === ty) continue;
                    if (powerUpPickup && powerUpPickup.x === tx && powerUpPickup.y === ty) continue;
                    if (extraFoods.some(function(ef) { return ef.x === tx && ef.y === ty; })) continue;
                    // Wrap-aware per-axis distance
                    var ddx = tx - epicFood.x, ddy = ty - epicFood.y;
                    if (ddx > PLAY_WIDTH / 2) ddx -= PLAY_WIDTH; else if (ddx < -PLAY_WIDTH / 2) ddx += PLAY_WIDTH;
                    if (ddy > PLAY_HEIGHT / 2) ddy -= PLAY_HEIGHT; else if (ddy < -PLAY_HEIGHT / 2) ddy += PLAY_HEIGHT;
                    var d = Math.abs(ddx) + Math.abs(ddy);
                    if (d >= minDist) candidates.push({ x: tx, y: ty });
                }
            }
            if (candidates.length === 0) return null;
            return candidates[Math.floor(seededRandom() * candidates.length)];
        }
        // v9 D: snap a teleport destination to the nearest free tile if occupied
        function snapToFreeTile(x, y) {
            if (!snake.some(function(s) { return s.x === x && s.y === y; }) &&
                !obstacles.some(function(o) { return o.x === x && o.y === y; }) &&
                !rivals.some(function(r) { return r.active && r.snake.some(function(s) { return s.x === x && s.y === y; }); })) {
                return { x: x, y: y };
            }
            var neighbors = [{x:x+TILE_SIZE,y:y},{x:x-TILE_SIZE,y:y},{x:x,y:y+TILE_SIZE},{x:x,y:y-TILE_SIZE}];
            for (var i = 0; i < neighbors.length; i++) {
                var n = wrapPosition(neighbors[i]);
                if (!snake.some(function(s) { return s.x === n.x && s.y === n.y; }) &&
                    !obstacles.some(function(o) { return o.x === n.x && o.y === n.y; }) &&
                    !rivals.some(function(r) { return r.active && r.snake.some(function(s) { return s.x === n.x && s.y === n.y; }); })) {
                    return n;
                }
            }
            return { x: x, y: y };
        }

        function spawnPowerUpPickup() {
            if (powerUpPickup) return;
            const types = Object.keys(POWERUP_TYPES);
            const type = types[Math.floor(seededRandom() * types.length)];
            const maxAttempts = 50;
            for (let attempt = 0; attempt < maxAttempts; attempt++) {
                const x = Math.floor(seededRandom() * (PLAY_WIDTH / TILE_SIZE)) * TILE_SIZE;
                const y = Math.floor(seededRandom() * (PLAY_HEIGHT / TILE_SIZE)) * TILE_SIZE;
                if (snake.some(s => s.x === x && s.y === y)) continue;
                if (obstacles.some(o => o.x === x && o.y === y)) continue;
                if (food && food.x === x && food.y === y) continue;
                var rivalSegsFree = rivalCombinedSnake();
                if (rivalSegsFree.some(s => s.x === x && s.y === y)) continue;
                powerUpPickup = { x, y, type };
                powerUpDespawnCounter = 125; // ~15 seconds at 120ms per tick
                return;
            }
        }

        function activatePowerUp(type) {
            vibrate(20);
            playSound('powerup');
            deactivatePowerUp(true);
            
            powerUpType = type;
            const config = POWERUP_TYPES[type];
            
            switch (type) {
                case 'shield':
                    shieldActive = true;
                    powerUpTimer = POWERUP_TYPES.shield.duration;
                    break;
                case 'magnet':
                    magnetActive = true;
                    powerUpTimer = config.duration;
                    break;
                case 'slowmo':
                    slowMoActive = true;
                    powerUpTimer = config.duration;
                    tickInterval = getEffectiveSpeed();
                    restartGameTimeout();
                    break;
            }
            // v9 F3: activation shockwave at the head
            if (snake.length > 0) {
                pushTransientRing(snake[0].x + TILE_SIZE / 2, snake[0].y + TILE_SIZE / 2, 25, config.color || '#FFFFFF', 500, 'ring', 3);
                if (!calmModeEffective()) spawnParticles(snake[0].x, snake[0].y, 12, config.color || '#FFFFFF');
            }
            
            const el = toastEl;
            if (el) {
                el.textContent = '⚡ ' + config.name + ' Activated!';
                el.style.display = 'block';
                setTimeout(function() { el.style.display = 'none'; }, 2000);
            }
        }

        function deactivatePowerUp(silent) {
            if (!silent) { playSound('powerdown'); vibrate(15); }
            if (slowMoActive) {
                slowMoActive = false;
                tickInterval = getEffectiveSpeed();
                restartGameTimeout();
            }
            shieldActive = false;
            magnetActive = false;
            powerUpTimer = 0;
            powerUpType = null;
            powerUpSpawnCounter = 0;
        }

             const combinedInitial = snake.concat(rivalCombinedSnake());

        function startGame() {

                    if (storedDate && storedDate !== todayStr) {

                        const yesterday = new Date(today);

                        const yesterdayStr = yesterday.getFullYear() + '-' + String(yesterday.getMonth()+1).padStart(2, '0') + '-' + String(yesterday.getDate()).padStart(2, '0');
                        if (storedDate === yesterdayStr) {

                    const allCosmetics = Object.assign({}, SNAKE_SKINS, GRID_THEMES, TRACE_EFFECTS, DEATH_EFFECTS, BORDER_EFFECTS);

        function checkCollision(pos) {
            const mc = MODE_CONFIG[gameMode];
            // Check obstacle collision
            for (let i = 0; i < obstacles.length; i++) {
                if (pos.x === obstacles[i].x && pos.y === obstacles[i].y) return true;
            }
            // Check self collision (existing)
            if (!mc.selfCollision) return false;
            for (let i = 0; i < snake.length; i++) {
                if (pos.x === snake[i].x && pos.y === snake[i].y) return true;
            }
            return false;
        }
        // v7: Evolution helper — obstacle-only collision test. Separate from
        // checkCollision() (which merges obstacle + self) so the Serpentine
        // obstacle pass can save obstacle hits without also eating self-collisions.
        function isObstacleCollision(pos) {
            for (let i = 0; i < obstacles.length; i++) {
                if (pos.x === obstacles[i].x && pos.y === obstacles[i].y) return true;
            }
            return false;
        }

        // v7: Evolution — apply a tier: visual flash, sound, toast + center floater.
        function evolveSnake(tierIndex) {
            evolutionTier = tierIndex;
            const tier = EVOLUTION_TIERS[tierIndex];
            const announceColor = tier.color === 'rainbow' ? '#FF44FF' : tier.color;
            queueGameEffect('flash', { color: announceColor, alpha: 0.3, priority: 'normal' });
            playSound('achievement');

        // v6: Responsive canvas sizing
        function resizeCanvas() {
            var canvasEl = document.getElementById('gameCanvas');
            if (!canvasEl) return;

            var scoreBar = document.getElementById('score');
            var scoreBarHeight = scoreBar ? scoreBar.offsetHeight : 0;
            var dpadHeight = dpad ? dpad.offsetHeight : 0;
            var margin = 16;

            var availableHeight = isStandalone ? window.innerHeight - margin : window.innerHeight - chromeOffset;
            var availableWidth = window.innerWidth - margin;

            var scaleX = availableWidth / CANVAS_WIDTH;
            var scaleY = availableHeight / CANVAS_HEIGHT;
            var scale = Math.min(scaleX, scaleY, 1);
            canvasEl.style.width = Math.max(300, Math.round(CANVAS_WIDTH * scale)) + 'px';
            canvasEl.style.height = Math.max(300, Math.round(CANVAS_HEIGHT * scale)) + 'px';

        // Persist the current run. Best-effort: localStorage may be full or
        // unavailable (e.g. private mode). Returns true only on a successful write.
        function saveSnapshot() {
            var snap = buildSnapshotObject();

            try {

        function restoreFromSnapshot(data, fromStorage) {

                // can be rebased to the new wall clock. The gap runs from

                // run. Current state (food, obstacles) is preserved exactly;

                extraFoods = (data.extraFoods || []).map(function(ef) { return { x: ef.x, y: ef.y, type: ef.type, spawnTime: performance.now(), portalLink: ef.portalLink || null }; });

                lastComboMilestone = data.lastComboMilestone || 0;
                lastEatTime = data.lastEatTime || 0;
                speedBoostCounter = data.speedBoostCounter || 0;
                obstacles = (data.obstacles || []).map(function (o) { return { x: o.x, y: o.y }; });

                powerUpType = data.powerUpType || null;
                powerUpTimer = data.powerUpTimer || 0;
                powerUpSpawnCounter = data.powerUpSpawnCounter || 0;
                powerUpDespawnCounter = data.powerUpDespawnCounter || 0;

                slowMoActive = !!data.slowMoActive;
                rivals = (data.rivals || []).map(function (r) { return { snake: (r.snake || []).map(function (s) { return { x: s.x, y: s.y }; }), dx: r.dx, dy: r.dy, active: !!r.active, respawnTimer: r.respawnTimer || 0, color: r.color || '#FF4444' }; });
                activeMutators = (data.activeMutators || []).slice();

                chaosCurrentWeights = data.chaosCurrentWeights || null;
                sessionFoodEaten = data.sessionFoodEaten || 0;

        // Restore from a #snapshot=<base64> URL hash. base64 wraps a
        function restoreFromSnapshotHash(hashData) {
            try {
                var json = decodeURIComponent(atob(hashData));

                if (restoreFromSnapshot(data, false)) {
                    // Strip the hash so a reload doesn't re-restore the old
                    // shared state over the user's continued play.
                    history.replaceState(null, '', window.location.pathname + window.location.search);
                    return true;
                }
                return false;
            } catch (e) {
                return false;
            }
        }

        // Encode the current run state to a shareable URL hash string.
        function encodeSnapshotHash() {
            var snap = buildSnapshotObject();
            if (!snap) return null;
            try {
                return 'snapshot=' + btoa(encodeURIComponent(JSON.stringify(snap)));
            } catch (e) {
                return null;
            }
        }

        // Clipboard share of the run state.
        function copyRunState() {
            var hash = encodeSnapshotHash();
            if (!hash) { queueToast('No run to copy', 2000); return; }
            var url = window.location.origin + window.location.pathname + '#' + hash;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(url).then(function () {
                    queueToast('Run state copied to clipboard!', 2500);
                }, function () { fallbackCopy(url); });
            } else {
                fallbackCopy(url);
            }
        }

        // Pause-menu "Save & Quit": persist the run, then return to the title

        function saveAndQuit() {
            if (!saveSnapshot()) {
                queueToast('Could not save run', 2500);
                return;
            }
            stopGameLoop();
            sessionPauseStart = 0;
            resetGame();
            queueToast('\uD83D\uDCBE Run saved — Resume from title screen', 3000);
        }

        function pickWeightedPattern() {
            const rand = seededRandom();
            let cumulative = 0;
            for (const pattern of OBSTACLE_PATTERNS) {
                cumulative += pattern.weight;
                if (rand < cumulative) return pattern;
            }
            return OBSTACLE_PATTERNS[0];
        }

        function findFreeTile(headX, headY) {
            const cols = PLAY_WIDTH / TILE_SIZE, rows = PLAY_HEIGHT / TILE_SIZE;
            const maxObs = Math.floor((cols * rows) * MAX_OBSTACLE_PERCENT);
            if (obstacles.length >= maxObs) return null;
            for (let attempt = 0; attempt < 50; attempt++) {
                const x = Math.floor(seededRandom() * cols) * TILE_SIZE;
                const y = Math.floor(seededRandom() * rows) * TILE_SIZE;
                if (Math.abs(x - headX) + Math.abs(y - headY) < 3 * TILE_SIZE) continue;
                if (snake.some(s => s.x === x && s.y === y)) continue;
                if (obstacles.some(o => o.x === x && o.y === y)) continue;
                if (food && food.x === x && food.y === y) continue;
                var rivalSegsFree = rivalCombinedSnake();
                if (rivalSegsFree.some(s => s.x === x && s.y === y)) continue;
                return { x, y };
            }
            return null;
        }

        function generateObstacles() {
            obstacles = [];
            if (gameMode === 'zen' || gameMode === 'walled' || gameMode === 'painter' || gameMode === 'gauntlet') return;
            const totalTiles = (PLAY_WIDTH / TILE_SIZE) * (PLAY_HEIGHT / TILE_SIZE);
            const maxObs = Math.floor(totalTiles * MAX_OBSTACLE_PERCENT);
            const count = Math.min(maxObs, 3 + Math.floor(seededRandom() * 6));
            const headX = 10 * TILE_SIZE;
            const headY = 10 * TILE_SIZE;
            
            for (let i = 0; i < count; i++) {
                let placed = false;
                for (let attempt = 0; attempt < 20; attempt++) {
                    const pattern = pickWeightedPattern();
                    const anchorX = Math.floor(seededRandom() * (PLAY_WIDTH / TILE_SIZE)) * TILE_SIZE;
                    const anchorY = Math.floor(seededRandom() * (PLAY_HEIGHT / TILE_SIZE)) * TILE_SIZE;
                    
                    const dist = Math.abs(anchorX - headX) + Math.abs(anchorY - headY);
                    if (dist < 3 * TILE_SIZE) continue;
                    
                    let conflict = false;
                    for (const offset of pattern.tiles) {
                        const tx = anchorX + offset.dx;
                        const ty = anchorY + offset.dy;
                        if (tx < 0 || tx >= PLAY_WIDTH || ty < 0 || ty >= PLAY_HEIGHT) { conflict = true; break; }
                        if (snake.some(s => s.x === tx && s.y === ty)) { conflict = true; break; }
                        if (obstacles.some(o => o.x === tx && o.y === ty)) { conflict = true; break; }
                        if (food && food.x === tx && food.y === ty) { conflict = true; break; }
                    }
                    if (conflict) continue;
                    
                    for (const offset of pattern.tiles) {
                        obstacles.push({ x: anchorX + offset.dx, y: anchorY + offset.dy });
                    }
                    placed = true;
                    break;
                }
                
                if (!placed) {
                    for (let attempt = 0; attempt < 20; attempt++) {
                        const obsX = Math.floor(seededRandom() * (PLAY_WIDTH / TILE_SIZE)) * TILE_SIZE;
                        const obsY = Math.floor(seededRandom() * (PLAY_HEIGHT / TILE_SIZE)) * TILE_SIZE;
                        const dist = Math.abs(obsX - headX) + Math.abs(obsY - headY);
                        if (dist < 3 * TILE_SIZE) continue;
                        if (snake.some(s => s.x === obsX && s.y === obsY)) continue;
                        if (obstacles.some(o => o.x === obsX && o.y === obsY)) continue;
                        if (food && food.x === obsX && food.y === obsY) continue;
                        obstacles.push({ x: obsX, y: obsY });
                        placed = true;
                        break;
                    }
                }
            }
            if (obstacles.length > maxObs) {
                obstacles = obstacles.slice(0, maxObs);
            }
        }

        function spawnRival(idx) {
            if (idx === undefined) idx = 0;
            while (rivals.length <= idx) {
                rivals.push({ snake: [], dx: TILE_SIZE, dy: 0, active: false, respawnTimer: 0, color: idx === 0 ? '#FF4444' : '#FF8844' });
            }
            if (rivals[idx].active) return;
            if (gameMode === 'zen' || gameMode === 'snap' || gameMode === 'daily' || gameMode === 'walled' || gameMode === 'painter') return;
            var r = rivals[idx];
            r.snake = [{ x: 10 * TILE_SIZE, y: 10 * TILE_SIZE }];
            r.dx = TILE_SIZE;
            r.dy = 0;
            r.active = true;
            r.respawnTimer = 0;
        }

        function updateRival(idx) {
            if (idx === undefined) idx = 0;
            if (idx >= rivals.length) return;
            var r = rivals[idx];
            if (!r.active) return;

            if (food) {
                var rand = seededRandom();
                if (rand < 0.7) {
                    var head = r.snake[0];
                    var dx_food = food.x - head.x;
                    var dy_food = food.y - head.y;
                    if (MODE_CONFIG[gameMode].wrap) {
                        if (Math.abs(dx_food) > PLAY_WIDTH / 2) {
                            dx_food = dx_food > 0 ? dx_food - PLAY_WIDTH : dx_food + PLAY_WIDTH;
                        }
                        if (Math.abs(dy_food) > PLAY_HEIGHT / 2) {
                            dy_food = dy_food > 0 ? dy_food - PLAY_HEIGHT : dy_food + PLAY_HEIGHT;
                        }
                    }
                    var possible = [];
                    if (dx_food > 0) possible.push({ dx: TILE_SIZE, dy: 0 });
                    else if (dx_food < 0) possible.push({ dx: -TILE_SIZE, dy: 0 });
                    if (dy_food > 0) possible.push({ dx: 0, dy: TILE_SIZE });
                    else if (dy_food < 0) possible.push({ dx: 0, dy: -TILE_SIZE });
                    if (possible.length > 0) {
                        var chosen = possible[Math.floor(seededRandom() * possible.length)];
                        r.dx = chosen.dx;
                        r.dy = chosen.dy;
                    }
                } else if (rand < 0.9) {
                    // continue straight
                } else {
                    var dirs = [{dx:TILE_SIZE,dy:0},{dx:-TILE_SIZE,dy:0},{dx:0,dy:TILE_SIZE},{dx:0,dy:-TILE_SIZE}];
                    var rchosen = dirs[Math.floor(seededRandom() * dirs.length)];
                    if (rchosen.dx !== -r.dx || rchosen.dy !== -r.dy) {
                        r.dx = rchosen.dx;

        // v8 D: Game-Over Recap Card helpers.

                    for (var i = 0; i < quests.length; i++) {
                        var before = base[i] || 0;

                        if (after > before) {

                        }
                    }
                };
                collect(dailyQuests, recapQuestBaseline.daily, 'daily');

            questDeltas.sort(function(a, b) { return b.delta - a.delta; });

        // v8 F: Bounty Rush — templates and logic.
        const BOUNTY_TEMPLATES = [
            { id: 'score',  desc: 'Score +{n} within the window',        kind: 'score',     target: 50,  windowTicks: 120, reward: { pts: 40 } },
            { id: 'food',   desc: 'Eat {n} more foods within the window', kind: 'food',      target: 3,   windowTicks: 90,  reward: { xp: 50 } },
            { id: 'combo',  desc: 'Reach a {n}x combo within the window', kind: 'combo',     target: 5,   windowTicks: 100, reward: { pts: 60 } },
            { id: 'length', desc: 'Grow by {n} segments within the window', kind: 'length',  target: 2,   windowTicks: 120, reward: { xp: 60 } },
            { id: 'speed',  desc: 'Eat {n} speed food within the window',   kind: 'speedFood', target: 1, windowTicks: 150, reward: { pts: 50 } }
        ];
        function pickBountyTemplate() {
            // Exclude kinds irrelevant to the current mode (e.g. speedFood where it
            // can't spawn). Weighted equally among valid templates.
            var valid = BOUNTY_TEMPLATES.filter(function(t) {
                if (t.kind === 'speedFood' && (gameMode === 'zen' || gameMode === 'painter' || gameMode === 'walled')) return false;
                return true;
            });
            if (!valid.length) return null;
            return valid[Math.floor(seededRandom() * valid.length)];
        }
        function spawnBounty() {
            var tpl = pickBountyTemplate();
            if (!tpl) return;
            // Scale targets to the current run so difficulty stays roughly stable.
            var target = tpl.target;
            if (tpl.kind === 'score') target = tpl.target + Math.floor(score / 50) * 25;
            if (tpl.kind === 'combo') target = Math.max(tpl.target, Math.min(15, comboCount + 3));
            if (tpl.kind === 'length') target = Math.max(tpl.target, Math.floor(snake.length / 10) + 1);
            activeBounty = {
                id: tpl.id,
                desc: tpl.desc.replace('{n}', target),
                kind: tpl.kind,
                target: target,
                windowTicks: tpl.windowTicks,
                reward: tpl.reward,
                ticksLeft: tpl.windowTicks,
                baseline: { score: score, sessionFoodEaten: sessionFoodEaten, comboCount: comboCount, snakeLen: snake.length, sessionSpeedFood: sessionSpeedFood }
            };
            queueToast('📋 Bounty: ' + activeBounty.desc, 2500);
        }
        function checkBounty() {
            if (!activeBounty) return;
