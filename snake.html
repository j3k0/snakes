            if (b.kind === 'score')      done = (score - b.baseline.score) >= b.target;
            else if (b.kind === 'food')   done = (sessionFoodEaten - b.baseline.sessionFoodEaten) >= b.target;
            else if (b.kind === 'combo')  done = comboCount >= b.target; // live combo (auto-completes if already past)
            else if (b.kind === 'length') done = (snake.length - b.baseline.snakeLen) >= b.target;
            else if (b.kind === 'speedFood') done = (sessionSpeedFood - b.baseline.sessionSpeedFood) >= b.target;

            for (var i = SYNESTHESIA_COMBO_OCTAVES.length - 1; i >= 0; i--) {
                if (comboCount >= SYNESTHESIA_COMBO_OCTAVES[i].minCombo) {
                    oct = SYNESTHESIA_COMBO_OCTAVES[i].octave;
                    break;
                }
            }
            return oct;
        }

        function playSynesthesiaChord(now) {
            if (!audioCtx) return;
            var notes = [261.63, 329.63, 392.00];
            if (comboCount >= 5) notes.push(493.88);
            if (comboCount >= 10) notes.push(293.66 * 2);
            if (comboCount >= 20) notes.push(261.63 * 2);
            var stagger = 0.05;
            for (var i = 0; i < notes.length; i++) {
                var chordOsc = audioCtx.createOscillator();
                var chordGain = audioCtx.createGain();
                chordOsc.type = 'sine';
                chordOsc.frequency.value = notes[i];
                var startTime = now + i * stagger;
                chordGain.gain.setValueAtTime(0, startTime);
                chordGain.gain.linearRampToValueAtTime(0.08, startTime + 0.05);
                chordGain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
                chordOsc.connect(chordGain);
                chordGain.connect(audioCtx.destination);
                chordOsc.start(startTime);
                chordOsc.stop(now + 0.6);
            }
        }

        function playSynesthesiaResolution(now) {
            if (!audioCtx) return;
            var resOsc = audioCtx.createOscillator();
            var resGain = audioCtx.createGain();
            resOsc.type = 'sine';
            resOsc.frequency.value = 261.63;
            resGain.gain.setValueAtTime(0.12, now);
            resGain.gain.exponentialRampToValueAtTime(0.001, now + 1.0);
            resOsc.connect(resGain);
            resGain.connect(audioCtx.destination);
            resOsc.start(now);
            resOsc.stop(now + 1.0);
        }

        function playSynesthesiaPulse() {
            if (!audioCtx) return;
            var now = audioCtx.currentTime;
            var pulseOsc = audioCtx.createOscillator();
            var pulseGain = audioCtx.createGain();
            pulseOsc.type = 'triangle';
            pulseOsc.frequency.value = 55;
            pulseGain.gain.setValueAtTime(0.04, now);
            pulseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            pulseOsc.connect(pulseGain);
            pulseGain.connect(audioCtx.destination);
            pulseOsc.start(now);
            pulseOsc.stop(now + 0.1);
        }

        function playSynesthesiaArp() {
            if (!audioCtx) return;
            var now = audioCtx.currentTime;
            var arpNotes = [261.63, 329.63, 392.00, 493.88];
            var freq = arpNotes[gameTick % arpNotes.length];
            var oct = getSynesthesiaOctave();
            freq = freq * Math.pow(2, oct - 4);
            var arpOsc = audioCtx.createOscillator();
            var arpGain = audioCtx.createGain();
            arpOsc.type = 'sine';
            arpOsc.frequency.value = freq;
            arpGain.gain.setValueAtTime(0.06, now);
            arpGain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
            arpOsc.connect(arpGain);
            arpGain.connect(audioCtx.destination);
            arpOsc.start(now);
            arpOsc.stop(now + 0.12);
        }

        function startPad() {
            if (!audioCtx || padActive) return;
            padActive = true;
            padChangeTick = gameTick;
            var now = audioCtx.currentTime;
            padOsc1 = audioCtx.createOscillator();
            padOsc2 = audioCtx.createOscillator();
            padGain = audioCtx.createGain();
            padOsc1.type = 'sine';
            padOsc2.type = 'sine';
            padOsc1.frequency.value = padRootNote;
            padOsc2.frequency.value = padRootNote * 1.005;
            padGain.gain.value = 0.09;
            padOsc1.connect(padGain);
            padOsc2.connect(padGain);
            padGain.connect(audioCtx.destination);
            padOsc1.start(now);
            padOsc2.start(now);
        }

        function stopPad() {
            if (!padActive) return;
            padActive = false;
            try { if (padOsc1) { padOsc1.stop(); padOsc1 = null; } } catch(e) {}
            try { if (padOsc2) { padOsc2.stop(); padOsc2 = null; } } catch(e) {}
            padGain = null;
        }

        function updatePad() {
            if (!synesthesiaMode || muted || !padActive) return;
            if (gameTick - padChangeTick >= 50) {
                padChangeTick = gameTick;
                var regions = [261.63, 293.66, 329.63, 349.23, 392.00];
                var regionIdx = Math.floor((snake[0].y / PLAY_HEIGHT) * regions.length);
                padRootNote = regions[Math.min(regionIdx, regions.length - 1)];
                var now = audioCtx.currentTime;
                if (padOsc1) padOsc1.frequency.linearRampToValueAtTime(padRootNote, now + 0.5);
                if (padOsc2) padOsc2.frequency.linearRampToValueAtTime(padRootNote * 1.005, now + 0.5);
            }
        }

        function startDrone() {
            if (!audioCtx || droneActive) return;
            droneActive = true;
            var now = audioCtx.currentTime;
            droneOsc = audioCtx.createOscillator();
            droneGain = audioCtx.createGain();
            droneOsc.type = 'sawtooth';
            droneOsc.frequency.value = 55;
            droneGain.gain.value = 0;
            droneOsc.connect(droneGain);
            droneGain.connect(audioCtx.destination);
            droneOsc.start(now);
        }

        function stopDrone() {
            if (!droneActive) return;
            droneActive = false;
            try { if (droneOsc) { droneOsc.stop(); droneOsc = null; } } catch(e) {}
            droneGain = null;
        }

        function updateDrone() {
            if (!synesthesiaMode || muted) return;
            if (obstacles.length === 0) {
                stopDrone();
                return;
            }
            var head = snake[0];
            var nearestDist = Infinity;
            for (var i = 0; i < obstacles.length; i++) {
                var dist = Math.abs(head.x - obstacles[i].x) + Math.abs(head.y - obstacles[i].y);
                if (dist < nearestDist) nearestDist = dist;
            }
            var tileDist = nearestDist / TILE_SIZE;
            var now = audioCtx.currentTime;
            if (tileDist <= 3) {
                if (!droneActive) startDrone();
                if (droneGain) droneGain.gain.linearRampToValueAtTime(0.08, now + 0.3);
            } else {
                if (droneActive && droneGain) {
                    droneGain.gain.linearRampToValueAtTime(0, now + 0.5);
                }
            }
        }

        function spawnSynesthesiaRing(x, y, color) {
            for (var i = 0; i < 6; i++) {
                var angle = (Math.PI * 2 / 6) * i;
                particles.push({
                    x: x + TILE_SIZE / 2,
                    y: y + TILE_SIZE / 2,
                    vx: Math.cos(angle) * 3,
                    vy: Math.sin(angle) * 3,
                    life: 1.0,
                    maxLife: 0.4,
                    color: color,
                    size: 3
                });
            }
        }

        function setNextDirection(newDx, newDy) {
            const currentDir = nextDirection ?? { dx, dy };
            if (newDx !== -currentDir.dx || newDy !== -currentDir.dy) {
                nextDirection = { dx: newDx, dy: newDy };
            }
        }

        function spawnParticles(x, y, count, color) {
            count = Math.min(count, 500 - particles.length);
            // v8 C: particle-density slider scales spawn count (after the perf clamp).
            count = Math.round(count * particleDensity / 100);
            if (count <= 0) return;
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x + TILE_SIZE / 2,
                    y: y + TILE_SIZE / 2,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    life: 1.0,
                    maxLife: count > 20 ? 1.0 : 0.5,
                    color: color,
                    size: Math.random() * 3 + 2
                });
            }
        }
        // v9 F: Transient rings — shared visual ring/puff array (hunter dust, bounty burst, power-up shockwave).
        // Drained in animateVisuals with delta time; capped at 50; reset in resetGame/resetWaveState.
        function pushTransientRing(x, y, maxRadius, color, maxLife, type, lineWidth) {
            if (transientRings.length >= 50) transientRings.shift();
            transientRings.push({ x: x, y: y, maxRadius: maxRadius, alpha: 0.8, color: color, life: maxLife, maxLife: maxLife, type: type || 'ring', lineWidth: lineWidth || 2 });
        }

        function animateVisuals(timestamp) {
            if (!lastFrameTime) lastFrameTime = timestamp;
            const delta = Math.min(timestamp - lastFrameTime, 100);
            lastFrameTime = timestamp;
            renderTime = timestamp || performance.now();

            // Update and draw particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.05; // gravity
                p.life -= delta / (p.maxLife * 1000) * (slowMoActive ? 0.5 : 1);
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }

            if (shakeTimer > 0) shakeTimer = Math.max(0, shakeTimer - delta);
            if (eatAnimTimer > 0) eatAnimTimer = Math.max(0, eatAnimTimer - delta);
            if (snapLevelUpFlash > 0) snapLevelUpFlash = Math.max(0, snapLevelUpFlash - delta);

            if (touchIndicatorTimer > 0) touchIndicatorTimer = Math.max(0, touchIndicatorTimer - delta);

            // v6: Floater lifecycle decay
            for (var fi = floaters.length - 1; fi >= 0; fi--) {
                floaters[fi].life -= delta / 1000;
                if (floaters[fi].life <= 0) floaters.splice(fi, 1);
            }
            // --- end v6 ---

            // New obstacle flash timer decay
            for (let i = newObstacleFlash.length - 1; i >= 0; i--) {
                newObstacleFlash[i].timer -= delta;
                if (newObstacleFlash[i].timer <= 0) newObstacleFlash.splice(i, 1);
            }
            if (newObstacleToastTimer > 0) newObstacleToastTimer -= delta;

            // v7: Flash overlay decay — read from queue, not direct write
            if (flashOverlay) {
                flashOverlay.alpha -= delta * 0.004;
                if (flashOverlay.alpha <= 0) flashOverlay = null;
            }

            // v7: Level-up flash — queue to rAF effects instead of direct write
            if (levelUpFlash > 0) {
                levelUpFlash = Math.max(0, levelUpFlash - delta);
                queueRAFEffect('flash', { color: '#FFD700', alpha: Math.min(0.3, levelUpFlash / 5000), priority: 'critical' });
            }

            const elapsed = timestamp - lastTickTime;
            const t = lastTickTime > 0 ? Math.min(elapsed / tickInterval, 1) : 1;

            const needsRedraw = gameState === 'playing' || visualDirty || particles.length > 0 || flashOverlay || hasPendingEffects() || shakeTimer > 0 || eatAnimTimer > 0 || snapLevelUpFlash > 0 || (gameMode === 'snap' && gameState === 'playing');
            if (needsRedraw) {
                visualDirty = false;
                // v8 A: fold the shake into drawGame's base transform instead of a
                // save()/translate()/restore() wrapper (which a setTransform inside
                // drawGame would wipe). shakeOffsetX/Y are read by drawGame's setTransform.
                if (shakeTimer > 0 && gameState !== 'paused') {
                    // v8 B: calm mode kills shake; v8 C: shakeIntensity slider scales it.
                    const intensity = calmModeEffective() ? 0 : (shakeTimer / 200) * 5 * (shakeIntensity / 100);
                    shakeOffsetX = (Math.random() - 0.5) * 2 * intensity;
                    shakeOffsetY = (Math.random() - 0.5) * 2 * intensity;
                } else {
                    shakeOffsetX = 0;
                    shakeOffsetY = 0;
                }
                drawGame(t);
            }

            // Render particles on top of game state
            for (const p of particles) {
                const alpha = Math.max(0, p.life);
                ctx.globalAlpha = alpha;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
            }
            ctx.globalAlpha = 1;

            // v7 D4: snake-decay death fragments — additive glow, tail-to-head via
            // per-fragment delay. MUST restore globalCompositeOperation to 'source-over'
            // after (ctx.restore() handles it). Updated with delta time so the effect
            // is frame-rate independent. Only active right after gameOver().
            if (deathFragmentsActive && deathFragments.length > 0) {
                ctx.save();
                ctx.globalCompositeOperation = 'lighter';
                for (let dfi = deathFragments.length - 1; dfi >= 0; dfi--) {
                    const df = deathFragments[dfi];
                    if (df.delay > 0) { df.delay -= delta; continue; }
                    df.x += df.vx;
                    df.y += df.vy;
                    df.vy += 0.08; // gravity
                    df.life -= delta / 1000;
                    if (df.life <= 0) { deathFragments.splice(dfi, 1); continue; }
                    ctx.globalAlpha = df.life / df.maxLife;
                    ctx.fillStyle = df.color;
                    ctx.shadowBlur = df.size;
                    ctx.shadowColor = df.color;
                    ctx.beginPath();
                    ctx.arc(df.x, df.y, df.size, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore(); // restores globalAlpha, compositeOp, shadowBlur, shadowColor
                if (deathFragments.length === 0) deathFragmentsActive = false;
            }
            // v9 F: Transient rings (hunter dust, bounty burst, power-up shockwave)
            if (transientRings.length > 0) {
                ctx.save();
                for (var tri = transientRings.length - 1; tri >= 0; tri--) {
                    var tr = transientRings[tri];
                    tr.life -= delta;
                    if (tr.life <= 0) { transientRings.splice(tri, 1); continue; }
                    var lifeFrac = tr.life / tr.maxLife;
                    var r = tr.maxRadius * (1 - lifeFrac);
                    var a = lifeFrac * tr.alpha;
                    ctx.globalAlpha = a;
                    ctx.strokeStyle = tr.color;
                    ctx.lineWidth = tr.lineWidth || 2;
                    if (tr.type === 'dust') {
                        ctx.fillStyle = tr.color;
                        ctx.globalAlpha = a * 0.5;
                        ctx.beginPath();
                        ctx.arc(tr.x, tr.y, r * 0.5, 0, 2 * Math.PI);
                        ctx.fill();
                    } else {
                        ctx.beginPath();
                        ctx.arc(tr.x, tr.y, r, 0, 2 * Math.PI);
                        ctx.stroke();
                    }
                }
                ctx.restore();
            }

            // v6: Render floaters on top of particles
            if (floaters.length > 0) drawFloaters(ctx);
            // --- end v6 ---

            // Touch swipe indicator
            if (touchIndicatorTimer > 0) {
                const alpha = Math.min(1, touchIndicatorTimer / 150);
                ctx.save();
                ctx.globalAlpha = alpha * 0.3;
                ctx.fillStyle = '#4488FF';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                ctx.restore();
            }

            // Help overlay — renders on top of everything
            if (helpOverlayVisible) {
                drawHelpOverlay();
            }


            // New obstacle toast
            if (newObstacleToastTimer > 0 && gameState === 'playing') {
                ctx.save();
                ctx.font = '16px Arial';
                ctx.fillStyle = 'rgba(255, 150, 50, ' + Math.min(1, newObstacleToastTimer / 500) + ')';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillText('\u26A0 New obstacles!', CANVAS_WIDTH / 2, 10);
                ctx.restore();
            }
            // v8 F: Bounty countdown ring (read-only — never writes activeBounty).
            if (activeBounty && gameState === 'playing') {
                ctx.save();
                var ringX = CANVAS_WIDTH / 2, ringY = 38, ringR = 14;
                var frac = Math.max(0, activeBounty.ticksLeft / activeBounty.windowTicks);
                // v9 F2: urgency pulse when time is running low (calm-mode: skip oscillation, keep arc)
                var urgencyActive = frac < 0.3 && !calmModeEffective() && !hoardActive;
                var ringR_eff = urgencyActive ? ringR + Math.sin(renderTime * 0.01) * 3 : ringR;
                var ringColor = urgencyActive ? '#FF4444' : (frac > 0.3 ? '#FFD700' : '#FF6B35');
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(ringX, ringY, ringR_eff, 0, 2 * Math.PI);
                ctx.stroke();
                ctx.strokeStyle = ringColor;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(ringX, ringY, ringR_eff, -Math.PI / 2, -Math.PI / 2 + frac * 2 * Math.PI);
                ctx.stroke();
                ctx.font = 'bold 9px Arial';
                ctx.fillStyle = '#FFD700';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('📋', ringX, ringY);
                ctx.font = '9px Arial';
                ctx.fillStyle = '#CCC';
                ctx.fillText(activeBounty.desc, ringX, ringY + ringR + 6);
                ctx.restore();
            }

            // Snap level-up flash
            if (snapLevelUpFlash > 0 && gameMode === 'snap') {
                const alpha = Math.min(1, snapLevelUpFlash / 500);
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = '#FFD700';
                ctx.font = 'bold 24px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.fillText('⚡ LEVEL ' + snapLevel + ' ⚡', CANVAS_WIDTH / 2, CANVAS_HEIGHT - 15);
                ctx.restore();
            }

            // XP level-up flash
            if (levelUpFlash > 0 && level >= 1) {
                const alpha = Math.min(1, levelUpFlash / 500);
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = '#FFD700';
                ctx.font = 'bold 24px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillText('🌟 LEVEL ' + level + '! 🌟', CANVAS_WIDTH / 2, 20);
                ctx.restore();
            }

            // Flash overlay — renders last on top of everything (AGENTS.md)
            // v7: Flash overlay — drain visual queue (merges game-tick and rAF effects)
            const visualFX = drainVisualQueue();
            if (visualFX.flash) {
                ctx.fillStyle = visualFX.flash.color === 'rainbow'
                    ? 'hsl(' + (Date.now() % 2000 / 2000 * 360) + ', 100%, 50%)'
                    : visualFX.flash.color;
                // v8 B: calm mode clamps flash alpha so screen flashes stay subtle.
                var flashAlpha = visualFX.flash.alpha;
                if (calmModeEffective()) flashAlpha = Math.min(flashAlpha, 0.15);
                ctx.globalAlpha = Math.max(0, flashAlpha);
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                ctx.globalAlpha = 1;
            }

            // Animate score
            const scoreDelta = score - displayedScore;
            if (scoreDelta > 1) {
                displayedScore += Math.ceil(scoreDelta * 0.3);
            } else if (scoreDelta > 0) {
                displayedScore = score;
            }
            if (displayedScore !== parseInt(scoreEl.textContent, 10)) {
                scoreEl.textContent = displayedScore;
            }

            const comboEl = comboDisplayEl;
            if (comboEl) {
                const mul = 1 + comboCount * 0.5;
                const comboText = comboCount > 0 ? 'x' + mul.toFixed(1) + ' COMBO!' : '';
                if (comboEl.textContent !== comboText) {
                    comboEl.textContent = comboText;
                }
            }
            const xpEl = xpDisplayEl;
            if (xpEl) {
                if (xpEl.style.display !== 'none') {
                    xpEl.style.display = 'none';
                }
            }

            requestAnimationFrame(animateVisuals);
        }

        function drawObstacles() {
            for (let i = 0; i < obstacles.length; i++) {
                const obs = obstacles[i];
                const flash = newObstacleFlash.find(f => f.x === obs.x && f.y === obs.y);
                if (flash) {
                    const alpha = flash.timer / 1000;
                    ctx.fillStyle = 'rgba(255, 100, 50, ' + (0.5 + alpha * 0.5) + ')';
                    ctx.strokeStyle = 'rgba(255, 150, 100, ' + (0.7 + alpha * 0.3) + ')';
                } else {
                    ctx.fillStyle = '#555';
                    ctx.strokeStyle = '#777';
                }
                ctx.fillRect(obs.x + 1, obs.y + 1, TILE_SIZE - 2, TILE_SIZE - 2);
                ctx.strokeRect(obs.x + 0.5, obs.y + 0.5, TILE_SIZE - 1, TILE_SIZE - 1);
                // High-contrast cross-hatch
                if (highContrast) {
                    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(obs.x + 1, obs.y + 1);
                    ctx.lineTo(obs.x + TILE_SIZE - 2, obs.y + TILE_SIZE - 2);
                    ctx.moveTo(obs.x + TILE_SIZE - 2, obs.y + 1);
                    ctx.lineTo(obs.x + 1, obs.y + TILE_SIZE - 2);
                    ctx.stroke();
                }
            }
        }

        // v7 D1: easeOutBack — overshoot easing for the food spawn "pop". Standard
        // easeOutBack with c1=1.7 / c3=2.7 (rounded). Clamps to 1 once the pop
        // window elapses so idle bob takes over cleanly.
        function easeOutBack(t) {
            return t < 1 ? 1 + 2.7 * Math.pow(t - 1, 3) + 1.7 * Math.pow(t - 1, 2) : 1;
        }

        function drawFood() {
            if (!food) return;
            const tier = FOOD_TIERS[food.type] || FOOD_TIERS.common;
            const cx = food.x + TILE_SIZE / 2;
            const cy = food.y + TILE_SIZE / 2;

            // v7 D1: spawn "pop" (easeOutBack over 250ms) + per-type idle bob.
            // Shapes are drawn around the LOCAL ORIGIN (0,0) below; the transform
            // (translate → scale → rotate) carries them to the tile center so a
            // single scale applies the pop and a single rotate applies the bob.
            // v8 B: calm mode — no spawn pop, no idle bob (shapes stay centered).
            const calm = calmModeEffective();
            const spawnElapsed = performance.now() - (food.spawnTime || 0);
            const spawnScale = calm ? 1 : (spawnElapsed < 250 ? Math.max(0, easeOutBack(spawnElapsed / 250)) : 1);
            var bobX = 0, bobY = 0, bobRot = 0, bobPulse = 1;
            if (!calm) {
                switch (food.type) {
                    case 'common':  bobY = Math.sin(renderTime / 300) * 1.5; break;            // circle: vertical wobble
                    case 'uncommon': bobRot = Math.sin(renderTime / 500) * 0.25; break;         // diamond: slow rotation
                    case 'rare':    bobPulse = 1 + 0.08 * Math.sin(renderTime / 400); break;    // triangle: gentle breathe
                    case 'epic':    bobPulse = 1 + 0.10 * Math.sin(renderTime / 350); break;    // hexagon: pulse
                    case 'speed':   bobX = Math.sin(renderTime / 250) * 2; break;               // chevron: horizontal drift
                    case 'hunter':  bobX = Math.sin(renderTime / 160) * 2.5; bobRot = Math.sin(renderTime / 220) * 0.3; break; // v8 E: nervous fidget
                    // 'bonus' keeps its own internal pulse mechanic (see its case below)
                }
            }

            ctx.save();
            ctx.translate(cx + bobX, cy + bobY);
            ctx.scale(spawnScale * bobPulse, spawnScale * bobPulse);
            ctx.rotate(bobRot);

            if (tier.glow) {
                ctx.shadowBlur = tier.glow;
                ctx.shadowColor = tier.color;
            }

            ctx.fillStyle = tier.color;

            switch (food.type) {
                case 'common': {
                    // Filled circle
                    ctx.beginPath();
                    ctx.arc(0, 0, TILE_SIZE * 0.4, 0, 2 * Math.PI);
                    ctx.fill();
                    break;
                }
                case 'uncommon': {
                    // Diamond shape
                    const s = TILE_SIZE * 0.45;
                    ctx.beginPath();
                    ctx.moveTo(0, -s);
                    ctx.lineTo(s, 0);
                    ctx.lineTo(0, s);
                    ctx.lineTo(-s, 0);
                    ctx.closePath();
                    ctx.fill();
                    break;
                }
                case 'rare': {
                    // Upward-pointing triangle
                    const s = TILE_SIZE * 0.45;
                    ctx.beginPath();
                    ctx.moveTo(0, -s);
                    ctx.lineTo(s, s * 0.7);
                    ctx.lineTo(-s, s * 0.7);
                    ctx.closePath();
                    ctx.fill();
                    break;
                }
                case 'epic': {
                    // Hexagon
                    const r = TILE_SIZE * 0.42;
                    ctx.beginPath();
                    for (let i = 0; i < 6; i++) {
                        const angle = (Math.PI / 3) * i - Math.PI / 2;
                        const px = r * Math.cos(angle);
                        const py = r * Math.sin(angle);
                        if (i === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    }
                    ctx.closePath();
                    ctx.fill();
                    break;
                }
                case 'bonus': {
                    // Pulsing circle (keep existing pulse mechanic)
                    const pulse = 1 + 0.5 * Math.sin(renderTime / 200);
                    const r = Math.min(TILE_SIZE * 0.4 * pulse, TILE_SIZE * 0.6);
                    ctx.beginPath();
                    ctx.arc(0, 0, r, 0, 2 * Math.PI);
                    ctx.fill();
                    break;
                }
                case 'speed': {
                    // Double chevron >>
                    const s = TILE_SIZE * 0.35;
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = tier.color;
                    ctx.beginPath();
                    ctx.moveTo(-s, -s);
                    ctx.lineTo(0, 0);
                    ctx.lineTo(-s, s);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(0, -s);
                    ctx.lineTo(s, 0);
                    ctx.lineTo(0, s);
                    ctx.stroke();
                    break;
                }
                case 'hunter': {
                    // v8 E: paw-print — four small toes around a pad. Drawn at local origin.
                    const r = TILE_SIZE * 0.4;
                    ctx.fillStyle = tier.color;
                    ctx.beginPath();
                    ctx.arc(0, 0, r * 0.55, 0, 2 * Math.PI);
                    ctx.fill();
                    for (var ti = 0; ti < 4; ti++) {
                        var ang = (ti / 4) * Math.PI * 2 + Math.PI / 4;
                        ctx.beginPath();
                        ctx.arc(Math.cos(ang) * r * 0.75, Math.sin(ang) * r * 0.75, r * 0.22, 0, 2 * Math.PI);
                        ctx.fill();
                    }
                    break;
                }
                default: {
                    ctx.fillRect(-TILE_SIZE / 2, -TILE_SIZE / 2, TILE_SIZE, TILE_SIZE);
                    break;
                }
            }

            ctx.restore();

            // Letter labels for non-common types with text outline for contrast
            if (!highContrast) {
                const labels = { uncommon: 'U', rare: 'R', epic: 'E', bonus: 'B', speed: 'S', hunter: 'H' };
                if (labels[food.type]) {
                    ctx.save();
                    ctx.font = 'bold 10px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 2;
                    ctx.strokeText(labels[food.type], cx, cy);
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillText(labels[food.type], cx, cy);
                    ctx.restore();
                }
            } else {
                // High-contrast: universal labels for ALL food types
                const hcLabels = { common: 'C', uncommon: 'U', rare: 'R', epic: 'E', bonus: 'B', speed: 'S', hunter: 'H' };
                ctx.save();
                ctx.font = 'bold 13px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 3;
                ctx.strokeText(hcLabels[food.type] || '?', cx, cy);
                ctx.fillStyle = '#FFFFFF';
                ctx.fillText(hcLabels[food.type] || '?', cx, cy);
                ctx.restore();
            }
            // v6: Echo Brew food2 rendering
            if (food2) {
                ctx.save();
                ctx.globalAlpha = 0.7;
                var f2Tier = FOOD_TIERS[food2.type] || FOOD_TIERS.common;
                // v7 D1: echo food also pops on spawn; v8 B: calm mode skips the pop.
                var f2Elapsed = performance.now() - (food2.spawnTime || 0);
                var f2Scale = calm ? 1 : (f2Elapsed < 250 ? Math.max(0, easeOutBack(f2Elapsed / 250)) : 1);
                var f2cx = food2.x + TILE_SIZE / 2;
                var f2cy = food2.y + TILE_SIZE / 2;
                ctx.fillStyle = f2Tier.color;
                ctx.beginPath();
                ctx.arc(f2cx, f2cy, TILE_SIZE * 0.35 * f2Scale, 0, 2 * Math.PI);
                ctx.fill();
                ctx.fillStyle = '#FFF';
                ctx.font = 'bold 8px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('E', f2cx, f2cy);
                ctx.restore();
            }
        }

        function drawPowerUpPickup() {
            if (!powerUpPickup) return;
            if (powerUpPickup && powerUpDespawnCounter < 20 && Math.floor(renderTime / 100) % 2 === 0) return;
            const config = POWERUP_TYPES[powerUpPickup.type];
            const cx = powerUpPickup.x + TILE_SIZE / 2;
            const cy = powerUpPickup.y + TILE_SIZE / 2;

            ctx.save();
            ctx.shadowBlur = 10;
            ctx.shadowColor = config.color;
            ctx.fillStyle = config.color;
            
            const r = TILE_SIZE * 0.35;
            if (powerUpPickup.type === 'shield') {
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, 2 * Math.PI);
                ctx.fill();
                ctx.fillStyle = '#FFF';
                ctx.font = 'bold 14px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('S', cx, cy);
            } else if (powerUpPickup.type === 'magnet') {
                ctx.beginPath();
                for (let i = 0; i < 4; i++) {
                    const angle = (i * Math.PI / 2) - Math.PI / 2;
                    const outerR = r;
                    const innerR = r * 0.4;
                    ctx.lineTo(cx + Math.cos(angle) * outerR, cy + Math.sin(angle) * outerR);
                    ctx.lineTo(cx + Math.cos(angle + Math.PI / 4) * innerR, cy + Math.sin(angle + Math.PI / 4) * innerR);
                }
                ctx.closePath();
                ctx.fill();
            } else if (powerUpPickup.type === 'slowmo') {
                ctx.beginPath();
                ctx.moveTo(cx, cy - r);
                ctx.lineTo(cx + r, cy);
                ctx.lineTo(cx, cy + r);
                ctx.lineTo(cx - r, cy);
                ctx.closePath();
                ctx.fill();
            }
            
            ctx.restore();
            // v9 D: draw extraFoods[] (portal + hoard foods) at end of drawFood
            for (var efdi = 0; efdi < extraFoods.length; efdi++) {
                drawExtraFood(extraFoods[efdi]);
            }
        }
        // v9 D: draw extraFoods[] (portal + hoard foods) — called from drawFood after primary food/food2
        function drawExtraFood(ef) {
            var cx = ef.x + TILE_SIZE / 2;
            var cy = ef.y + TILE_SIZE / 2;
            var calm = calmModeEffective();
            var spawnElapsed = performance.now() - (ef.spawnTime || 0);
            var spawnScale = calm ? 1 : (spawnElapsed < 250 ? Math.max(0, easeOutBack(spawnElapsed / 250)) : 1);
            // Portal connecting line (prominent, dashed, calm-safe)
            if (ef.type === 'portal' && ef.portalLink) {
                ctx.save();
                ctx.strokeStyle = 'rgba(170,68,255,0.4)';
                ctx.lineWidth = 1.5;
                ctx.setLineDash([4, 4]);
                ctx.beginPath();
                ctx.moveTo(cx, cy);
                ctx.lineTo(ef.portalLink.x + TILE_SIZE / 2, ef.portalLink.y + TILE_SIZE / 2);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.restore();
            }
            ctx.save();
            ctx.translate(cx, cy);
            if (ef.type === 'portal') {
                // Two concentric counter-rotating arcs (distinct from bonus pulse)
                var totalScale = spawnScale;
                ctx.scale(totalScale, totalScale);
                ctx.strokeStyle = '#AA44FF';
                ctx.lineWidth = 2;
                ctx.shadowBlur = 10;
                ctx.shadowColor = '#AA44FF';
                ctx.beginPath();
                ctx.arc(0, 0, TILE_SIZE * 0.35, renderTime * 0.003, renderTime * 0.003 + Math.PI * 1.5);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(0, 0, TILE_SIZE * 0.25, -renderTime * 0.004, -renderTime * 0.004 + Math.PI * 1.5);
                ctx.stroke();
                ctx.shadowBlur = 0;
                // Directional arrow toward the twin
                if (ef.portalLink) {
                    var adx = ef.portalLink.x - ef.x, ady = ef.portalLink.y - ef.y;
                    if (Math.abs(adx) > PLAY_WIDTH / 2) adx = adx > 0 ? adx - PLAY_WIDTH : adx + PLAY_WIDTH;
                    if (Math.abs(ady) > PLAY_HEIGHT / 2) ady = ady > 0 ? ady - PLAY_HEIGHT : ady + PLAY_HEIGHT;
                    var angle = Math.atan2(ady, adx);
                    ctx.rotate(angle);
                    ctx.fillStyle = '#CC88FF';
                    ctx.beginPath();
                    ctx.moveTo(TILE_SIZE * 0.45, 0);
                    ctx.lineTo(TILE_SIZE * 0.3, -3);
                    ctx.lineTo(TILE_SIZE * 0.3, 3);
                    ctx.closePath();
                    ctx.fill();
                    ctx.rotate(-angle);
                }
            } else {
                // Hoard bonus food: reuse the bonus visual (single pulsing circle)
                var pulse = calm ? 1 : (1 + 0.5 * Math.sin(renderTime / 200));
                var totalScale2 = spawnScale * pulse;
                ctx.scale(totalScale2, totalScale2);
                ctx.fillStyle = FOOD_TIERS.bonus.color;
                ctx.shadowBlur = FOOD_TIERS.bonus.glow || 0;
                ctx.shadowColor = FOOD_TIERS.bonus.color;
                ctx.beginPath();
                ctx.arc(0, 0, TILE_SIZE * 0.3, 0, 2 * Math.PI);
                ctx.fill();
                ctx.shadowBlur = 0;
            }
            ctx.restore();
            // Label after restore (wrapped in save/restore per AGENTS.md sub-function leak rule)
            ctx.save();
            ctx.fillStyle = '#FFF';
            ctx.font = 'bold 9px Arial';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            if (ef.type === 'portal') ctx.fillText('P', cx, cy);
            else ctx.fillText('\u2605', cx, cy);
            ctx.restore();
        }

        function drawEyes(drawX, drawY, dx, dy, scleraColor, pupilColor) {
            let ex1, ey1, ex2, ey2;
            if (dx > 0) {
                ex1 = drawX + 12; ey1 = drawY + 4;
                ex2 = drawX + 12; ey2 = drawY + 12;
            } else if (dx < 0) {
                ex1 = drawX + 4; ey1 = drawY + 4;
                ex2 = drawX + 4; ey2 = drawY + 12;
            } else if (dy < 0) {
                ex1 = drawX + 4; ey1 = drawY + 4;
                ex2 = drawX + 12; ey2 = drawY + 4;
            } else {
                ex1 = drawX + 4; ey1 = drawY + 12;
                ex2 = drawX + 12; ey2 = drawY + 12;
            }
            ctx.fillStyle = scleraColor;
            ctx.beginPath(); ctx.arc(ex1, ey1, 4, 0, 2 * Math.PI); ctx.fill();
            ctx.beginPath(); ctx.arc(ex2, ey2, 4, 0, 2 * Math.PI); ctx.fill();
            ctx.fillStyle = pupilColor;
            ctx.beginPath(); ctx.arc(ex1, ey1, 2, 0, 2 * Math.PI); ctx.fill();
            ctx.beginPath(); ctx.arc(ex2, ey2, 2, 0, 2 * Math.PI); ctx.fill();
        }
        // v9 C: Combo Heat Aura — body tint + head halo that warms with comboCount.
        function comboHeatColor(combo) {
            if (combo < 3) return null;
            if (combo < 7) { var t = (combo - 3) / 4; return 'rgba(255,' + Math.round(255 - t * 100) + ',' + Math.round(255 - t * 200) + ',0.15)'; }
            if (combo < 15) { var t2 = (combo - 7) / 8; return 'rgba(255,' + Math.round(155 - t2 * 100) + ',' + Math.round(55 - t2 * 55) + ',0.2)'; }
            return 'rgba(255,55,0,0.25)';
        }

        function drawSnake(t) {
            const skin = SNAKE_SKINS[cosmetics.snake] || SNAKE_SKINS.snake_green;
            // v7: Evolution visual morphs — the current tier governs body shape +
            // glow. Bonuses stack cumulatively, but the visible morph reflects the
            // highest tier reached (slim -> wavy -> thick -> rainbow head). The glow
            // uses the tier color as a halo; the player's chosen skin fill is kept.
            var evoTier = evolutionTier;
            var evo = evoTier >= 0 ? EVOLUTION_TIERS[evoTier] : null;
            var segSize = TILE_SIZE - 1, segPad = 0;        // default body cell
            if (evoTier === 0) { segSize = TILE_SIZE - 2; segPad = 1; }        // Swift: slimmer
            else if (evoTier >= 2) { segSize = TILE_SIZE; segPad = 0; }         // Titan/Apex: thicker (fills cell)
            var evoGlow = evo ? evo.glow : 0;
            var evoGlowColor = evo ? (evo.color === 'rainbow' ? '#FF44FF' : evo.color) : null;
            var evoWavy = (evoTier === 1);                  // Serpentine: sine-wave body
            let headDrawX = 0, headDrawY = 0;
            // v9 C: Combo Heat halo — drawn before the body so the body covers the center.
            // Z-order: halo (bottom) → body+evolution glow → shield aura (top). Alpha capped
            // so it never occludes the evolution glow; dimmed 50% when shield is active.
            if (comboCount >= 3 && snake.length > 0) {
                var comboFrac = Math.min(1, comboCount / 15);
                var haloAlpha = (0.3 + 0.2 * comboFrac) * (shieldActive ? 0.5 : 1);
                var pulseR = calmModeEffective() ? TILE_SIZE * 0.6 : (TILE_SIZE * 0.6 + Math.sin(renderTime * (0.005 + comboFrac * 0.01)) * 3);
                var hcx = snake[0].x + TILE_SIZE / 2;
                var hcy = snake[0].y + TILE_SIZE / 2;
                ctx.save();
                ctx.globalAlpha = haloAlpha;
                var haloColor = comboCount >= 15 ? '#FF4400' : comboCount >= 7 ? '#FF8800' : '#FFCC00';
                var grad = ctx.createRadialGradient(hcx, hcy, 0, hcx, hcy, pulseR);
                grad.addColorStop(0, haloColor);
                grad.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = grad;
                ctx.fillRect(hcx - pulseR, hcy - pulseR, pulseR * 2, pulseR * 2);
                ctx.restore();
            }
            snake.forEach(function(segment, index) {
                let drawX, drawY;
                
                if (t >= 1 || prevSnake.length === 0) {
                    drawX = segment.x;
                    drawY = segment.y;
                } else if (index === 0) {
                    // When the snake just ate (snakeGrew=true), snap the head to its
                    // actual position immediately so the visual matches where eating
                    // effects (particles, floater) and collision occurred. Without
                    // this, the head is interpolated from prevSnake[0] (1 block
                    // behind) while food is already replaced — making eating appear
                    // to trigger "early" and the head "1 block behind."
                    if (snakeGrew) {
                        drawX = segment.x;
                        drawY = segment.y;
                    } else {
                        const prev = prevSnake[0];
                        if (prev) {
                            const pdx = segment.x - prev.x;
                            const pdy = segment.y - prev.y;
                            drawX = Math.abs(pdx) > PLAY_WIDTH / 2 ? segment.x : prev.x + pdx * t;
                            drawY = Math.abs(pdy) > PLAY_HEIGHT / 2 ? segment.y : prev.y + pdy * t;
                        } else {
                            drawX = segment.x;
                            drawY = segment.y;
                        }
                    }
                } else if (snakeGrew && prevSnake[index - 1]) {
                    const prev = prevSnake[index - 1];
                    const pdx = segment.x - prev.x;
                    const pdy = segment.y - prev.y;
                    drawX = Math.abs(pdx) > PLAY_WIDTH / 2 ? segment.x : prev.x + pdx * t;
                    drawY = Math.abs(pdy) > PLAY_HEIGHT / 2 ? segment.y : prev.y + pdy * t;
                } else if (index > 0 && prevSnake[index - 1]) {
                    const pdx = segment.x - prevSnake[index - 1].x;
                    const pdy = segment.y - prevSnake[index - 1].y;
                    drawX = Math.abs(pdx) > PLAY_WIDTH / 2 ? segment.x : prevSnake[index - 1].x + pdx * t;
                    drawY = Math.abs(pdy) > PLAY_HEIGHT / 2 ? segment.y : prevSnake[index - 1].y + pdy * t;
                } else {
                    drawX = segment.x;
                    drawY = segment.y;
                }
                
                if (index === 0) {
                    headDrawX = drawX;
                    headDrawY = drawY;
                }
                
                // v7: evolution glow (shadow) — Serpentine glows head only; Titan/Apex
                // glow every segment. Set before the fill, reset right after so the
                // outline and eyes stay crisp (per canvas save/restore discipline).
                if (evoGlow > 0 && (evoTier >= 2 || index === 0)) {
                    ctx.shadowBlur = evoGlow;
                    ctx.shadowColor = evoGlowColor;
                }
                if (evoTier >= 3 && index === 0) {
                    // v7: Apex — rainbow head cycling with renderTime
                    ctx.fillStyle = 'hsl(' + ((renderTime * 0.2) % 360) + ', 100%, 55%)';
                } else if (skin.head === 'ghost') {
                    ctx.globalAlpha = 0.5;
                    ctx.fillStyle = index === 0 ? 'rgba(200, 200, 255, 0.7)' : 'rgba(150, 150, 255, 0.4)';
                } else if (skin.head === 'rainbow') {
                    const hue = (index * 20 + renderTime * 0.05) % 360;
                    ctx.fillStyle = 'hsl(' + hue + ', 100%, 50%)';
                } else {
                    ctx.fillStyle = index === 0 ? skin.head : skin.body;
                }
                // v7: Serpentine — subtle vertical sine-wave bob on body segments
                var wavyY = (evoWavy && index > 0) ? Math.round(Math.sin(index * 0.6 + renderTime * 0.008) * 2) : 0;
                if (index === 0 && eatAnimTimer > 0) {
                    const scale = 1 + 0.2 * (eatAnimTimer / 150);
                    const size = Math.round(segSize * scale);
                    const offset = Math.round((segSize - size) / 2);
                    ctx.fillRect(drawX + segPad + offset, drawY + segPad + offset, size, size);
                } else {
                    ctx.fillRect(drawX + segPad, drawY + segPad + wavyY, segSize, segSize);
                }
                // v9 C: Combo Heat body tint — semi-transparent overlay warming with comboCount
                var heatColor = comboHeatColor(comboCount);
                if (heatColor && index > 0) {
                    ctx.fillStyle = heatColor;
                    ctx.fillRect(drawX + segPad, drawY + segPad + wavyY, segSize, segSize);
                }
                if (evoGlow > 0) ctx.shadowBlur = 0;
                if (skin.head === 'ghost') {
                    ctx.globalAlpha = 1;
                }

                // High-contrast snake outline
                if (highContrast && !(skin.head === 'ghost')) {
                    ctx.strokeStyle = '#FFFFFF';
                    ctx.lineWidth = 1.5;
                    ctx.strokeRect(drawX + segPad, drawY + segPad + wavyY, segSize, segSize);
                }

                if (index === 0) {
                    drawEyes(drawX, drawY, dx, dy, 'white', 'black');
                }
            });

            // Snap mode timer ring around head
            if (gameMode === 'snap' && gameState === 'playing' && snake.length > 0) {
                const cx = headDrawX + TILE_SIZE / 2;
                const cy = headDrawY + TILE_SIZE / 2;
                const radius = TILE_SIZE * 0.8;
                const fraction = Math.min(shrinkTimer, snapDuration) / snapDuration;

                let ringColor;
                if (fraction > 0.5) ringColor = '#44FF44';
                else if (fraction > 0.25) ringColor = '#FFAA00';
                else ringColor = '#FF4444';

                ctx.strokeStyle = ringColor;
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(cx, cy, radius, -Math.PI / 2, -Math.PI / 2 + fraction * 2 * Math.PI);
                ctx.stroke();

                // Text label for accessibility
                ctx.fillStyle = ringColor;
                ctx.font = 'bold 9px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillText('SNAP ' + Math.round(fraction * 100) + '%', cx, cy + radius + 3);
            }

            // Shield aura around head
            if (shieldActive && snake.length > 0) {
                ctx.save();
                ctx.strokeStyle = '#4488FF';
                ctx.lineWidth = 2;
                ctx.shadowBlur = 8;
                ctx.shadowColor = '#4488FF';
                ctx.globalAlpha = 0.6;
                ctx.beginPath();
                ctx.arc(headDrawX + TILE_SIZE / 2, headDrawY + TILE_SIZE / 2, TILE_SIZE * 0.7, 0, 2 * Math.PI);
                ctx.stroke();
                ctx.restore();
            }
        }

        function drawRival(t) {
            for (var ri = 0; ri < rivals.length; ri++) {
                var r = rivals[ri];
                if (!r.active || r.snake.length === 0) continue;
                ctx.save();
                for (var rj = 0; rj < r.snake.length; rj++) {
                    ctx.fillStyle = rj === 0 ? '#FF6666' : r.color;
                    ctx.fillRect(r.snake[rj].x + 1, r.snake[rj].y + 1, TILE_SIZE - 2, TILE_SIZE - 2);
                }
                ctx.restore();
            }
        }

        function drawTrails() {
            const config = TRAIL_RENDER_CONFIG[cosmetics.trace];
            if (!config || snake.length < 4) return;
            const skin = SNAKE_SKINS[cosmetics.snake] || SNAKE_SKINS.snake_green;
            for (let t = 0; t < 3; t++) {
                const idx = snake.length - 1 - t;
                if (idx < 0) break;
                const seg = snake[idx];
                ctx.globalAlpha = config.alphaStart - t * config.alphaDecay;
                ctx.fillStyle = config.color(idx, skin);
                ctx.fillRect(seg.x, seg.y, TILE_SIZE - 1, TILE_SIZE - 1);
            }
            ctx.globalAlpha = 1;
        }

        function drawMuteIndicator() {
            if (muted) {
                ctx.fillStyle = '#888';
                ctx.font = hudFont(16);
                ctx.textAlign = 'right';
                ctx.textBaseline = 'top';
                ctx.fillText('🔇', CANVAS_WIDTH - 8, 8);
            }
            if (highContrast) {
                ctx.fillStyle = 'rgba(255,255,255,0.5)';
                ctx.font = hudFont(11);
                ctx.textAlign = 'right';
                ctx.textBaseline = 'bottom';
                ctx.fillText('HC', CANVAS_WIDTH - 8, CANVAS_HEIGHT - 4);
            }
            if (ghostEnabled && activeSeed !== null && getBestReplay(gameMode) !== null) {
                ctx.fillStyle = 'rgba(100,200,255,0.5)';
                ctx.font = hudFont(11);
                ctx.textAlign = 'right';
                ctx.textBaseline = 'bottom';
                ctx.fillText('👻', CANVAS_WIDTH - 8 - (highContrast ? 24 : 0), CANVAS_HEIGHT - 4);
            }
        }

        function drawXPBar() {
            if (level < 20) {
                updateXpCache();
                const xpInLevel = xp - cachedXpForPrevLevel;
                const xpNeeded = cachedXpForThisLevel - cachedXpForPrevLevel;
                const progress = xpInLevel / xpNeeded;
                
                const barX = 5;
                const barY = CANVAS_HEIGHT - 22;
                const barWidth = 120;
                const barHeight = 12;
                
                if (prestigeLevel > 0) {
                    ctx.fillStyle = '#FFD700';
                    ctx.font = 'bold 8px Arial';
                    ctx.textAlign = 'right';
                    ctx.textBaseline = 'bottom';
                    ctx.fillText('P' + prestigeLevel, barX + barWidth - 2, barY - 2);
                }
                
                ctx.fillStyle = 'rgba(0,0,0,0.5)';
                ctx.fillRect(barX - 2, barY - 2, barWidth + 4, barHeight + 4);
                
                ctx.fillStyle = 'rgba(255,215,0,0.3)';
                ctx.fillRect(barX, barY, barWidth * Math.min(progress, 1), barHeight);
                
                ctx.strokeStyle = 'rgba(255,215,0,0.5)';
                ctx.lineWidth = 1;
                ctx.strokeRect(barX, barY, barWidth, barHeight);
                
                ctx.fillStyle = '#FFD700';
                ctx.font = hudFont(9);
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('Lv.' + level + ' ' + xpInLevel + '/' + xpNeeded, barX + barWidth/2, barY + barHeight/2);
            }
        }

        function drawPrestigeBorder() {
            if (cosmetics.border && cosmetics.border !== 'border_none') {
                const borderConfig = BORDER_EFFECTS[cosmetics.border];
                if (borderConfig) {
                    if (cosmetics.border === 'border_gold') {
                        ctx.save();
                        ctx.strokeStyle = '#FFD700';
                        ctx.lineWidth = 3;
                        ctx.shadowBlur = 8;
                        ctx.shadowColor = '#FFD700';
                        ctx.strokeRect(1.5, 1.5, CANVAS_WIDTH - 3, CANVAS_HEIGHT - 3);
                        ctx.restore();
                    }
                }
            }
        }

        // v7 D3: post-processing — always-on vignette + slow-mo tint + death
        // vignette crush. Uses source-over (NOT multiply — multiply is not a valid
        // Canvas 2D composite op). Called as the LAST thing in drawGame(), before
        // the flash overlay (which renders in animateVisuals). The center stays
        // transparent so HUD/overlay text remains readable.
        function drawPostFX() {
            ctx.save();
            // Always-on vignette — transparent center → 0.15 black at edges
            var vig = ctx.createRadialGradient(
                CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2, CANVAS_WIDTH * 0.4,
                CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2, CANVAS_WIDTH * 0.75);
            vig.addColorStop(0, 'rgba(0,0,0,0)');
            vig.addColorStop(1, 'rgba(0,0,0,0.15)');
            ctx.fillStyle = vig;
            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            // Slow-mo tint — replaces the old flat drawSlowMoTint()
            if (slowMoActive) {
                ctx.fillStyle = 'rgba(80,0,120,0.08)';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            }
            // v9 E: Golden Hoard tint
            if (hoardActive) {
                ctx.fillStyle = calmModeEffective() ? 'rgba(255, 215, 0, 0.03)' : 'rgba(255, 215, 0, 0.06)';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            }
            // Death vignette crush — intensifies as shakeTimer winds down
            if (gameState === 'gameover' && shakeTimer > 0) {
                var deathAlpha = (1 - shakeTimer / 200) * 0.3;
                var dv = ctx.createRadialGradient(
                    CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2, 50,
                    CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2, CANVAS_WIDTH * 0.6);
                dv.addColorStop(0, 'rgba(0,0,0,0)');
                dv.addColorStop(1, 'rgba(60,0,0,' + deathAlpha + ')');
                ctx.fillStyle = dv;
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            }
            ctx.restore();
        }

        function drawTimeAttackHUD() {
            if (gameMode === 'timeAttack' && gameState === 'playing' && timeAttackEnd > 0) {
                const remaining = Math.max(0, Math.ceil((timeAttackEnd - Date.now()) / 1000));
                ctx.fillStyle = remaining <= 10 ? '#FF4444' : '#FFD700';
                ctx.font = hudFont(18);
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillText('TIME: ' + remaining + 's', CANVAS_WIDTH / 2, 5);
            }
        }

        function drawSnapHUD() {
            if (gameMode === 'snap' && gameState === 'playing') {
                const fraction = Math.min(shrinkTimer, snapDuration) / snapDuration;
                ctx.fillStyle = fraction > 0.5 ? '#44FF44' : fraction > 0.25 ? '#FFAA00' : '#FF4444';
                ctx.font = hudFont(14);
                ctx.textAlign = 'right';
                ctx.textBaseline = 'top';
                ctx.fillText('SNAP LV.' + snapLevel, CANVAS_WIDTH - 5, 5);

                const barWidth = 80;
                const barHeight = 6;
                const barX = CANVAS_WIDTH - 10 - barWidth;
                const barY = 22;
                ctx.fillStyle = 'rgba(255,255,255,0.15)';
                ctx.fillRect(barX, barY, barWidth, barHeight);
                ctx.fillStyle = fraction > 0.5 ? '#44FF44' : fraction > 0.25 ? '#FFAA00' : '#FF4444';
                ctx.fillRect(barX, barY, barWidth * fraction, barHeight);

        }

        function drawDailyHUD() {
            if (gameMode === 'daily' && gameState === 'playing') {
                const seed = getDailySeed();
                const challenge = DAILY_CHALLENGES[seed % DAILY_CHALLENGES.length];
                const progress = getDailyProgress(challenge);
                ctx.fillStyle = '#FFD700';
                ctx.font = hudFont(11);
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillText('\uD83C\uDFAF ' + challenge.desc, CANVAS_WIDTH / 2, 2);
                if (challenge.progressTarget) {
                    const fraction = Math.min(progress / challenge.progressTarget, 1);
                    ctx.fillStyle = fraction >= 1 ? '#4CAF50' : '#AAA';
                    ctx.font = hudFont(10);
                    ctx.fillText('Progress: ' + Math.min(progress, challenge.progressTarget) + '/' + challenge.progressTarget, CANVAS_WIDTH / 2, 18);
                }
            }

        function drawPowerUpHUD() {
            if (powerUpType) {
                const config = POWERUP_TYPES[powerUpType];
                const timerDuration = POWERUP_TYPES[powerUpType].duration;
                const fraction = Math.max(0, powerUpTimer / timerDuration);
                // Flicker when about to expire
                if (powerUpTimer > 0 && powerUpTimer < 2000 && Math.floor(renderTime / 80) % 2 === 0) return;
                const barX = 5;
                const barY = 5;
                const barWidth = 100;

                ctx.fillStyle = 'rgba(0,0,0,0.5)';

                ctx.fillStyle = config.color;
                ctx.globalAlpha = 0.3;
                ctx.fillRect(barX, barY, barWidth * fraction, barHeight);
                ctx.globalAlpha = 1;
                
                ctx.fillStyle = '#FFF';
                ctx.font = hudFont(11);
                ctx.textAlign = 'left';

        function drawRivalHUD() {
            if (rivals.length === 0) return;
            var rivalLen = 0;
            for (var ri = 0; ri < rivals.length; ri++) {
                if (rivals[ri].active) rivalLen = Math.max(rivalLen, rivals[ri].snake.length);
            }
            if (rivalLen === 0) return;
            ctx.save();
            ctx.fillStyle = '#FF8888';
            ctx.font = hudFont(10);
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText('Rival: ' + rivalLen, 5, 40);
            ctx.restore();

        function drawPaintGrid() {
            if (gameMode !== 'painter' || !paintGrid) return;
            var cols = PLAY_WIDTH / TILE_SIZE;
            var rows = PLAY_HEIGHT / TILE_SIZE;
            var now = Date.now();
            ctx.save();
            for (var c = 0; c < cols; c++) {
                for (var r = 0; r < rows; r++) {
                    var tile = paintGrid[c][r];
                    if (!tile) continue;
                    var age = now - tile.timestamp;
                    var flashAlpha = age < 500 ? 0.15 : 0;
                    ctx.globalAlpha = 0.85 + flashAlpha;
                    ctx.shadowBlur = 6;
                    ctx.shadowColor = tile.color;
                    ctx.fillStyle = tile.color;
                    ctx.fillRect(c * TILE_SIZE, r * TILE_SIZE, TILE_SIZE, TILE_SIZE);
                }
            }
            ctx.shadowBlur = 0;
            ctx.shadowColor = 'transparent';
            ctx.globalAlpha = 1;
            ctx.restore();
        }

            ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';

            ctx.textBaseline = 'middle';

        }

        function generateObstaclesForWave(wave) {
            if (wave.obstacles === 0) return;
            var headX = 10 * TILE_SIZE;
            var headY = 10 * TILE_SIZE;
            for (var i = 0; i < wave.obstacles; i++) {
                var tile = findFreeTile(headX, headY);
                if (tile) obstacles.push(tile);
            }
        }

        function applyGauntletPicks() {
            for (var i = 0; i < gauntletPicks.length; i++) {
                var pick = gauntletPicks[i];
                switch (pick.id) {
                    case 'extra_length':
                        for (var j = 0; j < 5; j++) {
                            snake.push({ x: snake[0].x, y: snake[0].y });
                        }
                        break;
                    case 'wave_shield':
                        shieldActive = true;
                        powerUpTimer = 6000;
                        powerUpType = 'shield';
                        break;
                    case 'slow_pace':
                        tickInterval = Math.floor(tickInterval * 1.2);
                        break;
                }
            }
        }

        function resetWaveState() {
            var wave = GAUNTLET_WAVES[gauntletWave];
            snake = [{ x: 10 * TILE_SIZE, y: 10 * TILE_SIZE }];
            dx = TILE_SIZE;
            dy = 0;
            nextDirection = null;
            food = null;
            extraFoods = []; // v9 D: clear portal + hoard foods per wave
            transientRings = []; // v9 F: clear visual rings per wave
            score = 0;
            gauntletWaveScore = 0;
            displayedScore = 0;
            sessionFoodEaten = 0;
            sessionFoodTypes = new Set();
            sessionSpeedFood = 0;
            sessionBonusFood = 0;
            comboCount = 0;
            lastEatTime = 0;
            lastComboMilestone = 0;
            evolutionTier = -1;
            obstaclePassUsed = false;
            // v8 F: clear bounty state per gauntlet wave.
            activeBounty = null;
            bountyTickCounter = 0;
            var hasComboSave = false;
            for (var cp = 0; cp < gauntletPicks.length; cp++) {
                if (gauntletPicks[cp].id === 'combo_save') hasComboSave = true;
            }
            if (!hasComboSave) sessionMaxCombo = 0;
            gameTick = 0;
            particles = [];
            deathFragments = [];
            deathFragmentsActive = false;
            flashOverlay = null;
            gameEffects.length = 0;
            rAFEffects.length = 0;
            shakeTimer = 0;
            eatAnimTimer = 0;
            touchIndicatorTimer = 0;
            speedBoostCounter = 0;
            shieldActive = false;
            magnetActive = false;
            slowMoActive = false;
            powerUpTimer = 0;
            powerUpType = null;
            powerUpPickup = null;
            powerUpSpawnCounter = 0;
            powerUpDespawnCounter = 0;
            rivals = [];
            obstacles = [];
            generateObstaclesForWave(wave);
            applyGauntletPicks();
            var combined = snake.concat(rivalCombinedSnake());
            food = generateFood(combined);
            tickInterval = wave.speedBase;
        }

        function completeGauntletWave() {
            gauntletWaveScore = score;
            gauntletScore += score;
            gauntletMasteryPoints++;

        function pickRandomGauntletPicks(count) {

                var pick = pool[idx];
                var dup = false;
                for (var pi = 0; pi < options.length; pi++) {
                    if (options[pi].id === pick.id) { dup = true; break; }
                }
                if (!dup) options.push(pick);
                safety++;
            }
            return options;

        function shuffleFoodWeights() {
            // v8 E: exclude hunter in Walled (wrap:false) so chaos_seed never puts it

            var keys = Object.keys(FOOD_TIERS).filter(function(k) { return !(MODE_CONFIG[gameMode].wrap === false && k === 'hunter'); });

            var total = weights.reduce(function(a,b) { return a+b; }, 0);
            var result = {};
            for (var i = 0; i < keys.length; i++) {
                result[keys[i]] = weights[i] / total;
            }
            return result;

                function drawGame(t) {

                ctx.fillRect(0, 0, PLAY_WIDTH, PLAY_HEIGHT);

        function updateGame() {
            if (gameState !== 'playing') return;
            // v8 F: Bounty Rush — tick/resolve contracts (game-logic only).
            tickBounty();
            // v9 E: Golden Hoard event — tick-counted, game-logic only, no session-end hook.
            if (MODE_CONFIG[gameMode].hoardEnabled) {
                if (!hoardActive) {
                    hoardTickCounter++;
                    if (hoardTickCounter >= HOARD_INTERVAL && gameState === 'playing') activateHoard();
                } else {
                    hoardTimer--;
                    if (hoardTimer <= 0) endHoard();
                }
            }

            // v6: extracted functions (declared here for closure over updateGame's locals)
            function handleComboMilestone() {
                if (COMBO_MILESTONES.includes(comboCount) && comboCount > lastComboMilestone) {
                    lastComboMilestone = comboCount;
                    var color = COMBO_FLASH_COLORS[comboCount] || '#44BB44';
                    var alpha = comboCount >= 20 ? 0.5 : comboCount >= 10 ? 0.4 : 0.3;
                    if (!flashOverlay || flashOverlay.priority !== 'critical') {
                        flashOverlay = { color: color, alpha: alpha, priority: comboCount >= 10 ? 'high' : 'normal' };
                        queueGameEffect('flash', { color: color, alpha: alpha, priority: comboCount >= 10 ? 'high' : 'normal' });
                    }
                    if (comboCount >= 10) {
                        shakeTimer = Math.min(300, 100 + comboCount * 5);
                    }
                    vibrate(30);
                    playSound('combo_milestone');
                    srSpeak('Combo ' + comboCount + '!');
                    // v6: Combustion Brew — each combo milestone adds +1 mult
                    if (activeBrews.indexOf('combustion') !== -1) {
                        brewUsageFlags.combustionAccum++;
                        brewUsageFlags.combRemaining += 3;
                    }
                    // v6: combo floater
                    if (comboCount >= 50) spawnFloater(PLAY_MARGIN_LEFT + PLAY_WIDTH / 2, PLAY_MARGIN_TOP + PLAY_HEIGHT / 2, 'COMBO x50!', '#FF0000', 42, 2.0);
                    else if (comboCount >= 20) spawnFloater(PLAY_MARGIN_LEFT + PLAY_WIDTH / 2, PLAY_MARGIN_TOP + PLAY_HEIGHT / 2, 'COMBO x20!', '#FFAA00', 38, 2.0);
                    else if (comboCount >= 10) spawnFloater(PLAY_MARGIN_LEFT + PLAY_WIDTH / 2, PLAY_MARGIN_TOP + PLAY_HEIGHT / 2, 'COMBO x10!', '#FF44FF', 34, 1.8);
                    else if (comboCount >= 5) spawnFloater(PLAY_MARGIN_LEFT + PLAY_WIDTH / 2, PLAY_MARGIN_TOP + PLAY_HEIGHT / 2, 'COMBO x5!', '#44FF44', 30, 1.5);
                    else spawnFloater(PLAY_MARGIN_LEFT + PLAY_WIDTH / 2, PLAY_MARGIN_TOP + PLAY_HEIGHT / 2, 'COMBO x3!', '#44CCFF', 28, 1.5);
                    // --- end v6 ---
                }
            }
            // --- end v6 extraction ---

            // Zen mode: score = snake length
            if (gameMode === 'zen') {
                score = snake.length;
            }
            // Painter mode: score = coverage %
            if (gameMode === 'painter' && paintTotalTiles > 0) {
                var coveragePct = Math.floor((paintCoveredCount / paintTotalTiles) * 100);
                score = coveragePct;
                if (paintLayers > 1) {
                    score = coveragePct + ((paintLayers - 1) * 100);
                }
            }

            // Gauntlet mode: wave objective checking
            if (gameMode === 'gauntlet') {
                if (gauntletIntermission) return;
                var wave = GAUNTLET_WAVES[gauntletWave];
                if (wave.objective === 'survive' && gameTick >= wave.duration) {
                    completeGauntletWave();
                    return;
                } else if (wave.objective === 'eat' && sessionFoodEaten >= wave.target) {
                    completeGauntletWave();
                    return;
                } else if (wave.objective === 'combo' && comboCount >= wave.target) {
                    completeGauntletWave();
                    return;
                } else if (wave.objective === 'score' && score >= wave.target) {
                    completeGauntletWave();
                    return;
                }
            }

            // === MUTATOR LOGIC ===
            if (activeMutators.indexOf('gravity') !== -1 && dy !== -TILE_SIZE && dy !== TILE_SIZE) {
                dx = 0;
                dy = TILE_SIZE;
            }

            var skipSelfCollision = false;
            if (activeMutators.indexOf('phase_shift') !== -1 && gameTick % 5 === 0) {
                skipSelfCollision = true;
            }

            if (activeMutators.indexOf('hunger_clock') !== -1) {
                if (!hungerStarted && sessionFoodEaten > 0) {
                    hungerStarted = true;
                    hungerTickCounter = 0;

                if (hungerStarted) {
                    hungerTickCounter++;
                    if (hungerTickCounter > 0 && hungerTickCounter % 50 === 0) {
                        if (snake.length > 1) {
