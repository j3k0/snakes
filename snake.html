<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Snake Game</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #222;
            font-family: Arial, sans-serif;
            color: white;
            overflow: hidden;
        }
        h1 {
            margin-bottom: 10px;
        }
        #gameCanvas {
            border: 2px solid #333;
            background-color: #111;
            display: block;
            max-width: 100%;
            height: auto;
            aspect-ratio: 440 / 600;
            touch-action: none;
        }
        #score {
            font-size: 1.5em;
        }
        #highScore {
            font-size: 1em;
            color: #aaa;
            margin-bottom: 10px;
        }
        @media (max-width: 480px) {
          body { padding: 5px; box-sizing: border-box; }
          #gameCanvas { max-width: 100%; }
          .dpad-btn { width: 56px; height: 56px; font-size: 24px; }
        }
        @media (pointer: coarse) {
          #dpad { display: flex !important; justify-content: center; }
        }
        #menuFooter {
            display: none;
            margin-top: 4px;
            text-align: center;
            user-select: none;
            line-height: 1.5;
            font-family: Arial, sans-serif;
            max-width: 440px;
        }
        .prestige-gold { color: #FFD700; font-weight: bold; font-size: 14px; }
        .prestige-purple { color: #AA44FF; font-weight: bold; font-size: 13px; }
        .prestige-gray { color: #888; font-size: 14px; }
        .shortcut-dim { color: #555; font-size: 13px; }
        @media (pointer: coarse) {
            #menuFooter { font-size: 12px; line-height: 1.3; max-width: calc(100vw - 20px); }
        }
    </style>
</head>
<body>
    <h1>Snake Game</h1>
    <canvas id="gameCanvas" width="440" height="600" role="img" aria-label="Snake game board"></canvas>
    <div id="menuFooter">
      <div id="prestigeInfo"></div>
      <div id="shortcutInfo"></div>
    </div>
    <div id="dpad" style="display:none;margin-top:10px;touch-action:manipulation;user-select:none;-webkit-user-select:none;">
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
        <button class="dpad-btn" data-key="ArrowUp" aria-label="Up" style="width:56px;height:56px;font-size:24px;background:#333;color:white;border:2px solid #555;border-radius:8px;cursor:pointer;touch-action:manipulation;">▲</button>
        <div style="display:flex;gap:48px;">
          <button class="dpad-btn" data-key="ArrowLeft" aria-label="Left" style="width:56px;height:56px;font-size:24px;background:#333;color:white;border:2px solid #555;border-radius:8px;cursor:pointer;touch-action:manipulation;">◀</button>
          <button class="dpad-btn" data-key="ArrowDown" aria-label="Down" style="width:56px;height:56px;font-size:24px;background:#333;color:white;border:2px solid #555;border-radius:8px;cursor:pointer;touch-action:manipulation;">▼</button>
          <button class="dpad-btn" data-key="ArrowRight" aria-label="Right" style="width:56px;height:56px;font-size:24px;background:#333;color:white;border:2px solid #555;border-radius:8px;cursor:pointer;touch-action:manipulation;">▶</button>
        </div>
        <button class="dpad-btn" data-key=" " aria-label="Pause" style="width:56px;height:56px;font-size:18px;background:#333;color:white;border:2px solid #555;border-radius:8px;cursor:pointer;touch-action:manipulation;margin-top:4px;">⏸</button>
      </div>
    </div>
    <p>Score: <span id="score">0</span></p>
    <p id="highScore">Best: 0</p>
        <div id="xpDisplay" style="color:#aaa;font-size:0.9em;"></div>
        <div id="seedContainer" style="margin-top:6px;display:flex;align-items:center;gap:6px;justify-content:center;font-size:12px;">
            <input type="text" id="seedField" placeholder="Seed..." style="width:120px;padding:3px 6px;background:#222;color:white;border:1px solid #555;border-radius:4px;font-family:monospace;font-size:12px;">
            <button id="seedRandomBtn" style="padding:3px 8px;background:#333;color:white;border:1px solid #555;border-radius:4px;cursor:pointer;font-size:11px;">🎲</button>
            <button id="seedClearBtn" style="padding:3px 8px;background:#333;color:#aaa;border:1px solid #555;border-radius:4px;cursor:pointer;font-size:11px;">✕</button>
        </div>
        <div id="comboDisplay" style="color:#FFD700;font-size:1.2em;min-height:1.5em;"></div>
        <div id="toast" style="display:none;position:fixed;top:max(20px, env(safe-area-inset-top, 0px));left:50%;transform:translateX(-50%);color:#FFD700;font-size:24px;font-weight:bold;text-shadow:2px 2px 4px rgba(0,0,0,0.8);z-index:1000;pointer-events:none;text-align:center;"></div>
        <div id="statsPanel" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.95);border:2px solid #555;border-radius:10px;padding:20px;color:white;font-family:monospace;z-index:100;min-width:300px;max-width:400px;max-height:70vh;overflow-y:auto;"></div>
        <div id="achievementsPanel" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.96);border:2px solid #FFD700;border-radius:12px;padding:20px;color:white;font-family:sans-serif;z-index:100;min-width:350px;max-width:480px;"></div>
        <div id="cosmeticsPanel" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.96);border:2px solid #9B59B6;border-radius:12px;padding:20px;color:white;font-family:sans-serif;z-index:100;min-width:320px;"></div>
        <div id="panelBackdrop" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:99;touch-action:manipulation;"></div>
        <!-- v6: Screen reader live region -->
        <div id="srAnnounce" aria-live="polite" aria-atomic="true" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;"></div>
        <!-- v6 styles for new panels -->
        <style>
            .brews-grid { display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0; }
            .brew-card { padding:8px;border-radius:8px;cursor:pointer;text-align:center;transition:all .15s; }
            .brew-card.unlocked { background:rgba(68,255,136,0.1);border:1px solid rgba(68,255,136,0.3); }
            .brew-card.locked { background:rgba(68,68,68,0.3);border:1px solid rgba(68,68,68,0.3); }
            .brew-card.equipped { border-color:#4488FF;box-shadow:0 0 8px rgba(68,136,255,0.5); }
            .brew-name { font-weight:bold;font-size:13px; }
            .brew-desc { font-size:11px;color:#AAA;margin:4px 0; }
            .brew-cost { font-size:10px;color:#888; }
            .diary-entry { padding:6px;border-bottom:1px solid #333;cursor:pointer; }
            .diary-entry:hover { background:rgba(255,255,255,0.05); }
            .diary-summary { display:flex;justify-content:space-between;align-items:center; }
            .diary-mode { font-weight:bold;font-size:12px; }
            .diary-score { font-size:14px;color:#FFD700; }
            .diary-time { font-size:11px;color:#AAA; }
            .diary-date { font-size:11px;color:#666; }
            .diary-detail { margin-top:6px;padding:8px;background:rgba(0,0,0,0.3);border-radius:4px; }
            .diary-stats { display:grid;grid-template-columns:repeat(2,1fr);gap:4px;font-size:11px;color:#CCC; }
            .diary-delete { margin-top:8px;padding:4px 10px;background:#C03;color:white;border:none;border-radius:4px;cursor:pointer;font-size:10px; }
            .panel-subtitle { text-align:center;font-size:12px;color:#AAA;margin:4px 0 12px 0; }
            #diaryFilter { text-align:center;margin:8px 0; }
            #diaryFilter select { background:#222;color:white;border:1px solid #555;padding:4px 8px;border-radius:4px;font-size:11px; }
            @media (display-mode: standalone) { #dpad { padding-bottom:max(8px, env(safe-area-inset-bottom)); } }
        </style>

    <script>
        const TILE_SIZE = 20;
        const CANVAS_WIDTH = 440;
        const CANVAS_HEIGHT = 600;
        const PLAY_WIDTH = 400;
        const PLAY_HEIGHT = 400;
        const PLAY_MARGIN_LEFT = 20;
        const PLAY_MARGIN_TOP = 50;
        const BASE_SPEED = 120;
        const MIN_SPEED = 50;
        const MAX_OBSTACLE_PERCENT = 0.20;
        const OBSTACLE_SPAWN_INTERVAL = 200;

        function ensureGridCache() {
            const theme = GRID_THEMES[cosmetics.grid] || GRID_THEMES.grid_classic;
            const cacheKey = cosmetics.grid + (highContrast ? '_hc' : '');
            if (gridCacheCanvas && gridCacheTheme === cacheKey) return;
            if (!gridCacheCanvas) {
                gridCacheCanvas = document.createElement('canvas');
                gridCacheCanvas.width = PLAY_WIDTH;
                gridCacheCanvas.height = PLAY_HEIGHT;
            }
            gridCacheTheme = cacheKey;
            const gctx = gridCacheCanvas.getContext('2d');
            gctx.fillStyle = theme.bg;
            gctx.fillRect(0, 0, PLAY_WIDTH, PLAY_HEIGHT);
            gctx.strokeStyle = highContrast ? 'rgba(255,255,255,0.15)' : theme.stroke;
            gctx.lineWidth = 1;
            gctx.beginPath();
            for (let x = 0; x <= PLAY_WIDTH; x += TILE_SIZE) {
                gctx.moveTo(x, 0);
                gctx.lineTo(x, PLAY_HEIGHT);
            }
            for (let y = 0; y <= PLAY_HEIGHT; y += TILE_SIZE) {
                gctx.moveTo(0, y);
                gctx.lineTo(PLAY_WIDTH, y);
            }
            gctx.stroke();
        }

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.addEventListener('contextmenu', e => e.preventDefault());
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');
        const toastEl = document.getElementById('toast');
        const comboDisplayEl = document.getElementById('comboDisplay');
        const xpDisplayEl = document.getElementById('xpDisplay');
        const panelBackdropEl = document.getElementById('panelBackdrop');

        let snake = [];
        let food = {};
        var food2 = null; // v6: Echo Brew duplicate food
        let dx = 0;
        let dy = 0;
        let score = 0;

        // === PROGRESSION SYSTEM ===
        const saveManager = {
            get(key, defaultVal) {
                try { const v = localStorage.getItem(key); return v !== null ? v : defaultVal; }
                catch(e) { return defaultVal; }
            },
            set(key, value) {
                try { localStorage.setItem(key, String(value)); }
                catch(e) { /* localStorage unavailable */ }
            },
            getInt(key, defaultVal) {
                try { const v = localStorage.getItem(key); return v !== null ? parseInt(v, 10) || defaultVal : defaultVal; }
                catch(e) { return defaultVal; }
            },
            getJSON(key, defaultVal, validator) {
                try {
                    const v = localStorage.getItem(key);
                    if (v === null) return defaultVal;
                    const parsed = JSON.parse(v);
                    return validator ? (validator(parsed) ? parsed : defaultVal) : parsed;
                }
                catch(e) { return defaultVal; }
            },
            setJSON(key, value) {
                try { localStorage.setItem(key, JSON.stringify(value)); }
                catch(e) { /* localStorage unavailable */ }
            },
            remove(key) {
                try { localStorage.removeItem(key); }
                catch(e) { /* localStorage unavailable */ }
            }
        };
        let highScore = saveManager.getInt('snake_high_score', 0);
        let gameTimeout = null;

        function scheduleNextTick() {
            if (gameState !== 'playing') return;
            gameTimeout = setTimeout(() => {
                updateGame();
                if (gameState === 'playing') {
                    scheduleNextTick();
                }
            }, tickInterval);
        }

        function stopGameLoop() {
            if (gameTimeout) { clearTimeout(gameTimeout); gameTimeout = null; }
        }

        let gameState = 'idle';
        let nextDirection = null;
        let audioCtx = null;
        let muted = saveManager.getInt('snake_muted', 0);
        let highContrast = saveManager.get('snake_high_contrast', '') === '1';
        let particles = [];
        let displayedScore = 0;
        let obstacles = [];
        let lastFrameTime = 0;
        let shakeTimer = 0;
        let flashOverlay = null;
        let visualDirty = true;
        let prevSnake = [];
        let lastTickTime = 0;
        let tickInterval = 120;
        let snakeGrew = false;
        let prevRivalSnake = [];
        let hasTouch = 'ontouchstart' in window;
        let isMobile = hasTouch || window.innerWidth < 600;
        let mutatorTokens = saveManager.getInt('snake_mutator_tokens', 0);
        let unlockedMutators = saveManager.getJSON('snake_mutator_unlocks', ['gravity','mirror','phase_shift'], function(v) { return Array.isArray(v) && v.length > 0; });

        // === SEEDED RUNS ===
        let activeSeed = null;
        let seedPrng = null;

        // === GHOST REPLAY SYSTEM ===
        let replayEvents = [];
        let ghostPositions = [];
        let ghostEnabled = false;
        const REPLAY_VERSION = 1;
        const CHALLENGE_URL_VERSION = 1;
        const GHOST_ARENA_MAX = 3;
        const GHOST_ARENA_COLORS = [
            { body: '#66CCFF', head: '#4488AA', label: '1st', alpha: 0.35 },
            { body: '#FF8866', head: '#AA4422', label: '2nd', alpha: 0.25 },
            { body: '#88FF88', head: '#44AA44', label: '3rd', alpha: 0.20 },
        ];

        let challengeFromUrl = null;
        let ghostArenaMode = false;
        let arenaGhostReplays = [];
        let arenaGhostPositions = [];

        function startReplayRecording() {
            replayEvents = [];
        }

        function recordReplayDirection(tick, dx, dy) {
            replayEvents.push({ tick: tick, type: 'dir', dx: dx, dy: dy });
        }

        function recordReplayGrow(tick) {
            replayEvents.push({ tick: tick, type: 'grow' });
        }

        function saveReplay(score, maxLength) {
            if (replayEvents.length === 0 || activeSeed === null) return;
            if (gameMode === 'daily' || gameMode === 'gauntlet') return;
            var replay = {
                version: REPLAY_VERSION,
                seed: activeSeed,
                mode: gameMode,
                mutators: activeMutators,
                score: score,
                maxLength: maxLength,
                timestamp: Date.now(),
                events: replayEvents
            };
            var replays = loadReplays(gameMode);
            replays.push(replay);
            replays.sort(function(a, b) { return b.score - a.score; });
            replays = replays.slice(0, 5);
            saveManager.setJSON('snake_replays_' + gameMode, replays);
        }

        function loadReplays(mode) {
            return saveManager.getJSON('snake_replays_' + mode, []);
        }

        // v6: Snake Diary
        var MAX_DIARY_ENTRIES = 200;

        function saveDiaryEntry() {
            if (gameMode === 'daily') return; // skip for daily mode (seed-based)
            var diary = saveManager.getJSON('snake_diary', []);
            var entry = {
                id: Date.now(),
                date: new Date().toISOString(),
                mode: gameMode,
                score: gameMode === 'painter' ? (paintCoveredCount || 0) : (score || 0),
                duration: Math.floor((Date.now() - (sessionStartTime || Date.now())) / 1000) || 0,
                foodEaten: sessionFoodEaten || 0,
                maxCombo: sessionMaxCombo || 0,
                level: level || 0,
                prestigeLevel: prestigeLevel || 0,
                deathCause: lastDeathCause || 'quit',
                seed: activeSeed || '',
                mutators: typeof activeMutators !== 'undefined' ? activeMutators.slice() : [],
                brews: typeof activeBrews !== 'undefined' ? activeBrews.slice() : [],
            };
            diary.unshift(entry);
            if (diary.length > MAX_DIARY_ENTRIES) diary.length = MAX_DIARY_ENTRIES;
            saveManager.setJSON('snake_diary', diary);
        }

        function formatDuration(secs) {
            if (!secs || secs < 0) return '0:00';
            var m = Math.floor(secs / 60);
            var s = Math.floor(secs % 60);
            return m + ':' + (s < 10 ? '0' : '') + s;
        }

        var diaryModeFilter = 'all';

        function renderDiary() {
            var list = document.getElementById('diaryList');
            if (!list) return;
            var diary = saveManager.getJSON('snake_diary', []);
            var filter = document.getElementById('diaryModeFilter');
            var fv = filter ? filter.value : 'all';
            var html = '';
            var count = 0;
            for (var di = 0; di < diary.length; di++) {
                var entry = diary[di];
                if (fv !== 'all' && entry.mode !== fv) continue;
                count++;
                var dateStr = entry.date ? new Date(entry.date).toLocaleDateString() : '?';
                var timeStr = formatDuration(entry.duration);
                html += '<div class="diary-entry" onclick="toggleDiaryDetail(' + entry.id + ')"><div class="diary-summary"><span class="diary-mode">' + (entry.mode || '?') + '</span><span class="diary-score">' + (entry.score || 0) + '</span><span class="diary-time">' + timeStr + '</span><span class="diary-date">' + dateStr + '</span></div><div id="diary-detail-' + entry.id + '" class="diary-detail" style="display:none;"><div class="diary-stats"><span>Food: ' + (entry.foodEaten || 0) + '</span><span>Combo: ' + (entry.maxCombo || 0) + 'x</span><span>Level: ' + (entry.level || 0) + '</span><span>Prestige: ' + (entry.prestigeLevel || 0) + '</span><span>Death: ' + (entry.deathCause || '?') + '</span><span>Mutators: ' + (entry.mutators && entry.mutators.length ? entry.mutators.join(', ') : 'none') + '</span><span>Brews: ' + (entry.brews && entry.brews.length ? entry.brews.join(', ') : 'none') + '</span></div><button onclick="deleteDiaryEntry(' + entry.id + ')" class="diary-delete">Delete</button></div></div>';
            }
            list.innerHTML = html || '<p style="text-align:center;color:#888;padding:20px;">No entries yet. Play some games!</p>';
        }

        function toggleDiaryDetail(id) {
            var el = document.getElementById('diary-detail-' + id);
            if (el) el.style.display = el.style.display === 'block' ? 'none' : 'block';
        }

        function deleteDiaryEntry(id) {
            if (!confirm('Delete this diary entry?')) return;
            var diary = saveManager.getJSON('snake_diary', []);
            diary = diary.filter(function(e) { return e.id !== id; });
            saveManager.setJSON('snake_diary', diary);
            renderDiary();
        }

        function showDiaryPanel() {
            var el = document.getElementById('diaryPanel');
            if (!el) return;
            panelBackdropEl.style.display = 'block';
            if (el.style.display === 'block') { el.style.display = 'none'; panelBackdropEl.style.display = 'none'; return; }
            document.getElementById('statsPanel').style.display = 'none';
            document.getElementById('achievementsPanel').style.display = 'none';
            document.getElementById('cosmeticsPanel').style.display = 'none';
            var bp = document.getElementById('brewsPanel');
            if (bp) bp.style.display = 'none';
            // Populate filter
            var filter = document.getElementById('diaryModeFilter');
            if (filter) {
                var modes = ['classic', 'timeAttack', 'snap', 'walled', 'zen', 'painter', 'gauntlet'];
                var cur = filter.value;
                filter.innerHTML = '<option value="all">All Modes</option>';
                for (var mi = 0; mi < modes.length; mi++) {
                    filter.innerHTML += '<option value="' + modes[mi] + '">' + modes[mi].charAt(0).toUpperCase() + modes[mi].slice(1) + '</option>';
                }
                filter.value = cur;
            }
            renderDiary();
            el.style.display = 'block';
            srSpeak('Run diary opened');
        }
        // --- end v6 ---

        function parseChallengeUrl(hash) {
            var parts = hash.split('~');
            if (parts.length < 2) return null;
            var mode = parts[0];
            if (!MODE_CONFIG[mode]) return null;
            if (mode === 'daily') return null;
            var seed = decodeURIComponent(parts[1]);
            if (!seed || seed.indexOf('~') !== -1) return null;
            var targetScore = parts[2] ? parseInt(parts[2], 10) || null : null;
            return { mode: mode, seed: seed, targetScore: targetScore, version: CHALLENGE_URL_VERSION };
        }

        function getArenaReplays(mode) {
            var replays = loadReplays(mode);
            var matched = [];
            for (var i = 0; i < replays.length; i++) {
                var r = replays[i];
                if (r.seed === activeSeed) matched.push(r);
            }
            matched.sort(function(a, b) { return b.score - a.score; });
            return matched.slice(0, GHOST_ARENA_MAX);
        }

        function fallbackCopy(text) {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.left = '-9999px';
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); queueToast('Challenge link copied!', 2000); }
            catch(e) { queueToast('Copy failed — use HTTPS', 2000); }
            document.body.removeChild(ta);
        }

        function rebuildGhost(replay, currentTick) {
            if (!replay || replay.seed !== activeSeed || replay.version !== REPLAY_VERSION) return [];
            // v6: Support both old (mutator) and new (mutators) format
var replayMutators = Array.isArray(replay.mutators) ? replay.mutators : (replay.mutator ? [replay.mutator] : []);
if (JSON.stringify(replayMutators) !== JSON.stringify(activeMutators)) return [];
            var head = { x: TILE_SIZE * 10, y: TILE_SIZE * 10 };
            var body = [{ x: head.x, y: head.y }];
            var dx = TILE_SIZE, dy = 0;
            var lastEventTick = -1;
            var advancedThisTick = false;

            for (var i = 0; i < replay.events.length; i++) {
                var evt = replay.events[i];
                if (evt.tick > currentTick) break;

                if (evt.type === 'dir') {
                    dx = evt.dx;
                    dy = evt.dy;
                }

                if (evt.tick !== lastEventTick && lastEventTick >= 0) {
                    head = { x: head.x + dx, y: head.y + dy };
                    body.unshift({ x: head.x, y: head.y });
                    advancedThisTick = true;
                }
                if (lastEventTick < 0) lastEventTick = evt.tick;
                lastEventTick = evt.tick;
            }

            // Advance for the current tick
            if (lastEventTick <= currentTick) {
                head = { x: head.x + dx, y: head.y + dy };
                body.unshift({ x: head.x, y: head.y });
            }

            // Trim to proper length based on grow events
            var growthCount = 0;
            for (var j = 0; j < replay.events.length; j++) {
                if (replay.events[j].tick <= currentTick && replay.events[j].type === 'grow') {
                    growthCount++;
                }
            }
            var expectedLen = growthCount + 1;
            while (body.length > expectedLen) {
                body.pop();
            }

            if (body.length === 0) return [];
            return body.map(function(p) { return wrapPosition(p); });
        }

        function getBestReplay(mode) {
            var replays = loadReplays(mode);
            if (replays.length === 0) return null;
            var best = null;
            for (var i = 0; i < replays.length; i++) {
                if (replays[i].seed === activeSeed && replays[i].version === REPLAY_VERSION) {
                    if (!best || replays[i].score > best.score) best = replays[i];
                }
            }
            return best;
        }

        function mulberry32(a) {
            return function() {
                a |= 0; a = a + 0x6D2B79F5 | 0;
                var t = Math.imul(a ^ a >>> 15, 1 | a);
                t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
                return ((t ^ t >>> 14) >>> 0) / 4294967296;
            };
        }

        function seededRandom() {
            return seedPrng ? seedPrng() : Math.random();

function purchaseBrew(id) {
    var brew = BREWS_CONFIG.find(function(b) { return b.id === id; });
    if (!brew || unlockedBrews.includes(id)) return false;
    if (mutatorTokens < brew.cost) { queueToast('Not enough mutator tokens!', 2000); return false; }
    mutatorTokens -= brew.cost;
    unlockedBrews.push(id);
    saveManager.setJSON('snake_unlocked_brews', unlockedBrews);
    saveManager.set('snake_mutator_tokens', String(mutatorTokens));
    saveManager.setJSON('snake_equipped_brews', equippedBrews);
    queueToast('🧪 Unlocked ' + brew.name + '!', 3000);
    renderBrewsPanel();
    return true;
}

function equipBrew(id) {
    if (!unlockedBrews.includes(id)) { purchaseBrew(id); return; }
    if (equippedBrews.includes(id)) { equippedBrews = equippedBrews.filter(function(b) { return b !== id; }); saveManager.setJSON('snake_equipped_brews', equippedBrews); renderBrewsPanel(); return; }
    if (equippedBrews.length >= 2) { queueToast('Max 2 brews equipped! Unequip one first.', 2000); return; }
    var brew = BREWS_CONFIG.find(function(b) { return b.id === id; });
    if (brew && brew.mutuallyExclusive) {
        for (var mi = 0; mi < brew.mutuallyExclusive.length; mi++) {
            equippedBrews = equippedBrews.filter(function(b) { return b !== brew.mutuallyExclusive[mi]; });
        }
    }
    equippedBrews.push(id);
    saveManager.setJSON('snake_equipped_brews', equippedBrews);
    renderBrewsPanel();
}

function renderBrewsPanel() {
    var grid = document.getElementById('brewsGrid');
    if (!grid) return;
    var html = '';
    for (var bi = 0; bi < BREWS_CONFIG.length; bi++) {
        var brew = BREWS_CONFIG[bi];
        var unlocked = unlockedBrews.includes(brew.id);
        var equipped = equippedBrews.includes(brew.id);
        var canAfford = mutatorTokens >= brew.cost;
        var statusClass = unlocked ? (equipped ? 'equipped' : 'unlocked') : (canAfford ? 'unlocked' : 'locked');
        var actionText = unlocked ? (equipped ? '✓ Equipped' : 'Tap to equip') : (canAfford ? '🔑 Unlock (' + brew.cost + ' tokens)' : '🔒 ' + brew.cost + ' tokens');
        html += '<div class="brew-card ' + statusClass + '" onclick="equipBrew(\'' + brew.id + '\')" role="button" tabindex="0"><div class="brew-name">' + brew.name + '</div><div class="brew-desc">' + brew.desc + '</div><div class="brew-cost">' + actionText + '</div></div>';
    }
    grid.innerHTML = html;
    var tc = document.getElementById('brewTokenCount');
    if (tc) tc.textContent = mutatorTokens;
}

function showBrewsPanel() {
    var el = document.getElementById('brewsPanel');
    if (!el) return;
    panelBackdropEl.style.display = 'block';
    if (el.style.display === 'block') { el.style.display = 'none'; panelBackdropEl.style.display = 'none'; return; }
    document.getElementById('statsPanel').style.display = 'none';
    document.getElementById('achievementsPanel').style.display = 'none';
    document.getElementById('cosmeticsPanel').style.display = 'none';
    renderBrewsPanel();
    el.style.display = 'block';
    srSpeak('Brews panel opened');
}

        function getDailySeed() {
            const today = new Date();
            const dateStr = today.getFullYear() + '-' + (today.getMonth()+1) + '-' + today.getDate();
            let hash = 0;
            for (let i = 0; i < dateStr.length; i++) {
                hash = ((hash << 5) - hash) + dateStr.charCodeAt(i);
                hash |= 0;
            }
            return Math.abs(hash);
        }

        function pickRandomFoodType() {
            const rand = seededRandom();

                var chaosCum = 0;
                for (var ck in chaosCurrentWeights) {
                    chaosCum += chaosCurrentWeights[ck];
                    if (rand < chaosCum) return ck;
                }
            }
            const tiers = FOOD_TIERS;
            let cumulative = 0;
            for (const typeKey in tiers) {
                cumulative += tiers[typeKey].weight;
                if (rand < cumulative) return typeKey;
            }
            return 'common';

        function generateFood(currentSnake) {
            const totalTiles = (PLAY_WIDTH / TILE_SIZE) * (PLAY_HEIGHT / TILE_SIZE);
            if (currentSnake.length + obstacles.length >= totalTiles) return null;

            let newFood;
            let iterations = 0;
            const MAX_ITERATIONS = 200;
            do {
                if (iterations++ > MAX_ITERATIONS) {
                    // Board is nearly full — scan all tiles for a free spot
                    const freeTiles = [];
                    const cols = PLAY_WIDTH / TILE_SIZE;
                    const rows = PLAY_HEIGHT / TILE_SIZE;
                    for (let x = 0; x < cols; x++) {
                        for (let y = 0; y < rows; y++) {
                            const tx = x * TILE_SIZE;
                            const ty = y * TILE_SIZE;
                            if (currentSnake.some(s => s.x === tx && s.y === ty)) continue;
                            if (obstacles.some(o => o.x === tx && o.y === ty)) continue;
                            freeTiles.push({ x: tx, y: ty });
                        }
                    }
                    if (freeTiles.length === 0) return null;
                    const tile = freeTiles[Math.floor(seededRandom() * freeTiles.length)];
                    const fallbackFood = { x: tile.x, y: tile.y, type: pickRandomFoodType() };
                    if (fallbackFood.type === 'rare' || fallbackFood.type === 'epic') playSound('rare_spawn');
                    return fallbackFood;
                }

                const type = pickRandomFoodType();
                newFood = {
                    x: Math.floor(seededRandom() * (PLAY_WIDTH / TILE_SIZE)) * TILE_SIZE,
                    y: Math.floor(seededRandom() * (PLAY_HEIGHT / TILE_SIZE)) * TILE_SIZE,
                    type: type
                };
            } while (currentSnake.some(segment => segment.x === newFood.x && segment.y === newFood.y) ||
                     obstacles.some(o => o.x === newFood.x && o.y === newFood.y) ||
                     // v6: Rampage Brew — prefer food closer to head
                     (minFoodSpawnDist !== null && currentSnake.length > 0 &&
                      Math.abs(newFood.x - currentSnake[0].x) + Math.abs(newFood.y - currentSnake[0].y) > minFoodSpawnDist * TILE_SIZE));
            if (newFood.type === 'rare' || newFood.type === 'epic') playSound('rare_spawn');
            return newFood;
        }

            if (powerUpPickup) return;

            for (let attempt = 0; attempt < maxAttempts; attempt++) {
                const x = Math.floor(seededRandom() * (PLAY_WIDTH / TILE_SIZE)) * TILE_SIZE;
                const y = Math.floor(seededRandom() * (PLAY_HEIGHT / TILE_SIZE)) * TILE_SIZE;
                if (snake.some(s => s.x === x && s.y === y)) continue;
                if (obstacles.some(o => o.x === x && o.y === y)) continue;
                if (food && food.x === x && food.y === y) continue;
                var rivalSegsFree = rivalCombinedSnake();
                if (rivalSegsFree.some(s => s.x === x && s.y === y)) continue;
                powerUpPickup = { x, y, type };
                powerUpDespawnCounter = 125; // ~15 seconds at 120ms per tick
                return;
            }
        }

                    // Update streak — only when a daily game actually starts

                    const todayStr = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');

                    if (storedDate && storedDate !== todayStr) {

            }
            // Check self collision (existing)
            if (!mc.selfCollision) return false;
            for (let i = 0; i < snake.length; i++) {
                if (pos.x === snake[i].x && pos.y === snake[i].y) return true;
            }
            return false;
        }

            // Preserve 440x600 aspect ratio: fit within available space

        function debouncedResize() {

        function pickWeightedPattern() {
            const rand = seededRandom();
            let cumulative = 0;
            for (const pattern of OBSTACLE_PATTERNS) {
                cumulative += pattern.weight;
                if (rand < cumulative) return pattern;
            }
            return OBSTACLE_PATTERNS[0];
        }

        function findFreeTile(headX, headY) {
            const cols = PLAY_WIDTH / TILE_SIZE, rows = PLAY_HEIGHT / TILE_SIZE;
            const maxObs = Math.floor((cols * rows) * MAX_OBSTACLE_PERCENT);
            if (obstacles.length >= maxObs) return null;
            for (let attempt = 0; attempt < 50; attempt++) {
                const x = Math.floor(seededRandom() * cols) * TILE_SIZE;
                const y = Math.floor(seededRandom() * rows) * TILE_SIZE;
                if (Math.abs(x - headX) + Math.abs(y - headY) < 3 * TILE_SIZE) continue;
                if (snake.some(s => s.x === x && s.y === y)) continue;
                if (obstacles.some(o => o.x === x && o.y === y)) continue;
                if (food && food.x === x && food.y === y) continue;
                var rivalSegsFree = rivalCombinedSnake();
                if (rivalSegsFree.some(s => s.x === x && s.y === y)) continue;
                return { x, y };
            }
            return null;
        }

        function generateObstacles() {
            obstacles = [];
            if (gameMode === 'zen' || gameMode === 'walled' || gameMode === 'painter' || gameMode === 'gauntlet') return;
            const totalTiles = (PLAY_WIDTH / TILE_SIZE) * (PLAY_HEIGHT / TILE_SIZE);
            const maxObs = Math.floor(totalTiles * MAX_OBSTACLE_PERCENT);
            const count = Math.min(maxObs, 3 + Math.floor(seededRandom() * 6));
            const headX = 10 * TILE_SIZE;
            const headY = 10 * TILE_SIZE;
            
            for (let i = 0; i < count; i++) {
                let placed = false;
                for (let attempt = 0; attempt < 20; attempt++) {
                    const pattern = pickWeightedPattern();
                    const anchorX = Math.floor(seededRandom() * (PLAY_WIDTH / TILE_SIZE)) * TILE_SIZE;
                    const anchorY = Math.floor(seededRandom() * (PLAY_HEIGHT / TILE_SIZE)) * TILE_SIZE;
                    
                    const dist = Math.abs(anchorX - headX) + Math.abs(anchorY - headY);
                    if (dist < 3 * TILE_SIZE) continue;
                    
                    let conflict = false;
                    for (const offset of pattern.tiles) {
                        const tx = anchorX + offset.dx;
                        const ty = anchorY + offset.dy;
                        if (tx < 0 || tx >= PLAY_WIDTH || ty < 0 || ty >= PLAY_HEIGHT) { conflict = true; break; }
                        if (snake.some(s => s.x === tx && s.y === ty)) { conflict = true; break; }
                        if (obstacles.some(o => o.x === tx && o.y === ty)) { conflict = true; break; }
                        if (food && food.x === tx && food.y === ty) { conflict = true; break; }
                    }
                    if (conflict) continue;
                    
                    for (const offset of pattern.tiles) {
                        obstacles.push({ x: anchorX + offset.dx, y: anchorY + offset.dy });
                    }
                    placed = true;
                    break;
                }
                
                if (!placed) {
                    for (let attempt = 0; attempt < 20; attempt++) {
                        const obsX = Math.floor(seededRandom() * (PLAY_WIDTH / TILE_SIZE)) * TILE_SIZE;
                        const obsY = Math.floor(seededRandom() * (PLAY_HEIGHT / TILE_SIZE)) * TILE_SIZE;
                        const dist = Math.abs(obsX - headX) + Math.abs(obsY - headY);
                        if (dist < 3 * TILE_SIZE) continue;
                        if (snake.some(s => s.x === obsX && s.y === obsY)) continue;
                        if (obstacles.some(o => o.x === obsX && o.y === obsY)) continue;
                        if (food && food.x === obsX && food.y === obsY) continue;
                        obstacles.push({ x: obsX, y: obsY });
                        placed = true;
                        break;
                    }
                }
            }
            if (obstacles.length > maxObs) {
                obstacles = obstacles.slice(0, maxObs);
            }
        }

        function spawnRival(idx) {
            if (idx === undefined) idx = 0;
            while (rivals.length <= idx) {
                rivals.push({ snake: [], dx: TILE_SIZE, dy: 0, active: false, respawnTimer: 0, color: idx === 0 ? '#FF4444' : '#FF8844' });
            }
            if (rivals[idx].active) return;
            if (gameMode === 'zen' || gameMode === 'snap' || gameMode === 'daily' || gameMode === 'walled' || gameMode === 'painter') return;
            var r = rivals[idx];
            r.snake = [{ x: 10 * TILE_SIZE, y: 10 * TILE_SIZE }];
            r.dx = TILE_SIZE;
            r.dy = 0;
            r.active = true;
            r.respawnTimer = 0;
        }

        function updateRival(idx) {
            if (idx === undefined) idx = 0;
            if (idx >= rivals.length) return;
            var r = rivals[idx];
            if (!r.active) return;

            if (food) {
                var rand = seededRandom();
                if (rand < 0.7) {
                    var head = r.snake[0];
                    var dx_food = food.x - head.x;
                    var dy_food = food.y - head.y;
                    if (MODE_CONFIG[gameMode].wrap) {
                        if (Math.abs(dx_food) > PLAY_WIDTH / 2) {
                            dx_food = dx_food > 0 ? dx_food - PLAY_WIDTH : dx_food + PLAY_WIDTH;
                        }
                        if (Math.abs(dy_food) > PLAY_HEIGHT / 2) {
                            dy_food = dy_food > 0 ? dy_food - PLAY_HEIGHT : dy_food + PLAY_HEIGHT;
                        }
                    }
                    var possible = [];
                    if (dx_food > 0) possible.push({ dx: TILE_SIZE, dy: 0 });
                    else if (dx_food < 0) possible.push({ dx: -TILE_SIZE, dy: 0 });
                    if (dy_food > 0) possible.push({ dx: 0, dy: TILE_SIZE });
                    else if (dy_food < 0) possible.push({ dx: 0, dy: -TILE_SIZE });
                    if (possible.length > 0) {
                        var chosen = possible[Math.floor(seededRandom() * possible.length)];
                        r.dx = chosen.dx;
                        r.dy = chosen.dy;
                    }
                } else if (rand < 0.9) {
                    // continue straight
                } else {
                    var dirs = [{dx:TILE_SIZE,dy:0},{dx:-TILE_SIZE,dy:0},{dx:0,dy:TILE_SIZE},{dx:0,dy:-TILE_SIZE}];
                    var rchosen = dirs[Math.floor(seededRandom() * dirs.length)];
                    if (rchosen.dx !== -r.dx || rchosen.dy !== -r.dy) {
                        r.dx = rchosen.dx;
                        r.dy = rchosen.dy;
                    }
                }
            }

            var head = r.snake[0];
            var newHead = {
                x: head.x + r.dx,
                y: head.y + r.dy
            };
            if (MODE_CONFIG[gameMode].wrap) {
                newHead.x = ((newHead.x % PLAY_WIDTH) + PLAY_WIDTH) % PLAY_WIDTH;
                newHead.y = ((newHead.y % PLAY_HEIGHT) + PLAY_HEIGHT) % PLAY_HEIGHT;
            }

            var selfHit = false;
            for (var rs = 0; rs < r.snake.length; rs++) {
                if (r.snake[rs].x === newHead.x && r.snake[rs].y === newHead.y) {
                    selfHit = true; break;
                }
            }
            if (selfHit) {
                removeRival(idx);
                return;
            }

            r.snake.unshift(newHead);
            if (r.snake.length > RIVAL_MAX_LENGTH) r.snake.pop();

            if (food && newHead.x === food.x && newHead.y === food.y) {
                r.snake.push({ x: newHead.x, y: newHead.y });
                if (r.snake.length > RIVAL_MAX_LENGTH) r.snake.pop();
                var combinedSnake = snake.slice();
                var rivalSegs = rivalCombinedSnake();
                for (var rs2 = 0; rs2 < rivalSegs.length; rs2++) combinedSnake.push(rivalSegs[rs2]);
                var newFood = generateFood(combinedSnake);
                if (newFood) {
                    food = newFood;
                } else {
                    food = null;
                }
            }

            if (snake.length > 0) {
                var playerHead = snake[0];
                if (playerHead.x === newHead.x && playerHead.y === newHead.y) {
                    removeRival(idx);
                    return;
                }
            }
        }

        function removeRival(idx) {
            if (idx === undefined) idx = 0;
            if (idx >= rivals.length) return;
            var r = rivals[idx];
            if (r.active && r.snake.length > 0) {
                spawnParticles(r.snake[0].x, r.snake[0].y, 20, r.color);

            r.active = false;
            r.respawnTimer = 10000;
        }

        function playSound(name) {
            if (muted) return;
            if (!audioCtx) {
                try {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                } catch (e) {
                    return;
                }
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            gain.gain.value = 0.2;
            const now = audioCtx.currentTime;

            switch (name) {
                case 'eat':
                    osc.frequency.value = 523;
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                    break;
                case 'bonus':
                    osc.frequency.value = 523;
                    osc.frequency.linearRampToValueAtTime(1047, now + 0.15);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                    break;
                case 'speed':
                    osc.frequency.value = 440;
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.06);
                    osc.start(now);
                    osc.stop(now + 0.06);
                    break;
                case 'achievement':
                    // Ascending arpeggio C5→E5→G5, 0.4s
                    osc.frequency.setValueAtTime(523, now);
                    osc.frequency.setValueAtTime(659, now + 0.13);
                    osc.frequency.setValueAtTime(784, now + 0.26);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                    osc.start(now);
                    osc.stop(now + 0.4);
                    break;
                case 'levelup':
                    // Two-tone ascending C5→C6, 0.3s
                    osc.frequency.setValueAtTime(523, now);
                    osc.frequency.setValueAtTime(1047, now + 0.15);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                    osc.start(now);
                    osc.stop(now + 0.3);
                    break;
                case 'powerup':
                    // Quick ascending sweep 440→880, 0.15s
                    osc.frequency.setValueAtTime(440, now);
                    osc.frequency.linearRampToValueAtTime(880, now + 0.15);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                    break;
                case 'powerdown':
                    // Short descending 660→330, 0.1s
                    osc.frequency.setValueAtTime(660, now);
                    osc.frequency.linearRampToValueAtTime(330, now + 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
                    osc.start(now);
                    osc.stop(now + 0.1);
                    break;
                case 'rare_spawn':
                    // Two quick ascending notes, 0.2s total
                    osc.frequency.setValueAtTime(880, now);
                    osc.frequency.setValueAtTime(1100, now + 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                    break;
                case 'combo_milestone':
                    // Quick ascending C5→E5, 0.2s
                    osc.frequency.setValueAtTime(523, now);
                    osc.frequency.setValueAtTime(659, now + 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.2);
                    osc.start(now);
                    osc.stop(now + 0.2);
                    break;
                case 'gameover':
                    osc.frequency.value = 440;
                    osc.frequency.linearRampToValueAtTime(220, now + 0.5);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
                    osc.start(now);
                    osc.stop(now + 0.5);
                    break;
                case 'pause':
                    osc.frequency.value = 330;
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                    break;
                case 'resume':
                    osc.frequency.value = 440;
                    gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
                    osc.start(now);
                    osc.stop(now + 0.05);
                    break;
            }
            // Synesthesia layer
            if (synesthesiaMode) {
                playSynesthesiaLayer(name, now);
            }
        }

        function playSynesthesiaLayer(name, now) {
            if (!audioCtx) return;
            if (name === 'eat' || name === 'bonus' || name === 'speed') {
                var tierInfo = SYNESTHESIA_NOTES[lastEatenType] || SYNESTHESIA_NOTES.common;
                var oct = getSynesthesiaOctave();
                var freq = tierInfo.freq * Math.pow(2, oct - 4);
                var noteOsc = audioCtx.createOscillator();
                var noteGain = audioCtx.createGain();
                noteOsc.type = 'sine';
                noteOsc.frequency.value = freq;
                noteGain.gain.setValueAtTime(0.15, now);
                noteGain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
                noteOsc.connect(noteGain);
                noteGain.connect(audioCtx.destination);
                noteOsc.start(now);
                noteOsc.stop(now + 0.4);
                // Fifth harmonic
                var harmOsc = audioCtx.createOscillator();
                var harmGain = audioCtx.createGain();
                harmOsc.type = 'sine';
                harmOsc.frequency.value = freq * 1.5;
                harmGain.gain.setValueAtTime(0.05, now);
                harmGain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
                harmOsc.connect(harmGain);
                harmGain.connect(audioCtx.destination);
                harmOsc.start(now);
                harmOsc.stop(now + 0.3);
            }
            if (name === 'combo_milestone') {
                playSynesthesiaChord(now);
            }
            if (name === 'gameover') {
                playSynesthesiaResolution(now);
            }
        }

        function getSynesthesiaOctave() {
            var oct = 4;
            for (var i = SYNESTHESIA_COMBO_OCTAVES.length - 1; i >= 0; i--) {
                if (comboCount >= SYNESTHESIA_COMBO_OCTAVES[i].minCombo) {
                    oct = SYNESTHESIA_COMBO_OCTAVES[i].octave;
                    break;
                }
            }
            return oct;
        }

        function playSynesthesiaChord(now) {
            if (!audioCtx) return;
            var notes = [261.63, 329.63, 392.00];
            if (comboCount >= 5) notes.push(493.88);
            if (comboCount >= 10) notes.push(293.66 * 2);
            if (comboCount >= 20) notes.push(261.63 * 2);
            var stagger = 0.05;
            for (var i = 0; i < notes.length; i++) {
                var chordOsc = audioCtx.createOscillator();
                var chordGain = audioCtx.createGain();
                chordOsc.type = 'sine';
                chordOsc.frequency.value = notes[i];
                var startTime = now + i * stagger;
                chordGain.gain.setValueAtTime(0, startTime);
                chordGain.gain.linearRampToValueAtTime(0.08, startTime + 0.05);
                chordGain.gain.exponentialRampToValueAtTime(0.001, now + 0.6);
                chordOsc.connect(chordGain);
                chordGain.connect(audioCtx.destination);
                chordOsc.start(startTime);
                chordOsc.stop(now + 0.6);
            }
        }

        function playSynesthesiaResolution(now) {
            if (!audioCtx) return;
            var resOsc = audioCtx.createOscillator();
            var resGain = audioCtx.createGain();
            resOsc.type = 'sine';
            resOsc.frequency.value = 261.63;
            resGain.gain.setValueAtTime(0.12, now);
            resGain.gain.exponentialRampToValueAtTime(0.001, now + 1.0);
            resOsc.connect(resGain);
            resGain.connect(audioCtx.destination);
            resOsc.start(now);
            resOsc.stop(now + 1.0);
        }

        function playSynesthesiaPulse() {
            if (!audioCtx) return;
            var now = audioCtx.currentTime;
            var pulseOsc = audioCtx.createOscillator();
            var pulseGain = audioCtx.createGain();
            pulseOsc.type = 'triangle';
            pulseOsc.frequency.value = 55;
            pulseGain.gain.setValueAtTime(0.04, now);
            pulseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            pulseOsc.connect(pulseGain);
            pulseGain.connect(audioCtx.destination);
            pulseOsc.start(now);
            pulseOsc.stop(now + 0.1);
        }

        function playSynesthesiaArp() {
            if (!audioCtx) return;
            var now = audioCtx.currentTime;
            var arpNotes = [261.63, 329.63, 392.00, 493.88];
            var freq = arpNotes[gameTick % arpNotes.length];
            var oct = getSynesthesiaOctave();
            freq = freq * Math.pow(2, oct - 4);
            var arpOsc = audioCtx.createOscillator();
            var arpGain = audioCtx.createGain();
            arpOsc.type = 'sine';
            arpOsc.frequency.value = freq;
            arpGain.gain.setValueAtTime(0.06, now);
            arpGain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
            arpOsc.connect(arpGain);
            arpGain.connect(audioCtx.destination);
            arpOsc.start(now);
            arpOsc.stop(now + 0.12);
        }

        function startPad() {
            if (!audioCtx || padActive) return;
            padActive = true;
            padChangeTick = gameTick;
            var now = audioCtx.currentTime;
            padOsc1 = audioCtx.createOscillator();
            padOsc2 = audioCtx.createOscillator();
            padGain = audioCtx.createGain();
            padOsc1.type = 'sine';
            padOsc2.type = 'sine';
            padOsc1.frequency.value = padRootNote;
            padOsc2.frequency.value = padRootNote * 1.005;
            padGain.gain.value = 0.09;
            padOsc1.connect(padGain);
            padOsc2.connect(padGain);
            padGain.connect(audioCtx.destination);
            padOsc1.start(now);
            padOsc2.start(now);
        }

        function stopPad() {
            if (!padActive) return;
            padActive = false;
            try { if (padOsc1) { padOsc1.stop(); padOsc1 = null; } } catch(e) {}
            try { if (padOsc2) { padOsc2.stop(); padOsc2 = null; } } catch(e) {}
            padGain = null;
        }

        function updatePad() {
            if (!synesthesiaMode || muted || !padActive) return;
            if (gameTick - padChangeTick >= 50) {
                padChangeTick = gameTick;
                var regions = [261.63, 293.66, 329.63, 349.23, 392.00];
                var regionIdx = Math.floor((snake[0].y / PLAY_HEIGHT) * regions.length);
                padRootNote = regions[Math.min(regionIdx, regions.length - 1)];
                var now = audioCtx.currentTime;
                if (padOsc1) padOsc1.frequency.linearRampToValueAtTime(padRootNote, now + 0.5);
                if (padOsc2) padOsc2.frequency.linearRampToValueAtTime(padRootNote * 1.005, now + 0.5);
            }
        }

        function startDrone() {
            if (!audioCtx || droneActive) return;
            droneActive = true;
            var now = audioCtx.currentTime;
            droneOsc = audioCtx.createOscillator();
            droneGain = audioCtx.createGain();
            droneOsc.type = 'sawtooth';
            droneOsc.frequency.value = 55;
            droneGain.gain.value = 0;
            droneOsc.connect(droneGain);
            droneGain.connect(audioCtx.destination);
            droneOsc.start(now);
        }

        function stopDrone() {
            if (!droneActive) return;
            droneActive = false;
            try { if (droneOsc) { droneOsc.stop(); droneOsc = null; } } catch(e) {}
            droneGain = null;
        }

        function updateDrone() {
            if (!synesthesiaMode || muted) return;
            if (obstacles.length === 0) {
                stopDrone();
                return;
            }
            var head = snake[0];
            var nearestDist = Infinity;
            for (var i = 0; i < obstacles.length; i++) {
                var dist = Math.abs(head.x - obstacles[i].x) + Math.abs(head.y - obstacles[i].y);
                if (dist < nearestDist) nearestDist = dist;
            }
            var tileDist = nearestDist / TILE_SIZE;
            var now = audioCtx.currentTime;
            if (tileDist <= 3) {
                if (!droneActive) startDrone();
                if (droneGain) droneGain.gain.linearRampToValueAtTime(0.08, now + 0.3);
            } else {
                if (droneActive && droneGain) {
                    droneGain.gain.linearRampToValueAtTime(0, now + 0.5);
                }
            }
        }

        function spawnSynesthesiaRing(x, y, color) {
            for (var i = 0; i < 6; i++) {
                var angle = (Math.PI * 2 / 6) * i;
                particles.push({
                    x: x + TILE_SIZE / 2,
                    y: y + TILE_SIZE / 2,
                    vx: Math.cos(angle) * 3,
                    vy: Math.sin(angle) * 3,
                    life: 1.0,
                    maxLife: 0.4,
                    color: color,
                    size: 3
                });
            }
        }

        function setNextDirection(newDx, newDy) {
            const currentDir = nextDirection ?? { dx, dy };
            if (newDx !== -currentDir.dx || newDy !== -currentDir.dy) {
                nextDirection = { dx: newDx, dy: newDy };
            }
        }

        function spawnParticles(x, y, count, color) {
            count = Math.min(count, 500 - particles.length);
            if (count <= 0) return;
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x + TILE_SIZE / 2,
                    y: y + TILE_SIZE / 2,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    life: 1.0,
                    maxLife: count > 20 ? 1.0 : 0.5,
                    color: color,
                    size: Math.random() * 3 + 2
                });
            }
        }

        function animateVisuals(timestamp) {
            if (!lastFrameTime) lastFrameTime = timestamp;
            const delta = Math.min(timestamp - lastFrameTime, 100);
            lastFrameTime = timestamp;
            renderTime = timestamp || performance.now();

            // Update and draw particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.05; // gravity
                p.life -= delta / (p.maxLife * 1000) * (slowMoActive ? 0.5 : 1);
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }

            if (shakeTimer > 0) shakeTimer = Math.max(0, shakeTimer - delta);
            if (eatAnimTimer > 0) eatAnimTimer = Math.max(0, eatAnimTimer - delta);
            if (snapLevelUpFlash > 0) snapLevelUpFlash = Math.max(0, snapLevelUpFlash - delta);
            if (sessionSummaryTimer > 0) sessionSummaryTimer = Math.max(0, sessionSummaryTimer - delta);
            if (touchIndicatorTimer > 0) touchIndicatorTimer = Math.max(0, touchIndicatorTimer - delta);

            // v6: Floater lifecycle decay
            for (var fi = floaters.length - 1; fi >= 0; fi--) {
                floaters[fi].life -= delta / 1000;
                if (floaters[fi].life <= 0) floaters.splice(fi, 1);
            }
            // --- end v6 ---

            // New obstacle flash timer decay
            for (let i = newObstacleFlash.length - 1; i >= 0; i--) {
                newObstacleFlash[i].timer -= delta;
                if (newObstacleFlash[i].timer <= 0) newObstacleFlash.splice(i, 1);
            }
            if (newObstacleToastTimer > 0) newObstacleToastTimer -= delta;

            if (flashOverlay) {
                flashOverlay.alpha -= delta * 0.004;
                if (flashOverlay.alpha <= 0) flashOverlay = null;
            }

            // Level-up flash overlay
            if (levelUpFlash > 0) {
                levelUpFlash = Math.max(0, levelUpFlash - delta);
            if (!flashOverlay || flashOverlay.priority !== 'critical') {
                flashOverlay = { color: '#FFD700', alpha: Math.min(0.3, levelUpFlash / 5000), priority: 'critical' };
            }
            }

            const elapsed = timestamp - lastTickTime;
            const t = lastTickTime > 0 ? Math.min(elapsed / tickInterval, 1) : 1;

            const needsRedraw = visualDirty || particles.length > 0 || flashOverlay || shakeTimer > 0 || eatAnimTimer > 0 || snapLevelUpFlash > 0 || (gameMode === 'snap' && gameState === 'playing');
            if (needsRedraw) {
                visualDirty = false;
                let didShake = false;
                if (shakeTimer > 0 && gameState !== 'paused') {
                    const intensity = (shakeTimer / 200) * 5;
                    ctx.save();
                    ctx.translate((Math.random() - 0.5) * 2 * intensity, (Math.random() - 0.5) * 2 * intensity);
                    didShake = true;
                }
                drawGame(1); // no interpolation — snake head was 1 block behind
                if (didShake) ctx.restore();
            }

            // Render particles on top of game state
            for (const p of particles) {
                const alpha = Math.max(0, p.life);
                ctx.globalAlpha = alpha;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
            }
            ctx.globalAlpha = 1;

            // v6: Render floaters on top of particles
            if (floaters.length > 0) drawFloaters(ctx);
            // --- end v6 ---

            // Touch swipe indicator
            if (touchIndicatorTimer > 0) {
                const alpha = Math.min(1, touchIndicatorTimer / 150);
                ctx.save();
                ctx.globalAlpha = alpha * 0.3;
                ctx.fillStyle = '#4488FF';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                ctx.restore();
            }

            // Help overlay — renders on top of everything
            if (helpOverlayVisible) {
                drawHelpOverlay();
            }

            // Session summary overlay
            if (sessionSummary && sessionSummaryTimer > 0) {
                const alpha = Math.min(1, sessionSummaryTimer / 1000);
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = 'rgba(0, 0, 0, 0.8)';
                ctx.fillRect(10, CANVAS_HEIGHT - 110, CANVAS_WIDTH - 20, 100);
                ctx.fillStyle = '#FFD700';
                ctx.font = 'bold 12px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillText('\uD83D\uDCCA Session Summary', CANVAS_WIDTH / 2, CANVAS_HEIGHT - 105);
                ctx.fillStyle = '#CCC';
                ctx.font = '11px Arial';
                ctx.fillText('Score: ' + sessionSummary.score + '  |  Time: ' + sessionSummary.time + 's  |  Food: ' + sessionSummary.food, CANVAS_WIDTH / 2, CANVAS_HEIGHT - 88);
                ctx.fillText('Best Combo: ' + sessionSummary.combo + 'x  |  XP Earned: +' + sessionSummary.xp, CANVAS_WIDTH / 2, CANVAS_HEIGHT - 73);
                ctx.restore();
            }

            // New obstacle toast
            if (newObstacleToastTimer > 0 && gameState === 'playing') {
                ctx.save();
                ctx.font = '16px Arial';
                ctx.fillStyle = 'rgba(255, 150, 50, ' + Math.min(1, newObstacleToastTimer / 500) + ')';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillText('\u26A0 New obstacles!', CANVAS_WIDTH / 2, 10);
                ctx.restore();
            }

            // Snap level-up flash
            if (snapLevelUpFlash > 0 && gameMode === 'snap') {
                const alpha = Math.min(1, snapLevelUpFlash / 500);
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = '#FFD700';
                ctx.font = 'bold 24px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.fillText('⚡ LEVEL ' + snapLevel + ' ⚡', CANVAS_WIDTH / 2, CANVAS_HEIGHT - 15);
                ctx.restore();
            }

            // XP level-up flash
            if (levelUpFlash > 0 && level >= 1) {
                const alpha = Math.min(1, levelUpFlash / 500);
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = '#FFD700';
                ctx.font = 'bold 24px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillText('🌟 LEVEL ' + level + '! 🌟', CANVAS_WIDTH / 2, 20);
                ctx.restore();
            }

            // Flash overlay — renders last on top of everything (AGENTS.md)
            if (flashOverlay) {
                ctx.fillStyle = flashOverlay.color === 'rainbow'
                    ? 'hsl(' + (Date.now() % 2000 / 2000 * 360) + ', 100%, 50%)'
                    : flashOverlay.color;
                ctx.globalAlpha = Math.max(0, flashOverlay.alpha);
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                ctx.globalAlpha = 1;
            }

            // Animate score
            const scoreDelta = score - displayedScore;
            if (scoreDelta > 1) {
                displayedScore += Math.ceil(scoreDelta * 0.3);
            } else if (scoreDelta > 0) {
                displayedScore = score;
            }
            if (displayedScore !== parseInt(scoreEl.textContent, 10)) {
                scoreEl.textContent = displayedScore;
            }

            const comboEl = comboDisplayEl;
            if (comboEl) {
                const mul = 1 + comboCount * 0.5;
                const comboText = comboCount > 0 ? 'x' + mul.toFixed(1) + ' COMBO!' : '';
                if (comboEl.textContent !== comboText) {
                    comboEl.textContent = comboText;
                }
            }
            const xpEl = xpDisplayEl;
            if (xpEl) {
                if (xpEl.style.display !== 'none') {
                    xpEl.style.display = 'none';
                }
            }

            requestAnimationFrame(animateVisuals);
        }
