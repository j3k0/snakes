<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
    <title>Snake Game</title>
    <link rel="manifest" href="data:application/manifest+json,%7B%22name%22%3A%22Snakes%22%2C%22short_name%22%3A%22Snakes%22%2C%22start_url%22%3A%22.%22%2C%22display%22%3A%22standalone%22%2C%22background_color%22%3A%22%23222%22%2C%22theme_color%22%3A%22%23111%22%2C%22orientation%22%3A%22portrait%22%2C%22icons%22%3A%5B%7B%22src%22%3A%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%2520xmlns%253D%2522http%253A%252F%252Fwww.w3.org%252F%252F2000%252Fsvg%2522%2520viewBox%253D%25220%25200%2520192%2520192%2522%253E%253Crect%2520width%253D%2522192%2522%2520height%253D%2522192%2522%2520fill%253D%2522%2523111%2522%2520rx%253D%252224%2522%252F%253E%253Cpath%2520d%253D%2522M96%252040%2520C60%252040%252C%252040%252060%252C%252040%252080%2520C40%2520100%252C%252060%2520100%252C%252096%2520100%2520C132%2520100%252C%2520152%2520100%252C%2520152%2520120%2520C152%2520140%252C%2520132%2520152%252C%252096%2520152%2522%2520stroke%253D%2522%252344FF44%2522%2520stroke-width%253D%252214%2522%2520fill%253D%2522none%2522%2520stroke-linecap%253D%2522round%2522%252F%253E%253Ccircle%2520cx%253D%252240%2522%2520cy%253D%252272%2522%2520r%253D%25225%2522%2520fill%253D%2522%2523FFF%2522%252F%253E%253C%252Fsvg%253E%22%2C%22sizes%22%3A%22192x192%22%2C%22type%22%3A%22image%2Fsvg%2Bxml%22%7D%5D%7D">
    <meta name="theme-color" content="#111">
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #222;
            font-family: Arial, sans-serif;
            color: white;
            overflow: hidden;
        }
        h1 {
            margin-bottom: 10px;
        }
        #gameCanvas {
            border: 2px solid #333;
            background-color: #111;
            display: block;
            max-width: 100%;
            height: auto;
            aspect-ratio: 440 / 600;
            touch-action: none;
        }
        #score {
            font-size: 1.5em;
        }
        #highScore {
            font-size: 1em;
            color: #aaa;
            margin-bottom: 10px;
        }
        @media (max-width: 480px) {
          body { padding: 5px; box-sizing: border-box; }
          #gameCanvas { max-width: 100%; }
          .dpad-btn { width: 56px; height: 56px; font-size: 24px; }
        }
        @media (pointer: coarse) {
          #dpad { display: flex !important; justify-content: center; }
        }
        #menuFooter {
            display: none;
            margin-top: 4px;
            text-align: center;
            user-select: none;
            line-height: 1.5;
            font-family: Arial, sans-serif;
            max-width: 440px;
        }
        .prestige-gold { color: #FFD700; font-weight: bold; font-size: 14px; }
        .prestige-purple { color: #AA44FF; font-weight: bold; font-size: 13px; }
        .prestige-gray { color: #888; font-size: 14px; }
        .shortcut-dim { color: #555; font-size: 13px; }
        @media (pointer: coarse) {
            #menuFooter { font-size: 12px; line-height: 1.3; max-width: calc(100vw - 20px); }
        }
        /* v7: Hide title and score in standalone PWA mode */
        @media (display-mode: standalone), (display-mode: fullscreen) {
            h1 { display: none; }
            #score { display: none; }
            #highScore { display: none; }
        }
    </style>
</head>
<body>
    <h1>Snake Game</h1>
    <canvas id="gameCanvas" width="440" height="600" role="img" aria-label="Snake game board"></canvas>
    <div id="menuFooter">
      <div id="prestigeInfo"></div>
      <div id="shortcutInfo"></div>
    </div>
    <div id="dpad" style="display:none;margin-top:10px;touch-action:manipulation;user-select:none;-webkit-user-select:none;">
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px;">
        <button class="dpad-btn" data-key="ArrowUp" aria-label="Up" style="width:56px;height:56px;font-size:24px;background:#333;color:white;border:2px solid #555;border-radius:8px;cursor:pointer;touch-action:manipulation;">▲</button>
        <div style="display:flex;gap:48px;">
          <button class="dpad-btn" data-key="ArrowLeft" aria-label="Left" style="width:56px;height:56px;font-size:24px;background:#333;color:white;border:2px solid #555;border-radius:8px;cursor:pointer;touch-action:manipulation;">◀</button>
          <button class="dpad-btn" data-key="ArrowDown" aria-label="Down" style="width:56px;height:56px;font-size:24px;background:#333;color:white;border:2px solid #555;border-radius:8px;cursor:pointer;touch-action:manipulation;">▼</button>
          <button class="dpad-btn" data-key="ArrowRight" aria-label="Right" style="width:56px;height:56px;font-size:24px;background:#333;color:white;border:2px solid #555;border-radius:8px;cursor:pointer;touch-action:manipulation;">▶</button>
        </div>
        <button class="dpad-btn" data-key=" " aria-label="Pause" style="width:56px;height:56px;font-size:18px;background:#333;color:white;border:2px solid #555;border-radius:8px;cursor:pointer;touch-action:manipulation;margin-top:4px;">⏸</button>
      </div>
    </div>
    <p>Score: <span id="score">0</span></p>
    <p id="highScore">Best: 0</p>
        <div id="xpDisplay" style="color:#aaa;font-size:0.9em;"></div>
        <div id="seedContainer" style="margin-top:6px;display:flex;align-items:center;gap:6px;justify-content:center;font-size:12px;">
            <input type="text" id="seedField" placeholder="Seed..." style="width:120px;padding:3px 6px;background:#222;color:white;border:1px solid #555;border-radius:4px;font-family:monospace;font-size:12px;">
            <button id="seedRandomBtn" style="padding:3px 8px;background:#333;color:white;border:1px solid #555;border-radius:4px;cursor:pointer;font-size:11px;">🎲</button>
            <button id="seedClearBtn" style="padding:3px 8px;background:#333;color:#aaa;border:1px solid #555;border-radius:4px;cursor:pointer;font-size:11px;">✕</button>
        </div>
        <div id="comboDisplay" style="color:#FFD700;font-size:1.2em;min-height:1.5em;"></div>
        <div id="toast" style="display:none;position:fixed;top:max(20px, env(safe-area-inset-top, 0px));left:50%;transform:translateX(-50%);color:#FFD700;font-size:24px;font-weight:bold;text-shadow:2px 2px 4px rgba(0,0,0,0.8);z-index:1000;pointer-events:none;text-align:center;"></div>
        <div id="statsPanel" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.95);border:2px solid #555;border-radius:10px;padding:20px;color:white;font-family:monospace;z-index:100;min-width:300px;max-width:400px;max-height:70vh;overflow-y:auto;"></div>
        <div id="achievementsPanel" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.96);border:2px solid #FFD700;border-radius:12px;padding:20px;color:white;font-family:sans-serif;z-index:100;min-width:350px;max-width:480px;"></div>
        <div id="cosmeticsPanel" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.96);border:2px solid #9B59B6;border-radius:12px;padding:20px;color:white;font-family:sans-serif;z-index:100;min-width:320px;"></div>
        <div id="questsPanel" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.96);border:2px solid #44FF88;border-radius:12px;padding:20px;color:white;font-family:sans-serif;z-index:100;min-width:320px;max-width:440px;max-height:80vh;overflow-y:auto;"></div>
        <div id="settingsPanel" style="display:none;position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(0,0,0,0.96);border:2px solid #88AAFF;border-radius:12px;padding:20px;color:white;font-family:sans-serif;z-index:100;min-width:320px;max-width:440px;max-height:80vh;overflow-y:auto;"></div>
        <div id="panelBackdrop" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.5);z-index:99;touch-action:manipulation;"></div>
        <!-- v6: Screen reader live region -->
        <div id="srAnnounce" aria-live="polite" aria-atomic="true" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;"></div>
        <!-- v6 styles for new panels -->
        <style>
            .brews-grid { display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0; }
            .brew-card { padding:8px;border-radius:8px;cursor:pointer;text-align:center;transition:all .15s; }
            .brew-card.unlocked { background:rgba(68,255,136,0.1);border:1px solid rgba(68,255,136,0.3); }
            .brew-card.locked { background:rgba(68,68,68,0.3);border:1px solid rgba(68,68,68,0.3); }
            .brew-card.equipped { border-color:#4488FF;box-shadow:0 0 8px rgba(68,136,255,0.5); }
            .brew-name { font-weight:bold;font-size:13px; }
            .brew-desc { font-size:11px;color:#AAA;margin:4px 0; }
            .brew-cost { font-size:10px;color:#888; }
            .diary-entry { padding:6px;border-bottom:1px solid #333;cursor:pointer; }
            .diary-entry:hover { background:rgba(255,255,255,0.05); }
            .diary-summary { display:flex;justify-content:space-between;align-items:center; }
            .diary-mode { font-weight:bold;font-size:12px; }
            .diary-score { font-size:14px;color:#FFD700; }
            .diary-time { font-size:11px;color:#AAA; }
            .diary-date { font-size:11px;color:#666; }
            .diary-detail { margin-top:6px;padding:8px;background:rgba(0,0,0,0.3);border-radius:4px; }
            .diary-stats { display:grid;grid-template-columns:repeat(2,1fr);gap:4px;font-size:11px;color:#CCC; }
            .diary-delete { margin-top:8px;padding:4px 10px;background:#C03;color:white;border:none;border-radius:4px;cursor:pointer;font-size:10px; }
            .panel-subtitle { text-align:center;font-size:12px;color:#AAA;margin:4px 0 12px 0; }
            #diaryFilter { text-align:center;margin:8px 0; }
            #diaryFilter select { background:#222;color:white;border:1px solid #555;padding:4px 8px;border-radius:4px;font-size:11px; }
            @media (display-mode: standalone) { #dpad { padding-bottom:max(8px, env(safe-area-inset-bottom)); } }
        </style>

    <script>
        // --- Anonymous player counter (FOV-2041) ---
        // Anonymous counters via Abacus (abacus.jasoncameron.dev, free CORS counting
        // API): page loads, per-UTC-day loads, games started, games finished. No cookies, no fingerprinting,
        // no personal data, nothing stored. Fires ONLY on the public deployment
        // (j3k0.github.io) — local runs and test harnesses are never counted.
        const _snakesCount = location.hostname === 'j3k0.github.io'
            ? function (key) { try { fetch('https://abacus.jasoncameron.dev/hit/j3k0.github.io/' + key, { mode: 'no-cors', keepalive: true }); } catch (e) {} }
            : function () {};
        _snakesCount('load');
        _snakesCount('day-' + new Date().toISOString().slice(0, 10)); // distinct visiting days

        const TILE_SIZE = 20;
        const CANVAS_WIDTH = 440;
        const CANVAS_HEIGHT = 600;
        // v8 A: HiDPI/Retina backing store — scale by devicePixelRatio (capped at 3).
        // All draw code keeps using logical CANVAS_WIDTH/CANVAS_HEIGHT coords; the base
        // transform (set in drawGame) maps logical→backing pixels. CSS size is managed
        // separately by resizeCanvas().
        let DPR = Math.min(window.devicePixelRatio || 1, 3);
        const PLAY_WIDTH = 400;
        const PLAY_HEIGHT = 400;
        const PLAY_MARGIN_LEFT = 20;
        const PLAY_MARGIN_TOP = 50;
        const BASE_SPEED = 120;
        const MIN_SPEED = 50;
        const MAX_OBSTACLE_PERCENT = 0.20;
        const OBSTACLE_SPAWN_INTERVAL = 200;

        function ensureGridCache() {
            const theme = GRID_THEMES[cosmetics.grid] || GRID_THEMES.grid_classic;
            // v8 A: DPR in the cache key so a DPR change rebuilds the cache (resizeCanvas
            // does not call ensureGridCache — the key mismatch triggers the rebuild).
            // v8 C: gridVisible in the key so toggling lines rebuilds bg-only vs full.
            const cacheKey = cosmetics.grid + (highContrast ? '_hc' : '') + (DPR !== 1 ? '_dpr' + DPR : '') + (gridVisible ? '_g' : '_bg') + (cvdPalette !== 'off' ? '_cvd' + cvdPalette : '');
            if (gridCacheCanvas && gridCacheTheme === cacheKey) return;
            if (!gridCacheCanvas) {
                gridCacheCanvas = document.createElement('canvas');
            }
            gridCacheCanvas.width = PLAY_WIDTH * DPR;
            gridCacheCanvas.height = PLAY_HEIGHT * DPR;
            gridCacheTheme = cacheKey;
            const gctx = gridCacheCanvas.getContext('2d');
            gctx.setTransform(DPR, 0, 0, DPR, 0, 0);
            gctx.fillStyle = theme.bg;
            gctx.fillRect(0, 0, PLAY_WIDTH, PLAY_HEIGHT);
            if (gridVisible) {
                gctx.strokeStyle = highContrast ? 'rgba(255,255,255,0.15)' : theme.stroke;
                gctx.lineWidth = 1;
                gctx.beginPath();
                for (let x = 0; x <= PLAY_WIDTH; x += TILE_SIZE) {
                    gctx.moveTo(x, 0);
                    gctx.lineTo(x, PLAY_HEIGHT);
                }
                for (let y = 0; y <= PLAY_HEIGHT; y += TILE_SIZE) {
                    gctx.moveTo(0, y);
                    gctx.lineTo(PLAY_WIDTH, y);
                }
                gctx.stroke();
            }
        }

        const canvas = document.getElementById('gameCanvas');
        canvas.width = CANVAS_WIDTH * DPR;
        canvas.height = CANVAS_HEIGHT * DPR;
        const ctx = canvas.getContext('2d');
        canvas.addEventListener('contextmenu', e => e.preventDefault());
        const scoreEl = document.getElementById('score');
        const highScoreEl = document.getElementById('highScore');
        const toastEl = document.getElementById('toast');
        const comboDisplayEl = document.getElementById('comboDisplay');
        const xpDisplayEl = document.getElementById('xpDisplay');
        const panelBackdropEl = document.getElementById('panelBackdrop');

        let snake = [];
        let food = {};
        var food2 = null; // v6: Echo Brew duplicate food
        let extraFoods = []; // v9 D: shared array for portal + hoard foods
        let transientRings = []; // v9 F: shared visual rings (hunter dust, bounty burst, power-up shockwave)
        let hoardActive = false; // v9 E: Golden Hoard event state (declared here so F can reference it before E)
        let hazards = []; // v10 C: Hazard Zones — temporal pulsing danger tiles
        let scoreMultiplier = 1; // v9 E: hoard score multiplier (declared here for same reason)
        // v11 A: Hazard Chain Bonus — stacking multiplier for eating adjacent to on-phase hazards
        let hazardChainStreak = 0;
        let hazardAdjacentThisTick = false;
        // v13: index of the rival whose segments the player's HEAD contacted this tick, or -1.
        // Rule 1 (checkPlayerDeath) owns that contact: if a save absorbed it, rule 2 must not
        // re-adjudicate the same collision in the player's favour. In a head-on swap the
        // rival's new head lands on the tile the player just left — which after the unshift
        // is snake[1], the neck — so the si=1 skip alone does not cover it, and a shielded
        // charge paid a credited kill the base build never gave.
        let rivalHeadContactIdx = -1;
        let dx = 0;
        let dy = 0;
        let score = 0;

        // v11 F: Save Corruption Auto-Recovery — quarantine corrupted keys instead of
        // silently returning defaults. Populated during load; read once for the toast.
        const quarantinedKeys = new Set();
        function quarantineKey(key) {
            try {
                var raw = localStorage.getItem(key);
                if (raw !== null && !key.startsWith('snake_corrupt_')) {
                    localStorage.setItem('snake_corrupt_' + key, raw);
                    quarantinedKeys.add(key);
                }
            } catch (e) { /* localStorage unavailable */ }
        }
        // === PROGRESSION SYSTEM ===
        const saveManager = {
            get(key, defaultVal) {
                try { const v = localStorage.getItem(key); return v !== null ? v : defaultVal; }
                catch(e) { return defaultVal; }
            },
            set(key, value) {
                try { localStorage.setItem(key, String(value)); }
                catch(e) { /* localStorage unavailable */ }
            },
            getInt(key, defaultVal) {
                // NaN-only fallback: a legitimately stored 0 (e.g. daily attempts
                // exhausted, shake intensity 0) must NOT resurrect the default.
                try {
                    const v = localStorage.getItem(key);
                    if (v === null) return defaultVal;
                    const n = parseInt(v, 10);
                    return isNaN(n) ? defaultVal : n;
                }
                catch(e) { return defaultVal; }
            },
            getJSON(key, defaultVal, validator) {
                try {
                    const v = localStorage.getItem(key);
                    if (v === null) return defaultVal;
                    const parsed = JSON.parse(v);
                    if (validator && !validator(parsed)) {
                        quarantineKey(key);
                        return defaultVal;
                    }
                    return parsed;
                } catch(e) {
                    if (!key.startsWith('snake_corrupt_')) quarantineKey(key);
                    return defaultVal;
                }
            },
            setJSON(key, value) {
                try { localStorage.setItem(key, JSON.stringify(value)); }
                catch(e) { /* localStorage unavailable */ }
            },
            remove(key) {
                try { localStorage.removeItem(key); }
                catch(e) { /* localStorage unavailable */ }
            }
        };
        let highScore = saveManager.getInt('snake_high_score', 0);
        let gameTimeout = null;

        function scheduleNextTick() {
            if (gameTimeout) return;
            if (gameState !== 'playing') return;
            gameTimeout = setTimeout(() => {
                gameTimeout = null;
                updateGame();
                if (gameState === 'playing') {
                    scheduleNextTick();
                }
            }, tickInterval);
        }

        function stopGameLoop() {
            if (gameTimeout) { clearTimeout(gameTimeout); gameTimeout = null; }
        }

        let gameState = 'idle';
        let dirQueue = [];          // v10 G: 2-deep input buffer (replaces nextDirection)
        let lastConsumedDir = { dx: 1, dy: 0 }; // for reverse-check when queue is empty
        let audioCtx = null;
        let muted = saveManager.getInt('snake_muted', 0);
        let highContrast = saveManager.get('snake_high_contrast', '') === '1';
        // v10 F: Colorblind (CVD) food palettes — remap food-tier colors to
        // Okabe-Ito confusion-line-safe hues. 'off' = no remap.
        let cvdPalette = saveManager.get('snake_cvd_palette', 'off');
        const CVD_PALETTES = {
            off: null,
            protan: { // Protanopia — red-blind
                common:   { fill: '#0072B2', outline: '#004F7C' },   // blue
                uncommon: { fill: '#E69F00', outline: '#B37A00' },   // orange
                rare:     { fill: '#009E73', outline: '#006D52' },   // green-teal
                epic:     { fill: '#CC79A7', outline: '#A35587' },   // magenta
                bonus:   { fill: '#F0E442', outline: '#B8B132' },   // yellow
                speed:   { fill: '#56B4E9', outline: '#3A8AC4' },   // sky-blue
                hunter:  { fill: '#D55E00', outline: '#A04700' },   // vermillion
                bomb:    { fill: '#999999', outline: '#666666' },   // grey (for bomb)
            },
            deutan: { // Deuteranopia — green-blind (same Okabe-Ito safe set)
                common:   { fill: '#0072B2', outline: '#004F7C' },
                uncommon: { fill: '#E69F00', outline: '#B37A00' },
                rare:     { fill: '#009E73', outline: '#006D52' },
                epic:     { fill: '#CC79A7', outline: '#A35587' },
                bonus:   { fill: '#F0E442', outline: '#B8B132' },
                speed:   { fill: '#56B4E9', outline: '#3A8AC4' },
                hunter:  { fill: '#D55E00', outline: '#A04700' },
                bomb:    { fill: '#999999', outline: '#666666' },
            },
            tritan: { // Tritanopia — blue-blind
                common:   { fill: '#D55E00', outline: '#A04700' },   // vermillion
                uncommon: { fill: '#E69F00', outline: '#B37A00' },   // orange
                rare:     { fill: '#009E73', outline: '#006D52' },   // green
                epic:     { fill: '#CC79A7', outline: '#A35587' },   // magenta
                bonus:   { fill: '#F0E442', outline: '#B8B132' },   // yellow
                speed:   { fill: '#0072B2', outline: '#004F7C' },   // blue
                hunter:  { fill: '#999999', outline: '#666666' },   // grey
                bomb:    { fill: '#56B4E9', outline: '#3A8AC4' },   // sky-blue
            },
        };
        function foodColor(type) {
            const p = CVD_PALETTES[cvdPalette];
            if (p && p[type]) return p[type].fill;
            return FOOD_TIERS[type] ? FOOD_TIERS[type].color : '#FFF';
        }
        function foodOutlineColor(type) {
            const p = CVD_PALETTES[cvdPalette];
            if (p && p[type]) return p[type].outline;
            return FOOD_TIERS[type] ? FOOD_TIERS[type].color : '#FFF';
        }
        function setCvdPalette(type) {
            cvdPalette = type;
            saveManager.set('snake_cvd_palette', type);
            gridCacheTheme = null;
            visualDirty = true;
            renderSettings();
        }
        // v8 C: grid-lines visibility (themed bg always paints; this gates lines only).
        let gridVisible = saveManager.get('snake_grid_visible', '1') === '1';
        // v8 B: Calm Mode — reduced-motion accessibility. 'auto' follows the OS
        // prefers-reduced-motion setting; 'on'/'off' override it. Persists via saveManager.
        let calmMode = saveManager.get('snake_calm_mode', 'auto');
        let displayedScore = 0;
        const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
        function calmModeEffective() {
            return calmMode === 'on' || (calmMode === 'auto' && prefersReducedMotion.matches);
        }
        prefersReducedMotion.addEventListener('change', function() { visualDirty = true; });
        // v8 C: Settings sliders (declared here so the folded-shake line and
        // spawnParticles gating can reference them; populated by the Settings panel).
        let shakeIntensity = saveManager.getInt('snake_shake_intensity', 100);
        let particleDensity = saveManager.getInt('snake_particle_density', 100);
        let particles = [];
        // v7 D4: snake-decay death fragments — REPLACE the old death particle burst.
        // Spawned tail-to-head in gameOver(); updated/rendered additively in the rAF
        // loop. deathFragmentsActive gates rendering so the array isn't scanned when
        // no death sequence is in flight. Capped at 400 fragments.
        let deathFragments = [];
        let deathFragmentsActive = false;
        let shakeTimer = 0;
        // v8 A: shake offset folded into drawGame's base transform (visual state,
        // written only in animateVisuals, read in drawGame). Replaces the old
        // save()/translate()/restore() shake wrapper around the drawGame call.
        let shakeOffsetX = 0;
        let shakeOffsetY = 0;
        let obstacles = [];
        let lastFrameTime = 0;

// v6: Resonance detection and cascade multiplier
// v12 A CRITICAL FIX: RESONANCES is authored in hand-written order, but detection
// sorts the drafted mutators before joining them. 5 of the 8 keys were therefore
// UNREACHABLE — e.g. the table holds 'golden_food~chaos_seed' while a lookup of those
// two mutators builds 'chaos_seed~golden_food'. Only the 3 keys that happened to be
// written in sorted order (gravity~mirror, gravity~mirror~phase_shift,
// golden_food~hunger_clock~shrink_zone) could ever match, and none of those three had a
// working effect either — so NO resonance ever did anything. Canonicalising the table
// once at load makes the authored order irrelevant.
var RESONANCE_BY_KEY = (function () {
    var map = {};
    for (var k in RESONANCES) {
        if (!Object.prototype.hasOwnProperty.call(RESONANCES, k)) continue;
        var canonical = k.split('~').sort().join('~');
        map[canonical] = RESONANCES[k];
    }
    return map;
})();

function detectResonance(mutators) {
    var sorted = mutators.slice().sort();
    var key = sorted.join('~');
    return RESONANCE_BY_KEY[key] || null;
}

// v12 A: Resonance implementation. Before v12 only `invertControls` (a white
// flash) and `feastFamine` (an empty if) had ANY code; the other six effects were
// detected, named in the HUD, and did nothing.
//
// CRITICAL: `resonanceActive()` exists because the mutator blocks that consume
// resonance state (hunger at ~L6650) execute ABOVE the tick's resonance
// recomputation. Using the `activeResonance` global there would read the PREVIOUS
// tick's value; any cadence state stored on the resonance object itself would be
// reset on every recomputation (~8x/second). All cadence state lives in the
// module counters below, and readers derive from `activeMutators` via the same
// sorted-key match `detectResonance` uses.
function resonanceActive(effect) {
    var r = detectResonance(activeMutators);
    return !!r && r.effect === effect;
}

// Cadence counters. Because a resonance's effect is exact-key matched, at most one
// resonance is ever active, but these are kept independent anyway.
let intangibleWindowTicks = 0;  // intangiblePhase: self-exemption window
let resonanceInvertTicks = 0;   // invertControls: remaining inverted ticks
let resonanceInvertCooldown = 0; // invertControls: ticks until the next window
let resonanceToggleTick = 0;    // quantumToggle: 15-tick alternator
let resonanceMirrorSuspended = 0; // quantumToggle: mirror off for N ticks
let chaosCycleIndex = 0;        // chaosCycle: which sub-effect is live

// v12 A: food-award multiplier for the two score resonances. Applied at the FOOD
// AWARD SITES, never inside addScore — addScore also serves bounties, quests,
// achievements, the survival drip and the session-end bonus, and the descriptors
// promise "food" points/XP specifically. Note golden_food's own x3 is applied to
// `amount` inside addScore BEFORE the Math.min(totalMult,4) cap, so the cap does
// not bound this multiplier — the food site is the correct seam.
function foodResonanceMult() {
    if (resonanceActive('doubleGold')) return 2;
    if (resonanceActive('feastFamine')) return 4;
    return 1;
}

// v12 A: feastFamine shortens the hunger pop interval from 50 to 30 ticks.
function hungerInterval() {
    return resonanceActive('feastFamine') ? 30 : 50;
}

// v12 A: chaosCycle rotates gravity / mirror / phase_shift through 5-tick windows.
// Written as an ADDITIVE gate — `mutator is on AND the cycle allows it` — never as
// a replacement of the mutator checks, so a player who drafted a SUBSET of those
// three can never be affected (and cannot enter this branch at all: the resonance
// keys on the sorted full set).
var CHAOS_CYCLE_EFFECTS = ['gravity', 'mirror', 'phase_shift'];
function chaosCycleAllows(name) {
    if (!resonanceActive('chaosCycle')) return true;
    return CHAOS_CYCLE_EFFECTS[chaosCycleIndex % CHAOS_CYCLE_EFFECTS.length] === name;
}

// v12 A: per-tick resonance cadence. Called from the tick loop where the old
// inline resonance block used to be.
function tickResonance() {
    activeResonance = detectResonance(activeMutators);
    if (!activeResonance) {
        resonanceInvertTicks = 0;
        resonanceInvertCooldown = 0;
        resonanceMirrorSuspended = 0;
        return;
    }
    // v12 A: one-shot onboarding the first time a resonance goes live (mirrors the
    // hasSeenPortal / hasSeenBomb / hasSeenComboBank pattern).
    if (!hasSeenResonance) {
        hasSeenResonance = true;
        saveManager.set('snake_has_seen_resonance', '1');
        queueToast('✦ ' + activeResonance.name + ': ' + activeResonance.desc, 5000, 'normal');
    }
    var eff = activeResonance.effect;
    if (eff === 'invertControls') {
        if (resonanceInvertTicks > 0) {
            resonanceInvertTicks--;
        } else if (resonanceInvertCooldown > 0) {
            resonanceInvertCooldown--;
        } else {
            // Deterministic cadence (was Math.random, which broke seeded runs).
            resonanceInvertTicks = 5;
            resonanceInvertCooldown = 10 + Math.floor(seededRandom() * 6);
            flashOverlay = { color: '#FFFFFF', alpha: 0.2, priority: 'normal' };
            queueGameEffect('flash', { color: '#FFFFFF', alpha: 0.2, priority: 'normal' });
            spawnFloater(PLAY_WIDTH / 2, PLAY_HEIGHT / 2, 'AXES SWAPPED!', '#FFFFFF', 20, 1.0);
        }
    }
    if (eff === 'chaosCycle' && gameTick > 0 && gameTick % 5 === 0) {
        chaosCycleIndex = (chaosCycleIndex + 1) % CHAOS_CYCLE_EFFECTS.length;
    }
    if (eff === 'quantumToggle' && gameTick > 0 && gameTick % 15 === 0) {
        resonanceToggleTick = (resonanceToggleTick + 1) % 2;
        if (resonanceToggleTick === 0) {
            // Suspend the mirror flip for 5 ticks — reads as "controls un-reverse".
            resonanceMirrorSuspended = 5;
            spawnFloater(PLAY_WIDTH / 2, PLAY_HEIGHT / 2, 'MIRROR OFF', '#CC88FF', 20, 1.0);
        } else {
            // Real reassignment. A bare shuffleFoodWeights() call mutates nothing
            // (it RETURNS a fresh map) and would be silently inert.
            chaosCurrentWeights = shuffleFoodWeights();
            chaosShuffleTick = gameTick;
            spawnFloater(PLAY_WIDTH / 2, PLAY_HEIGHT / 2, 'TYPES SHUFFLED', '#CC88FF', 20, 1.0);
        }
    }
    if (resonanceMirrorSuspended > 0) resonanceMirrorSuspended--;
}

function getCascadeMultiplier(count) {
    if (count <= 1) return 1.0;
    return 0.5;
}

function purchaseBrew(id) {
    var brew = BREWS_CONFIG.find(function(b) { return b.id === id; });
    if (!brew || unlockedBrews.includes(id)) return false;
    if (mutatorTokens < brew.cost) { queueToast('Not enough mutator tokens!', 2000); return false; }
    mutatorTokens -= brew.cost;
    unlockedBrews.push(id);
    saveManager.setJSON('snake_unlocked_brews', unlockedBrews);
    saveManager.set('snake_mutator_tokens', String(mutatorTokens));
    saveManager.setJSON('snake_equipped_brews', equippedBrews);
    queueToast('🧪 Unlocked ' + brew.name + '!', 3000);
    renderBrewsPanel();
    return true;
}

function equipBrew(id) {
    if (!unlockedBrews.includes(id)) { purchaseBrew(id); return; }
    if (equippedBrews.includes(id)) { equippedBrews = equippedBrews.filter(function(b) { return b !== id; }); saveManager.setJSON('snake_equipped_brews', equippedBrews); renderBrewsPanel(); return; }
    if (equippedBrews.length >= 2) { queueToast('Max 2 brews equipped! Unequip one first.', 2000); return; }
    var brew = BREWS_CONFIG.find(function(b) { return b.id === id; });
    if (brew && brew.mutuallyExclusive) {
        for (var mi = 0; mi < brew.mutuallyExclusive.length; mi++) {
            equippedBrews = equippedBrews.filter(function(b) { return b !== brew.mutuallyExclusive[mi]; });
        }
    }
    equippedBrews.push(id);
    saveManager.setJSON('snake_equipped_brews', equippedBrews);
    renderBrewsPanel();
}

function renderBrewsPanel() {
    var grid = document.getElementById('brewsGrid');
    if (!grid) return;
    var html = '';
    for (var bi = 0; bi < BREWS_CONFIG.length; bi++) {
        var brew = BREWS_CONFIG[bi];
        var unlocked = unlockedBrews.includes(brew.id);
        var equipped = equippedBrews.includes(brew.id);
        var canAfford = mutatorTokens >= brew.cost;
        var statusClass = unlocked ? (equipped ? 'equipped' : 'unlocked') : (canAfford ? 'unlocked' : 'locked');
        var actionText = unlocked ? (equipped ? '✓ Equipped' : 'Tap to equip') : (canAfford ? '🔑 Unlock (' + brew.cost + ' tokens)' : '🔒 ' + brew.cost + ' tokens');
        html += '<div class="brew-card ' + statusClass + '" onclick="equipBrew(\'' + brew.id + '\')" role="button" tabindex="0"><div class="brew-name">' + brew.name + '</div><div class="brew-desc">' + brew.desc + '</div><div class="brew-cost">' + actionText + '</div></div>';
    }
    grid.innerHTML = html;
    var tc = document.getElementById('brewTokenCount');
    if (tc) tc.textContent = mutatorTokens;
}

            for (let i = 0; i < dateStr.length; i++) {
                hash = ((hash << 5) - hash) + dateStr.charCodeAt(i);
                hash |= 0;
            }
            return Math.abs(hash);
        }

        // ============================================================
        // v7 Feature C: Quest Board (Daily/Weekly Missions)
        // 3 daily + 3 weekly missions, deterministic per day/ISO-week seed.
        // Rewards are XP only (NOT mutator tokens) per design review —
        // flooding the token economy would destroy its scarcity.
        // checkQuestProgress() is a parallel session-end hook: it MUST be

        let dailyQuests = [];

        function getDayString() {
            const d = new Date();
            return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
        }

        // ISO-8601 week string: 'YYYY-Www'. Monday-anchored, week 1 = first week
        // with a Thursday. Deterministic per calendar week across runs.
        function getISOWeekString() {
            const d = new Date();
            const tmp = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
            const dayNum = (tmp.getUTCDay() + 6) % 7; // 0 = Monday
            tmp.setUTCDate(tmp.getUTCDate() - dayNum + 3); // nearest Thursday
            const firstThursday = tmp.getTime();
            tmp.setUTCMonth(0, 1);
            if (tmp.getUTCDay() !== 4) {
                tmp.setUTCMonth(0, 1 + ((4 - tmp.getUTCDay()) + 7) % 7);
            }
            const weekNum = 1 + Math.round((firstThursday - tmp.getTime()) / (7*24*3600*1000));
            return tmp.getUTCFullYear() + '-W' + String(weekNum).padStart(2,'0');
        }

        function hashString(s) {
            let h = 0;
            for (let i = 0; i < s.length; i++) {
                h = ((h << 5) - h) + s.charCodeAt(i);
                h |= 0;
            }
            return Math.abs(h);
        }

        // Maps a quest's progressKey to its current live value. Run-based
        // metrics (score, length, combo, time, food counts) track the BEST
        // single run of the period via Math.max in checkQuestProgress — this
        // mirrors the existing daily-challenge semantics, not cumulative totals.
        // The reader receives the quest so param-driven keys (modeScore,
        // modePlayed) can inspect param.mode.
        const QUEST_PROGRESS_MAP = {
            snakeLength: () => snake.length,
            score: () => score,
            maxCombo: () => sessionMaxCombo,
            timeAlive: (q) => Math.min(sessionTimeAlive, q.target),
            foodEaten: () => sessionFoodEaten,
            speedFood: () => sessionSpeedFood,
            bonusFood: () => sessionBonusFood,
            modePlayed: (q) => (gameMode === (q.param && q.param.mode)) ? 1 : 0,
            modeScore: (q) => (gameMode === (q.param && q.param.mode)) ? score : 0,
            walledScore: () => (gameMode === 'walled') ? score : 0,
            mutatorUsed: () => activeMutators.length > 0 ? 1 : 0,
            brewUsed: () => activeBrews.length > 0 ? 1 : 0,
        };

        function instantiateQuest(template, target, period) {
            const displayN = template.progressKey === 'timeAlive'
                ? (target / 1000) + 's'
                : String(target);
            const xp = period === 'daily' ? template.xpDaily : template.xpWeekly;
            return {
                id: 'q_' + period + '_' + template.id + '_' + target,
                templateId: template.id,
                desc: template.desc.replace('{n}', displayN),
                progressKey: template.progressKey,
                param: template.param || null,
                progress: 0,
                target: target,
                completed: false,
                claimed: false,
                reward: { xp: xp },
                period: period,
            };
        }

        // Deterministic per day/week: same seed string → same 3 quests. Picks
        // 3 distinct templates from the period's pool, then a target from each
        // template's pool, both driven by mulberry32(seedHash).
        function generateQuests(period) {
            const seedStr = (period === 'daily' ? getDayString() : getISOWeekString()) + '_quests_' + period;
            const rng = mulberry32(hashString(seedStr));
            const pool = QUEST_TEMPLATES.filter(t => (period === 'daily' ? t.daily : t.weekly).length > 0);
            const chosen = [];
            const usedIdx = new Set();
            while (chosen.length < 3 && usedIdx.size < pool.length) {
                const idx = Math.floor(rng() * pool.length);
                if (usedIdx.has(idx)) continue;
                usedIdx.add(idx);
                const t = pool[idx];
                const targets = period === 'daily' ? t.daily : t.weekly;
                const target = targets[Math.floor(rng() * targets.length)];
                chosen.push(instantiateQuest(t, target, period));
            }
            return chosen;
        }

        // Update progress for all active quests. Called from the food-eat
        // block (length/food/combo movement) AND from BOTH gameOver() and
        // endZenSession() — the parallel session-end paths (AGENTS.md).
        // Progress is monotonic (Math.max) so it survives across runs in the
        // same period; newly-completed quests toast once.
        function checkQuestProgress() {
            let changed = false;
            let newlyCompleted = null;
            const all = dailyQuests.concat(weeklyQuests);
            for (let i = 0; i < all.length; i++) {
                const q = all[i];
                if (q.completed) continue;
                const reader = QUEST_PROGRESS_MAP[q.progressKey];
                if (!reader) continue;
                const current = reader(q) || 0;
                if (current > q.progress) { q.progress = current; changed = true; }
                if (q.progress >= q.target) { q.completed = true; changed = true; if (!newlyCompleted) newlyCompleted = q; }
            }
            if (changed) persistQuests();
            if (newlyCompleted) queueToast('🎯 Quest complete: ' + newlyCompleted.desc, 2800);
        }

        // Atomic claim: set claimed, award XP, persist — all synchronous, no
        // await between them, so a crash mid-claim cannot leave a half-state.
        function claimQuest(period, index) {
            const list = period === 'daily' ? dailyQuests : weeklyQuests;
            const q = list[index];
            if (!q || !q.completed || q.claimed) return;
            q.claimed = true;
            awardXP(q.reward.xp);
            persistQuests();
            queueToast('🎯 Claimed: +' + q.reward.xp + ' XP', 2500);
            renderQuests();

        }

            saveManager.setJSON('snake_daily_quests', dailyQuests);

        // Staleness check — page load + idle render only (NOT during gameplay).
        // If the stored date doesn't match today / this ISO week, regenerate;
        // otherwise restore persisted quests. Always re-persists so the date
        // keys stay current even on a fresh generate.
        function syncQuestState() {
            const today = getDayString();
            const thisWeek = getISOWeekString();
            if (saveManager.get('snake_daily_quest_date', '') !== today) {
                dailyQuests = generateQuests('daily');
            } else {
                const saved = saveManager.getJSON('snake_daily_quests', null);
                dailyQuests = (Array.isArray(saved) && saved.length === 3) ? saved : generateQuests('daily');
            }
            if (saveManager.get('snake_weekly_quest_date', '') !== thisWeek) {
                weeklyQuests = generateQuests('weekly');
            } else {
                const saved = saveManager.getJSON('snake_weekly_quests', null);
                weeklyQuests = (Array.isArray(saved) && saved.length === 3) ? saved : generateQuests('weekly');
            }
            persistQuests();
        }

        // Human-readable "resets in Xh Ym" for the period boundary.
        function questResetCountdown(period) {
            const now = new Date();
            let next;
            if (period === 'daily') {
                next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 0, 0);
            } else {
                const dayIdx = (now.getDay() + 6) % 7; // 0 = Monday
                const daysToMonday = (7 - dayIdx) % 7 || 7;
                next = new Date(now.getFullYear(), now.getMonth(), now.getDate() + daysToMonday, 0, 0, 0, 0);
            }
            const ms = Math.max(0, next - now);
            const h = Math.floor(ms / 3600000);
            const m = Math.floor((ms % 3600000) / 60000);
            return h + 'h ' + m + 'm';
        }

        // --- end v8 Feature C ---
        // v9 A: Save Data Export/Import — download/restore all snake_* localStorage keys.
        function exportSaveData() {
            var keys = {};
            try {
                Object.keys(localStorage).filter(function(k) { return k.indexOf('snake_') === 0; }).forEach(function(k) { keys[k] = localStorage.getItem(k); });
            } catch (e) { queueToast('Export failed: ' + e.message, 2000); return; }
            var data = { format: 'snakes-backup', version: 1, exportedAt: new Date().toISOString(), keys: keys };
            var blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = 'snakes-backup-' + new Date().toISOString().slice(0, 10) + '.json';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            queueToast('Backup exported!', 2000);
        }
        function importSaveData(file) {
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(e) {
                try {
                    var data = JSON.parse(e.target.result);
                    if (!data || data.format !== 'snakes-backup' || data.version !== 1) {
                        queueToast('Invalid backup file', 2000);
                        return;
                    }
                    if (!confirm('Importing will overwrite all current save data. Continue?')) return;
                    // Only snake_-prefixed string keys (same filter as export) — a
                    // crafted backup must not clobber unrelated origin localStorage.
                    Object.keys(data.keys).forEach(function(k) {
                        if (k.indexOf('snake_') !== 0) return;
                        if (typeof data.keys[k] !== 'string') return;
                        localStorage.setItem(k, data.keys[k]);
                    });
                    if (quarantinedKeys.size > 0) queueToast('⚠ Some imported keys were corrupt — backed up. Reload to apply.', 4000);
                    queueToast('Backup imported! Reload to apply.', 3000);
                } catch (err) {
                    queueToast('Import failed: ' + err.message, 2000);
                }
            };
            reader.readAsText(file);
        }

        let gameMode = 'classic';

                classic: 'Standard Snake. Speed increases with score. Board closes in over time.',
                timeAttack: 'Score max points in 60 seconds. Fixed speed, bonus food worth +50.',

        function getSpeed() {
            const mc = MODE_CONFIG[gameMode];
            if (typeof mc.speed === 'number') return mc.speed;
            return Math.max(MIN_SPEED, BASE_SPEED - Math.floor(score / 50) * 5);
        }

        function getEffectiveSpeed() {
            // Returns the tick interval in ms (smaller = faster snake). slowMo doubles
            // it (slower); the Swift evolution divides it by (1+bonus) for +5% speed.
            let speed = slowMoActive ? getSpeed() * 2 : getSpeed();
            // v7: Swift evolution — +5% speed = ~5% smaller tick interval. Recomputed
            // live every call so it never needs snapshot/restore across slowMo changes.
            if (evolutionTier >= 0) speed /= (1 + EVOLUTION_TIERS[0].speedBonus);
            return speed;
        }

        // Speed-boost target: 30ms faster than the CURRENT effective speed
        // (recomputed live, so slow-mo activates/deactivations adjust the boosted
        // target per the Speed Boost System rule), but never SLOWER than it — at
        // the MIN_SPEED floor with Swift evolution the raw clamp would invert the
        // boost into a slowdown.
        function getBoostedSpeed() {
            const eff = getEffectiveSpeed();
            return Math.min(eff, Math.max(MIN_SPEED, eff - 30));
        }

        function getOverchargeMultiplier() {
            if (level < 20) return 1;
            const bonus = Math.min(0.50, Math.floor(xpOvercharge / 1000) * 0.01);
            return 1 + bonus;
        }

        function addScore(amount) {
            if (gameMode === 'zen' || gameMode === 'painter') {
                if (gameMode === 'zen') score = snake.length;
                updateScoreDisplay();
                return;
            }
            const multi = (pinnacleRank > 0 ? (1 + pinnacleRank * 0.02) : 1) * getOverchargeMultiplier();
            if (gameMode === 'gauntlet') {
                for (var gpi = 0; gpi < gauntletPicks.length; gpi++) {
                    if (gauntletPicks[gpi].id === 'score_boost') {
                        amount = Math.floor(amount * 1.5);
                        break;
                    }
                }
            }
            if (activeMutators.indexOf('golden_food') !== -1) {
                amount = Math.round(amount * 3);
            }
            // v9 E: hoard scoreMultiplier (cap with golden_food to prevent ×6 trivialization)
            var effectiveHoardMult = scoreMultiplier;
            // v11 C: Pigment Rush overrides hoard ×2 with ×3 (the rush IS the climax)
            if (pigmentRushActive) {
                effectiveHoardMult = activeMutators.indexOf('golden_food') !== -1 ? 2 : 3; // golden+rush caps at ×2
            } else if (activeMutators.indexOf('golden_food') !== -1 && scoreMultiplier > 1) {
                effectiveHoardMult = Math.min(scoreMultiplier, 1.5); // Hoard + Golden Age = ×4.5 max
            }
            // v11 A: Hazard Chain Bonus multiplier + global cap (prevents ×7.5 compounding)
            var hazardChainMult = (hazardAdjacentThisTick && hazardChainStreak > 0) ? (1 + Math.min(hazardChainStreak, 3) * 0.5) : 1;
            var totalMult = Math.min(multi * effectiveHoardMult * hazardChainMult, 4);
            score += Math.round(amount * totalMult);
            updateScoreDisplay();
        }

        function vibrate(duration) {
            if (navigator.vibrate) {

                }
            }
        }

        function pickRandomFoodType() {
            const rand = seededRandom();
            if (activeMutators.indexOf('chaos_seed') !== -1 && chaosCurrentWeights) {
                var chaosCum = 0;
                for (var ck in chaosCurrentWeights) {
                    chaosCum += chaosCurrentWeights[ck];
                    if (rand < chaosCum) return ck;
                }
            }
            // v8 E: in Walled (wrap:false) modes, hunter can't spawn (flee bias needs
            // wrapping). The chaos branch above is handled by shuffleFoodWeights' filter.
            const tiers = MODE_CONFIG[gameMode].wrap === false
                ? Object.fromEntries(Object.entries(FOOD_TIERS).filter(([k]) => k !== 'hunter' && k !== 'bomb'))
                : FOOD_TIERS;
            // Normalize by the (possibly reduced) total so a filtered Walled table
            // doesn't leave a dead band ([0.91,1.0) → 'common') skewing distribution.
            let totalW = 0;
            for (const typeKey in tiers) totalW += tiers[typeKey].weight;
            let cumulative = 0;
            for (const typeKey in tiers) {
                cumulative += tiers[typeKey].weight / totalW;
                if (rand < cumulative) return typeKey;
            }
            return 'common';
        }
        // v8 E: hunter food — fleeing prey. Fixed interval (no per-move random) so no
        // extra food-snapshot field is needed; type:'hunter' round-trips in the snapshot.
        const HUNTER_MOVE_INTERVAL = 3;
        function moveHunter() {
            if (!food || food.type !== 'hunter') return;
            var head = snake[0];
            var candidates = [
                { x: food.x + TILE_SIZE, y: food.y },
                { x: food.x - TILE_SIZE, y: food.y },
                { x: food.x, y: food.y + TILE_SIZE },
                { x: food.x, y: food.y - TILE_SIZE }
            ];
            var best = null, bestScore = -1;
            for (var ci = 0; ci < candidates.length; ci++) {
                var c = wrapPosition(candidates[ci]);
                // Reject occupied tiles: snake body, obstacles, rival, food2, power-up.
                if (snake.some(function(s) { return s.x === c.x && s.y === c.y; })) continue;
                if (obstacles.some(function(o) { return o.x === c.x && o.y === c.y; })) continue;
                if (rivals.some(function(r) { return r.active && r.snake.some(function(s) { return s.x === c.x && s.y === c.y; }); })) continue;
                if (food2 && food2.x === c.x && food2.y === c.y) continue;
                if (powerUpPickup && powerUpPickup.x === c.x && powerUpPickup.y === c.y) continue;
                // v9 D: reject extraFoods[] tiles (portal + hoard foods)
                if (extraFoods.some(function(ef) { return ef.x === c.x && ef.y === c.y; })) continue;
                // v10 C: reject on-phase hazard tiles (same as generateFood) so the
                // hunter never flees into a lethal zone.
                if (hazards.some(function(h) { return h.phase === 'on' && Math.abs(h.cx - c.x) + Math.abs(h.cy - c.y) <= h.radius; })) continue;
                // Wrap-aware Manhattan distance from head (PLAY dims, not CANVAS).
                var ddx = c.x - head.x, ddy = c.y - head.y;
                if (ddx > PLAY_WIDTH / 2) ddx -= PLAY_WIDTH; else if (ddx < -PLAY_WIDTH / 2) ddx += PLAY_WIDTH;
                if (ddy > PLAY_HEIGHT / 2) ddy -= PLAY_HEIGHT; else if (ddy < -PLAY_HEIGHT / 2) ddy += PLAY_HEIGHT;
                var dist = Math.abs(ddx) + Math.abs(ddy);
                // seededRandom() tiebreak so seeded challenge runs stay deterministic.
                var score = dist + seededRandom() * 0.5;
                if (score > bestScore) { bestScore = score; best = c; }
            }
            if (best) {
                // v9 F1: dust trail at the vacated cell (calm-mode: skip)
                if (!calmModeEffective()) pushTransientRing(food.x + TILE_SIZE / 2, food.y + TILE_SIZE / 2, 6, '#8B7355', 300, 'dust');
                food.x = best.x; food.y = best.y; food.spawnTime = performance.now();
            }
        }

        function generateFood(currentSnake) {
            const totalTiles = (PLAY_WIDTH / TILE_SIZE) * (PLAY_HEIGHT / TILE_SIZE);
            if (currentSnake.length + obstacles.length + extraFoods.length >= totalTiles) return null;

            let newFood;
            let iterations = 0;
            const MAX_ITERATIONS = 200;
            do {
                if (iterations++ > MAX_ITERATIONS) {
                    // Board is nearly full — scan all tiles for a free spot
                    const freeTiles = [];
                    const cols = PLAY_WIDTH / TILE_SIZE;
                    const rows = PLAY_HEIGHT / TILE_SIZE;
                    for (let x = 0; x < cols; x++) {
                        for (let y = 0; y < rows; y++) {
                            const tx = x * TILE_SIZE;
                            const ty = y * TILE_SIZE;
                            if (currentSnake.some(s => s.x === tx && s.y === ty)) continue;
                            if (obstacles.some(o => o.x === tx && o.y === ty)) continue;
                            if (food && food.x === tx && food.y === ty) continue;
                            if (food2 && food2.x === tx && food2.y === ty) continue;
                            if (powerUpPickup && powerUpPickup.x === tx && powerUpPickup.y === ty) continue;
                            // v10 C: reject active hazard tiles — the near-full fallback
                            // must not place food inside a lethal zone.
                            if (hazards.some(h => h.phase === 'on' && Math.abs(h.cx - tx) + Math.abs(h.cy - ty) <= h.radius)) continue;
                            if (extraFoods.some(ef => ef.x === tx && ef.y === ty)) continue;
                            freeTiles.push({ x: tx, y: ty });
                        }
                    }
                    if (freeTiles.length === 0) return null;
                    const tile = freeTiles[Math.floor(seededRandom() * freeTiles.length)];
                    const fallbackFood = { x: tile.x, y: tile.y, type: pickRandomFoodType(), spawnTime: performance.now() };
                    if (fallbackFood.type === 'rare' || fallbackFood.type === 'epic') playSound('rare_spawn');
                    return fallbackFood;
                }

                const type = pickRandomFoodType();
                newFood = {
                    x: Math.floor(seededRandom() * (PLAY_WIDTH / TILE_SIZE)) * TILE_SIZE,
                    y: Math.floor(seededRandom() * (PLAY_HEIGHT / TILE_SIZE)) * TILE_SIZE,
                    type: type,
                    spawnTime: performance.now()
                };
            } while (currentSnake.some(segment => segment.x === newFood.x && segment.y === newFood.y) ||
                     obstacles.some(o => o.x === newFood.x && o.y === newFood.y) ||
                     (food2 && food2.x === newFood.x && food2.y === newFood.y) ||
                     (powerUpPickup && powerUpPickup.x === newFood.x && powerUpPickup.y === newFood.y) ||
                     // v10 C: reject active hazard tiles
                     hazards.some(h => h.phase === 'on' && Math.abs(h.cx - newFood.x) + Math.abs(h.cy - newFood.y) <= h.radius) ||
                     // v6: Rampage Brew — prefer food closer to head.
                     // v7: Titan evolution shrinks the cap by foodProximity tiles
                     // (stacks with Rampage; only meaningful while a cap is active).
                     (minFoodSpawnDist !== null && currentSnake.length > 0 &&
                      Math.abs(wrapAxisDelta(newFood.x - currentSnake[0].x, PLAY_WIDTH)) + Math.abs(wrapAxisDelta(newFood.y - currentSnake[0].y, PLAY_HEIGHT)) > Math.max(1, minFoodSpawnDist - ((evolutionTier >= 2) ? EVOLUTION_TIERS[2].foodProximity : 0)) * TILE_SIZE));
            if (newFood.type === 'rare' || newFood.type === 'epic') playSound('rare_spawn');
            // v9 D: epic food spawns a linked portal twin in extraFoods[] (non-Walled only)
            if (newFood && FOOD_TIERS[newFood.type] && FOOD_TIERS[newFood.type].portal && MODE_CONFIG[gameMode].wrap !== false) {
                var portalFood = findPortalTile(newFood, currentSnake);
                if (portalFood) {
                    portalFood.type = 'portal';
                    portalFood.spawnTime = performance.now();
                    portalFood.portalLink = { x: newFood.x, y: newFood.y };
                    newFood.portalLink = { x: portalFood.x, y: portalFood.y };
                    extraFoods.push(portalFood);
                    if (!hasSeenPortal) {
                        hasSeenPortal = true;
                        saveManager.set('snake_has_seen_portal', '1');
                        queueToast('🌀 Portal food! Eat to teleport to its twin.', 3000, 'low');
                    }
                }
            }
            return newFood;
        }

        // v9 D: find a distant free tile for the portal twin (min 10 tiles, wrap-aware distance)
        function findPortalTile(epicFood, currentSnake) {
            var cols = PLAY_WIDTH / TILE_SIZE;
            var rows = PLAY_HEIGHT / TILE_SIZE;
            var minDist = 10 * TILE_SIZE;
            var candidates = [];
            for (var x = 0; x < cols; x++) {
                for (var y = 0; y < rows; y++) {
                    var tx = x * TILE_SIZE, ty = y * TILE_SIZE;
                    if (currentSnake.some(function(s) { return s.x === tx && s.y === ty; })) continue;
                    if (obstacles.some(function(o) { return o.x === tx && o.y === ty; })) continue;
                    if (food && food.x === tx && food.y === ty) continue;
                    if (food2 && food2.x === tx && food2.y === ty) continue;
                    if (powerUpPickup && powerUpPickup.x === tx && powerUpPickup.y === ty) continue;
                    if (extraFoods.some(function(ef) { return ef.x === tx && ef.y === ty; })) continue;
                    if (hazards.some(function(h) { return h.phase === 'on' && Math.abs(h.cx - tx) + Math.abs(h.cy - ty) <= h.radius; })) continue;
                    // Wrap-aware per-axis distance
                    var ddx = tx - epicFood.x, ddy = ty - epicFood.y;
                    if (ddx > PLAY_WIDTH / 2) ddx -= PLAY_WIDTH; else if (ddx < -PLAY_WIDTH / 2) ddx += PLAY_WIDTH;
                    if (ddy > PLAY_HEIGHT / 2) ddy -= PLAY_HEIGHT; else if (ddy < -PLAY_HEIGHT / 2) ddy += PLAY_HEIGHT;
                    var d = Math.abs(ddx) + Math.abs(ddy);
                    if (d >= minDist) candidates.push({ x: tx, y: ty });
                }
            }
            if (candidates.length === 0) return null;
            return candidates[Math.floor(seededRandom() * candidates.length)];
        }
        // v9 D: snap a teleport destination to the nearest free tile if occupied
        function snapToFreeTile(x, y) {
            // v14 C: test the materialising telegraph too (rivalCombinedSnake covers every
            // rival with a body, active or winding up) — the old r.active filter let the
            // portal exit land the player on a rival that solidified a tick later.
            var rivalSegs = rivalCombinedSnake();
            if (!snake.some(function(s) { return s.x === x && s.y === y; }) &&
                !obstacles.some(function(o) { return o.x === x && o.y === y; }) &&
                !rivalSegs.some(function(s) { return s.x === x && s.y === y; })) {
                return { x: x, y: y };
            }
            var neighbors = [{x:x+TILE_SIZE,y:y},{x:x-TILE_SIZE,y:y},{x:x,y:y+TILE_SIZE},{x:x,y:y-TILE_SIZE}];
            for (var i = 0; i < neighbors.length; i++) {
                var n = wrapPosition(neighbors[i]);
                if (!snake.some(function(s) { return s.x === n.x && s.y === n.y; }) &&
                    !obstacles.some(function(o) { return o.x === n.x && o.y === n.y; }) &&
                    !rivalSegs.some(function(s) { return s.x === n.x && s.y === n.y; })) {
                    return n;
                }
            }
            return { x: x, y: y };
        }

        function spawnPowerUpPickup() {
            if (powerUpPickup) return;
            const types = Object.keys(POWERUP_TYPES);
            const type = types[Math.floor(seededRandom() * types.length)];
            const maxAttempts = 50;
            for (let attempt = 0; attempt < maxAttempts; attempt++) {
                const x = Math.floor(seededRandom() * (PLAY_WIDTH / TILE_SIZE)) * TILE_SIZE;
                const y = Math.floor(seededRandom() * (PLAY_HEIGHT / TILE_SIZE)) * TILE_SIZE;
                if (snake.some(s => s.x === x && s.y === y)) continue;
                if (obstacles.some(o => o.x === x && o.y === y)) continue;
                if (food && food.x === x && food.y === y) continue;
                var rivalSegsFree = rivalCombinedSnake();
                if (rivalSegsFree.some(s => s.x === x && s.y === y)) continue;
                powerUpPickup = { x, y, type };
                powerUpDespawnCounter = 125; // ~15 seconds at 120ms per tick
                return;
            }
        }

        function activatePowerUp(type) {
            vibrate(20);
            playSound('powerup');
            deactivatePowerUp(true);
            
            powerUpType = type;
            const config = POWERUP_TYPES[type];
            
            switch (type) {
                case 'shield':
                    shieldActive = true;
                    powerUpTimer = POWERUP_TYPES.shield.duration;
                    break;
                case 'magnet':
                    magnetActive = true;
                    powerUpTimer = config.duration;
                    break;
                case 'slowmo':
                    slowMoActive = true;
                    powerUpTimer = config.duration;
                    // Preserve any running speed boost across the slow-mo change.
                    tickInterval = speedBoostCounter > 0 ? getBoostedSpeed() : getEffectiveSpeed();
                    restartGameTimeout();
                    break;
            }
            // v9 F3: activation shockwave at the head
            if (snake.length > 0) {
                pushTransientRing(snake[0].x + TILE_SIZE / 2, snake[0].y + TILE_SIZE / 2, 25, config.color || '#FFFFFF', 500, 'ring', 3);
                if (!calmModeEffective()) spawnParticles(snake[0].x, snake[0].y, 12, config.color || '#FFFFFF');
            }
            
            // v12 E: was a direct toastEl write with its own timer — it corrupted any
            // in-flight queued toast. Route through the queue like everything else.
            queueToast('⚡ ' + config.name + ' Activated!', 2000, 'high');
        }

        function deactivatePowerUp(silent) {
            if (!silent) { playSound('powerdown'); vibrate(15); }
            if (slowMoActive) {
                slowMoActive = false;
                // Preserve any running speed boost across the slow-mo change.
                tickInterval = speedBoostCounter > 0 ? getBoostedSpeed() : getEffectiveSpeed();
                restartGameTimeout();
            }
            shieldActive = false;
            magnetActive = false;
            powerUpTimer = 0;
            powerUpType = null;
            powerUpSpawnCounter = 0;
        }

        function resetGame() {
            helpOverlayVisible = false;
            lastDeathCause = '';
            lastSaveEvent = '';
            // v12 C: pre-cascade score + factor. gameOver() overwrites `score` with the
            // cascaded value, so the raw score must be captured there — score/0.5 cannot
            // recover it (the Math.floor loss is unrecoverable and wrong for odd scores).
            sessionRawScore = 0;
            sessionCascadeMult = 1;
            lastComboMilestone = 0;
            comboCount = 0;
            comboCharges = 0;
            // v12 A: resonance cadence counters — per-run state.
            intangibleWindowTicks = 0;
            resonanceInvertTicks = 0;
            resonanceInvertCooldown = 0;
            resonanceToggleTick = 0;
            resonanceMirrorSuspended = 0;
            chaosCycleIndex = 0;
            activeResonance = null;
            comboBankSpendMode = 0;
            hazardChainStreak = 0; // v11 A
            evolutionTier = -1;
            obstaclePassUsed = false;
            // v8 D: clear recap state so the idle screen never shows a stale recap.
            recapData = null;
            recapQuestBaseline = null;
            // v12 E: a single gameOver() can queue ~22s of toasts from six systems
            // (achievement, level-up, quest, cosmetic, meta-achievement, daily). Without
            // this, they bleed into the next run and draw over a live board.
            clearToasts();
            sessionFoodEaten = 0;
            sessionFoodTypes = new Set();
            // v8 F: clear bounty state for a fresh run.
            activeBounty = null;
            bountyTickCounter = 0;
            sessionBonusFood = 0;
            sessionSpeedFood = 0;
            gameTick = 0;
            lastEatTime = 0;
            sessionXP = 0;
            sessionPauseStart = 0;
            sessionPausedTime = 0;
            sessionTimeAlive = 0;
            sessionMaxCombo = 0;
            shrinkTimer = 3000;
            snapDuration = 3000;
            snapTimeSinceDecrease = 0;
            snapLevel = 1;
            snapLevelUpFlash = 0;
            levelUpFlash = 0;
            touchIndicatorTimer = 0;
            shakeTimer = 0;
            flashOverlay = null;

            if (comboFadeTimer) clearTimeout(comboFadeTimer);

            paintGrid = null;

            powerUpTimer = 0;

            deathRivals = [];

            hungerStarted = false;

            chaosCurrentWeights = null;
            speedBoostCounter = 0;
            obstacleSpawnTimer = OBSTACLE_SPAWN_INTERVAL;
            newObstacleFlash = [];
            newObstacleToastTimer = 0;
            pauseMenuSelection = 0;
            pauseConfirmPending = false;
            pauseConfirmAction = null;

            snake = [{ x: 10 * TILE_SIZE, y: 10 * TILE_SIZE }];
            if (gameMode === 'painter') {
                snake = [
                    { x: 10 * TILE_SIZE, y: 10 * TILE_SIZE },
                    { x: 9 * TILE_SIZE, y: 10 * TILE_SIZE },
                    { x: 8 * TILE_SIZE, y: 10 * TILE_SIZE }
                ];
            }
            dx = TILE_SIZE;
            dy = 0;
            lastConsumedDir = { dx: TILE_SIZE, dy: 0 };
            ghostPositions = [];
            ghostArenaMode = false;
            arenaGhostReplays = [];
            arenaGhostPositions = [];
            // v11 D: Derive the run seed BEFORE board generation so the opening
            // obstacles/food are deterministic too. Daily uses the per-date seed;
            // a manual seed (seedField) applies to any mode; otherwise the run is
            // non-deterministic. This also stops a prior daily run's seedPrng from
            // leaking into Classic/TimeAttack/Snap (which must stay random).
            var seedInputEl = document.getElementById('seedField');
            var manualSeed = seedInputEl ? seedInputEl.value.replace(/~/g, '').trim() : '';
            if (gameMode === 'daily') {
                activeSeed = String(getDailySeed());
                seedPrng = mulberry32(hashString(activeSeed));
            } else if (manualSeed) {
                activeSeed = manualSeed;
                seedPrng = mulberry32(hashString(manualSeed));
            } else {
                activeSeed = null;
                seedPrng = null;
            }
            // The previous run's food must be gone BEFORE board generation:
            // generateObstacles() skips the current food tile, so a stale food from the
            // last run steered the obstacle draw and consumed a different number of
            // seededRandom() calls — the same daily seed produced different boards
            // depending on what the previous run left behind (test-bughunt, 2026-10-04).
            food = null;
            food2 = null; // v6: Echo Brew duplicate food
            // Cleared before generateFood(), not after: an epic opening food pushes its
            // portal twin into extraFoods, and clearing afterwards orphaned that twin.
            extraFoods = []; // v9 D: clear portal + hoard foods
            generateObstacles();
            hazards = []; // v10 C: clear hazard zones
            hazardTickCounter = 0; // v10 C: reset spawn timer
            if (gameMode === 'painter') {
                var cols = PLAY_WIDTH / TILE_SIZE;
                var rows = PLAY_HEIGHT / TILE_SIZE;
                paintGrid = [];
                for (var c = 0; c < cols; c++) {
                    paintGrid[c] = [];
                    for (var r = 0; r < rows; r++) {
                        paintGrid[c][r] = null;
                    }
                }
                paintCoveredCount = 0;
                paintTotalTiles = (cols * rows) - obstacles.length;
                paintLayers = 1;
                currentPaintColor = '#FF4444';
                painterFoodEaten = 0;
            }
            stopDrone();
            stopPad();
             const combinedInitial = snake.concat(rivalCombinedSnake());
            food = generateFood(combinedInitial);
            transientRings = []; // v9 F: clear visual rings
            hoardActive = false; hoardTimer = 0; hoardTickCounter = 0; scoreMultiplier = 1; // v9 E: clear hoard state
            hoardPigmentCount = 0; pigmentRushTimer = 0; pigmentRushActive = false; // v11 C
            rivalFreezeMs = 0; // v11 C: rival freeze
            score = 0;
            displayedScore = 0;
            particles = [];
            deathFragments = [];
            deathFragmentsActive = false;
            gameState = 'idle';
            // Per the Game Loop rule: never write gameTimeout directly — stopGameLoop
            // clears any pending timeout so a stale chain can't double-fire later.
            stopGameLoop();
            dirQueue = [];
            updateScoreDisplay();
            updateMenuFooter();
            drawGame(1);
            visualDirty = true;
            timeAttackEnd = 0;
            zenActive = false;
        }

        function updateScoreDisplay() {
            if (score > (modeHighScores[gameMode] || 0)) {
                modeHighScores[gameMode] = score;
                saveManager.setJSON('snake_mode_highs', modeHighScores);
                sessionRunMaxRaw = score;
            }
            // v14 D2: ONE celebration per run, at the first crossing. The per-crossing form
            // fired 19 toasts in a 40-eat record run (58 queued vs a cap of 20), and never
            // fired at all in a fresh mode (`prevBest &&` failed on undefined — the run most
            // deserving of one). score > 0 is implied: sessionModeHighStart >= 0.
            if (gameState === 'playing' && score > sessionModeHighStart && !sessionNewBestAnnounced) {
                sessionNewBestAnnounced = true;
                queueToast('🏆 NEW BEST! ' + MODE_CONFIG[gameMode].name + ': ' + score, 3000);
                playSound('achievement');

                highScore = score;
                saveManager.set('snake_high_score', highScore);

            } else {

        }

                } else if (prestigeLevel >= 5) {

            }
        }

        function startGame() {
            _snakesCount('start');
            // v7 E: starting a fresh run — discard any saved snapshot so the
            // idle "Resume Run" button doesn't offer a stale unrelated run.
            clearSnapshot();
            // Panels are toggleable from idle/gameover — a modal left open would
            // cover the canvas for the whole run. Close all on start.
            closeAllPanels();
            syncDailyState();
            // v8 D: reset recap state and snapshot quest progress for end-of-run delta.
            recapData = null;
            recapQuestBaseline = captureQuestBaseline();
            srSpeak('Game started. Mode: ' + gameMode);
            if (gameMode === 'daily') {
                if (dailyAttempts <= 0) {
                    queueToast('No attempts remaining! Come back tomorrow.', 3000, 'high');
                    return;
                }
                dailyAttempts--;
                saveManager.set('snake_daily_attempts_remaining', dailyAttempts);
                    // Update streak — only when a daily game actually starts
                    const today = new Date();
                    const storedDate = saveManager.get('snake_daily_date', '');
                    let streak = saveManager.getInt('snake_streak_count', 0);
                    const todayStr = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');

                    if (storedDate && storedDate !== todayStr) {
                        // Different day than last play — check if consecutive
                        const parts = storedDate.split('-');
                        const storedDateObj = new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2]));
                        const yesterday = new Date(today);
                        yesterday.setDate(yesterday.getDate() - 1);
                        const yesterdayStr = yesterday.getFullYear() + '-' + String(yesterday.getMonth()+1).padStart(2, '0') + '-' + String(yesterday.getDate()).padStart(2, '0');
                        if (storedDate === yesterdayStr) {
                            streak++;
                        } else {
                            streak = 1; // Broken streak, restart
                        }
                        saveManager.set('snake_streak_count', streak);
                    } else if (!storedDate) {
                        // First ever play
                        streak = 1;
                        saveManager.set('snake_streak_count', streak);
                    }
                    // Always save the date so next day's comparison works
                    saveManager.set('snake_daily_date', todayStr);
                    // v11 D: Seed the PRNG for daily mode so ALL seededRandom() calls
                    // (food, hazard, rival, hunter spawns) are deterministic per date.
                    // This makes the daily leaderboard fair (same board for all) and
                    // enables learnable hazard layouts for diary replay.
                    // resetGame already derived this seed before board generation;
                    // re-seed here so direct startGame callers stay deterministic.
                    // hashString form matches restoreFromSnapshot/seedField hashing.
                    activeSeed = String(getDailySeed());
                    seedPrng = mulberry32(hashString(activeSeed));
            }
            // Check streak cosmetic unlocks
            const streak = saveManager.getInt('snake_streak_count', 0);
            for (const days in STREAK_UNLOCKS) {
                if (streak >= parseInt(days)) {
                    const id = STREAK_UNLOCKS[days];
                    if (unlockedCosmetics.indexOf(id) === -1) {
                        unlockedCosmetics.push(id);
                        saveManager.setJSON('snake_unlocks', unlockedCosmetics);
                    const allCosmetics = Object.assign({}, SNAKE_SKINS, GRID_THEMES, TRACE_EFFECTS, DEATH_EFFECTS, BORDER_EFFECTS);
                    const c = allCosmetics[id];
                    if (c) {
                        queueToast('🔑 Unlocked: ' + c.name + '!', 4000);
                    }
                    }
                }
            }
            // v11 E: Re-read streak charges from save + grant charges at 7/14/30 day thresholds
            streakCharges = saveManager.getInt('snake_streak_charges', 0);
            streakChargeGranted = saveManager.getInt('snake_streak_charge_granted', -1);
            const STREAK_CHARGE_DAYS = [7, 14, 30];
            for (var sci = 0; sci < STREAK_CHARGE_DAYS.length; sci++) {
                if (streak >= STREAK_CHARGE_DAYS[sci] && streakChargeGranted < sci) {
                    streakCharges++;
                    streakChargeGranted = sci;
                    saveManager.set('snake_streak_charges', streakCharges);
                    saveManager.set('snake_streak_charge_granted', streakChargeGranted);
                    queueToast('🛡 Streak charge earned! (' + STREAK_CHARGE_DAYS[sci] + ' day streak)', 3000);
                }
            }

        function checkCollision(pos) {

            // Check self collision (existing)

            playSound('achievement');
            queueToast('\u26A1 Evolution: ' + tier.name + '!', 3000);

            vibrate(40);
        }

        // v7: Evolution trigger — call after every snake growth. Each food grows
