                                    if (rvHead.x === wrappedHead.x && rvHead.y === wrappedHead.y) {
                                        rivalHeadOn = true;
                                    } else if (prevSnake.length > 0 &&
                                               rvHead.x === prevSnake[0].x && rvHead.y === prevSnake[0].y) {
                                        rivalHeadOn = true;   // the player charged the tile the rival moved into
                                    }
                                }
                                lastDeathCause = rivalHeadOn
                                    ? 'You charged the rival head-on!'
                                    : 'You ran into the rival!';
                                // v13: the rule itself needs teaching — charging used to be a
                                // free kill and v13 made it lethal, so a player who learned the
                                // old behaviour dies to the new one. One-shot, because the cause
                                // string alone cannot carry the counterplay (and must stay short:
                                // the recap card is 320px and the descriptive form measures 323).
                                if (rivalHeadOn && !hasSeenRivalHeadOn) {
                                    hasSeenRivalHeadOn = true;
                                    saveManager.set('snake_has_seen_rival_head_on', '1');
                                    queueToast('\u26A0 Charging a rival head-on is lethal — ram its SIDE instead!', 4000, 'high');
                                }
                                return true;
                            }
                        }
                    }
                }
                return false;
            }
            // --- end v6 extraction ---

            if (checkPlayerDeath(wrappedHead, skipSelfCollision)) {
                snake.push(tail);
                gameOver();
                return;
            }

            if (teleportSavePos) {
                // Phoenix/streak-charge save: re-anchor the whole snake at the free
                // tile (same construction as the portal-food teleport) — this
                // tick's move is consumed by the teleport, so no unshift.
                snake = [{ x: teleportSavePos.x, y: teleportSavePos.y }];
                while (snake.length < 3) {
                    var saveTailSeg = wrapPosition({ x: snake[snake.length - 1].x - dx, y: snake[snake.length - 1].y - dy });
                    if (snake.some(function (s) { return s.x === saveTailSeg.x && s.y === saveTailSeg.y; })) break;
                    // v13: the rebuilt tail tiles are unfiltered by findFreeTile (which only
                    // vets the head), so stop the body before it lands on a rival segment —
                    // otherwise a later tick could credit that rival as a ram the player never
                    // earned. Mirrors the existing self-overlap break above.
                    if (rivalCombinedSnake().some(function (rs) { return rs.x === saveTailSeg.x && rs.y === saveTailSeg.y; })) break;
                    snake.push(saveTailSeg);
                }
                wrappedHead = snake[0]; // post-move processing sees the real head
                teleportSavePos = null;
                // v13: NOT a ram. The teleport relocated the player INTO the board; it was
                // not rammed. The rebuilt body is laid down without an occupancy check, so
                // resolving rams here could credit a kill the player never earned.
            } else {
                snake.unshift(wrappedHead);
                // v13: the player's move is committed — `snake` is now its real post-move
                // occupancy, so rival-vs-body contacts can be resolved exactly (rule 2).
                resolveRivalRams();
            }
            // Painter mode: paint the head position too
            if (gameMode === 'painter' && paintGrid) {
                var hcol = Math.floor(wrappedHead.x / TILE_SIZE);
                var hrow = Math.floor(wrappedHead.y / TILE_SIZE);
                var cols = PLAY_WIDTH / TILE_SIZE;
                var rows = PLAY_HEIGHT / TILE_SIZE;
                if (hcol >= 0 && hcol < cols && hrow >= 0 && hrow < rows) {
                    if (!paintGrid[hcol][hrow]) {
                        paintGrid[hcol][hrow] = { color: currentPaintColor, layer: paintLayers, timestamp: Date.now() };
                        paintCoveredCount++;
                    } else {
                        paintGrid[hcol][hrow] = { color: currentPaintColor, layer: paintGrid[hcol][hrow].layer + 1, timestamp: Date.now() };
                    }
                }
            }
            // v8 E: hunter food flees the head every HUNTER_MOVE_INTERVAL ticks (after
            // the snake has moved, so it flees the NEW head position). Game-logic only.
            if (food && food.type === 'hunter' && gameTick % HUNTER_MOVE_INTERVAL === 0) {
                moveHunter();
            }

            // v6: Phantom Brew — cross ghost trail for +1.0x combo (5s cooldown)
            if (activeBrews.indexOf('phantom') !== -1) {
                var phantomNow = Date.now();
                var phantomCooldown = brewUsageFlags.phantomCooldown || 0;
                if (phantomNow > phantomCooldown) {
                    var ghostMatch = false;
                    if (ghostPositions.length > 0) {
                        for (var pgi = 0; pgi < ghostPositions.length; pgi++) {
                            if (ghostPositions[pgi].x === wrappedHead.x && ghostPositions[pgi].y === wrappedHead.y) {
                                ghostMatch = true; break;
                            }
                        }
                    }
                    if (!ghostMatch && arenaGhostPositions.length > 0) {
                        for (var agi2 = 0; agi2 < arenaGhostPositions.length; agi2++) {
                            var agBody = arenaGhostPositions[agi2] || [];
                            for (var agj = 0; agj < agBody.length; agj++) {
                                if (agBody[agj].x === wrappedHead.x && agBody[agj].y === wrappedHead.y) {
                                    ghostMatch = true; break;
                                }
                            }
                            if (ghostMatch) break;
                        }
                    }
                    if (ghostMatch) {
                        brewUsageFlags.phantomCooldown = phantomNow + 5000;
                        comboCount = Math.min(50, comboCount + 1);
                        lastEatTime = Date.now();
                        // Mirrors the eat blocks: a phantom +1 can cross a milestone
                        // (e.g. 2→3) that would otherwise be permanently skipped.
                        if (comboCount > stats.maxCombo) stats.maxCombo = comboCount;
                        if (comboCount > sessionMaxCombo) sessionMaxCombo = comboCount;
                        handleComboMilestone();
                        spawnParticles(wrappedHead.x, wrappedHead.y, 15, '#88FFFF');
                        playSound('bonus');
                        queueToast('Phantom Brew: +1.0x Combo!', 2000);
                    }
                }
            }

            if (food && wrappedHead.x === food.x && wrappedHead.y === food.y) {
                snake.push(tail);
                snakeGrew = true;
                triggerEvolutionIfReady();
                if (activeSeed !== null) recordReplayGrow(gameTick);
                const eatenType = food.type;

                // v10 B: Bomb food — tactical, 0 score/XP. Blasts obstacles + trims rival.
                if (eatenType === 'bomb') {
                    sessionFoodTypes.add('bomb');
                    sessionFoodEaten++;
                    stats.totalFoodEaten++;
                    stats.bombsEaten = (stats.bombsEaten || 0) + 1;
                    // Blast: clear obstacles within 2-tile Manhattan radius
                    var bombRad = 2 * TILE_SIZE;
                    obstacles = obstacles.filter(function(o) {
                        return Math.abs(o.x - wrappedHead.x) + Math.abs(o.y - wrappedHead.y) > bombRad;
                    });
                    // Trim rival tails within range
                    for (var bri = 0; bri < rivals.length; bri++) {
                        if (rivals[bri].active && rivals[bri].snake.length > 1) {
                            var rh = rivals[bri].snake[0];
                            if (Math.abs(rh.x - wrappedHead.x) + Math.abs(rh.y - wrappedHead.y) <= bombRad) {
                                var trim = Math.min(3, rivals[bri].snake.length - 1);
                                for (var bti = 0; bti < trim; bti++) rivals[bri].snake.pop();
                            }
                        }
                    }
                    spawnParticles(wrappedHead.x, wrappedHead.y, 16, foodColor('bomb'));
                    pushTransientRing(wrappedHead.x + TILE_SIZE / 2, wrappedHead.y + TILE_SIZE / 2, 80, '#FF6600', 500, 'ring', 4);
                    playSound('bonus');
                    if (!hasSeenBomb) { hasSeenBomb = true; saveManager.set('snake_has_seen_bomb', '1'); queueToast('💣 Bomb! Blasted obstacles & trimmed rival!', 3000, 'low'); }
                    // Combo timer continues (bomb is an eat, not a miss)
                    const bombNow = Date.now();
                    if (bombNow - lastEatTime < 3000 && lastEatTime > 0) {
                        comboCount = Math.min(50, comboCount + 1);
                    } else {
                        comboCount = (evolutionTier >= 3) ? EVOLUTION_TIERS[3].minCombo : 0;
                        lastComboMilestone = 0;
                    }
                    lastEatTime = bombNow;
                    clearTimeout(comboFadeTimer);
                    comboFadeTimer = setTimeout(function() { comboDisplayEl.textContent = ''; }, 3500);
                    if (comboCount > stats.maxCombo) stats.maxCombo = comboCount;
                    if (comboCount > sessionMaxCombo) sessionMaxCombo = comboCount;
                    handleComboMilestone();
                    // v11 A: bomb breaks the hazard chain (it is an eat, but not a
                    // hazard-adjacent harvest) — the reset was unreachable in the
                    // non-bomb else branch.
                    hazardChainStreak = 0;
                    // v10 B: bomb is still a Snap-mode eat — refresh the shrink timer
                    // (every other food type does), or the shrink erases the growth.
                    if (gameMode === 'snap') {
                        shrinkTimer = snapDuration;
                        shrinkTimer += MODE_CONFIG.snap.speed;
                    }
                    // Generate new food (bomb is consumed)
                    food = generateFood(snake.concat(rivalCombinedSnake()).concat(extraFoods));
                    if (!food) { lastDeathCause = 'The board filled up!'; gameOver(); return; }
                    srSpeak('Bomb detonated');
                    checkAchievements(score);
                    checkQuestProgress();
                } else {
                // Stats tracking
                sessionFoodEaten++;
                stats.totalFoodEaten++;
                stats.normalFoodEaten++;
                // Lifetime per-type buckets drive achievements (SPEED_DEMON,
                // BONUS_FEAST, EPICURE) — they were only ever incremented on the
                // hoard/portal-twin paths, leaving primary eats uncounted.
                if (eatenType === 'speed') { sessionSpeedFood++; stats.speedFoodEaten = (stats.speedFoodEaten || 0) + 1; }
                if (eatenType === 'bonus') { sessionBonusFood++; stats.bonusFoodEaten = (stats.bonusFoodEaten || 0) + 1; }
                if (eatenType === 'epic') { stats.epicFoodEaten = (stats.epicFoodEaten || 0) + 1; }
                sessionFoodTypes.add(eatenType);

                srSpeak('Ate ' + eatenType + '. Score ' + score);

                // Combo logic
                const now = Date.now();
                if (now - lastEatTime < 3000 && lastEatTime > 0) {
                    comboCount = Math.min(50, comboCount + 1);
                } else {
                    comboCount = (evolutionTier >= 3) ? EVOLUTION_TIERS[3].minCombo : 0;
                    lastComboMilestone = 0;
                }
                lastEatTime = now;
                clearTimeout(comboFadeTimer);
                comboFadeTimer = setTimeout(function() {
                    comboDisplayEl.textContent = '';
                }, 3500);
                if (comboCount > stats.maxCombo) stats.maxCombo = comboCount;
                if (comboCount > sessionMaxCombo) sessionMaxCombo = comboCount;

                // --- v6: extracted combo milestone handler ---
            handleComboMilestone();
            // --- end v6 extraction ---

                // XP award for eating
                const tier = FOOD_TIERS[eatenType] || FOOD_TIERS.common;
                // v12 A: resonance food multiplier (Chaos Gold x2 / Famine Feast x4).
                // Applied at the FOOD SITE, not inside addScore/awardXP — those funnels
                // also serve bounties, quests, achievements and the survival drip, and
                // the descriptors promise FOOD points/XP specifically.
                const resMult = foodResonanceMult();
                let foodXP = tier.xp * resMult;
                if (gameMode === 'zen') {
                    foodXP = 10; // Flat XP in Zen mode
                } else {
                    const comboMul = 1 + comboCount * 0.5;
                    foodXP = Math.round(foodXP * comboMul);
                }
                awardXP(foodXP);

                // Track longest length
                if (snake.length > stats.longestLength) stats.longestLength = snake.length;

                const tierColor = foodColor(eatenType);
                if (!flashOverlay || (flashOverlay.priority !== 'high' && flashOverlay.priority !== 'critical')) {
                    flashOverlay = { color: tierColor, alpha: 0.4, priority: 'normal' };
                    queueGameEffect('flash', { color: tierColor, alpha: 0.4, priority: 'normal' });
                }
                eatAnimTimer = 150;
                spawnParticles(wrappedHead.x, wrappedHead.y, tier.pCount, tierColor);
                // v6: Score pop-up floater
                if (eatenType === 'speed') {
                    spawnFloater(wrappedHead.x, wrappedHead.y, '+5 SPEED!', '#FFDD00', 20);
                } else if (eatenType === 'bonus') {
                    spawnFloater(wrappedHead.x, wrappedHead.y, '+30 BONUS!', '#FFD700', 18);
                } else {
                    spawnFloater(wrappedHead.x, wrappedHead.y, '+' + tier.pts, tierColor);
                }
                // --- end v6 ---
                if (synesthesiaMode) {
                    spawnSynesthesiaRing(wrappedHead.x, wrappedHead.y, tierColor);
                }
                if (gameMode !== 'zen' && gameMode !== 'painter') addScore(tier.pts * resMult);
                // v6: Combustion Brew bonus — each combo milestone adds +1 mult to next 3 foods
                if (activeBrews.indexOf('combustion') !== -1 && brewUsageFlags.combRemaining > 0 && gameMode !== 'zen' && gameMode !== 'painter') {
                    addScore(tier.pts * brewUsageFlags.combustionAccum);
                    brewUsageFlags.combRemaining--;
                }
                // Combo score bonus
                if (comboCount > 0 && gameMode !== 'zen' && gameMode !== 'painter') {
                    let comboBonus;
                    if (comboCount >= 20) {
                        comboBonus = Math.floor(comboCount * 5);
                    } else if (comboCount >= 10) {
                        comboBonus = Math.floor(comboCount * 3);
                    } else {
                        comboBonus = Math.floor(comboCount * 2);
                    }
                    addScore(comboBonus);
                }
                if (gameMode === 'snap') {
                    shrinkTimer = snapDuration;
                    if (eatenType === 'rare' || eatenType === 'epic') {
                        shrinkTimer = Math.min(5000, shrinkTimer + 1000);
                    } else if (eatenType === 'bonus') {
                        shrinkTimer = Math.min(5000, shrinkTimer + 2000);
                    }
                    shrinkTimer += MODE_CONFIG.snap.speed;
                }
                // Track last eaten type BEFORE playSound (synesthesia and painter depend on it)
                lastEatenType = eatenType;
                vibrate(15);
                playSound(tier.sound);
                // speed food still has the special speed boost behavior
                if (eatenType === 'speed') {
                    if (activeSeed === null) {
                        tickInterval = getBoostedSpeed();
                        speedBoostCounter = 16; // ~2 seconds at 120ms ticks
                    }
                }
                // Painter mode: 100% coverage check
                if (gameMode === 'painter' && paintTotalTiles > 0 && paintCoveredCount >= paintTotalTiles && !flashOverlay) {
                    paintLayers++;
                    paintCoveredCount = 0;
                    flashOverlay = { color: '#FFFFFF', alpha: 0.6, priority: 'high' };
                    queueGameEffect('flash', { color: '#FFFFFF', alpha: 0.6, priority: 'high' });
                    queueToast('100% Coverage! Layer ' + paintLayers + '!', 3000);
                    playSound('achievement');
                    vibrate(50);
                }
                // Painter mode: update paint color
                if (gameMode === 'painter') {
                    painterFoodEaten++;
                    if (comboCount >= 30) {
                        currentPaintColor = 'hsl(' + ((renderTime * 0.1) % 360) + ',100%,50%)';
                    } else if (comboCount >= 10) {
                        var tierKeys = Object.keys(FOOD_TIERS);
                        currentPaintColor = foodColor(tierKeys[painterFoodEaten % tierKeys.length]);
                    } else {
                        currentPaintColor = foodColor(eatenType);
                    }
                    if (painterFoodEaten % 50 === 0) {
                        var painterSpeed = Math.max(MIN_SPEED, getEffectiveSpeed() - 5);
                        tickInterval = painterSpeed;
                        restartGameTimeout();
                    }
                }
                checkAchievements(score);
                checkQuestProgress();
                // v11 A: Hazard Chain Bonus — bump streak if adjacent, reset otherwise.
                // (eatenType is never 'bomb' in this else branch — bombs reset in the
                // bomb branch above.)
                if (hazardAdjacentThisTick) {
                    hazardChainStreak++;
                    if (hazardChainStreak >= 1) {
                        spawnFloater(snake[0].x, snake[0].y - 10, '×' + (1 + Math.min(hazardChainStreak, 3) * 0.5) + ' Hazard!', '#FFD700');
                    }
                    // v12 F: every third consecutive hazard-chain eat banks a charge.
                    // hazardChainStreak is read at the eat moment (it is reset at the melt,
                    // hazard-death, bomb-eat and non-adjacent-eat sites), never cached.
                    // The `> 0` guard keeps 0 % 3 === 0 from banking on a broken chain,
                    // so the rule does not depend on the increment above running first.
                    if (hazardChainStreak > 0 && hazardChainStreak % 3 === 0) bankComboCharge('hazard chain');
                } else {
                    hazardChainStreak = 0;
                }
                // v9 D: if the eaten food was a portal epic, remove its twin from extraFoods[]
                if (eatenType === 'epic') {
                    extraFoods = extraFoods.filter(function(ef) { return !ef.portalLink; });
                }
                const playerCombined = snake.concat(rivalCombinedSnake()).concat(extraFoods);
                food = generateFood(playerCombined);
                if (!food) { lastDeathCause = 'The board filled up!'; gameOver(); return; }
                // v6: Rampage Brew — food spawns closer to head (min 3 tiles)
                if (activeBrews.indexOf('rampage') !== -1) {
                    minFoodSpawnDist = 3;
                }
                // v6: Echo Brew — every 8th food spawns adjacent copy (half pts)
                if (activeBrews.indexOf('echo') !== -1) {
                    brewUsageFlags.echoCount = (brewUsageFlags.echoCount || 0) + 1;
                    if (brewUsageFlags.echoCount % 8 === 0 && food) {
                        var adj = [{x: food.x + TILE_SIZE, y: food.y}, {x: food.x - TILE_SIZE, y: food.y}, {x: food.x, y: food.y + TILE_SIZE}, {x: food.x, y: food.y - TILE_SIZE}];
                        for (var ai = 0; ai < adj.length; ai++) {
                            // Occupancy check: the food2 tile must be free, or it can
                            // spawn inside an obstacle (unreachable without Serpentine)
                            // or stacked on the portal twin (double-event on one tile).
                            var fx = adj[ai].x, fy = adj[ai].y;
                            if (fx < 0 || fx >= PLAY_WIDTH || fy < 0 || fy >= PLAY_HEIGHT) continue;
                            if (obstacles.some(function(o) { return o.x === fx && o.y === fy; })) continue;
                            if (snake.some(function(s) { return s.x === fx && s.y === fy; })) continue;
                            if (extraFoods.some(function(e) { return e.x === fx && e.y === fy; })) continue;
                            if (powerUpPickup && powerUpPickup.x === fx && powerUpPickup.y === fy) continue;
                            // v8 E: food2 copies the eaten food's type — coerce hunter/portal/bomb/epic
                            // to common so a static food2 never inherits a special mechanic.
                            var f2Type = (food.type === 'hunter' || food.type === 'portal' || food.type === 'bomb' || food.type === 'epic') ? 'common' : food.type;
                            food2 = { x: fx, y: fy, type: f2Type, pts: Math.floor((FOOD_TIERS[f2Type] ? FOOD_TIERS[f2Type].pts : 10) / 2), spawnTime: performance.now() };
                            break;
                        }
                    }
                }
                } // end v10 B bomb else
            } // end if (food eat)

            // v6: Echo Brew food2 eating
            if (food2 && wrappedHead.x === food2.x && wrappedHead.y === food2.y) {
                snake.push(tail);
                snakeGrew = true;
                triggerEvolutionIfReady();
                if (activeSeed !== null) recordReplayGrow(gameTick);
                sessionFoodEaten++;
                stats.totalFoodEaten++;
                stats.normalFoodEaten++;
                // Echo food counts toward sessionFoodTypes/explorer + per-type session
                // counters (mirror the primary eat), so it isn't invisible to quests.
                sessionFoodTypes.add(food2.type);
                if (food2.type === 'speed') sessionSpeedFood++;
                if (food2.type === 'bonus') sessionBonusFood++;
                // v12 A: the multiplier must wrap the WHOLE expression. `food2.pts` is set
                // at every construction site to floor(tier.pts/2) and is always >= 2, so
                // putting foodResonanceMult() only on the fallback made it dead code.
                addScore(Math.floor((food2.pts || FOOD_TIERS[food2.type].pts / 2) * foodResonanceMult()));
                spawnParticles(food2.x, food2.y, 8, '#44FF88');
                playSound('eat');
                food2 = null;
                checkAchievements(score);
                checkQuestProgress();
            }
            // v9 D: extraFoods[] eat check (portal + hoard foods)
            for (var efi = extraFoods.length - 1; efi >= 0; efi--) {
                var ef = extraFoods[efi];
                if (wrappedHead.x === ef.x && wrappedHead.y === ef.y) {
                    if (ef.portalLink) {
                        // Portal food: teleport the entire snake (Phoenix-style re-anchor)
                        // Eating the portal grants the epic's bonus (score + XP) and removes both foods.
                        var exitTile = snapToFreeTile(ef.portalLink.x, ef.portalLink.y);
                        spawnParticles(ef.x, ef.y, 18, '#AA44FF');
                        spawnParticles(exitTile.x, exitTile.y, 18, '#AA44FF');
                        playSound('bonus');
                        // Grant the epic's bonus
                        sessionFoodEaten++;
                        stats.totalFoodEaten++;
                        stats.epicFoodEaten++;
                        sessionFoodTypes.add('epic');
                        if (gameMode !== 'zen' && gameMode !== 'painter') addScore(FOOD_TIERS.epic.pts * foodResonanceMult());
                        awardXP(FOOD_TIERS.epic.xp * foodResonanceMult());
                        spawnFloater(exitTile.x, exitTile.y, '+' + FOOD_TIERS.epic.pts + ' EPIC!', '#AA44FF', 18);
                        // Remove the portal food from extraFoods[]
                        extraFoods.splice(efi, 1);
                        // Remove the primary epic food (it's the `food` variable, not in extraFoods[])
                        // The epic's portalLink points to the portal food we just removed.
                        // Check if food is the epic twin: its portalLink matches the eaten portal's position.
                        if (food && food.portalLink && food.portalLink.x === ef.x && food.portalLink.y === ef.y) {
                            food = null;
                            // Generate a new primary food (without portal, since we don't want another portal immediately)
                            var combinedAfterPortal = snake.concat(rivalCombinedSnake()).concat(extraFoods);
                            food = generateFood(combinedAfterPortal);
                            if (!food) { lastDeathCause = 'The board filled up!'; gameOver(); return; }
                        }
                        // Re-anchor: snake becomes a short segment at the exit
                        snake = [{ x: exitTile.x, y: exitTile.y }];
                        while (snake.length < 3) {
                            var tailSeg = wrapPosition({ x: snake[snake.length - 1].x - dx, y: snake[snake.length - 1].y - dy });
                            if (snake.some(function(s) { return s.x === tailSeg.x && s.y === tailSeg.y; })) break;
                            snake.push(tailSeg);
                        }
                        snakeGrew = true;
                        triggerEvolutionIfReady();
                        queueToast('🌀 Teleported!', 1500);
                    } else {
                        // Hoard bonus food: normal eat logic
                        snake.push(tail);
                        snakeGrew = true;
                        triggerEvolutionIfReady();
                        if (activeSeed !== null) recordReplayGrow(gameTick);
                        sessionFoodEaten++;
                        stats.totalFoodEaten++;
                        stats.bonusFoodEaten++;
                        sessionBonusFood++;
                        sessionFoodTypes.add('bonus');
                        if (gameMode !== 'zen' && gameMode !== 'painter') addScore(FOOD_TIERS.bonus.pts * foodResonanceMult());
                        spawnParticles(ef.x, ef.y, FOOD_TIERS.bonus.pCount, foodColor('bonus'));
                        spawnFloater(ef.x, ef.y, '+30 BONUS!', foodColor('bonus'), 18);
                        playSound('bonus');
                        extraFoods.splice(efi, 1);
                        // v11 C: Pigment Rush — eating all 4 hoard foods triggers a 5s ×3 climax
                        if (ef.pigment) {
                            hoardPigmentCount++;
                            if (hoardPigmentCount >= 4 && !pigmentRushActive) {
                                pigmentRushActive = true;
                                pigmentRushTimer = 42; // ~5s at 120ms tick
                                // Extend rival freeze by 3s past the hoard window.
                                // (The old respawnTimer += 3000 on ACTIVE rivals was
                                // a no-op — that timer is only consumed when dead.)
                                rivalFreezeMs = 3000;
                                queueToast('🎨 Pigment Rush! ×3 score!', 3000, 'high');
                                queueGameEffect('flash', { color: '#FFD700', alpha: 0.4, priority: 'high' });
                                // v12 F: sweeping all four hoard foods under a timer is a
                                // danger-priced feat — it pays a charge.
                                bankComboCharge('pigment rush');
                                if (!hasSeenPigmentRush) { hasSeenPigmentRush = true; saveManager.set('snake_has_seen_pigment_rush', '1'); }
                            }
                        }
                    }
                        checkAchievements(score);
                        checkQuestProgress();
                    break; // only eat one food per tick
                }
            }

            // Check power-up collection
            if (powerUpPickup && wrappedHead.x === powerUpPickup.x && wrappedHead.y === powerUpPickup.y) {
                activatePowerUp(powerUpPickup.type);
                powerUpPickup = null;
                spawnParticles(wrappedHead.x, wrappedHead.y, 12, '#FFFFFF');
                playSound('bonus');
            }

            // Snap mode shrink logic
            if (gameMode === 'snap') {
                // Decrement by the ACTUAL tick cadence, not the fixed mode constant —
                // under slow-mo (2x interval) / speed food the wall-clock shrink
                // pressure should track real time, or it trivializes/over-punishes.
                shrinkTimer -= tickInterval;
                if (shrinkTimer <= 0) {
                    if (snake.length <= 1) {
                        lastDeathCause = 'You shrunk to nothing!';
                        gameOver();
                        return;
                    }
                    const tailSeg = snake.pop();
                    shrinkTimer = snapDuration;
                    spawnParticles(tailSeg.x, tailSeg.y, 6, '#FF4444');
                    playSound('eat');
                }
                
                // Duration decreases every ~12 seconds of play
                snapTimeSinceDecrease += tickInterval;
                if (snapTimeSinceDecrease >= 12000) {
                    snapDuration = Math.floor(snapDuration * 0.88);
                    snapTimeSinceDecrease -= 12000;
                    snapLevel++;
                    snapLevelUpFlash = 1500; // show "LEVEL N!" for 1.5s
                    if (snapDuration < 800) snapDuration = 800;
                }
            }

            // Power-up timer update
            if (powerUpType) {
                // Timers are authored in wall-clock ms — subtract the real cadence so a
                // speed boost doesn't drain a 6s shield in ~4.5s.
                const tickDuration = tickInterval;
                powerUpTimer -= tickDuration;
                if (powerUpTimer <= 0) {
                    deactivatePowerUp();
                }
            }

            // Magnet effect: pull food toward snake
            // v8 E: magnet pull skips hunter food (a fleeing hunter pulled 1 tile/tick
            // toward the head would be a free lunch, defeating the challenge).
            if (magnetActive && food && food.type !== 'hunter' && food.type !== 'bomb' && !food.portalLink) {
                const head = snake[0];
                let dx_food = head.x - food.x;
                let dy_food = head.y - food.y;

                // Account for wrapping — use the shortest path on each axis
                if (Math.abs(dx_food) > PLAY_WIDTH / 2) {
                    dx_food = dx_food > 0 ? dx_food - PLAY_WIDTH : dx_food + PLAY_WIDTH;
                }
                if (Math.abs(dy_food) > PLAY_HEIGHT / 2) {
                    dy_food = dy_food > 0 ? dy_food - PLAY_HEIGHT : dy_food + PLAY_HEIGHT;
                }

                const dist = Math.abs(dx_food) + Math.abs(dy_food);
                if (dist > 0 && dist <= 4 * TILE_SIZE) {
                    let newFX = food.x;
                    let newFY = food.y;
                    if (Math.abs(dx_food) >= Math.abs(dy_food)) {
                        newFX += dx_food > 0 ? TILE_SIZE : -TILE_SIZE;
                    } else {
                        newFY += dy_food > 0 ? TILE_SIZE : -TILE_SIZE;
                    }
                    const wrappedPos = wrapPosition({ x: newFX, y: newFY });
                    const wrappedFX = wrappedPos.x;
                    const wrappedFY = wrappedPos.y;
                    if (!snake.some(s => s.x === wrappedFX && s.y === wrappedFY) &&
                        !obstacles.some(o => o.x === wrappedFX && o.y === wrappedFY)) {
                        food.x = wrappedFX;
                        food.y = wrappedFY;
                    }
                }
            }
            // v9 D: magnet also pulls extraFoods[] (hoard bonus foods, not portal foods)
            if (magnetActive) {
                for (var efi2 = 0; efi2 < extraFoods.length; efi2++) {
                    var ef2 = extraFoods[efi2];
                    if (ef2.type === 'portal') continue;
                    var head2 = snake[0];
                    var dfx = head2.x - ef2.x, dfy = head2.y - ef2.y;
                    if (Math.abs(dfx) > PLAY_WIDTH / 2) dfx = dfx > 0 ? dfx - PLAY_WIDTH : dfx + PLAY_WIDTH;
                    if (Math.abs(dfy) > PLAY_HEIGHT / 2) dfy = dfy > 0 ? dfy - PLAY_HEIGHT : dfy + PLAY_HEIGHT;
                    var d2 = Math.abs(dfx) + Math.abs(dfy);
                    if (d2 > 0 && d2 <= 4 * TILE_SIZE) {
                        var nfx = ef2.x, nfy = ef2.y;
                        if (Math.abs(dfx) >= Math.abs(dfy)) nfx += dfx > 0 ? TILE_SIZE : -TILE_SIZE;
                        else nfy += dfy > 0 ? TILE_SIZE : -TILE_SIZE;
                        var wp = wrapPosition({ x: nfx, y: nfy });
                        if (!snake.some(function(s) { return s.x === wp.x && s.y === wp.y; }) &&
                            !obstacles.some(function(o) { return o.x === wp.x && o.y === wp.y; })) {
                            ef2.x = wp.x; ef2.y = wp.y;
                        }
                    }
                }
            }

            // Power-up spawn timer
            if (gameMode !== 'zen' && gameMode !== 'walled' && !powerUpPickup && !powerUpType) {
                powerUpSpawnCounter++;
                if (powerUpSpawnCounter >= 500) {
                    powerUpSpawnCounter = 0;
                    spawnPowerUpPickup();
                }
            }

            // Power-up despawn timer
            if (powerUpPickup && !powerUpType) {
                powerUpDespawnCounter--;
                if (powerUpDespawnCounter <= 0) {
                    powerUpPickup = null;
                }
            }

            // v13: the rival respawn + update block moved to the TOP of the tick (see the
            // hoisted block after the rivalFreezeMs decay). It must run before the player
            // moves so the player's collision test sees the rival's post-move body.
            // The `if (gameState !== 'playing') return;` guard that stood here moved with it.

            // Sparkle trail spawn
            if (cosmetics.trace === 'trace_sparkle' && gameTick % 5 === 0 && snake.length > 1) {
                const tail = snake[snake.length - 1];
                spawnParticles(tail.x, tail.y, 2, '#FFD700');
            }
            if (cosmetics.trace === 'trace_rainbow' && gameTick % 4 === 0 && snake.length > 1) {
                const tail = snake[snake.length - 1];
                const color = ['#FF0000','#FF8800','#FFFF00','#00FF00','#0088FF','#8800FF'][Math.floor(renderTime / 200) % 6];
                spawnParticles(tail.x, tail.y, 3, color);
            }
            if (cosmetics.trace === 'trace_galaxy' && gameTick % 4 === 0 && snake.length > 1) {
                const tail = snake[snake.length - 1];
                const galaxyColors = ['#FF88FF', '#88FFFF', '#FFFF88', '#8888FF', '#FF8888'];
                spawnParticles(tail.x, tail.y, 2, galaxyColors[gameTick % galaxyColors.length]);
            }
            if (cosmetics.trace === 'trace_fire' && gameTick % 6 === 0 && snake.length > 1) {
                const tail = snake[snake.length - 1];
                spawnParticles(tail.x, tail.y, 2, '#FF6600');
            }

            // Passive food regeneration
            var foodRegenInterval = 10;
            if (activeMutators.indexOf('golden_food') !== -1) foodRegenInterval = 20;
            if (gameMode === 'gauntlet') {
                for (var gfpi = 0; gfpi < gauntletPicks.length; gfpi++) {
                    if (gauntletPicks[gfpi].id === 'food_rush') { foodRegenInterval = Math.floor(foodRegenInterval / 2); break; }
                }
            }
            if (!food && gameTick % foodRegenInterval === 0 && gameState === 'playing') {
                const combinedSnake = snake.concat(rivalCombinedSnake()).concat(extraFoods);
                const newFood = generateFood(combinedSnake);
                if (newFood) food = newFood;
            }

            // Synesthesia: rhythmic pulse, drone, pad, arpeggiator
            if (synesthesiaMode && !muted) {
                if (gameTick % 4 === 0) playSynesthesiaPulse();
                if (gameTick % 10 === 0) updateDrone();
                updatePad();
                if (comboCount > 0 && gameTick % Math.max(1, 4 - Math.min(3, Math.floor(comboCount / 5))) === 0) {
                    playSynesthesiaArp();
                }
            }

            lastTickTime = performance.now();
            visualDirty = true;

            // Speed boost counter — decrements every tick
            if (speedBoostCounter > 0) {
                speedBoostCounter--;
                if (speedBoostCounter <= 0) {
                    tickInterval = getEffectiveSpeed();
                }
            } else {
                tickInterval = getEffectiveSpeed();
            }

            // Progressive obstacle spawning
            if (gameMode !== 'zen' && gameMode !== 'walled' && gameMode !== 'daily' && gameMode !== 'painter' && gameMode !== 'gauntlet' && obstacles.length < Math.floor((PLAY_WIDTH / TILE_SIZE) * (PLAY_HEIGHT / TILE_SIZE) * MAX_OBSTACLE_PERCENT)) {
                if (obstacleSpawnTimer <= 0) {
                    obstacleSpawnTimer = OBSTACLE_SPAWN_INTERVAL;
                    const head = snake.length > 0 ? snake[0] : { x: 10 * TILE_SIZE, y: 10 * TILE_SIZE };
                    const count = 1 + Math.floor(seededRandom() * 2);
                    let spawned = 0;
                    for (let i = 0; i < count; i++) {
                        const tile = findFreeTile(head.x, head.y);
                        if (tile) {
                            obstacles.push(tile);
                            newObstacleFlash.push({ x: tile.x, y: tile.y, timer: 1000 });
                            spawned++;
                        }
                    }
                    if (spawned > 0) {
                        newObstacleToastTimer = 2000;
                    }
                } else {
                    obstacleSpawnTimer--;
                }
            }

        }

        function getLevelFromXP(xp) {
            let n = 1;
            while (true) {
                const required = 100 * n * (n + 1) / 2;
                if (xp < required) return n;
                n++;
            }
        }

        function updateXpCache() {
            if (cachedLevel === level) return;
            cachedLevel = level;
            cachedXpForThisLevel = 100 * level * (level + 1) / 2;
            cachedXpForPrevLevel = level > 1 ? 100 * (level - 1) * level / 2 : 0;
        }

        function awardXP(amount) {
            const mc = MODE_CONFIG[gameMode];
            if (!mc.earnXP) return;
            // v11 E: Streak-scaled XP multiplier (+1% per streak day, cap +30%)
            const streakCount = saveManager.getInt('snake_streak_count', 0);
            const streakMult = 1 + Math.min(0.30, streakCount * 0.01);
            amount = Math.round(amount * streakMult);
            if (level >= 20) {
                xpOvercharge += amount;
                sessionXP += amount;
                saveManager.set('snake_xp_overcharge', xpOvercharge);
                return;
            }
            xp += amount;
            sessionXP += amount;
            const newLevel = getLevelFromXP(xp);
            while (newLevel > level) {
                level++;
                levelUpFlash = 1500; // show "LEVEL N!" for 1.5 seconds
                showLevelUpToast(level);
                checkLevelUnlocks(level);
                srSpeak('Level ' + level + '!');
            }
            cachedLevel = -1; // invalidate XP cache on level change
            saveManager.set('snake_xp', xp);
        }

        function loadStats() {
            return Object.assign(getDefaultStats(), saveManager.getJSON('snake_stats', {}));
        }

        function getDefaultStats() {
            return {
                gamesPlayed: 0, totalScore: 0, maxScore: 0,
                totalFoodEaten: 0, normalFoodEaten: 0, bonusFoodEaten: 0, speedFoodEaten: 0,
                longestLength: 0, longestTimeAlive: 0, totalTimePlayed: 0,
                totalDistance: 0, maxCombo: 0, totalDeaths: 0,
                rivalsDefeated: 0,
                shieldBlocks: 0,
                magnetEats: 0,
                dailyCompleted: 0,
                epicFoodEaten: 0,
                bombsEaten: 0, // v10 B
            };
        }

        function saveAllState() {
            saveManager.set('snake_pinnacle', pinnacleRank);
            saveManager.set('snake_xp_overcharge', xpOvercharge);

        function queueToast(message, duration, priority) {
            duration = duration || 3000;
            priority = priority || 'normal';
            // Coalesce against the message currently on screen: extend its display
            // rather than re-showing it after it expires.
            if (toastActive && message === toastCurrentMessage) {
                scheduleToastHide(message, Math.max(duration, toastCurrentDuration));
                return;
            }
            // Coalesce on exact message equality: extend the queued entry rather than
            // duplicating it. Priority is never downgraded.
            for (var qi = 0; qi < toastQueue.length; qi++) {
                if (toastQueue[qi].message === message) {
                    if (duration > toastQueue[qi].duration) toastQueue[qi].duration = duration;
                    if ((TOAST_PRIORITY[priority] || 1) > (TOAST_PRIORITY[toastQueue[qi].priority] || 1)) {
                        toastQueue[qi].priority = priority;
                    }
                    return;
                }
            }
            toastQueue.push({ message: message, duration: duration, priority: priority });
            // Bound the backlog: evict lowest-priority-then-oldest. A `high` message is
            // never evicted while a lower-priority one exists.
            if (toastQueue.length > TOAST_QUEUE_CAP) {
                var worstIdx = -1, worstRank = Infinity;
                for (var wi = 0; wi < toastQueue.length; wi++) {
                    var rank = TOAST_PRIORITY[toastQueue[wi].priority] || 1;
                    if (rank < worstRank) { worstRank = rank; worstIdx = wi; }
                }
                if (worstIdx !== -1) toastQueue.splice(worstIdx, 1);
            }
            if (!toastActive) processToastQueue();
        }

        function processToastQueue() {
            if (toastQueue.length === 0) {
                toastActive = false;
                return;
            }
            toastActive = true;
            // Highest priority first, FIFO within a priority.
            var pickIdx = 0, pickRank = -1;
            for (var pi = 0; pi < toastQueue.length; pi++) {
                var pr = TOAST_PRIORITY[toastQueue[pi].priority] || 1;
                if (pr > pickRank) { pickRank = pr; pickIdx = pi; }
            }
            const toast = toastQueue.splice(pickIdx, 1)[0];
            const el = toastEl;
            if (el) {
                el.textContent = toast.message;
                el.style.display = 'block';
            }
            scheduleToastHide(toast.message, toast.duration);
        }

        // v12 E: the hide timer is kept in a handle so a coalesced repeat can EXTEND the
        // display, and clearToasts() can cancel it outright. The generation guard stays as
        // a second defence against a stale callback re-entering the drain loop.
        function scheduleToastHide(message, duration) {
            toastCurrentMessage = message;
            toastCurrentDuration = duration;
            if (toastTimerHandle) { clearTimeout(toastTimerHandle); toastTimerHandle = null; }
            const gen = toastGeneration;
            toastTimerHandle = setTimeout(function() {
                if (gen !== toastGeneration) return;
                toastTimerHandle = null;
                toastCurrentMessage = '';
                const el2 = toastEl;
                if (el2) el2.style.display = 'none';
                processToastQueue();
            }, duration);
        }

        // v12 E: called from resetGame() ONLY. resetWaveState() must NOT call this —
        // startNextWave() calls it immediately after completeGauntletWave() queued the
        // 2000ms "Wave N Complete!" toast, which would be destroyed in the common case.
        function clearToasts() {
            toastGeneration++;
            if (toastTimerHandle) { clearTimeout(toastTimerHandle); toastTimerHandle = null; }
            toastCurrentMessage = '';
            toastCurrentDuration = 0;
            toastQueue = [];
            toastActive = false;
            if (toastEl) {
                toastEl.style.display = 'none';
                toastEl.textContent = '';
            }
        }

            const mc = MODE_CONFIG[gameMode];

            const ctx = {

                eatAllTypes: sessionFoodTypes.size >= 6,

                    achievements[id] = Date.now();

            if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT' || e.target.tagName === 'TEXTAREA')) return;

                e.preventDefault();
            }

            if (welcomeOverlay && gameState === 'idle') {
                welcomeOverlay = false;
                saveManager.set('snake_has_played', '1');
                visualDirty = true;
            }

            // Gauntlet intermission navigation
            if (gauntletIntermission) {
                if (e.key === 'ArrowLeft' || e.key === 'a') {
                    gauntletSelection = (gauntletSelection - 1 + gauntletPickOptions.length) % gauntletPickOptions.length;
                    drawGame(1);
                    return;
                }
                if (e.key === 'ArrowRight' || e.key === 'd') {
                    gauntletSelection = (gauntletSelection + 1) % gauntletPickOptions.length;
                    drawGame(1);
                    return;
                }
                if (e.key === 'ArrowUp' || e.key === 'w') {
                    gauntletSelection = (gauntletSelection - 1 + gauntletPickOptions.length) % gauntletPickOptions.length;
                    drawGame(1);
                    return;
                }
                if (e.key === 'ArrowDown' || e.key === 's') {
                    gauntletSelection = (gauntletSelection + 1) % gauntletPickOptions.length;
                    drawGame(1);
                    return;
                }
                if (e.key === 'Enter') {
                    gauntletPicks.push(gauntletPickOptions[gauntletSelection]);
                    startNextWave();
                    drawGame(1);
                    return;
                }
                if (e.key === 'Escape') {
                    startNextWave();
                    drawGame(1);
                    return;
                }
                // v6: Cascade mode toggle
                if (cascadeUnlocked && (e.key === 'c' || e.key === 'C')) {
                    cascadeMode = !cascadeMode;
                    queueToast('Cascade Mode: ' + (cascadeMode ? 'ON (pick 3)' : 'OFF (pick 1)'), 2000);
                    drawGame(1);
                    return;
                }
                return;
            }

            if (draftScreenVisible) {
                if (e.key === 'ArrowLeft' || e.key === 'a') {
                    draftSelection = (draftSelection - 1 + draftOptions.length) % draftOptions.length;
                    drawGame(1);
                    return;
                }
                if (e.key === 'ArrowRight' || e.key === 'd') {
                    draftSelection = (draftSelection + 1) % draftOptions.length;
                    drawGame(1);
                    return;
                }
                if (e.key === 'Enter') {
                    // v6: Cascade multi-pick
                    if (cascadeMode && activeMutators.length < 3) {
                        activeMutators.push(draftOptions[draftSelection]);
                        if (activeMutators.length >= 3) {
                            draftScreenVisible = false;
                            draftModeEnabled = false;
                            if (activeMutators.indexOf('double_rival') !== -1 && rivalEnabledInMode(gameMode)) {
                                spawnRival(1);
                            }
                            startGame();
                            queueToast('Cascade x3 starting!', 2000);
                            return;
                        }
                        draftOptions = pickDraftOptions(MUTATOR_DRAFT_SIZE);
                        draftSelection = 0;
                        queueToast('Pick ' + (activeMutators.length + 1) + ' of 3', 1500);
                        drawGame(1);
                        return;
                    }
                    activeMutators = [draftOptions[draftSelection]];
                    draftScreenVisible = false;
                    draftModeEnabled = false;
                    var mutDef = MUTATOR_DEFS[activeMutators[0]];
                    if (activeMutators.indexOf('double_rival') !== -1 && rivalEnabledInMode(gameMode)) {
                        spawnRival(1);
                    }
                    startGame();
                    if (mutDef) queueToast(mutDef.icon + ' ' + mutDef.name + '!', 2000);
                    return;
                }
                if (e.key === 'Escape') {
                    activeMutators = [];
                    draftScreenVisible = false;
                    draftModeEnabled = false;
                    startGame();
                    return;
                }
                if ((e.key === 'r' || e.key === 'R') && mutatorTokens > 0) {
                    mutatorTokens--;
                    saveManager.set('snake_mutator_tokens', mutatorTokens);
                    draftOptions = pickDraftOptions(MUTATOR_DRAFT_SIZE);
                    draftSelection = 0;
                    queueToast('Re-rolled! (Tokens: ' + mutatorTokens + ')', 1500);
                    drawGame(1);
                    return;
                }
                return;
            }
            // v8 C: S key opens the Settings panel (idle/gameover only — placed after
            // the gauntlet-intermission and draft blocks so it never collides with
            // their 's'/S navigation, and blocked during playing/paused).
            if ((e.key === 's' || e.key === 'S') && (gameState === 'idle' || gameState === 'gameover')) {
                showSettingsPanel();
                return;
            }

            if (e.key === 'Enter') {
                if (gameState === 'idle') {
                    if (challengeFromUrl) {
                        gameMode = challengeFromUrl.mode;
                        // resetGame derives activeSeed/seedPrng from seedField.
                        var seedField = document.getElementById('seedField');
                        seedField.value = challengeFromUrl.seed;
                        try { history.replaceState(null, '', window.location.pathname); } catch(e) {}
                        challengeFromUrl = null;
                        resetGame();
                        startGame();
                        visualDirty = true;
                        return;
                    }
                    if (draftModeEnabled && unlockedMutators.length > 0 && gameMode !== 'daily') {
                        resetGame();
                        draftOptions = pickDraftOptions(MUTATOR_DRAFT_SIZE);
                        draftSelection = 0;
                        draftScreenVisible = true;
                        drawGame(1);
                        return;
                    }
                    if (gameMode === 'daily' && dailyAttempts <= 0) {
                        queueToast('No attempts left today!', 2000, 'high');
                        return;
                    }
                    resetGame();
                    startGame();
                    visualDirty = true;
                    return;
                }
                if (gameState === 'gameover') {
                    resetGame();
                    startGame();
                    return;
                }
            }

            // v10 A: Combo Bank — X cycles spend mode (playing), Z spends (playing)
            if ((e.key === 'x' || e.key === 'X') && gameState === 'playing') {
                comboBankSpendMode = (comboBankSpendMode + 1) % 3;
                var modeNames = ['Clear', 'Magnet', 'Teleport'];
                queueToast('⚡ ' + modeNames[comboBankSpendMode] + ' (' + comboCharges + ' charges)', 1500);
                return;
