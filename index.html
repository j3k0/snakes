                // v9 E: hoard state — additive (missing => no active hoard).
                hoardActive = !!data.hoardActive;
                hoardTimer = data.hoardTimer || 0;
                hoardTickCounter = data.hoardTickCounter || 0;
                scoreMultiplier = data.scoreMultiplier || 1;
                // v11 C: Pigment Rush state (additive)
                hoardPigmentCount = data.hoardPigmentCount || 0;
                pigmentRushTimer = data.pigmentRushTimer || 0;
                pigmentRushActive = data.pigmentRushActive || false;
                rivalFreezeMs = data.rivalFreezeMs || 0; // v11 C: rival freeze

                sessionPausedTime = (data.sessionPausedTime || 0) + offlineGap;
                sessionPauseStart = 0;
                // Clean transient visual state (snapshot excludes it by design).
                particles = [];
                transientRings = []; // v9 F: clear visual rings on restore
                deathFragments = [];
                deathFragmentsActive = false;
                flashOverlay = null;
                gameEffects.length = 0;
                rAFEffects.length = 0;
                shakeTimer = 0;
                eatAnimTimer = 0;
                snapLevelUpFlash = 0;
                levelUpFlash = 0;
                touchIndicatorTimer = 0;
                newObstacleFlash = [];
                newObstacleToastTimer = 0;
                if (comboFadeTimer) { clearTimeout(comboFadeTimer); comboFadeTimer = null; }
                pauseMenuSelection = 0;
                pauseConfirmPending = false;
                pauseConfirmAction = null;
                helpOverlayVisible = false;
                ghostPositions = [];

                // Snapshot consumed — clear so it can't be double-restored
                // (only for localStorage path; URL hash restores never wrote).
                if (fromStorage) clearSnapshot();

                srSpeak('Run resumed.');
                resumeGameLoop();
                updateScoreDisplay();
                updateMenuFooter();
                drawGame(1);
                visualDirty = true;
                if (synesthesiaMode) startPad();
                return true;
            } catch (e) {
                if (fromStorage) { quarantineKey(SNAPSHOT_KEY); clearSnapshot(); }
                return false;
            }
        }

        // Restore from a #snapshot=<base64> URL hash. base64 wraps a
        function restoreFromSnapshotHash(hashData) {
            try {
                var json = decodeURIComponent(atob(hashData));
                var data = JSON.parse(json);
                if (restoreFromSnapshot(data, false)) {
                    // Strip the hash so a reload doesn't re-restore the old
                    // shared state over the user's continued play.
                    history.replaceState(null, '', window.location.pathname + window.location.search);
                    return true;
                }
                return false;
            } catch (e) {
                return false;
            }
        }

        // Encode the current run state to a shareable URL hash string.
        function encodeSnapshotHash() {
            var snap = buildSnapshotObject();
            if (!snap) return null;
            try {
                return 'snapshot=' + btoa(encodeURIComponent(JSON.stringify(snap)));
            } catch (e) {
                return null;
            }
        }

        // Clipboard share of the run state.
        function copyRunState() {
            var hash = encodeSnapshotHash();
            if (!hash) { queueToast('No run to copy', 2000); return; }
            var url = window.location.origin + window.location.pathname + '#' + hash;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(url).then(function () {
                    queueToast('Run state copied to clipboard!', 2500);
                }, function () { fallbackCopy(url); });
            } else {
                fallbackCopy(url);
            }
        }

        // Pause-menu "Save & Quit": persist the run, then return to the title
        // screen. The snapshot survives resetGame() (which does not touch it),
        // so the "Resume Run" button lights up on the idle screen.
        function saveAndQuit() {
            if (!saveSnapshot()) {
                queueToast('Could not save run', 2500);
                return;
            }
            stopGameLoop();
            sessionPauseStart = 0;
            resetGame();
            queueToast('\uD83D\uDCBE Run saved — Resume from title screen', 3000);
        }

        function pickWeightedPattern() {
            const rand = seededRandom();
            let cumulative = 0;
            for (const pattern of OBSTACLE_PATTERNS) {
                cumulative += pattern.weight;
                if (rand < cumulative) return pattern;
            }
            return OBSTACLE_PATTERNS[0];
        }

        // ignoreObstacleCap: the MAX_OBSTACLE_PERCENT early-out exists for obstacle
        // SPAWNING; death saves (Phoenix/streak charge) and combo-bank teleports
        // must still find a tile on a capped board, or the save silently fails.
        //
        // v13: the third parameter also accepts an options object. Defaults reproduce the
        // pre-v13 behaviour EXACTLY for every existing caller (3 raw tiles, today's
        // occupancy set) — tightening the shared guard would silently cost a death save
        // its only free tile on a crowded board. The object form is used by spawnRival:
        //   { minTiles, wrapAware, avoidExtras }
        function findFreeTile(headX, headY, opts) {
            var o = (opts === true || opts === false) ? { ignoreObstacleCap: opts } : (opts || {});
            var minTiles = o.minTiles === undefined ? 3 : o.minTiles;
            var wrapAware = !!o.wrapAware;
            var avoidExtras = !!o.avoidExtras;
            const cols = PLAY_WIDTH / TILE_SIZE, rows = PLAY_HEIGHT / TILE_SIZE;
            const maxObs = Math.floor((cols * rows) * MAX_OBSTACLE_PERCENT);
            if (!o.ignoreObstacleCap && obstacles.length >= maxObs) return null;
            for (let attempt = 0; attempt < 50; attempt++) {
                const x = Math.floor(seededRandom() * cols) * TILE_SIZE;
                const y = Math.floor(seededRandom() * rows) * TILE_SIZE;
                // v13: raw Manhattan measured "3 tiles away" on a wrapping board while the
                // tile was 1 step across the seam (head (0,10) -> tile (19,10): raw 19,
                // wrap-aware 1). wrapAware is opt-in so no save path changes meaning.
                var ddx = Math.abs(x - headX), ddy = Math.abs(y - headY);
                if (wrapAware) {
                    ddx = Math.min(ddx, PLAY_WIDTH - ddx);
                    ddy = Math.min(ddy, PLAY_HEIGHT - ddy);
                }
                if (ddx + ddy < minTiles * TILE_SIZE) continue;
                if (snake.some(s => s.x === x && s.y === y)) continue;
                if (obstacles.some(o2 => o2.x === x && o2.y === y)) continue;
                if (food && food.x === x && food.y === y) continue;
                var rivalSegsFree = rivalCombinedSnake();
                if (rivalSegsFree.some(s => s.x === x && s.y === y)) continue;
                if (avoidExtras) {
                    // v13: without this a rival could materialise on the hoard food, the
                    // portal twin, the echo food, a power-up or inside an on-phase hazard
                    // the player is running for — announced by its own countdown arc.
                    if (hazards.some(h => h.phase === 'on' && Math.abs(h.cx - x) + Math.abs(h.cy - y) <= h.radius)) continue;
                    if (extraFoods.some(function (ef) { return ef.x === x && ef.y === y; })) continue;
                    if (food2 && food2.x === x && food2.y === y) continue;
                    if (powerUpPickup && powerUpPickup.x === x && powerUpPickup.y === y) continue;
                }
                return { x, y };
            }
            return null;
        }

        function generateObstacles() {
            obstacles = [];
            if (gameMode === 'zen' || gameMode === 'walled' || gameMode === 'painter' || gameMode === 'gauntlet') return;
            const totalTiles = (PLAY_WIDTH / TILE_SIZE) * (PLAY_HEIGHT / TILE_SIZE);
            const maxObs = Math.floor(totalTiles * MAX_OBSTACLE_PERCENT);
            const count = Math.min(maxObs, 3 + Math.floor(seededRandom() * 6));
            const headX = 10 * TILE_SIZE;
            const headY = 10 * TILE_SIZE;
            
            for (let i = 0; i < count; i++) {
                let placed = false;
                for (let attempt = 0; attempt < 20; attempt++) {
                    const pattern = pickWeightedPattern();
                    const anchorX = Math.floor(seededRandom() * (PLAY_WIDTH / TILE_SIZE)) * TILE_SIZE;
                    const anchorY = Math.floor(seededRandom() * (PLAY_HEIGHT / TILE_SIZE)) * TILE_SIZE;
                    
                    const dist = Math.abs(anchorX - headX) + Math.abs(anchorY - headY);
                    if (dist < 3 * TILE_SIZE) continue;
                    
                    let conflict = false;
                    for (const offset of pattern.tiles) {
                        const tx = anchorX + offset.dx;
                        const ty = anchorY + offset.dy;
                        if (tx < 0 || tx >= PLAY_WIDTH || ty < 0 || ty >= PLAY_HEIGHT) { conflict = true; break; }
                        if (snake.some(s => s.x === tx && s.y === ty)) { conflict = true; break; }
                        if (obstacles.some(o => o.x === tx && o.y === ty)) { conflict = true; break; }
                        if (food && food.x === tx && food.y === ty) { conflict = true; break; }
                    }
                    if (conflict) continue;
                    
                    for (const offset of pattern.tiles) {
                        obstacles.push({ x: anchorX + offset.dx, y: anchorY + offset.dy });
                    }
                    placed = true;
                    break;
                }
                
                if (!placed) {
                    for (let attempt = 0; attempt < 20; attempt++) {
                        const obsX = Math.floor(seededRandom() * (PLAY_WIDTH / TILE_SIZE)) * TILE_SIZE;
                        const obsY = Math.floor(seededRandom() * (PLAY_HEIGHT / TILE_SIZE)) * TILE_SIZE;
                        const dist = Math.abs(obsX - headX) + Math.abs(obsY - headY);
                        if (dist < 3 * TILE_SIZE) continue;
                        if (snake.some(s => s.x === obsX && s.y === obsY)) continue;
                        if (obstacles.some(o => o.x === obsX && o.y === obsY)) continue;
                        if (food && food.x === obsX && food.y === obsY) continue;
                        obstacles.push({ x: obsX, y: obsY });
                        placed = true;
                        break;
                    }
                }
            }
            if (obstacles.length > maxObs) {
                obstacles = obstacles.slice(0, maxObs);
            }
        }

        // v13: the rival is offered by the draft pool, not by a literal mode list scattered
        // across four call sites. `double_rival` used to be draftable in modes where no
        // second rival can ever spawn (see pickDraftOptions) — an advertised mutator that
        // did nothing, which is the v12 "nothing advertised is a lie" defect.
        function rivalEnabledInMode(mode) {
            return mode === 'classic' || mode === 'timeAttack' || mode === 'gauntlet';
        }

        // v13: spawnRival now performs the MATERIALISING step. It picks the tile and the
        // body but leaves the rival inert (`active = false` with a non-empty body is the
        // materialising state — a state built entirely from fields that already
        // round-trip, so the snapshot needs no change). The respawn loop promotes it to
        // active after RIVAL_WINDUP_MS, which is what gives the player warning.
        function spawnRival(idx) {
            if (idx === undefined) idx = 0;
            while (rivals.length <= idx) {
                rivals.push({ snake: [], dx: TILE_SIZE, dy: 0, active: false, respawnTimer: 0, moveCounter: 0, deferCount: 0, color: idx === 0 ? '#B71C1C' : '#AD1457' });
            }
            // Never re-pick over an active OR materialising rival.
            if (rivals[idx].active || rivals[idx].snake.length > 0) return;
            if (!rivalEnabledInMode(gameMode)) return;
            var r = rivals[idx];
            // Spawn at a free tile AWAY from the player. The old fixed center
            // (10*TILE_SIZE) is exactly the player's spawn tile: the rival appeared
            // ON the player (dying on tick 1 whenever it moved the same direction),
            // could materialize on the player's next tile (unfair death), and
            // double_rival rivals stacked on the same tile.
            var ph = (snake && snake.length > 0) ? snake[0] : { x: 10 * TILE_SIZE, y: 10 * TILE_SIZE };
            var spawnPos = findFreeTile(ph.x, ph.y, {
                ignoreObstacleCap: true,
                minTiles: RIVAL_MIN_SPAWN_TILES,
                wrapAware: true,
                avoidExtras: true
            });
            if (!spawnPos) {
                // No free tile right now — re-arm the respawn timer so it retries, instead
                // of stacking onto an occupied tile (or never spawning again once the timer
                // hit 0). Note this is reached AFTER the timer crossed RIVAL_WINDUP_MS, so
                // the pre-empt branch re-enters here roughly every RIVAL_WINDUP_MS — a
                // visibly retrying telegraph on a full board, not a 2s reprieve.
                r.respawnTimer = Math.max(r.respawnTimer, 2000);
                return;
            }
            r.dx = TILE_SIZE;
            r.dy = 0;
            r.moveCounter = 0;
            r.deferCount = 0;
            // v13: the rival spawns WITH a body (arena spec, Feature 1), laid backwards
            // along -dx and truncated at the first blocked tile. A fresh rival is a
            // creature, not a single 20x20 dot, and the telegraph ghost renders the whole
            // body so the shape is announced too.
            r.snake = [{ x: spawnPos.x, y: spawnPos.y }];
            for (var sl = 1; sl < RIVAL_SPAWN_LENGTH; sl++) {
                var prevSeg = r.snake[sl - 1];
                var seg = MODE_CONFIG[gameMode].wrap
                    ? wrapPosition({ x: prevSeg.x - r.dx, y: prevSeg.y - r.dy })
                    : { x: prevSeg.x - r.dx, y: prevSeg.y - r.dy };
                if (seg.x < 0 || seg.x >= PLAY_WIDTH || seg.y < 0 || seg.y >= PLAY_HEIGHT) break;
                if (snake.some(function (s) { return s.x === seg.x && s.y === seg.y; })) break;
                if (obstacles.some(function (ob) { return ob.x === seg.x && ob.y === seg.y; })) break;
                if (r.snake.some(function (s) { return s.x === seg.x && s.y === seg.y; })) break;
                // v13: the body gets the SAME occupancy set as the head tile (findFreeTile's
                // avoidExtras), or the rival could materialise with its tail over the hoard
                // food, a portal twin or inside an on-phase rift — and the telegraph ghost
                // would then be drawn on top of the very thing the player is running for.
                if (food && food.x === seg.x && food.y === seg.y) break;
                if (extraFoods.some(function (ef) { return ef.x === seg.x && ef.y === seg.y; })) break;
                // v13: sibling rivals previously unchecked — under double_rival the head tile
                // respected rivalCombinedSnake() but the body could be laid over the other
                // rival's telegraph.
                if (rivalCombinedSnake().some(function (rs) { return rs.x === seg.x && rs.y === seg.y; })) break;
                if (food2 && food2.x === seg.x && food2.y === seg.y) break;
                if (powerUpPickup && powerUpPickup.x === seg.x && powerUpPickup.y === seg.y) break;
                if (hazards.some(function (h) { return h.phase === 'on' && Math.abs(h.cx - seg.x) + Math.abs(h.cy - seg.y) <= h.radius; })) break;
                r.snake.push(seg);
            }
            r.active = false;
            r.respawnTimer = RIVAL_WINDUP_MS;
            announceRivalIncoming(r);
        }

        // v13: the rival's entry cue, fired when the wind-up STARTS (not at activation), so
        // the player gets the full RIVAL_WINDUP_MS to react. Informational only — nothing
        // here gates gameplay, and sound is never the sole channel (srSpeak + the dashed
        // ring carry the same information).
        function announceRivalIncoming(r) {
            if (!r.snake.length) return;
            if (snake && snake.length > 0) {
                var adx = wrapAxisDelta(r.snake[0].x - snake[0].x, PLAY_WIDTH);
                var ady = wrapAxisDelta(r.snake[0].y - snake[0].y, PLAY_HEIGHT);
                var tiles = Math.round((Math.abs(adx) + Math.abs(ady)) / TILE_SIZE);
                var dirWord = Math.abs(adx) > Math.abs(ady)
                    ? (adx > 0 ? 'right' : 'left')
                    : (ady > 0 ? 'below' : 'above');
                srSpeak('Rival incoming, ' + dirWord + ', ' + tiles + ' tiles');
            }
            playSound('rival_warn');
            if (!hasSeenRival) {
                hasSeenRival = true;
                saveManager.set('snake_has_seen_rival', '1');
                queueToast('\u26A0 Rival incoming — avoid the dashed ring!', 3000, 'high');
            }
        }

        function updateRival(idx) {
            if (idx === undefined) idx = 0;
            if (idx >= rivals.length) return;
            var r = rivals[idx];
            if (!r.active) return;

            // v13: the rival's stride is derived from its OWN length — a short rival competes
            // for food at full parity with the player, a long one is the slow wall it should
            // be. Tick-counted (never wall-clock), so slowMo / speed food / the Swift divider
            // / Time Attack's fixed cadence all scale the rival with the player exactly as
            // before. The skip sits BEFORE the AI re-roll so a skipped tick cannot make the
            // rival turn in place.
            var rStride = r.snake.length >= RIVAL_CADENCE_LONG ? 3
                        : r.snake.length >= RIVAL_CADENCE_MID ? 2 : 1;
            r.moveCounter = (r.moveCounter || 0) + 1;
            if (r.moveCounter % rStride !== 0) return;

            if (food) {
                var rand = seededRandom();
                if (rand < 0.7) {
                    var head = r.snake[0];
                    var dx_food = food.x - head.x;
                    var dy_food = food.y - head.y;
                    if (MODE_CONFIG[gameMode].wrap) {
                        if (Math.abs(dx_food) > PLAY_WIDTH / 2) {
                            dx_food = dx_food > 0 ? dx_food - PLAY_WIDTH : dx_food + PLAY_WIDTH;
                        }
                        if (Math.abs(dy_food) > PLAY_HEIGHT / 2) {
                            dy_food = dy_food > 0 ? dy_food - PLAY_HEIGHT : dy_food + PLAY_HEIGHT;
                        }
                    }
                    var possible = [];
                    if (dx_food > 0) possible.push({ dx: TILE_SIZE, dy: 0 });
                    else if (dx_food < 0) possible.push({ dx: -TILE_SIZE, dy: 0 });
                    if (dy_food > 0) possible.push({ dx: 0, dy: TILE_SIZE });
                    else if (dy_food < 0) possible.push({ dx: 0, dy: -TILE_SIZE });
                    // Never steer into a 180° reversal: the trail body always holds
                    // the previous head tile, so a reversal is a GUARANTEED self-hit
                    // (the AI suicided whenever the food ended up behind it). The
                    // random-turn branch below already guards this.
                    var reverseOfHead = function(d) { return d.dx === -r.dx && d.dy === -r.dy; };
                    var perpCandidates = function() {
                        return [
                            { dx: 0, dy: TILE_SIZE }, { dx: 0, dy: -TILE_SIZE },
                            { dx: TILE_SIZE, dy: 0 }, { dx: -TILE_SIZE, dy: 0 }
                        ].filter(function(d) { return !reverseOfHead(d); });
                    };
                    possible = possible.filter(function(d) { return !reverseOfHead(d); });
                    // v13: stern deadlock. When the food sits directly astern, the axis
                    // filter above leaves `possible` EMPTY, there was no `else`, and
                    // r.dx/r.dy kept their old values — so the rival drove AWAY from the
                    // food for up to a half-lap (traced: food at x=80, rival at x=100
                    // facing +x moved to x=120). Fall back to the perpendicular axis; one
                    // such step makes the food diagonal and the normal chase resumes, so
                    // this cannot oscillate.
                    if (possible.length === 0) possible = perpCandidates();
                    // v13: 1-ply self-rejection — the rule the arena spec promised and
                    // never got. Without it the rival's every turn is a coin-flip on its own
                    // body, which (with the old per-tick growth) made it suicide constantly.
                    // Only indices 0..n-2 are tested: the tail (n-1) is vacated by the pop
                    // that runs before the self test, exactly as it is for the player.
                    var bodyHit = function(d) {
                        var nx = head.x + d.dx, ny = head.y + d.dy;
                        if (MODE_CONFIG[gameMode].wrap) {
                            nx = ((nx % PLAY_WIDTH) + PLAY_WIDTH) % PLAY_WIDTH;
                            ny = ((ny % PLAY_HEIGHT) + PLAY_HEIGHT) % PLAY_HEIGHT;
                        }
                        for (var bi = 0; bi < r.snake.length - 1; bi++) {
                            if (r.snake[bi].x === nx && r.snake[bi].y === ny) return true;
                        }
                        return false;
                    };
                    // v14 B1: the rival steers around SOLID geometry when a free move exists.
                    // Never fatal: when nothing is safe the fallback below takes the blocked
                    // move (the "spirit" escape hatch — the v4 trapped-rival rule stays dead).
                    // Chase branch only: the 20% straight / 10% random branches still walk
                    // through obstacles (measured residual — see AGENTS.md v14).
                    var obstacleHit = function(d) {
                        var nx = head.x + d.dx, ny = head.y + d.dy;
                        if (MODE_CONFIG[gameMode].wrap) {
                            nx = ((nx % PLAY_WIDTH) + PLAY_WIDTH) % PLAY_WIDTH;
                            ny = ((ny % PLAY_HEIGHT) + PLAY_HEIGHT) % PLAY_HEIGHT;
                        }
                        for (var oi = 0; oi < obstacles.length; oi++) {
                            if (obstacles[oi].x === nx && obstacles[oi].y === ny) return true;
                        }
                        return false;
                    };
                    var safe = possible.filter(function(d) { return !bodyHit(d) && !obstacleHit(d); });
                    if (safe.length === 0) {
                        // Every axis candidate is blocked. Try the perpendiculars before
                        // accepting a self-hit — without this the guard was best-effort and
                        // the rival still drove into its own body whenever the food axis and
                        // the body axis were the same.
                        safe = perpCandidates().filter(function(d) { return !bodyHit(d) && !obstacleHit(d); });
                    }
                    if (safe.length > 0) possible = safe;
                    if (possible.length > 0) {
                        var chosen = possible[Math.floor(seededRandom() * possible.length)];
                        r.dx = chosen.dx;
                        r.dy = chosen.dy;
                    }
                } else if (rand < 0.9) {
                    // continue straight
                } else {
                    var dirs = [{dx:TILE_SIZE,dy:0},{dx:-TILE_SIZE,dy:0},{dx:0,dy:TILE_SIZE},{dx:0,dy:-TILE_SIZE}];
                    var rchosen = dirs[Math.floor(seededRandom() * dirs.length)];
                    if (rchosen.dx !== -r.dx || rchosen.dy !== -r.dy) {
                        r.dx = rchosen.dx;
                        r.dy = rchosen.dy;
                    }
                }
            }

            var head = r.snake[0];
            var newHead = {
                x: head.x + r.dx,
                y: head.y + r.dy
            };
            if (MODE_CONFIG[gameMode].wrap) {
                newHead.x = ((newHead.x % PLAY_WIDTH) + PLAY_WIDTH) % PLAY_WIDTH;
                newHead.y = ((newHead.y % PLAY_HEIGHT) + PLAY_HEIGHT) % PLAY_HEIGHT;
            }

            // v13: mirror the player's movement contract — vacate the tail BEFORE the self
            // test (the player pops at L7014 and tests at L7063), and grow only by eating.
            // The old form unshifted and popped only PAST RIVAL_MAX_LENGTH, so the rival
            // gained a segment per tick of empty movement and saturated at 20 in 19 ticks
            // (~2.3s) without eating anything.
            var rTail = r.snake.pop();
            var selfHit = false;
            for (var rs = 0; rs < r.snake.length; rs++) {
                if (r.snake[rs].x === newHead.x && r.snake[rs].y === newHead.y) {
                    selfHit = true; break;
                }
            }
            if (selfHit) {
                removeRival(idx, false); // a rival that tangles itself is NOT a player kill
                return;
            }

            r.snake.unshift(newHead);
            r.movedThisTick = true;   // v13: the move is committed — see the leech clause
            if (r.snake.length > RIVAL_MAX_LENGTH) r.snake.pop();

            // v14 B2: the rift is lethal to everyone standing in it. Post-move: a rival
            // stepping OUT of an igniting rift survives, one stepping IN dies. Runs before
            // the eat block, so a rival cannot eat a food inside a live rift. Credit is
            // false: the player did not ram it, and this must not pay a defeat.
            // (Call-site invariant: updateRival only runs when !hoardActive &&
            // rivalFreezeMs <= 0 && !gauntletIntermission — updateGame's hoisted block.)
            if (MODE_CONFIG[gameMode].hazardsEnabled && isHazardCollision(newHead)) {
                removeRival(idx, false);
                return;
            }

            if (food && newHead.x === food.x && newHead.y === food.y) {
                // v13: growth is the vacated tail returned to the body. The old
                // `push({ x: newHead.x, y: newHead.y })` duplicated the head's own tile —
                // +2 length per food, two identical cells, and one segment permanently over
                // RIVAL_MAX_LENGTH at the cap (pop 19, unshift 20, push 21, pop 21).
                r.snake.push(rTail);
                if (r.snake.length > RIVAL_MAX_LENGTH) r.snake.pop();
                // v9 D: if the rival ate a portal epic, its twin is now stale — remove it
                // (mirrors the player-path cleanup) so it can't grant a phantom epic bonus.
                if (food.type === 'epic') {
                    extraFoods = extraFoods.filter(function(ef) { return !ef.portalLink; });
                }
                var combinedSnake = snake.slice();
                var rivalSegs = rivalCombinedSnake();
                for (var rs2 = 0; rs2 < rivalSegs.length; rs2++) combinedSnake.push(rivalSegs[rs2]);
                // include extraFoods (portal/hoard) so the respawned food never hides one
                for (var rs3 = 0; rs3 < extraFoods.length; rs3++) combinedSnake.push(extraFoods[rs3]);
                var newFood = generateFood(combinedSnake);
                if (newFood) {
                    food = newFood;
                } else {
                    food = null;
                }
                // v14 A: the rival's meal is a player-facing event — you just lost a race.
                // Deliberately quieter than the player's own eat cue (4 particles vs 8-18,
                // a floater phrase not a '+pts', one short blip), and NO toast (ambient
                // information, not an interruption). Fires for every food type.
                spawnFloater(newHead.x, newHead.y, 'rival ate', '#FF8888', 12, 0.8);
                spawnParticles(newHead.x, newHead.y, 4, r.color);
                playSound('rival_eat');
                srSpeak('Rival ate');
                // v12 A: Pressure Cooker resonance (rivalShrink) — a rival eating also
                // shrinks the board. advanceShrinkZone() tests the PLAYER's head, so a
                // rival's meal can kill the player; that is what the descriptor promises.
                // Must honour its death return: the guard immediately after the hoisted
                // rival block in updateGame() (`if (gameState !== 'playing') return;`)
                // handles the propagation, and it is only reached between rivals, not
                // inside this loop.
                if (resonanceActive('rivalShrink')) {
                    if (advanceShrinkZone()) {
                        gameOver();
                        return;
                    }
                }

            // rival's new head against the player's PRE-move head and called removeRival()
            // on a match — so a player who charged a rival destroyed it, took no damage and
            // was credited with a kill (the "I sometimes run through it" report). Contact is
            // now resolved entirely in the player's phase, against post-move positions:
            //   rule 1 — player head on a rival segment  → player dies (checkPlayerDeath)
            //   rule 2 — rival head on the player's body → rival dies   (resolveRivalRams)

        }

        // removals count — a rival that tangles itself used to pay the player a defeat,
        // which (with the free-growth bug) was the dominant source of RIVAL_SLAYER and the
        // 25 / 100 rival milestones.
        function removeRival(idx, defeatedByPlayer) {
            if (idx === undefined) idx = 0;
            if (idx >= rivals.length) return;
            var r = rivals[idx];
            var wasActive = r.active;
            // The arena spec's "particle explosion" — must run while r.snake[0] exists.
            if (r.active && r.snake.length > 0) {
                spawnParticles(r.snake[0].x, r.snake[0].y, 20, r.color);
                if (wasActive && defeatedByPlayer) {

                }
            }
            r.snake = [];
            r.active = false;
            r.respawnTimer = RIVAL_RESPAWN_MS;
            if (wasActive && defeatedByPlayer) {
                stats.rivalsDefeated++;
                addScore(50);             // spec: +50 bonus score
                awardXP(100);             // spec: +100 XP
                playSound('powerdown');   // reused — the defeat needs no new sound case
                queueToast('\u2694\uFE0F Rival defeated!', 1500);

            srSpeak(defeatedByPlayer ? 'Rival destroyed' : 'Rival destroyed itself');

        // v13: wrap-aware Manhattan distance between two tiles, in tiles.
        function rivalTileDistance(x1, y1, x2, y2) {
            var dx = Math.abs(wrapAxisDelta(x2 - x1, PLAY_WIDTH));
            var dy = Math.abs(wrapAxisDelta(y2 - y1, PLAY_HEIGHT));
            return (dx + dy) / TILE_SIZE;
        }

        // exists to be reacted to, not to ambush. Re-measured at the activation instant.
        function playerInsideRivalSpawnRadius(r) {
            if (!r.snake.length || !snake || snake.length === 0) return false;

        // occupancy (new head + post-pop body). Testing this from inside updateRival would
        // use the PRE-move body, which still holds the tile the player is about to vacate
        // — so a rival merely following the player was destroyed and credited.
        // Rule 1 (checkPlayerDeath) runs first and returns on a hit, so reaching here
        // proves the two heads are not on the same tile: a head-on is never double-resolved.
        //
        // v13: the scan starts at si = 1 — the player's HEAD tile is rule 1's business, never
        // rule 2's. A save (shield especially) cancels rule 1 without relocating the head, so

        // would hand the player a credited, rewarded kill for being saved.
        function resolveRivalRams() {
            for (var ri = 0; ri < rivals.length; ri++) {
                if (!rivals[ri].active || rivals[ri].snake.length === 0) continue;
                // v13: rule 1 already adjudicated this rival's contact this tick (and a save
                // may have absorbed it) — never resolve it again in the player's favour.
                if (ri === rivalHeadContactIdx) continue;
                var rHead = rivals[ri].snake[0];
                for (var si = 1; si < snake.length; si++) {
                    if (snake[si].x === rHead.x && snake[si].y === rHead.y) {
                        removeRival(ri, true);
                        break;
                    }
                }
            }
        }

            drawGame(1);

            if (sessionCascadeMult < 1 && sessionRunMaxRaw > 0 &&

        // v8 D: Game-Over Recap Card helpers.
        function captureQuestBaseline() {
            return {
                daily: dailyQuests.map(function(q) { return q.progress || 0; }),
                weekly: weeklyQuests.map(function(q) { return q.progress || 0; })
            };
        }
        function buildRecapData() {
            var prevBest = sessionModeHighStart || 0;
            var isZen = gameMode === 'zen';
            var isNewBest = !isZen && score > prevBest;
            // Quest progress deltas (per-run-best semantics mirror quests themselves).
            var questDeltas = [];
            if (recapQuestBaseline) {
                var collect = function(quests, base, period) {
                    for (var i = 0; i < quests.length; i++) {
                        var before = base[i] || 0;
                        var after = quests[i].progress || 0;
                        if (after > before) {
                            questDeltas.push({ desc: quests[i].desc, delta: after - before, target: quests[i].target, completed: quests[i].completed });
                        }
                    }
                };
                collect(dailyQuests, recapQuestBaseline.daily, 'daily');
                collect(weeklyQuests, recapQuestBaseline.weekly, 'weekly');
            }
            questDeltas.sort(function(a, b) { return b.delta - a.delta; });
            var tierName = evolutionTier >= 0 ? EVOLUTION_TIERS[evolutionTier].name : null;
            recapData = {
                score: score,
                isZen: isZen,
                prevBest: prevBest,
                isNewBest: isNewBest,
                xpEarned: sessionXP || 0,
                evolutionTier: tierName,
                questDeltas: questDeltas.slice(0, 3),
                // v12 C: what killed you, the last save (if any), and the cascade
                // arithmetic. lastDeathCause was ALWAYS tracked but only ever rendered on
                // the gauntlet and legacy-overlay paths — every non-gauntlet death since
                // v8 D takes this card, so the single most-asked question after a death
                // went unanswered on the screen where it matters.
                deathCause: lastDeathCause || '',
                saveEvent: lastSaveEvent || '',
                rawScore: sessionRawScore,
                cascadeMult: sessionCascadeMult
            };
        }
        function drawRecapCard() {
            if (!recapData) return;
            ctx.save();

            // v12 C: the card is laid out with a running cursor and a card height derived
            // from the row count, instead of the previous hard-coded offsets (XP at +80,
            // quests at +100, prompt at cardH-22). Adding the death-cause, save and
            // cascade rows to a fixed 168px box would have overprinted the retry prompt.
            var cardW = 320;
            var cx = CANVAS_WIDTH / 2;
            var dashStr = '';
            if (!recapData.isZen) {
                dashStr = recapData.isNewBest
                    ? '＋' + (recapData.score - recapData.prevBest) + ' vs best'
                    : (recapData.prevBest > 0 ? '−' + (recapData.prevBest - recapData.score) + ' vs best' : '');
            }
            // v12 C: gate on the FACTOR, not on the mode. gameOver() applies the cascade
            // on a Zen death too (Zen is draftable), so keying this on !isZen hid the row
            // in exactly the case that needed it: a Zen starvation death with 2+ mutators
            // halved the length score and the card showed no explanation. endZenSession()
            // forces the factor to 1, so a manual Zen quit still shows no row.
            var hasCascade = recapData.cascadeMult < 1;
            var hasCause = !!recapData.deathCause;
            var hasSave = !!recapData.saveEvent;
            var questRows = recapData.questDeltas.length;

            // Content height computed from the same row arithmetic used to draw, so the
            // card can never be sized differently from its contents.
            var contentH = 10 + 26 + 26                       // top pad, title, score
                         + (dashStr ? 15 : 0)
                         + (hasCascade ? 15 : 0)
                         + (hasCause ? 16 : 0)
                         + (hasSave ? 15 : 0)
                         + 17                                 // XP / tier line
                         + questRows * 14;
            var cardH = contentH + 26;                        // + retry-prompt row
            var cardX = (CANVAS_WIDTH - cardW) / 2;
            var cardY = CANVAS_HEIGHT / 2 - cardH / 2 + 6;
            ctx.fillStyle = 'rgba(0,0,0,0.88)';
            ctx.fillRect(cardX, cardY, cardW, cardH);
            ctx.strokeStyle = recapData.isNewBest ? '#FFD700' : '#555';
            ctx.lineWidth = 2;
            ctx.strokeRect(cardX, cardY, cardW, cardH);
            ctx.textAlign = 'center';
            ctx.textBaseline = 'top';

            var y = cardY + 10;
            // Title
            ctx.fillStyle = recapData.isNewBest ? '#FFD700' : '#CCC';
            ctx.font = 'bold 18px Arial';
            ctx.fillText(recapData.isZen ? 'ZEN SESSION ENDED' : (recapData.isNewBest ? '★ NEW BEST! ★' : 'RUN OVER'), cx, y);
            y += 26;
            // Score line
            ctx.font = 'bold 22px Arial';
            ctx.fillStyle = '#FFF';
            ctx.fillText(recapData.isZen ? 'Length: ' + recapData.score : 'Score: ' + recapData.score, cx, y);
            y += 26;
            if (dashStr) {
                ctx.font = '12px Arial';
                ctx.fillStyle = recapData.isNewBest ? '#FFD700' : '#888';
                ctx.fillText(dashStr, cx, y);
                y += 15;
            }
            // Cascade disclosure — shows the arithmetic the game used to apply silently.
            if (hasCascade) {
                ctx.font = '12px Arial';
                ctx.fillStyle = '#FF8888';
                ctx.fillText('⚠ Cascade ×' + recapData.cascadeMult + '   ' + recapData.rawScore + ' → ' + recapData.score, cx, y);
                y += 15;
            }
            // Death cause — the question every player asks first.
            if (hasCause) {
                ctx.font = 'bold 13px Arial';
                ctx.fillStyle = '#FF9999';
                ctx.fillText(recapData.deathCause, cx, y);
                y += 16;
            }
            // Last save — a rescue is not a death; report it separately.
            if (hasSave) {
                ctx.font = '12px Arial';
                ctx.fillStyle = '#88CCFF';
                ctx.fillText(recapData.saveEvent + ' (survived)', cx, y);
                y += 15;
            }
            // XP + evolution line
            ctx.font = '13px Arial';
            ctx.fillStyle = '#9B59B6';
            var xpLine = '＋' + recapData.xpEarned + ' XP';
            if (recapData.evolutionTier) xpLine += '  |  Tier: ' + recapData.evolutionTier;
            ctx.fillText(xpLine, cx, y);
            y += 17;
            // Quest progress lines (up to 3)
            ctx.font = '11px Arial';
            ctx.fillStyle = '#44FF88';
            for (var qi = 0; qi < recapData.questDeltas.length; qi++) {
                var qd = recapData.questDeltas[qi];
                ctx.fillText('▸ ' + qd.desc + ' (+' + qd.delta + (qd.completed ? ' ✓' : '') + ')', cx, y);
                y += 14;
            }
            // Retry prompt — anchored to the card bottom, so it follows any card growth.
            ctx.font = '12px Arial';
            ctx.fillStyle = '#888';
            ctx.fillText('Press ENTER to retry', cx, cardY + cardH - 22);
            ctx.restore();
        }
        // v8 F: Bounty Rush — templates and logic.
        const BOUNTY_TEMPLATES = [
            { id: 'score',  desc: 'Score +{n} within the window',        kind: 'score',     target: 50,  windowTicks: 120, reward: { pts: 40 } },
            { id: 'food',   desc: 'Eat {n} more foods within the window', kind: 'food',      target: 3,   windowTicks: 90,  reward: { xp: 50 } },
            { id: 'combo',  desc: 'Reach a {n}x combo within the window', kind: 'combo',     target: 5,   windowTicks: 100, reward: { pts: 60 } },
            { id: 'length', desc: 'Grow by {n} segments within the window', kind: 'length',  target: 2,   windowTicks: 120, reward: { xp: 60 } },
            { id: 'speed',  desc: 'Eat {n} speed food within the window',   kind: 'speedFood', target: 1, windowTicks: 150, reward: { pts: 50 } }
        ];
        function pickBountyTemplate() {
            // Exclude kinds irrelevant to the current mode (e.g. speedFood where it
            // can't spawn). Weighted equally among valid templates.
            var valid = BOUNTY_TEMPLATES.filter(function(t) {
                if (t.kind === 'speedFood' && (gameMode === 'zen' || gameMode === 'painter' || gameMode === 'walled')) return false;
                return true;
            });
            if (!valid.length) return null;
            return valid[Math.floor(seededRandom() * valid.length)];
        }
        function spawnBounty() {
            var tpl = pickBountyTemplate();

            var target = tpl.target;
            if (tpl.kind === 'score') target = tpl.target + Math.floor(score / 50) * 25;
            if (tpl.kind === 'combo') target = Math.max(tpl.target, Math.min(15, comboCount + 3));
            if (tpl.kind === 'length') target = Math.max(tpl.target, Math.floor(snake.length / 10) + 1);
            activeBounty = {
                id: tpl.id,
                desc: tpl.desc.replace('{n}', target),
                kind: tpl.kind,
                target: target,
                windowTicks: tpl.windowTicks,
                reward: tpl.reward,
                ticksLeft: tpl.windowTicks,
                baseline: { score: score, sessionFoodEaten: sessionFoodEaten, comboCount: comboCount, snakeLen: snake.length, sessionSpeedFood: sessionSpeedFood }
            };

        }
        function checkBounty() {
            if (!activeBounty) return;
            var b = activeBounty;
            var done = false;
            if (b.kind === 'score')      done = (score - b.baseline.score) >= b.target;
            else if (b.kind === 'food')   done = (sessionFoodEaten - b.baseline.sessionFoodEaten) >= b.target;
            else if (b.kind === 'combo')  done = comboCount >= b.target; // live combo (auto-completes if already past)
            else if (b.kind === 'length') done = (snake.length - b.baseline.snakeLen) >= b.target;
            else if (b.kind === 'speedFood') done = (sessionSpeedFood - b.baseline.sessionSpeedFood) >= b.target;
            if (done) {

                queueToast('✅ Bounty complete! +' + (b.reward.pts || b.reward.xp) + (b.reward.pts ? ' pts' : ' XP'), 2500, 'high');
                // v12 F: contracts are a danger-priced income source for the combo bank.

        function tickBounty() {

                    if (Math.abs(ddx) + Math.abs(ddy) <= pulseRad) {

                        if (Math.abs(ddx) >= Math.abs(ddy)) {
                            f.x = head.x + (ddx > 0 ? -TILE_SIZE : TILE_SIZE);
                            f.y = head.y;
                        } else {
                            f.x = head.x;
                            f.y = head.y + (ddy > 0 ? -TILE_SIZE : TILE_SIZE);
                        }
                        if (canWrap) {
                            f.x = ((f.x % PLAY_WIDTH) + PLAY_WIDTH) % PLAY_WIDTH;
                            f.y = ((f.y % PLAY_HEIGHT) + PLAY_HEIGHT) % PLAY_HEIGHT;
                        }
                    }
                });
                pushTransientRing(head.x + TILE_SIZE / 2, head.y + TILE_SIZE / 2, pulseRad, '#FF00FF', 400, 'ring', 3);
            } else if (comboBankSpendMode === 2) {
                // Food Teleport: relocate current food near head (skip portal-linked epics;
                // the primary food is never type 'portal', so check the portalLink instead)
                if (food && !food.portalLink) {
                    var ft = findFreeTile(head.x, head.y, true);
                    if (ft) { food.x = ft.x; food.y = ft.y; }
                    else { consumed = false; }
                } else {
                    consumed = false;
                }
                pushTransientRing(head.x + TILE_SIZE / 2, head.y + TILE_SIZE / 2, 2 * TILE_SIZE, '#FFFF00', 300, 'ring', 2);
            }
            if (consumed) comboCharges--;
        }

        function spawnParticles(x, y, count, color) {
            count = Math.min(count, 500 - particles.length);
            // v8 C: particle-density slider scales spawn count (after the perf clamp).
            count = Math.round(count * particleDensity / 100);
            if (count <= 0) return;
            for (let i = 0; i < count; i++) {
                particles.push({
                    x: x + TILE_SIZE / 2,
                    y: y + TILE_SIZE / 2,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    life: 1.0,
                    maxLife: count > 20 ? 1.0 : 0.5,
                    color: color,
                    size: Math.random() * 3 + 2
                });
            }
        }
        // v9 F: Transient rings — shared visual ring/puff array (hunter dust, bounty burst, power-up shockwave).
        // Drained in animateVisuals with delta time; capped at 50; reset in resetGame/resetWaveState.
        function pushTransientRing(x, y, maxRadius, color, maxLife, type, lineWidth) {
            if (transientRings.length >= 50) transientRings.shift();
            transientRings.push({ x: x, y: y, maxRadius: maxRadius, alpha: 0.8, color: color, life: maxLife, maxLife: maxLife, type: type || 'ring', lineWidth: lineWidth || 2 });
        }

        // v12 D: Help & Legend truth pass. Both surfaces below derive from FOOD_TIERS,
        // which AGENTS.md designates the global authority for food distribution. Before

        // the real values (0.33/0.13) after the v8 E hunter and v10 B bomb rebalances; it
        // also omitted hunter and bomb entirely, and its colours were looked up by index
        // into Object.keys(FOOD_TIERS) while the names were hard-coded — so inserting a
        // tier silently miscoloured the whole table.
        function buildFoodTableRows() {
            return Object.keys(FOOD_TIERS).map(function(key) {
                var t = FOOD_TIERS[key];
                return {
                    key: key,
                    // Colour is derived from the SAME key being rendered, never an index.
                    color: foodColor(key),
                    label: t.shortName || key,
                    stats: t.pts + 'pts/' + t.xp + 'XP/' + Math.round(t.weight * 100) + '%'
                };
            });
        }

            { keys: 'Q',           desc: 'Quests' },
            { keys: 'S (idle)',    desc: 'Settings' },

        // v12 D: draw text, truncating with an ellipsis so it can never run past maxX.
        //
        // The help overlay used to rely on hardcoded column offsets, and canvas text
        // metrics are environment-dependent: 'Cycle combo-bank mode' measures 132.7px in
        // one Chromium build and 149.1px in another, so the same offset fits in one and
        // clips mid-glyph in the other. Measuring at draw time is the only layout that
        // holds everywhere. A visible ellipsis is honest; a glyph chopped at the canvas
        // edge reads as a rendering bug.
        function fillTextClipped(text, x, y, maxX) {
            var avail = maxX - x;
            if (avail <= 0) return;
            if (ctx.measureText(text).width <= avail) { ctx.fillText(text, x, y); return; }
            var ell = '\u2026';
            // Longest prefix (plus the ellipsis) that fits — bisection, ~log2(len) measures.
            var lo = 0, hi = text.length;
            while (lo < hi) {
                var mid = (lo + hi + 1) >> 1;
                if (ctx.measureText(text.slice(0, mid) + ell).width <= avail) lo = mid;
                else hi = mid - 1;
            }
            ctx.fillText(lo > 0 ? text.slice(0, lo) + ell : ell, x, y);
        }

        function drawHelpOverlay() {

                // Column 1 stops before column 2 starts; column 2 stops before the edge.

                fillTextClipped(b.desc, x + (col === 0 ? 92 : 67), y,

                // that overflow a 440px line at this size. Ellipsised rather than clipped
                // mid-glyph; the full text stays in getModeDesc() for the screen reader

                fillTextClipped(MODE_CONFIG[mode].name + ': ' + getModeDesc(mode), 20, y, CANVAS_WIDTH - 6);
            });

            // Footer

        function drawWelcomeOverlay() {

        function animateVisuals(timestamp) {
            if (!lastFrameTime) lastFrameTime = timestamp;
            const delta = Math.min(timestamp - lastFrameTime, 100);
            lastFrameTime = timestamp;
            renderTime = timestamp || performance.now();

            // Update and draw particles
            for (let i = particles.length - 1; i >= 0; i--) {
                const p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.vy += 0.05; // gravity
                p.life -= delta / (p.maxLife * 1000) * (slowMoActive ? 0.5 : 1);
                if (p.life <= 0) {
                    particles.splice(i, 1);
                }
            }

            if (shakeTimer > 0) shakeTimer = Math.max(0, shakeTimer - delta);
            if (eatAnimTimer > 0) eatAnimTimer = Math.max(0, eatAnimTimer - delta);
            if (snapLevelUpFlash > 0) snapLevelUpFlash = Math.max(0, snapLevelUpFlash - delta);

            if (touchIndicatorTimer > 0) touchIndicatorTimer = Math.max(0, touchIndicatorTimer - delta);

            // v6: Floater lifecycle decay
            for (var fi = floaters.length - 1; fi >= 0; fi--) {
                floaters[fi].life -= delta / 1000;
                if (floaters[fi].life <= 0) floaters.splice(fi, 1);
            }
            // --- end v6 ---

            // New obstacle flash timer decay
            for (let i = newObstacleFlash.length - 1; i >= 0; i--) {
                newObstacleFlash[i].timer -= delta;
                if (newObstacleFlash[i].timer <= 0) newObstacleFlash.splice(i, 1);
            }
            if (newObstacleToastTimer > 0) newObstacleToastTimer -= delta;

            // v7: Flash overlay decay — read from queue, not direct write
            if (flashOverlay) {
                flashOverlay.alpha -= delta * 0.004;
                if (flashOverlay.alpha <= 0) flashOverlay = null;
            }

            // v7: Level-up flash — queue to rAF effects instead of direct write
            if (levelUpFlash > 0) {
                levelUpFlash = Math.max(0, levelUpFlash - delta);
                queueRAFEffect('flash', { color: '#FFD700', alpha: Math.min(0.3, levelUpFlash / 5000), priority: 'critical' });
            }

            const elapsed = timestamp - lastTickTime;
            const t = lastTickTime > 0 ? Math.min(elapsed / tickInterval, 1) : 1;

            // Effects are stored in play-area coordinates (tile + TILE_SIZE/2), but
            // drawGame translates the play area by the HUD margins — so the rAF
            // effect layer must apply the same translate or every particle/fragment/
            // ring/floater appears offset into the margin. (Combo/evolution floaters
            // were the only margin-relative callers; now all floaters are play-area.)
            const needsRedraw = gameState === 'playing' || visualDirty || particles.length > 0 || flashOverlay || hasPendingEffects() || shakeTimer > 0 || eatAnimTimer > 0 || snapLevelUpFlash > 0 || (gameMode === 'snap' && gameState === 'playing') || deathFragmentsActive || transientRings.length > 0 || floaters.length > 0 || touchIndicatorTimer > 0 || levelUpFlash > 0 || helpOverlayVisible;
            if (needsRedraw) {
                visualDirty = false;
                // v8 A: fold the shake into drawGame's base transform instead of a
                // save()/translate()/restore() wrapper (which a setTransform inside
                // drawGame would wipe). shakeOffsetX/Y are read by drawGame's setTransform.
                if (shakeTimer > 0 && gameState !== 'paused') {
                    // v8 B: calm mode kills shake; v8 C: shakeIntensity slider scales it.
                    const intensity = calmModeEffective() ? 0 : (shakeTimer / 200) * 5 * (shakeIntensity / 100);
                    shakeOffsetX = (Math.random() - 0.5) * 2 * intensity;
                    shakeOffsetY = (Math.random() - 0.5) * 2 * intensity;
                } else {
                    shakeOffsetX = 0;
                    shakeOffsetY = 0;
                }
                drawGame(t);
            }

            // Effects are in play-area coords but the base transform is drawGame's
            // absolute DPR setTransform (shake folded in) — apply the margin
            // translate AFTER drawGame so the effect layer lands on the board.
            ctx.save();
            ctx.translate(PLAY_MARGIN_LEFT, PLAY_MARGIN_TOP);

            // Render particles on top of game state
            for (const p of particles) {
                const alpha = Math.max(0, p.life);
                ctx.globalAlpha = alpha;
                ctx.fillStyle = p.color;
                ctx.fillRect(p.x - p.size / 2, p.y - p.size / 2, p.size, p.size);
            }
            ctx.globalAlpha = 1;

            // v7 D4: snake-decay death fragments — additive glow, tail-to-head via
            // per-fragment delay. MUST restore globalCompositeOperation to 'source-over'
            // after (ctx.restore() handles it). Updated with delta time so the effect
            // is frame-rate independent. Only active right after gameOver().
            if (deathFragmentsActive && deathFragments.length > 0) {
                ctx.save();
                ctx.globalCompositeOperation = 'lighter';
                for (let dfi = deathFragments.length - 1; dfi >= 0; dfi--) {
                    const df = deathFragments[dfi];
                    if (df.delay > 0) { df.delay -= delta; continue; }
                    df.x += df.vx;
                    df.y += df.vy;
                    df.vy += 0.08; // gravity
                    df.life -= delta / 1000;
                    if (df.life <= 0) { deathFragments.splice(dfi, 1); continue; }
                    ctx.globalAlpha = df.life / df.maxLife;
                    ctx.fillStyle = df.color;
                    ctx.shadowBlur = df.size;
                    ctx.shadowColor = df.color;
                    ctx.beginPath();
                    ctx.arc(df.x, df.y, df.size, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.restore(); // restores globalAlpha, compositeOp, shadowBlur, shadowColor
                if (deathFragments.length === 0) deathFragmentsActive = false;
            }
            // v9 F: Transient rings (hunter dust, bounty burst, power-up shockwave)
            if (transientRings.length > 0) {
                ctx.save();
                for (var tri = transientRings.length - 1; tri >= 0; tri--) {
                    var tr = transientRings[tri];
                    tr.life -= delta;
                    if (tr.life <= 0) { transientRings.splice(tri, 1); continue; }
                    var lifeFrac = tr.life / tr.maxLife;
                    var r = tr.maxRadius * (1 - lifeFrac);
                    var a = lifeFrac * tr.alpha;
                    ctx.globalAlpha = a;
                    ctx.strokeStyle = tr.color;
                    ctx.lineWidth = tr.lineWidth || 2;
                    if (tr.type === 'dust') {
                        ctx.fillStyle = tr.color;
                        ctx.globalAlpha = a * 0.5;
                        ctx.beginPath();
                        ctx.arc(tr.x, tr.y, r * 0.5, 0, 2 * Math.PI);
                        ctx.fill();
                    } else {
                        ctx.beginPath();
                        ctx.arc(tr.x, tr.y, r, 0, 2 * Math.PI);
                        ctx.stroke();
                    }
                }
                ctx.restore();
            }

            // v6: Render floaters on top of particles
            if (floaters.length > 0) drawFloaters(ctx);
            // --- end v6 ---
            ctx.restore(); // end play-area translated effect layer

            // Touch swipe indicator
            if (touchIndicatorTimer > 0) {
                const alpha = Math.min(1, touchIndicatorTimer / 150);
                ctx.save();
                ctx.globalAlpha = alpha * 0.3;
                ctx.fillStyle = '#4488FF';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                ctx.restore();
            }

            // Help overlay — renders on top of everything
            if (helpOverlayVisible) {
                drawHelpOverlay();
            }


            // New obstacle toast
            if (newObstacleToastTimer > 0 && gameState === 'playing') {
                ctx.save();
                ctx.font = '16px Arial';
                ctx.fillStyle = 'rgba(255, 150, 50, ' + Math.min(1, newObstacleToastTimer / 500) + ')';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillText('\u26A0 New obstacles!', CANVAS_WIDTH / 2, 10);
                ctx.restore();
            }
            // v8 F: Bounty countdown ring (read-only — never writes activeBounty).
            if (activeBounty && gameState === 'playing') {
                ctx.save();
                var ringX = CANVAS_WIDTH / 2, ringY = 38, ringR = 14;
                var frac = Math.max(0, activeBounty.ticksLeft / activeBounty.windowTicks);
                // v9 F2: urgency pulse when time is running low (calm-mode: skip oscillation, keep arc)
                var urgencyActive = frac < 0.3 && !calmModeEffective() && !hoardActive;
                var ringR_eff = urgencyActive ? ringR + Math.sin(renderTime * 0.01) * 3 : ringR;
                var ringColor = urgencyActive ? '#FF4444' : (frac > 0.3 ? '#FFD700' : '#FF6B35');
                ctx.strokeStyle = '#333';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(ringX, ringY, ringR_eff, 0, 2 * Math.PI);
                ctx.stroke();
                ctx.strokeStyle = ringColor;
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(ringX, ringY, ringR_eff, -Math.PI / 2, -Math.PI / 2 + frac * 2 * Math.PI);
                ctx.stroke();
                ctx.font = 'bold 9px Arial';
                ctx.fillStyle = '#FFD700';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('📋', ringX, ringY);
                ctx.font = '9px Arial';
                ctx.fillStyle = '#CCC';
                ctx.fillText(activeBounty.desc, ringX, ringY + ringR + 6);
                ctx.restore();
            }

            // Snap level-up flash
            if (snapLevelUpFlash > 0 && gameMode === 'snap') {
                const alpha = Math.min(1, snapLevelUpFlash / 500);
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = '#FFD700';
                ctx.font = 'bold 24px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'bottom';
                ctx.fillText('⚡ LEVEL ' + snapLevel + ' ⚡', CANVAS_WIDTH / 2, CANVAS_HEIGHT - 15);
                ctx.restore();
            }

            // XP level-up flash
            if (levelUpFlash > 0 && level >= 1) {
                const alpha = Math.min(1, levelUpFlash / 500);
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.fillStyle = '#FFD700';
                ctx.font = 'bold 24px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'top';
                ctx.fillText('🌟 LEVEL ' + level + '! 🌟', CANVAS_WIDTH / 2, 20);
                ctx.restore();
            }

            // Flash overlay — renders last on top of everything (AGENTS.md)
            // v7: Flash overlay — drain visual queue (merges game-tick and rAF effects)
            const visualFX = drainVisualQueue();
            if (visualFX.flash) {
                ctx.fillStyle = visualFX.flash.color === 'rainbow'
                    ? 'hsl(' + (Date.now() % 2000 / 2000 * 360) + ', 100%, 50%)'
                    : visualFX.flash.color;
                // v8 B: calm mode clamps flash alpha so screen flashes stay subtle.
                var flashAlpha = visualFX.flash.alpha;
                if (calmModeEffective()) flashAlpha = Math.min(flashAlpha, 0.15);
                ctx.globalAlpha = Math.max(0, flashAlpha);
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                ctx.globalAlpha = 1;
            }

            // Animate score
            const scoreDelta = score - displayedScore;
            if (scoreDelta > 1) {
                displayedScore += Math.ceil(scoreDelta * 0.3);
            } else if (scoreDelta > 0) {
                displayedScore = score;
            }
            if (displayedScore !== parseInt(scoreEl.textContent, 10)) {
                scoreEl.textContent = displayedScore;
            }

            const comboEl = comboDisplayEl;
            if (comboEl) {
                const mul = 1 + comboCount * 0.5;
                const comboText = comboCount > 0 ? 'x' + mul.toFixed(1) + ' COMBO!' : '';
                if (comboEl.textContent !== comboText) {
                    comboEl.textContent = comboText;
                }
            }
            const xpEl = xpDisplayEl;
            if (xpEl) {
                if (xpEl.style.display !== 'none') {
                    xpEl.style.display = 'none';
                }
            }

            requestAnimationFrame(animateVisuals);
        }

        function drawOverlay(text, subtext) {
            ctx.save();
            if (gameState === 'idle') {
                if (welcomeOverlay) {
                    drawWelcomeOverlay();
                    ctx.restore();
                    return;
                }
                ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
                ctx.fillStyle = '#FFF';
                ctx.font = 'bold 32px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';

            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

                ctx.fillStyle = '#AAA';
