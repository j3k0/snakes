        function drawGrid() {
            ensureGridCache();
            // v8 A: explicit dest size so the DPR-scaled cache paints at logical dims.
            ctx.drawImage(gridCacheCanvas, 0, 0, PLAY_WIDTH, PLAY_HEIGHT);
        }

        function drawObstacles() {
            for (let i = 0; i < obstacles.length; i++) {
                const obs = obstacles[i];
                const flash = newObstacleFlash.find(f => f.x === obs.x && f.y === obs.y);
                if (flash) {
                    const alpha = flash.timer / 1000;
                    ctx.fillStyle = 'rgba(255, 100, 50, ' + (0.5 + alpha * 0.5) + ')';
                    ctx.strokeStyle = 'rgba(255, 150, 100, ' + (0.7 + alpha * 0.3) + ')';
                } else {
                    ctx.fillStyle = '#555';
                    ctx.strokeStyle = '#777';
                }
                ctx.fillRect(obs.x + 1, obs.y + 1, TILE_SIZE - 2, TILE_SIZE - 2);
                ctx.strokeRect(obs.x + 0.5, obs.y + 0.5, TILE_SIZE - 1, TILE_SIZE - 1);
                // High-contrast cross-hatch
                if (highContrast) {
                    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(obs.x + 1, obs.y + 1);
                    ctx.lineTo(obs.x + TILE_SIZE - 2, obs.y + TILE_SIZE - 2);
                    ctx.moveTo(obs.x + TILE_SIZE - 2, obs.y + 1);
                    ctx.lineTo(obs.x + 1, obs.y + TILE_SIZE - 2);
                    ctx.stroke();
                }
            }
        }
        // v10 C: drawHazards — blue/violet pulsing rifts (CVD-safe default)
        function drawHazards() {
            var calm = calmModeEffective();
            for (var i = 0; i < hazards.length; i++) {
                var h = hazards[i];
                ctx.save();
                // v12 B: pulse floor raised from 0.25±0.15 (trough 0.10) to 0.28±0.12
                // (trough 0.16). The old trough sat barely above the off-phase 0.08, so at
                // the bottom of the pulse a LETHAL rift looked nearly identical to a safe
                // one. The solid lethal border below is the other half of the cue.
                var alpha = h.phase === 'on' ? (calm ? 0.35 : 0.28 + 0.12 * Math.sin(renderTime / 150)) : 0.08;
                var grad = ctx.createRadialGradient(h.cx + TILE_SIZE / 2, h.cy + TILE_SIZE / 2, 0, h.cx + TILE_SIZE / 2, h.cy + TILE_SIZE / 2, h.radius);
                grad.addColorStop(0, 'rgba(107,63,160,' + alpha + ')');
                grad.addColorStop(0.7, 'rgba(107,63,160,' + (alpha * 0.5) + ')');
                grad.addColorStop(1, 'rgba(107,63,160,0)');
                ctx.fillStyle = grad;
                ctx.beginPath();
                ctx.arc(h.cx + TILE_SIZE / 2, h.cy + TILE_SIZE / 2, h.radius, 0, 2 * Math.PI);
                ctx.fill();
                // Solid border when lethal
                if (h.phase === 'on' && !calm) {
                    ctx.strokeStyle = 'rgba(107,63,160,0.5)';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(h.cx + TILE_SIZE / 2, h.cy + TILE_SIZE / 2, h.radius, 0, 2 * Math.PI);
                    ctx.stroke();
                }
                // v12 B: pre-ignition keyframe. phaseTimer counts DOWN to the flip and is
                // reset to a full duration on it, so while off the live values are
                // OFF-1 … 1 — `<= 2` is exactly the two ticks before the rift becomes
                // lethal. Without this the player got zero advance warning: the rift went
                // from safe to deadly in a single tick. A distinct warm hue (not the
                // rift's own violet) so it reads as "about to fire", not as part of the
                // rift's idle look.
                if (h.phase === 'off' && h.phaseTimer <= 2) {
                    var warnA = h.phaseTimer === 2 ? 0.5 : 0.9; // brightens into ignition
                    ctx.save();
                    ctx.strokeStyle = 'rgba(255,170,60,' + warnA + ')';
                    ctx.lineWidth = 3;
                    ctx.setLineDash([5, 5]);
                    ctx.beginPath();
                    ctx.arc(h.cx + TILE_SIZE / 2, h.cy + TILE_SIZE / 2, h.radius + 3, 0, 2 * Math.PI);
                    ctx.stroke();
                    ctx.restore();
                }
                // v12 B: countdown arc — how far through the current phase the rift is.
                // Informational, so it renders in Calm Mode too (matching the v9 F2
                // bounty-ring precedent: calm gates oscillation, never information).
                var phaseFrac = Math.max(0, Math.min(1,
                    h.phaseTimer / (h.phase === 'on' ? HAZARD_ON_TICKS : HAZARD_OFF_TICKS)));
                ctx.strokeStyle = h.phase === 'on' ? 'rgba(255,120,120,0.7)' : 'rgba(180,180,255,0.6)';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.arc(h.cx + TILE_SIZE / 2, h.cy + TILE_SIZE / 2, h.radius,
                    -Math.PI / 2, -Math.PI / 2 + 2 * Math.PI * phaseFrac);
                ctx.stroke();
                ctx.restore();
            }
            // v11 A: Gold ring around adjacent hazard when hazard chain is active
            if (hazardAdjacentThisTick && hazardChainStreak > 0) {
                for (var ri = 0; ri < hazards.length; ri++) {
                    var rh = hazards[ri];
                    if (rh.phase !== 'on') continue;
                    var rdist = Math.abs(snake[0].x - rh.cx) + Math.abs(snake[0].y - rh.cy);
                    if (rdist > rh.radius && rdist <= rh.radius + TILE_SIZE) {
                        ctx.save();
                        ctx.strokeStyle = '#FFD700';
                        ctx.lineWidth = 2;
                        ctx.globalAlpha = 0.6;
                        ctx.beginPath();
                        ctx.arc(rh.cx + TILE_SIZE / 2, rh.cy + TILE_SIZE / 2, rh.radius + TILE_SIZE * 0.5, 0, 2 * Math.PI);
                        ctx.stroke();
                        ctx.restore();
                    }
                }
            }
        }

        // v7 D1: easeOutBack — overshoot easing for the food spawn "pop". Standard
        // easeOutBack with c1=1.7 / c3=2.7 (rounded). Clamps to 1 once the pop
        // window elapses so idle bob takes over cleanly.
        function easeOutBack(t) {
            return t < 1 ? 1 + 2.7 * Math.pow(t - 1, 3) + 1.7 * Math.pow(t - 1, 2) : 1;
        }

        function drawFood() {
            if (!food) return;
            const tier = FOOD_TIERS[food.type] || FOOD_TIERS.common;
            const cx = food.x + TILE_SIZE / 2;
            const cy = food.y + TILE_SIZE / 2;

            // v7 D1: spawn "pop" (easeOutBack over 250ms) + per-type idle bob.
            // Shapes are drawn around the LOCAL ORIGIN (0,0) below; the transform
            // (translate → scale → rotate) carries them to the tile center so a
            // single scale applies the pop and a single rotate applies the bob.
            // v8 B: calm mode — no spawn pop, no idle bob (shapes stay centered).
            const calm = calmModeEffective();
            const spawnElapsed = performance.now() - (food.spawnTime || 0);
            const spawnScale = calm ? 1 : (spawnElapsed < 250 ? Math.max(0, easeOutBack(spawnElapsed / 250)) : 1);
            var bobX = 0, bobY = 0, bobRot = 0, bobPulse = 1;
            if (!calm) {
                switch (food.type) {
                    case 'common':  bobY = Math.sin(renderTime / 300) * 1.5; break;            // circle: vertical wobble
                    case 'uncommon': bobRot = Math.sin(renderTime / 500) * 0.25; break;         // diamond: slow rotation
                    case 'rare':    bobPulse = 1 + 0.08 * Math.sin(renderTime / 400); break;    // triangle: gentle breathe
                    case 'epic':    bobPulse = 1 + 0.10 * Math.sin(renderTime / 350); break;    // hexagon: pulse
                    case 'speed':   bobX = Math.sin(renderTime / 250) * 2; break;               // chevron: horizontal drift
                    case 'hunter':  bobX = Math.sin(renderTime / 160) * 2.5; bobRot = Math.sin(renderTime / 220) * 0.3; break; // v8 E: nervous fidget
                    // 'bonus' keeps its own internal pulse mechanic (see its case below)
                }
            }

            ctx.save();
            ctx.translate(cx + bobX, cy + bobY);
            ctx.scale(spawnScale * bobPulse, spawnScale * bobPulse);
            ctx.rotate(bobRot);

            if (tier.glow) {
                ctx.shadowBlur = tier.glow;
                ctx.shadowColor = foodColor(food.type);
            }

            ctx.fillStyle = foodColor(food.type);

            switch (food.type) {
                case 'common': {
                    // Filled circle
                    ctx.beginPath();
                    ctx.arc(0, 0, TILE_SIZE * 0.4, 0, 2 * Math.PI);
                    ctx.fill();
                    break;
                }
                case 'uncommon': {
                    // Diamond shape
                    const s = TILE_SIZE * 0.45;
                    ctx.beginPath();
                    ctx.moveTo(0, -s);
                    ctx.lineTo(s, 0);
                    ctx.lineTo(0, s);
                    ctx.lineTo(-s, 0);
                    ctx.closePath();
                    ctx.fill();
                    break;
                }
                case 'rare': {
                    // Upward-pointing triangle
                    const s = TILE_SIZE * 0.45;
                    ctx.beginPath();
                    ctx.moveTo(0, -s);
                    ctx.lineTo(s, s * 0.7);
                    ctx.lineTo(-s, s * 0.7);
                    ctx.closePath();
                    ctx.fill();
                    break;
                }
                case 'epic': {
                    // Hexagon
                    const r = TILE_SIZE * 0.42;
                    ctx.beginPath();
                    for (let i = 0; i < 6; i++) {
                        const angle = (Math.PI / 3) * i - Math.PI / 2;
                        const px = r * Math.cos(angle);
                        const py = r * Math.sin(angle);
                        if (i === 0) ctx.moveTo(px, py);
                        else ctx.lineTo(px, py);
                    }
                    ctx.closePath();
                    ctx.fill();
                    break;
                }
                case 'bonus': {
                    // Pulsing circle (keep existing pulse mechanic)
                    const pulse = 1 + 0.5 * Math.sin(renderTime / 200);
                    const r = Math.min(TILE_SIZE * 0.4 * pulse, TILE_SIZE * 0.6);
                    ctx.beginPath();
                    ctx.arc(0, 0, r, 0, 2 * Math.PI);
                    ctx.fill();
                    break;
                }
                case 'speed': {
                    // Double chevron >>
                    const s = TILE_SIZE * 0.35;
                    ctx.lineWidth = 3;
                    ctx.strokeStyle = foodColor('speed');
                    ctx.beginPath(); // paths persist until beginPath — clear stale segments
                    ctx.moveTo(-s, -s);
                    ctx.lineTo(0, 0);
                    ctx.lineTo(-s, s);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(0, -s);
                    ctx.lineTo(s, 0);
                    ctx.lineTo(0, s);
                    ctx.stroke();
                    break;
                }
                case 'hunter': {
                    // v8 E: paw-print — four small toes around a pad. Drawn at local origin.
                    const r = TILE_SIZE * 0.4;
                    ctx.fillStyle = foodColor('hunter');
                    ctx.beginPath();
                    ctx.arc(0, 0, r * 0.55, 0, 2 * Math.PI);
                    ctx.fill();
                    for (var ti = 0; ti < 4; ti++) {
                        var ang = (ti / 4) * Math.PI * 2 + Math.PI / 4;
                        ctx.beginPath();
                        ctx.arc(Math.cos(ang) * r * 0.75, Math.sin(ang) * r * 0.75, r * 0.22, 0, 2 * Math.PI);
                        ctx.fill();
                    }
                    break;
                }
                case 'bomb': {
                    // v10 B: pulsing dark-orange circle with a fuse spark
                    const fusePulse = calm ? 1 : (1 + 0.15 * Math.sin(renderTime / 120));
                    const r = TILE_SIZE * 0.38 * fusePulse;
                    ctx.beginPath();
                    ctx.arc(0, 0, r, 0, 2 * Math.PI);
                    ctx.fill();
                    // Fuse spark (small bright dot at top)
                    if (!calm) {
                        ctx.fillStyle = '#FFDD00';
                        ctx.beginPath();
                        ctx.arc(0, -r * 0.8, 2 + Math.sin(renderTime / 80), 0, 2 * Math.PI);
                        ctx.fill();
                    }
                    break;
                }
                default: {
                    ctx.fillRect(-TILE_SIZE / 2, -TILE_SIZE / 2, TILE_SIZE, TILE_SIZE);
                    break;
                }
            }

            ctx.restore();

            // Letter labels for non-common types with text outline for contrast
            if (!highContrast) {
                const labels = { uncommon: 'U', rare: 'R', epic: 'E', bonus: 'B', speed: 'S', hunter: 'H', bomb: 'X' };
                if (labels[food.type]) {
                    ctx.save();
                    ctx.font = 'bold 10px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.strokeStyle = '#000';
                    ctx.lineWidth = 2;
                    ctx.strokeText(labels[food.type], cx, cy);
                    ctx.fillStyle = '#FFFFFF';
                    ctx.fillText(labels[food.type], cx, cy);
                    ctx.restore();
                }
            } else {
                // High-contrast: universal labels for ALL food types
                const hcLabels = { common: 'C', uncommon: 'U', rare: 'R', epic: 'E', bonus: 'B', speed: 'S', hunter: 'H', bomb: 'X' };
                ctx.save();
                ctx.font = 'bold 13px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 3;
                ctx.strokeText(hcLabels[food.type] || '?', cx, cy);
                ctx.fillStyle = '#FFFFFF';
                ctx.fillText(hcLabels[food.type] || '?', cx, cy);
                ctx.restore();
            }
            // v6: Echo Brew food2 rendering
            if (food2) {
                ctx.save();
                ctx.globalAlpha = 0.7;
                var f2Tier = FOOD_TIERS[food2.type] || FOOD_TIERS.common;
                ctx.fillStyle = foodColor(food2.type);
                var f2Elapsed = performance.now() - (food2.spawnTime || 0);
                var f2Scale = calm ? 1 : (f2Elapsed < 250 ? Math.max(0, easeOutBack(f2Elapsed / 250)) : 1);
                var f2cx = food2.x + TILE_SIZE / 2;
                var f2cy = food2.y + TILE_SIZE / 2;
                ctx.fillStyle = f2Tier.color;
                ctx.beginPath();
                ctx.arc(f2cx, f2cy, TILE_SIZE * 0.35 * f2Scale, 0, 2 * Math.PI);
                ctx.fill();
                ctx.fillStyle = '#FFF';
                ctx.font = 'bold 8px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('E', f2cx, f2cy);
                ctx.restore();
            }
            // v9 D: draw extraFoods[] (portal + hoard foods) — moved from drawPowerUpPickup
            for (var efdi = 0; efdi < extraFoods.length; efdi++) {
                drawExtraFood(extraFoods[efdi]);
            }
        }

        function drawPowerUpPickup() {
            if (!powerUpPickup) return;
            if (powerUpPickup && powerUpDespawnCounter < 20 && Math.floor(renderTime / 100) % 2 === 0) return;
            const config = POWERUP_TYPES[powerUpPickup.type];
            const cx = powerUpPickup.x + TILE_SIZE / 2;
            const cy = powerUpPickup.y + TILE_SIZE / 2;

            ctx.save();
            ctx.shadowBlur = 10;
            ctx.shadowColor = config.color;
            ctx.fillStyle = config.color;
            
            const r = TILE_SIZE * 0.35;
            if (powerUpPickup.type === 'shield') {
                ctx.beginPath();
                ctx.arc(cx, cy, r, 0, 2 * Math.PI);
                ctx.fill();
                ctx.fillStyle = '#FFF';
                ctx.font = 'bold 14px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('S', cx, cy);
            } else if (powerUpPickup.type === 'magnet') {
                ctx.beginPath();
                for (let i = 0; i < 4; i++) {
                    const angle = (i * Math.PI / 2) - Math.PI / 2;
                    const outerR = r;
                    const innerR = r * 0.4;

        function drawPostFX() {
            ctx.save();

            var vig = ctx.createRadialGradient(
                CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2, CANVAS_WIDTH * 0.4,

            ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

                ctx.fillStyle = 'rgba(80,0,120,0.08)';
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            }
            // v9 E: Golden Hoard tint

                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            }
            // v11 C: Pigment Rush — stronger gold tint during the climax

                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);
            }
            // Death vignette crush — intensifies as shakeTimer winds down
            if (gameState === 'gameover' && shakeTimer > 0) {
                var deathAlpha = (1 - shakeTimer / 200) * 0.3;
                var dv = ctx.createRadialGradient(
                    CANVAS_WIDTH / 2, CANVAS_HEIGHT / 2, 50,

                dv.addColorStop(0, 'rgba(0,0,0,0)');
                dv.addColorStop(1, 'rgba(60,0,0,' + deathAlpha + ')');
                ctx.fillStyle = dv;
                ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

            ctx.restore();

        // v13: three states instead of one, and it renders while the rival is ABSENT —

        // the collision test is not gated by hoard/rivalFreezeMs, so labelling a frozen
        // rival as stopped would be a cue that says "safe" on a lethal object.
        function drawRivalHUD() {
            if (rivals.length === 0) return;
            var liveLen = 0, windupLeft = -1, deadLeft = -1;
            for (var ri = 0; ri < rivals.length; ri++) {
                var r = rivals[ri];
                if (r.active) liveLen = Math.max(liveLen, r.snake.length);
                else if (r.snake.length > 0) windupLeft = Math.max(windupLeft, r.respawnTimer || 0);
                else if (r.respawnTimer > 0 && (deadLeft < 0 || r.respawnTimer < deadLeft)) deadLeft = r.respawnTimer;
            }
            // v13: the telegraph OUTRANKS the live length. There is one line, and under
            // double_rival a live rival's ambient "Rival: N" used to mask a materialising
            // rival's countdown for its entire window — hiding the feature's core cue. The
            // live rival is visible on the board; its length can wait 1.6s.
            var text, color;
            if (windupLeft >= 0) { text = '\u26A0 Rival in ' + Math.max(0, windupLeft / 1000).toFixed(1) + 's'; color = '#FFB0B0'; }
            else if (liveLen > 0) { text = 'Rival: ' + liveLen; color = '#FF8888'; }
            else if (deadLeft >= 0) { text = 'Rival \u29D7 ' + (deadLeft / 1000).toFixed(1) + 's'; color = '#FF8888'; }
            else return;
            ctx.save();
            ctx.fillStyle = color;
            ctx.font = hudFont(10);
            ctx.textAlign = 'left';
            ctx.textBaseline = 'top';
            ctx.fillText(text, 5, 40);
            ctx.restore();

        function pickRandomGauntletPicks(count) {
            var pool = GAUNTLET_PICKS.slice();

            while (options.length < count && safety < 100) {
                var idx = Math.floor(Math.random() * pool.length);
                var pick = pool[idx];
                var dup = false;
                for (var pi = 0; pi < options.length; pi++) {
                    if (options[pi].id === pick.id) { dup = true; break; }
                }
                if (!dup) options.push(pick);
                safety++;
            }
            return options;
        }

        function pickDraftOptions(count) {
            // v13: drop mutators that cannot run in the current mode. `double_rival` was
            // draftable in Zen/Walled/Painter/Snap/Daily (where spawnRival is inert) and in
            // the Gauntlet — the name appeared in the HUD and nothing happened, which is
            // exactly the "nothing advertised is a lie" defect v12 was about.
            var pool = unlockedMutators.filter(function (k) {
                if (k !== 'double_rival') return true;
                return rivalEnabledInMode(gameMode);
            });
            // Never hand the draft screen an empty pool — a degenerate unlock set must not
            // produce a NaN selection or an `activeMutators = [undefined]`.
            if (!pool.length) pool = unlockedMutators.slice();
            if (pool.length <= count) return pool;
            var options = [];
            var safety = 0;
            while (options.length < count && safety < 100) {
                var idx = Math.floor(Math.random() * pool.length);
                var key = pool[idx];
                if (options.indexOf(key) === -1) options.push(key);
                safety++;
            }
            return options;
        }

        function shuffleFoodWeights() {
            // v8 E: exclude hunter in Walled (wrap:false) so chaos_seed never puts it
            // into rotation there. Self-normalizing (divides by total) so dropping a
            // key is safe.
            var keys = Object.keys(FOOD_TIERS).filter(function(k) { return !(MODE_CONFIG[gameMode].wrap === false && (k === 'hunter' || k === 'bomb')); });
            // v12 A: draw from the seeded PRNG. This was Math.random(), which made
            // every seeded run that reshuffles (chaos_seed, plus the Chaos Gold and
            // Schrodinger resonances that call this) non-deterministic.
            var weights = keys.map(function() { return seededRandom(); });
            var total = weights.reduce(function(a,b) { return a+b; }, 0);
            var result = {};
            for (var i = 0; i < keys.length; i++) {
                result[keys[i]] = weights[i] / total;
            }
            return result;
        }

            } else if (ghostEnabled && activeSeed !== null) {
                var bestReplay = getBestReplay(gameMode);
                ghostPositions = rebuildGhost(bestReplay, gameTick);
            } else {
                ghostPositions = [];
                arenaGhostPositions = [];
            }
            stats.totalDistance++;
            if (gameTick % 10 === 0) awardXP(1);

            // Time Attack timer
            if (gameMode === 'timeAttack' && timeAttackEnd > 0) {
                const remaining = timeAttackEnd - Date.now();
                if (remaining <= 0) { lastDeathCause = 'Time\'s up!'; gameOver(); return; }
            }

            // v10 G: consume from the 2-deep direction queue
            if (dirQueue.length > 0) {
                const next = dirQueue.shift();
                // Reverse-check against current direction (safety; push-time already checks)
                if (next.dx !== -dx || next.dy !== -dy) {
                    dx = next.dx;
                    dy = next.dy;
                    lastConsumedDir = { dx: dx, dy: dy };
                    if (activeSeed !== null) {
                        recordReplayDirection(gameTick, dx, dy);
                    }
                }
            }

            const tail = snake.pop();
            // Painter mode: paint the tail position
            if (gameMode === 'painter' && paintGrid) {
                var pcol = Math.floor(tail.x / TILE_SIZE);
                var prow = Math.floor(tail.y / TILE_SIZE);
                var cols = PLAY_WIDTH / TILE_SIZE;
                var rows = PLAY_HEIGHT / TILE_SIZE;
                if (pcol >= 0 && pcol < cols && prow >= 0 && prow < rows) {
                    if (!paintGrid[pcol][prow]) {
                        paintGrid[pcol][prow] = { color: currentPaintColor, layer: paintLayers, timestamp: Date.now() };
                        paintCoveredCount++;
                    } else {
                        paintGrid[pcol][prow] = { color: currentPaintColor, layer: paintGrid[pcol][prow].layer + 1, timestamp: Date.now() };
                    }
                }
            }

            const headRef = snake.length > 0 ? snake[0] : tail;
            const newHead = {
                x: headRef.x + dx,
                y: headRef.y + dy
            };
            let wrappedHead = wrapPosition(newHead);
            // Set by a Phoenix/streak-charge save inside checkPlayerDeath: the save
            // teleports the snake to a free tile INSTEAD of moving to wrappedHead.
            // The caller re-anchors the whole snake there (portal-style) and skips
            // the unshift — assigning snake[0] inside the save would be buried by
            // the caller's unshift, leaving the head on the deadly tile.
            var teleportSavePos = null;

            // v11 E: Streak charge death save — auto-fire death insurance. Consumes a
            function tryStreakChargeSave(wrappedHead) {
                if (streakCharges > 0) {
                    var freePos = findFreeTile(wrappedHead.x, wrappedHead.y, true);
                    if (freePos) {
                        streakCharges--;
                        saveManager.set('snake_streak_charges', streakCharges);
                        teleportSavePos = freePos;
                        lastSaveEvent = '🛡 Streak charge saved you!';
                        spawnParticles(freePos.x, freePos.y, 25, '#FFEE88');
                        queueToast('🛡 Streak charge consumed!', 2000);
                        return false;
                    }
                }
                return true; // no save, proceed to death
            }
            // --- v6: extracted death check ---
            function checkPlayerDeath(wrappedHead, skipSelfCollision) {
                var hitObstacle = isObstacleCollision(wrappedHead);
                var hitSelf = !skipSelfCollision && checkCollision(wrappedHead);
                if (hitObstacle || hitSelf) {
                    if (shieldActive) {
                        shieldActive = false; powerUpTimer = 0; powerUpType = null;
                        stats.shieldBlocks++;
                        spawnParticles(wrappedHead.x, wrappedHead.y, 15, '#4488FF');
                        playSound('bonus');
                        return false;
                    }
                    // v6: Vampire Brew — survive first fatal hit at length 3
                    if (activeBrews.indexOf('vampire') !== -1 && !brewUsageFlags.vampireUsed) {
                        brewUsageFlags.vampireUsed = true;
                        while (snake.length > 3) snake.pop();
                        lastSaveEvent = 'Vampire Brew saved you!';
                        spawnParticles(wrappedHead.x, wrappedHead.y, 20, '#FF0044');
                        return false;
                    }
                    // v11 E: Streak charge save (after vampire, before serpentine)
                    if (!tryStreakChargeSave(wrappedHead)) return false;
                    // v7: Serpentine evolution — one-time obstacle pass. Order per
                    // design: Shield -> Vampire/Phoenix brew -> Serpentine -> death,
                    // so a chosen brew save is never wasted on an automatic save.
                    if (evolutionTier >= 1 && !obstaclePassUsed && isObstacleCollision(wrappedHead)) {
                        obstaclePassUsed = true;
                        lastSaveEvent = 'Serpentine phased through an obstacle!';
                        spawnParticles(wrappedHead.x, wrappedHead.y, 18, EVOLUTION_TIERS[1].color);
                        playSound('bonus');
                        queueToast('\uD83D\uDEE1\uFE0F Serpentine: obstacle pass used!', 2000);
                        return false;
                    }
                    lastDeathCause = isObstacleCollision(wrappedHead) ? 'Hit an obstacle!' : 'You ran into yourself!';
                    return true;
                }
                if (MODE_CONFIG[gameMode].wallDeath) {
                    if (wrappedHead.x < 0 || wrappedHead.x >= PLAY_WIDTH || wrappedHead.y < 0 || wrappedHead.y >= PLAY_HEIGHT) {
                        // v12 C: the cause is written AFTER the saves below. Writing it first
                        // left a stale "Hit the wall!" behind whenever a save rescued the
                        // player, and any later ending that sets no cause of its own (the
                        // Time Attack clock) then reported a death that never happened.
                        // v6: Phoenix Brew — resurrect once
                        if (activeBrews.indexOf('phoenix') !== -1 && !brewUsageFlags.phoenixUsed) {
                            var freePos = findFreeTile(wrappedHead.x, wrappedHead.y, true);
                            if (freePos) {
                                brewUsageFlags.phoenixUsed = true;
                                teleportSavePos = freePos;
                                score = 0;
                                lastSaveEvent = 'Phoenix Brew resurrected!';
                                spawnParticles(freePos.x, freePos.y, 25, '#FF8800');
                                return false;
                            }
                        }
                        // v11 E: Streak charge save (after phoenix, before death)
                        if (!tryStreakChargeSave(wrappedHead)) return false;
                        lastDeathCause = 'Hit the wall!';
                        return true;
                    }
                }
                // v10 C: Hazard death — lethal when phase==='on' and head within radius
                // Save chain: shield → vampire → death (no serpentine — hazards aren't obstacles)
                if (isHazardCollision(wrappedHead)) {
                    // v11 B: Combo Heat → Hazard Melt — at combo ≥ 10, entering an
                    // on-phase hazard downgrades lethal to combo-break (no death).
                    // Melt is hazard-only; slots before shield so a high-combo player
                    // isn't punished by also consuming their shield.
                    if (comboCount >= 10) {
                        // Respect the Apex combo floor like the other break sites.
                        comboCount = (evolutionTier >= 3) ? EVOLUTION_TIERS[3].minCombo : 0;
                        lastComboMilestone = 0;
                        hazardChainStreak = 0;
                        lastSaveEvent = 'Melted a hazard!';
                        spawnParticles(wrappedHead.x, wrappedHead.y, 20, '#FFAA00');
                        pushTransientRing(wrappedHead.x + TILE_SIZE / 2, wrappedHead.y + TILE_SIZE / 2, 40, '#FFAA00', 400, 'ring', 3);
                        queueToast('🔥 Melted a hazard!', 1500);
                        return false;
                    }
                    if (shieldActive) {
                        shieldActive = false; powerUpTimer = 0; powerUpType = null;
                        stats.shieldBlocks++;
                        spawnParticles(wrappedHead.x, wrappedHead.y, 15, '#4488FF');
                        playSound('bonus');
                        return false;
                    }
                    if (activeBrews.indexOf('vampire') !== -1 && !brewUsageFlags.vampireUsed) {
                        brewUsageFlags.vampireUsed = true;
                        while (snake.length > 3) snake.pop();
                        lastSaveEvent = 'Vampire Brew saved you from a hazard!';
                        spawnParticles(wrappedHead.x, wrappedHead.y, 20, '#FF0044');
                        return false;
                    }
                    // v11 E: Streak charge save (after vampire, before death)
                    if (!tryStreakChargeSave(wrappedHead)) return false;
                    hazardChainStreak = 0; // v11 A: reset chain on hazard death
                    lastDeathCause = 'Caught in a hazard rift!';
                    return true;
                }
                for (var rci = 0; rci < rivals.length; rci++) {
                    if (rivals[rci].active) {
                        // v6: Leech Brew head-to-head with rival
                        if (activeBrews.indexOf('leech') !== -1 && rivals[rci].snake.length > 0) {
                            var rHead = rivals[rci].snake[0];
                            var ldx = Math.abs(wrappedHead.x - rHead.x);
                            var ldy = Math.abs(wrappedHead.y - rHead.y);
                            if (ldx <= TILE_SIZE && ldy <= TILE_SIZE && ldx + ldy <= TILE_SIZE * 2) {
                                for (var lsi = 0; lsi < 3 && rivals[rci].snake.length > 1; lsi++) {
                                    snake.push({ x: snake[snake.length - 1].x, y: snake[snake.length - 1].y });
                                    rivals[rci].snake.pop();
                                }
                                // Design (IMPL_PLAN_v6 L178): a leech-drained rival is
                                // DEFEATED and respawns later. The old direct active=false
                                // left respawnTimer at 0 (never respawns) and didn't count
                                // the defeat.
                                // v7: evolution trigger — Leech steal is a 3rd growth site.
                                // Must run BEFORE the removal decision below: the drain has
                                // already grown the snake, and a `continue` past this point
                                // would silently skip the evolution check.
                                spawnParticles(wrappedHead.x, wrappedHead.y, 10, '#44FF88');
                                triggerEvolutionIfReady();
                                // v13: the drain RESOLVES the contact only when it left the
                                // rival standing on the PLAYER'S OWN HEAD TILE. Drained to
                                // <=1 the rival is gone either way; drained to >=2 it survives
                                // — and if its head still occupies the player's tile, the
                                // segment test below would kill the player, so the brew would
                                // have backfired on the head-to-head it advertises.
                                //
                                // The test is the rival's HEAD TILE, not its whole body, and
                                // that distinction is load-bearing. The leech window is the 3x3
                                // box around the rival's head, so its neck is ALWAYS inside it:
                                // testing the whole body made a plain charge (the snakes swap
                                // tiles, landing the player on the rival's neck) survive a
                                // contact that kills you without the brew, destroy the rival,
                                // and pay +50 score / +100 XP. That is a free kill for the
                                // brew's owner, and a regression against the pre-v13 build,
                                // which killed the player in exactly that geometry.
                                // v13: the two disjuncts are NOT the same rule and must not
                                // share a guard.
                                //
                                //  · `length <= 1` — the drain emptied the rival. This is
                                //    UNCONDITIONAL, exactly as in the base build
                                //    (`if (rivals[rci].snake.length <= 1) removeRival(rci)`):
                                //    you drained it to nothing, so it is gone and the segment
                                //    test can no longer kill you. Gating this on movement
                                //    removed a base rescue — a frozen rival of length <= 4
                                //    drained to nothing left the player dying with the drain
                                //    already applied, which is the "the counter backfires"
                                //    defect this cycle exists to delete.
                                //  · `head on the player's tile` — the rival is still standing
                                //    (>= 2 segments) and its head occupies the player's tile,
                                //    so the segment test below would kill them. THIS is the
                                //    disjunct that needs `movedThisTick`: a stationary rival
                                //    (cadence skip, or the hoard/Pigment Rush freeze) keeps
                                //    its head on the tile the player charged into, and
                                //    resolving that as a kill survived a contact the base
                                //    build punishes with death — flipping on the rival's
                                //    invisible moveCounter, the same unlearnable texture as
                                //    "sometimes I run through it". When the rival DID move,
                                //    its pre-move body cannot hold its new tile (that would
                                //    be a self-hit), so base survived the charge and removed
                                //    the rival too: base-consistent, and only the reward new.
                                if (rivals[rci].snake.length <= 1 ||
                                    (rivals[rci].movedThisTick &&
                                     (wrappedHead.x === rHead.x && wrappedHead.y === rHead.y))) {
                                    removeRival(rci, true);
                                    continue;
                                }
                            }
                        }
                        for (var rcj = 0; rcj < rivals[rci].snake.length; rcj++) {
                            if (rivals[rci].snake[rcj].x === wrappedHead.x && rivals[rci].snake[rcj].y === wrappedHead.y) {
                                // v13: this contact belongs to rule 1 from here on. resolveRivalRams
                                // must not also score it — a save that absorbs the hit (the shield
                                // especially) leaves the head/neck on the contact tile, and scoring
                                // that as a body ram paid a credited, rewarded kill for being saved.
                                rivalHeadContactIdx = rci;
                                if (shieldActive) {
                                    shieldActive = false; powerUpTimer = 0; powerUpType = null;
                                    stats.shieldBlocks++;
                                    spawnParticles(wrappedHead.x, wrappedHead.y, 15, '#4488FF');
                                    playSound('bonus');
                                    return false;
                                }
                                // v12 C: cause written after the saves — see the wall branch.
                                // v6: Phoenix Brew in rival collision
                                if (activeBrews.indexOf('phoenix') !== -1 && !brewUsageFlags.phoenixUsed) {
                                    var freePos2 = findFreeTile(wrappedHead.x, wrappedHead.y, true);
                                    if (freePos2) {
                                        brewUsageFlags.phoenixUsed = true;
                                        teleportSavePos = freePos2;
                                        score = 0;
                                        lastSaveEvent = 'Phoenix Brew resurrected!';
                                        spawnParticles(freePos2.x, freePos2.y, 25, '#FF8800');
                                        return false;
                                    }
                                }
                                // v11 E: Streak charge save (after phoenix, before death)
                                if (!tryStreakChargeSave(wrappedHead)) return false;
                                // v13: the cause must TEACH the rule, because v13 made it
                                // lethal where it used to be a free kill. A head-on (the two
                                // heads converge on the same tile, or the rival's head ends on
                                // the tile the player just vacated) is the death that a charging
                                // player suffers; running into the rival's flank is the other.
                                // v13: a head-on is the rival's HEAD on the player's head, or
                                // on the tile the player just vacated (the swap — the two snakes
                                // trade tiles). A rival head merely resting somewhere else on the
                                // player's body is NOT a head-on: using that as the test labelled
                                // ~7% of rival deaths "head-on" and fired the "ram its SIDE"
                                // teaching toast on deaths that were already a side ram, which is
                                // a worse lesson than the generic string it replaced.
                                var rivalHeadOn = false;
                                var rvHead = rivals[rci].snake.length > 0 ? rivals[rci].snake[0] : null;
