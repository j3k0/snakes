            if ((e.key === 'z' || e.key === 'Z') && gameState === 'playing') {
                spendComboCharge();
                return;
            }
            // Prestige on idle
            if ((e.key === 'x' || e.key === 'X') && gameState === 'idle' && level >= 20) {
                if (prestigeLevel < 5) {
                    prestigeLevel++;
                    xp = 0;
                    level = 1;
                    xpOvercharge = 0;
                    saveManager.set('snake_prestige', prestigeLevel);
                    saveManager.set('snake_xp', '0');
                    saveManager.set('snake_xp_overcharge', 0);
                    checkPrestigeUnlocks();
                    queueToast('🌟 Prestige ' + prestigeLevel + '!', 3000);
                } else {
                    pinnacleRank++;
                    xp = 0;
                    level = 1;
                    // Overcharge preserved for pinnacle ranks
                    saveManager.set('snake_pinnacle', pinnacleRank);
                    saveManager.set('snake_xp', '0');
                    saveManager.set('snake_xp_overcharge', xpOvercharge);
                    queueToast('⚡ Pinnacle Rank ' + pinnacleRank + '! Score +' + (pinnacleRank * 2) + '%', 4000);
                }
                drawGame(1);
                updateMenuFooter();
                return;
            }

            // Mode selection on idle
            if (gameState === 'idle') {
                if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    modeSelectIndex = (modeSelectIndex - 1 + MODE_ORDER.length) % MODE_ORDER.length;
                    gameMode = MODE_ORDER[modeSelectIndex];
                    drawGame(1);
                    visualDirty = true;
                    srSpeak(getModeDesc(gameMode));
                    return;
                }
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    modeSelectIndex = (modeSelectIndex + 1) % MODE_ORDER.length;
                    gameMode = MODE_ORDER[modeSelectIndex];
                    drawGame(1);
                    visualDirty = true;
                    srSpeak(getModeDesc(gameMode));
                    return;
                }
            }

            // Zen mode quit
            if (e.key === 'Enter' && gameState === 'playing' && gameMode === 'zen') {
                endZenSession();
                return;
            }

            if (e.key === 'p' || e.key === 'P' || e.key === ' ') {
                if (gameState === 'playing') {
                    autoPaused = false;
                    gameState = 'paused';
                    pauseMenuSelection = 0;
                    pauseConfirmPending = false;
                    pauseConfirmAction = null;
                    stopGameLoop();
                    sessionPauseStart = Date.now();
                    playSound('pause');
                    drawGame(1);
                    visualDirty = true;
                    srSpeak('Game paused');
                } else if (gameState === 'paused') {
                    resumeGame();
                    return;
                }
                return;
            }

            if (e.key === 'm' || e.key === 'M') {
                muted = muted ? 0 : 1;
                saveManager.set('snake_muted', muted);
                queueToast(muted ? '\uD83D\uDD07 Muted' : '\uD83D\uDD0A Sound On', 1500);
                return;
            }

            if (e.key === 'y' || e.key === 'Y') {
                synesthesiaMode = !synesthesiaMode;
                saveManager.set('snake_synesthesia', synesthesiaMode ? '1' : '0');
                if (synesthesiaMode) {
                    if (gameState === 'playing') startPad();
                    queueToast('\u266B Synesthesia On', 1500);
                } else {
                    stopDrone();
                    stopPad();
                    queueToast('Synesthesia Off', 1500);
                }
                return;
            }

            if ((e.key === 'd' || e.key === 'D') && gameState === 'idle') {
                draftModeEnabled = !draftModeEnabled;
                queueToast(draftModeEnabled ? 'Draft Mode ON \u2014 start game to draft a mutator' : 'Draft Mode OFF', 2000);
                drawGame(1);
                return;
            }

            // v7 E: Resume saved run with 'R' on idle
            if ((e.key === 'r' || e.key === 'R') && gameState === 'idle' && hasSnapshot()) {
                var snap = saveManager.getJSON(SNAPSHOT_KEY, null);
                if (snap) {
                    if (restoreFromSnapshot(snap, true)) {
                        drawGame(1);
                        visualDirty = true;
                    }
                } else {
                    // Unparseable snapshot: getJSON already quarantined it; remove the
                    // dead key so the 'Resume Run' button doesn't linger forever.
                    clearSnapshot();
                    queueToast('Saved run was corrupt — cleared.', 2500);
                    updateMenuFooter();
                    drawGame(1);
                    visualDirty = true;
                }
                return;
            }

            if (e.key === 'v' || e.key === 'V') {
                highContrast = !highContrast;
                saveManager.set('snake_high_contrast', highContrast ? '1' : '0');
                visualDirty = true;
                return;
            }

            if (e.key === 'G' && e.shiftKey) {
                e.preventDefault();
                if (activeSeed === null) {
                    queueToast('Ghost Arena requires a seeded run', 2000);
                    return;
                }
                ghostArenaMode = !ghostArenaMode;
                if (ghostArenaMode) {
                    arenaGhostReplays = getArenaReplays(gameMode);
                    if (arenaGhostReplays.length === 0) {
                        ghostArenaMode = false;
                        queueToast('No ghosts found for this seed', 2000);
                        return;
                    }
                    ghostEnabled = false;
                    queueToast('Ghost Arena: ' + arenaGhostReplays.length + ' of ' + GHOST_ARENA_MAX + ' ghosts', 2000);
                } else {
                    arenaGhostReplays = [];
                    arenaGhostPositions = [];
                    queueToast('Ghost Arena Off', 1500);
                }
                return;
            }

            if (e.key === 'g' || e.key === 'G') {
                ghostEnabled = !ghostEnabled;
                queueToast(ghostEnabled ? '👻 Ghost On' : '👻 Ghost Off', 1500);
                return;
            }

            // Full-screen panels that don't pause the game must be blocked during
            // play (consistent with C/B/Q) or a fat-fingered key hides the board.
            if (e.key === 'Tab') {
                e.preventDefault();
                if (gameState === 'playing') return;
                showStatsPanel();
                return;
            }
            // Escape during 'paused' defers to the paused-state branch (cancel
            // confirm / resume) — keep the global panel-close logic for all other
            // states but don't swallow the paused key.
            if (e.key === 'Escape' && gameState !== 'paused') {
                // Close help overlay first if open
                if (helpOverlayVisible) {
                    helpOverlayVisible = false;
                    visualDirty = true;
                    return;
                }
                if (gameState === 'gameover') {
                    gameState = 'idle';
                    closeAllPanels();
                    updateMenuFooter();
                    drawGame(1);
                    visualDirty = true;
                    return;
                }
                closeAllPanels();
                return;
            }

            // 'c' during 'paused' defers to the paused-state copyRunState branch.
            if ((e.key === 'c' || e.key === 'C') && gameState !== 'paused') {
                e.preventDefault();
                if (gameState === 'playing') return;
                showCosmeticsPanel();
                return;
            }

            if (e.key === 'b' || e.key === 'B') {
                e.preventDefault();
                if (gameState === 'playing') return;
                showBrewsPanel();
                return;
            }

            if (e.key === 'f' || e.key === 'F') {
                e.preventDefault();
                if (gameState === 'playing') return;
                showAchievementsPanel();
                return;
            }

            // v6: diary panel
            if (e.key === 'j' || e.key === 'J') {
                e.preventDefault();
                if (gameState === 'playing') return;
                showDiaryPanel();
                return;
            }
            // v7 Feature C: quest board panel (idle/gameover only)
            if (e.key === 'q' || e.key === 'Q') {
                e.preventDefault();
                if (gameState === 'playing') return;
                showQuestsPanel();
                return;
            }

            if (e.key === 'h' || e.key === 'H') {
                e.preventDefault();
                // Only toggle help on idle screen — prevents obscuring gameplay/gameover
                if (gameState !== 'idle') return;
                if (helpOverlayVisible) {
                    helpOverlayVisible = false;
                    visualDirty = true;
                } else {
                    helpOverlayVisible = true;
                    visualDirty = true;
                }
                return;
            }

            if ((e.key === 'k' || e.key === 'K') && gameState === 'gameover' && activeSeed !== null) {
                var url = window.location.origin + window.location.pathname + '#' + gameMode + '~' + encodeURIComponent(activeSeed) + (score > 0 ? '~' + score : '');
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    navigator.clipboard.writeText(url).then(function() {
                        queueToast('Challenge link copied!', 2000);
                    }).catch(function() {
                        fallbackCopy(url);
                    });
                } else {
                    fallbackCopy(url);
                }
                return;
            }

            if (e.key === 'l' || e.key === 'L') {
                if (gameState === 'idle') {
                    showFoodLegend();
                }
                return;
            }

            if (gameState !== 'playing') {
                if (gameState === 'paused') {
                    if (e.key === 'ArrowUp') {
                        if (pauseConfirmPending) return;
                        pauseMenuSelection = (pauseMenuSelection - 1 + 4) % 4;
                        drawGame(1);
                        return;
                    }
                    if (e.key === 'ArrowDown') {
                        if (pauseConfirmPending) return;
                        pauseMenuSelection = (pauseMenuSelection + 1) % 4;
                        drawGame(1);
                        return;
                    }
                    if (e.key === 'Enter') {
                        e.preventDefault();
                        if (pauseConfirmPending) {
                            if (pauseConfirmAction === 'restart') {
                                pauseConfirmPending = false;
                                pauseConfirmAction = null;
                                resetGame();
                                startGame();
                                return;
                            }
                            if (pauseConfirmAction === 'quit') {
                                pauseConfirmPending = false;
                                pauseConfirmAction = null;
                                resetGame();
                                drawGame(1);
                                return;
                            }
                            pauseConfirmPending = false;
                            return;
                        }
                        if (pauseMenuSelection === 0) {
                            resumeGame();
                            return;
                        }
                        if (pauseMenuSelection === 1) {
                            pauseConfirmPending = true;
                            pauseConfirmAction = 'restart';
                            drawGame(1);
                            return;
                        }
                        if (pauseMenuSelection === 2) {
                            saveAndQuit();
                            return;
                        }
                        if (pauseMenuSelection === 3) {
                            pauseConfirmPending = true;
                            pauseConfirmAction = 'quit';
                            drawGame(1);
                            return;
                        }
                        return;
                    }
                    if (e.key === 'c' || e.key === 'C') {
                        if (!pauseConfirmPending) {
                            copyRunState();
                        }
                        return;
                    }
                    if (e.key === 'Escape') {
                        if (pauseConfirmPending) {
                            pauseConfirmPending = false;
                            pauseConfirmAction = null;
                            drawGame(1);
                            return;
                        }
                        resumeGame();
                        return;
                    }
                }
                return;
            }

            let newDx = dx;
            let newDy = dy;

            switch (e.key) {
                case 'ArrowLeft':
                case 'a':
                    newDx = -TILE_SIZE;
                    newDy = 0;
                    break;
                case 'ArrowUp':
                case 'w':
                    newDx = 0;
                    newDy = -TILE_SIZE;
                    break;
                case 'ArrowRight':
                case 'd':
                    newDx = TILE_SIZE;
                    newDy = 0;
                    break;
                case 'ArrowDown':
                case 's':
                    newDx = 0;
                    newDy = TILE_SIZE;
                    break;
                default:
                    return;
            }

            setNextDirection(newDx, newDy);
        });

        // Virtual D-pad — single dispatch with touch suppression
        let _touchDispatched = false;
        document.querySelectorAll('.dpad-btn').forEach(function(btn) {
          btn.addEventListener('touchstart', function(e) {
            e.preventDefault();
            _touchDispatched = true;
            const key = btn.getAttribute('data-key');
            document.dispatchEvent(new KeyboardEvent('keydown', { key: key }));
          }, { passive: false });
          btn.addEventListener('click', function(e) {
            e.preventDefault();
            if (_touchDispatched) {
              _touchDispatched = false;
              return;
            }
            const key = btn.getAttribute('data-key');
            document.dispatchEvent(new KeyboardEvent('keydown', { key: key }));
          });
        });

        // Touch swipe controls
        let touchStartX = 0;
        let touchStartY = 0;
        canvas.addEventListener('touchstart', function(e) {
          e.preventDefault();
          touchStartX = e.touches[0].clientX;
          touchStartY = e.touches[0].clientY;
        }, { passive: false });

        canvas.addEventListener('touchend', function(e) {
          e.preventDefault();
          const dx_touch = e.changedTouches[0].clientX - touchStartX;
          const dy_touch = e.changedTouches[0].clientY - touchStartY;

          // Tap detection (small movement)
          if (Math.abs(dx_touch) < 10 && Math.abs(dy_touch) < 10) {
            if (welcomeOverlay) {
              welcomeOverlay = false;
              saveManager.set('snake_has_played', '1');
              updateMenuFooter();
              visualDirty = true; // overlay replaced the idle menu — force a redraw
              return; // Touch/click: dismiss but don't start game
            }
            if (gameState === 'paused') {
              const rect = canvas.getBoundingClientRect();
              const scaleX = CANVAS_WIDTH / rect.width;
              const scaleY = CANVAS_HEIGHT / rect.height;
              const tapX = (e.changedTouches[0].clientX - rect.left) * scaleX;
              const tapY = (e.changedTouches[0].clientY - rect.top) * scaleY;
              if (pauseConfirmPending) {
                const confirmYesX = CANVAS_WIDTH / 2 - 60;
                const confirmNoX = CANVAS_WIDTH / 2 + 60;
                const confirmY = CANVAS_HEIGHT / 2 + 35;
                if (tapX >= confirmYesX - 40 && tapX <= confirmYesX + 40 &&
                    tapY >= confirmY - 20 && tapY <= confirmY + 20) {
                  pauseConfirmPending = false;
                  const action = pauseConfirmAction;
                  pauseConfirmAction = null;
                  if (action === 'restart') { resetGame(); startGame(); }
                  else if (action === 'quit') { resetGame(); drawGame(1); }
                  return;
                }
                if (tapX >= confirmNoX - 40 && tapX <= confirmNoX + 40 &&
                    tapY >= confirmY - 20 && tapY <= confirmY + 20) {
                  pauseConfirmPending = false;
                  pauseConfirmAction = null;
                  drawGame(1);
                  return;
                }
                return;
              }
              const menuTopY = CANVAS_HEIGHT / 2 - 10;
              for (let i = 0; i < 4; i++) {
                const itemY = menuTopY + i * 40;
                if (tapY >= itemY - 15 && tapY <= itemY + 20 && tapX >= 50 && tapX <= CANVAS_WIDTH - 50) {
                  if (i === 0) { resumeGame(); }
                  else if (i === 1) { pauseConfirmPending = true; pauseConfirmAction = 'restart'; drawGame(1); }
                  else if (i === 2) { saveAndQuit(); }
                  else if (i === 3) { pauseConfirmPending = true; pauseConfirmAction = 'quit'; drawGame(1); }
                  return;
                }
              }
            }
            // v7 E: Resume Run tap on idle screen
            if (gameState === 'idle' && hasSnapshot()) {
              const rect = canvas.getBoundingClientRect();
              const scaleY = CANVAS_HEIGHT / rect.height;
              const tapY = (e.changedTouches[0].clientY - rect.top) * scaleY;
              const tapX = (e.changedTouches[0].clientX - rect.left) * (CANVAS_WIDTH / rect.width);
              if (tapY >= resumeRunTextY - 15 && tapY <= resumeRunTextY + 20 && tapX >= 50 && tapX <= CANVAS_WIDTH - 50) {
                var snap = saveManager.getJSON(SNAPSHOT_KEY, null);
                if (snap && restoreFromSnapshot(snap, true)) {
                  drawGame(1);
                  visualDirty = true;
                } else if (!snap) {
                  // Unparseable snapshot: already quarantined by getJSON — remove
                  // the dead key so 'Resume Run' doesn't linger forever.
                  clearSnapshot();
                  queueToast('Saved run was corrupt — cleared.', 2500);
                  updateMenuFooter();
                  drawGame(1);
                  visualDirty = true;
                }
                return;
              }
            }
            // v7: PWA install tap on idle screen
            if (gameState === 'idle' && deferredInstallPrompt && !isStandalone) {
              const rect = canvas.getBoundingClientRect();
              const scaleY = CANVAS_HEIGHT / rect.height;
              const tapY = (e.changedTouches[0].clientY - rect.top) * scaleY;
              if (tapY >= CANVAS_HEIGHT - 40) {
                deferredInstallPrompt.prompt();
                deferredInstallPrompt = null;
                drawGame(1);
                return;
              }
            }
            if (gameState === 'idle' || gameState === 'gameover') {
              document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter' }));
            } else if (gameState === 'playing' && gauntletIntermission) {
              // Gauntlet wave-pick screen: D-pad arrows navigate, tap confirms the
              // highlighted pick (gameState stays 'playing' during intermission, so
              // without this a touch device has no way to confirm — soft-lock).
              document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Enter' }));
            } else if (gameState === 'playing') {
              document.dispatchEvent(new KeyboardEvent('keydown', { key: ' ' }));
            }
            return;
          }

          // Idle-state swipe detection for mode selection
          if (gameState === 'idle') {
            if (Math.abs(dy_touch) > Math.abs(dx_touch) && Math.abs(dy_touch) > 30) {
              // Swipe up moves the highlight up the mode list — same semantics as
              // ArrowUp (which decrements the index), not the inverted natural-scroll.
              if (dy_touch < 0) {
                modeSelectIndex = (modeSelectIndex - 1 + MODE_ORDER.length) % MODE_ORDER.length;
              } else {
                modeSelectIndex = (modeSelectIndex + 1) % MODE_ORDER.length;
              }
              gameMode = MODE_ORDER[modeSelectIndex];
              visualDirty = true;
              srSpeak(getModeDesc(gameMode));
              return;
            }
            return;
          }

          // Swipe detection (minimum 30px movement)
          if (Math.abs(dx_touch) < 30 && Math.abs(dy_touch) < 30) return;

          let newDx = 0, newDy = 0;
          if (Math.abs(dx_touch) > Math.abs(dy_touch)) {
            newDx = dx_touch > 0 ? TILE_SIZE : -TILE_SIZE;
          } else {
            newDy = dy_touch > 0 ? TILE_SIZE : -TILE_SIZE;
          }

          if (gameState === 'playing') {
            touchIndicatorTimer = 200; // 200ms flash
            setNextDirection(newDx, newDy);
          }
        }, { passive: false });

        document.addEventListener('visibilitychange', () => {
            if (document.hidden && gameState === 'playing') {
                saveSnapshot(); // v9 B: save before pausing so mobile backgrounding doesn't lose the run
                autoPaused = true;
                sessionPauseStart = Date.now();
                gameState = 'paused';
                pauseMenuSelection = 0;
                pauseConfirmPending = false;
                pauseConfirmAction = null;
                stopGameLoop();
                playSound('pause');
                drawGame(1);
                visualDirty = true;
            } else if (!document.hidden && gameState === 'paused' && autoPaused) {
                autoPaused = false;
                resumeGame();
            }
        });

        panelBackdropEl.addEventListener('click', function() {
            closeAllPanels();
        });

        // v7 E: Auto-save on tab close / navigation (pagehide for mobile iOS)
        function autoSaveOnClose() {
            if (gameState === 'playing' || gameState === 'paused') {
                saveSnapshot();
            }
        }
        window.addEventListener('beforeunload', autoSaveOnClose);
        window.addEventListener('pagehide', autoSaveOnClose);

        syncDailyState();
        syncQuestState();

        window.addEventListener('load', function() {
            var hash = window.location.hash.slice(1);
            if (hash) {
                if (hash.startsWith('snapshot=')) {
                    restoreFromSnapshotHash(hash.slice(9));
                } else {
                    challengeFromUrl = parseChallengeUrl(hash);
                }
            }
        });

        window.addEventListener('hashchange', function() {
            if (gameState === 'idle') {
                var hash = window.location.hash.slice(1);
                if (hash && hash.startsWith('snapshot=')) {
                    restoreFromSnapshotHash(hash.slice(9));
                } else {
                    challengeFromUrl = hash ? parseChallengeUrl(hash) : null;
                }
                visualDirty = true;
            }
        });

        resetGame();

        // === SEED INPUT HANDLERS ===
        document.getElementById('seedField').addEventListener('input', function() {
            var rawVal = this.value;
            rawVal = rawVal.replace(/~/g, '');
            if (rawVal !== this.value) this.value = rawVal;
            const val = rawVal.trim();
            if (val) {
                activeSeed = val;
                seedPrng = mulberry32(hashString(val));
            } else {
                activeSeed = null;
                seedPrng = null;
            }
        });
        document.getElementById('seedRandomBtn').addEventListener('click', function() {
            const seed = Math.random().toString(36).substring(2, 10).toUpperCase();
            document.getElementById('seedField').value = seed;
            activeSeed = seed;
            seedPrng = mulberry32(hashString(seed));
        });
        document.getElementById('seedClearBtn').addEventListener('click', function() {
            document.getElementById('seedField').value = '';
            activeSeed = null;
            seedPrng = null;
        });

        requestAnimationFrame(animateVisuals);
        // v11 F: Load-time corruption detection toast
        if (quarantinedKeys.size > 0) queueToast('⚠ Save data issue detected — backed up ' + quarantinedKeys.size + ' corrupted key(s), settings reset.', 5000);
    </script>
</body>
</html>
